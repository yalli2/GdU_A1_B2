eguntó cuándo ___ el examen.","o":["sería","será","fue"],"a":"sería"},{"t":"pick","q":"“¿Vamos a ir?” → Preguntó si ___ a ir.","o":["íbamos","vamos","fuimos"],"a":"íbamos"},{"t":"pick","q":"“¿Será mejor quedar otro día?” → Quería saber si ___ mejor quedar otro día.","o":["sería","será","fue"],"a":"sería"},{"t":"pick","q":"“¿Qué haremos si hace mal tiempo?” → Preguntó qué ___ si hacía mal tiempo.","o":["haríamos","haremos","hicimos"],"a":"haríamos"}]},{"title":"연습 3. 간접 의문문 쓰기","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"전달 동사에 맞는 시제.","items":[{"t":"text","q":"“¿Dónde vives?” → Quiere saber dónde (tú, vivir) ___ .","a":["vives"]},{"t":"text","q":"“¿Dónde vives?” → Quería saber dónde (tú, vivir) ___ .","a":["vivías"]},{"t":"text","q":"“¿Qué estás haciendo?” → Me preguntó qué (yo, estar) ___ haciendo.","a":["estaba"]},{"t":"text","q":"“¿Has acabado el cuadro?” → Preguntó si (yo, acabar) ___ el cuadro.","a":["había acabado"]},{"t":"text","q":"“¿Cuándo será el examen?” → Quiere saber cuándo (ser) ___ el examen.","a":["será"]},{"t":"text","q":"“¿Quién era la chica?” → Me preguntó quién (ser) ___ la chica.","a":["era"]},{"t":"text","q":"“¿Hablas español?” → Ha preguntado si (tú, hablar) ___ español.","a":["hablas"]},{"t":"text","q":"“¿Vais a ir a la sierra?” → Me preguntó si (nosotros, ir) ___ a ir a la sierra.","a":["íbamos"]}]},{"title":"연습 4. 올바른 문장","instr":"알맞은 문장을 고르세요.","rule":"간접 의문문에는 ¿ ? 를 쓰지 않음.","items":[{"t":"pick","q":"올바른 문장: ___","o":["Me preguntó si tenía novio.","Me preguntó ¿si tenía novio?","Me preguntó que tenía novio."],"a":"Me preguntó si tenía novio."},{"t":"pick","q":"올바른 문장: ___","o":["Le pregunté cómo se llamaba su hermano.","Le pregunté como se llama su hermano.","Le pregunté que cómo llama."],"a":"Le pregunté cómo se llamaba su hermano."},{"t":"pick","q":"올바른 문장: ___","o":["Me gustaría saber qué pasó anoche.","Me gustaría saber que pasó anoche.","Me gustaría saber si qué pasó."],"a":"Me gustaría saber qué pasó anoche."}]}]};</script>
