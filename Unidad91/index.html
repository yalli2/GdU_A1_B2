<script>window.UNIT={"id":91,"es":"Si ganan, serán campeones","ko":"조건문 (1): 가능한 조건","theory":"<h2>핵심 정리<\/h2>\n<h3>구조: Si + 직설법 현재 → 귀결<\/h3>\n<div class=\"tw\"><table><thead><tr><th>조건 (Si +)<\/th><th>귀결<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>presente de indicativo<\/td><td><b>단순미래<\/b> (가장 흔함)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si acabo la carrera este año, podré trabajar en un bufete.\">Si acabo la carrera este año, podré trabajar en un bufete.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si no nos damos prisa, llegaremos tarde.\">Si no nos damos prisa, llegaremos tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si ganan este partido, serán campeones.\">Si ganan este partido, serán campeones.<\/span><\/td><\/tr><tr><td>presente de indicativo<\/td><td><b>현재형<\/b> (매우 확실한 결과)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si encuentro otro trabajo, me cambio.\">Si encuentro otro trabajo, me cambio.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si discutís, me voy.\">Si discutís, me voy.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si te gusta esa pluma, te la regalo.\">Si te gusta esa pluma, te la regalo.<\/span><\/td><\/tr><tr><td>presente de indicativo<\/td><td><b>명령법<\/b> (명령·부탁)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si llaman de la oficina, avísame.\">Si llaman de la oficina, avísame.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si no quieren trabajar, váyanse.\">Si no quieren trabajar, váyanse.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si vienen ustedes a Madrid, vengan a visitarnos.\">Si vienen ustedes a Madrid, vengan a visitarnos.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>조건절은 문장 끝에 올 수 있습니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Podemos irnos si no te gusta la película.\">Podemos irnos si no te gusta la película.<\/span><\/div>\n<h3>일반적 조건 (= cuando, siempre que)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Si + 현재<\/th><th>현재<\/th><\/tr><\/thead><tbody><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si calientas el hielo, se derrite.\">Si calientas el hielo, se derrite.<\/span><\/td><td>보편적 진실<\/td><\/tr><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si hace frío, no voy a la piscina.\">Si hace frío, no voy a la piscina.<\/span><\/td><td>습관<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>si 뒤에는 <b>미래형·접속법 현재를 쓰지 않습니다<\/b>. (✗ Si lloverá…, ✗ Si llueva…)<\/div>","ex":[{"title":"연습 1. 조건절 동사 형태","instr":"알맞은 형태를 고르세요.","rule":"si + 직설법 현재.","items":[{"t":"pick","q":"Si ___ mañana, iré a la playa. (no llover)","o":["no llueve","no lloverá","no llueva"],"a":"no llueve"},{"t":"pick","q":"Si ___ este partido, serán campeones. (ganar, ellos)","o":["ganan","ganarán","ganen"],"a":"ganan"},{"t":"pick","q":"Si ___ hambre, come algo. (tener, tú)","o":["tienes","tendrás","tengas"],"a":"tienes"},{"t":"pick","q":"Si ___ la carrera este año, podré trabajar. (acabar, yo)","o":["acabo","acabaré","acabe"],"a":"acabo"},{"t":"pick","q":"Si no nos ___ prisa, llegaremos tarde. (dar)","o":["damos","daremos","demos"],"a":"damos"},{"t":"pick","q":"Si ___ ustedes a Madrid, vengan a visitarnos. (venir)","o":["vienen","vendrán","vengan"],"a":"vienen"},{"t":"pick","q":"Si ___ de la oficina, avísame. (llamar, ellos)","o":["llaman","llamarán","llamen"],"a":"llaman"},{"t":"pick","q":"Si te ___ esa pluma, te la regalo. (gustar)","o":["gusta","gustará","guste"],"a":"gusta"}]},{"title":"연습 2. 귀결절 쓰기","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"단순미래 / 현재 / 명령.","items":[{"t":"text","q":"Si acabo la carrera, (yo, poder) ___ trabajar en un bufete.","a":["podré"]},{"t":"text","q":"Si no nos damos prisa, (nosotros, llegar) ___ tarde.","a":["llegaremos"]},{"t":"text","q":"Si no llueve mañana, (yo, ir) ___ a la playa.","a":["iré"]},{"t":"text","q":"Si ganan este partido, (ellos, ser) ___ campeones.","a":["serán"]},{"t":"text","q":"Si estudias, (tú, aprobar) ___ .","a":["aprobarás"]},{"t":"text","q":"Si hace frío, no (yo, ir) ___ a la piscina.","a":["voy"]},{"t":"text","q":"Si calientas el hielo, (derretirse) ___ .","a":["se derrite"]},{"t":"text","q":"Si llaman de la oficina, (tú, avisarme) ___ .","a":["avísame"]}]},{"title":"연습 3. 알맞은 표현 고르기","instr":"알맞은 것을 고르세요.","rule":"가능한 조건에는 si + 현재.","items":[{"t":"pick","q":"___ no te gusta la película, podemos irnos.","o":["Si","Aunque","Cuando que"],"a":"Si"},{"t":"pick","q":"Si no ___ , llegaremos tarde. (nosotros, darse prisa)","o":["nos damos prisa","nos daremos prisa","nos demos prisa"],"a":"nos damos prisa"},{"t":"pick","q":"Si ___ otro trabajo, me cambio. (encontrar, yo)","o":["encuentro","encontraré","encuentre"],"a":"encuentro"},{"t":"pick","q":"Si discutís, me ___ . (irse, yo)","o":["voy","iré","vaya"],"a":"voy"},{"t":"pick","q":"Si ___ ustedes a Madrid, vengan a visitarnos.","o":["vienen","vendrán","vengan"],"a":"vienen"},{"t":"pick","q":"___ calientas el hielo, se derrite.","o":["Si","Que","Porque"],"a":"Si"}]},{"title":"연습 4. 문장 완성","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"si + 현재, 귀결 = 미래·현재·명령.","items":[{"t":"text","q":"Si (tú, tener) ___ tiempo, ven a verme.","a":["tienes"]},{"t":"text","q":"Si (nosotros, perder) ___ el tren, llegaremos tarde.","a":["perdemos"]},{"t":"text","q":"Si no (ellos, venir) ___ , nos iremos.","a":["vienen"]},{"t":"text","q":"Si me (tú, dar) ___ tu número, te llamaré.","a":["das"]},{"t":"text","q":"Si (llover) ___ , no saldremos.","a":["llueve"]},{"t":"text","q":"Si (hacer) ___ calor, nos bañamos en la piscina.","a":["hace"]}]}]};</script>
