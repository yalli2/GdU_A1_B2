<script>window.UNIT={"id":45,"es":"tengo, tienes, tiene…","ko":"tener 직설법 현재","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>tener<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td><b>tengo<\/b><\/td><\/tr><tr><td>tú<\/td><td><b>tienes<\/b><\/td><\/tr><tr><td>usted, él, ella<\/td><td><b>tiene<\/b><\/td><\/tr><tr><td>nosotros/as<\/td><td><b>tenemos<\/b><\/td><\/tr><tr><td>vosotros/as<\/td><td><b>tenéis<\/b><\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td><b>tienen<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>불규칙: yo 형 <b>tengo<\/b>, e → ie 변화(tienes, tiene, tienen), nosotros/vosotros는 규칙.<\/div>\n<h3>tener의 쓰임<\/h3>\n<ul class=\"rules\"><li><b>소유<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes dinero?\">¿Tienes dinero?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo un ordenador nuevo.\">Tengo un ordenador nuevo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Luis no tiene coche.\">Luis no tiene coche.<\/span><\/li><li><b>요청<\/b>(의문문): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes un lápiz? — Sí, pero lo necesito.\">¿Tienes un lápiz? — Sí, pero lo necesito.<\/span><\/li><li><b>가족<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cristina tiene siete hermanos.\">Cristina tiene siete hermanos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuántos hijos tenéis? — No tenemos hijos.\">¿Cuántos hijos tenéis? — No tenemos hijos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Adela y Jorge no tienen hijos.\">Adela y Jorge no tienen hijos.<\/span><\/li><li><b>나이<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuántos años tienes?\">¿Cuántos años tienes?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis abuelos tienen noventa años.\">Mis abuelos tienen noventa años.<\/span><\/li><li><b>묘사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Enrique tiene los ojos verdes.\">Enrique tiene los ojos verdes.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi casa no tiene jardín.\">Mi casa no tiene jardín.<\/span><\/li><li><b>신체·정신 상태<\/b>: hambre, sed, frío, calor, miedo, sueño, fiebre, gripe → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo sueño.\">Tengo sueño.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tenéis frío?\">¿Tenéis frío?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No, tenemos miedo.\">No, tenemos miedo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes fiebre?\">¿Tienes fiebre?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tienes mala cara.\">Tienes mala cara.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. tener 변화","instr":"알맞은 형태를 쓰세요.","rule":"tengo, tienes, tiene, tenemos, tenéis, tienen.","items":[{"t":"text","q":"(yo) ___ un ordenador nuevo.","a":["tengo"]},{"t":"text","q":"(tú) ___ dinero.","a":["tienes"]},{"t":"text","q":"(él) ___ siete hermanos.","a":["tiene"]},{"t":"text","q":"(nosotros) no ___ hijos.","a":["tenemos"]},{"t":"text","q":"(vosotros) ¿___ frío?","a":["tenéis"]},{"t":"text","q":"(ellos) ___ noventa años.","a":["tienen"]},{"t":"text","q":"(usted) ¿___ fiebre?","a":["tiene"]},{"t":"text","q":"(ellas) ___ sueño.","a":["tienen"]}]},{"title":"연습 2. 나이와 가족","instr":"알맞은 형태를 고르세요.","rule":"나이: tener + 숫자 + años. 가족: tener hermanos.","items":[{"t":"pick","q":"¿Cuántos años ___ tú?","o":["tienes","eres","estás"],"a":"tienes"},{"t":"pick","q":"Mis abuelos ___ noventa años.","o":["tienen","son","están"],"a":"tienen"},{"t":"pick","q":"Cristina ___ siete hermanos.","o":["tiene","es","está"],"a":"tiene"},{"t":"pick","q":"Yo ___ veinte años.","o":["tengo","soy","estoy"],"a":"tengo"},{"t":"pick","q":"¿Cuántos hijos ___ vosotros?","o":["tenéis","tienen","tenemos"],"a":"tenéis"},{"t":"pick","q":"Adela y Jorge no ___ hijos.","o":["tienen","tiene","tenemos"],"a":"tienen"}]},{"title":"연습 3. tener + 명사 (상태)","instr":"알맞은 명사를 고르세요.","rule":"tener hambre/sed/frío/calor/miedo/sueño/fiebre.","items":[{"t":"pick","q":"Es tarde. Tengo ___.","o":["sueño","frío","fiebre"],"a":"sueño"},{"t":"pick","q":"No he comido nada. Tengo ___.","o":["hambre","sed","sueño"],"a":"hambre"},{"t":"pick","q":"Hace mucho calor. Tengo ___.","o":["sed","frío","miedo"],"a":"sed"},{"t":"pick","q":"En la calle hace mucho frío. Tengo ___.","o":["frío","calor","sed"],"a":"frío"},{"t":"pick","q":"Me duele todo y la temperatura es 39. Tengo ___.","o":["fiebre","miedo","sueño"],"a":"fiebre"},{"t":"pick","q":"La película da mucho miedo. Tenemos ___.","o":["miedo","calor","sed"],"a":"miedo"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 tener 형태를 쓰세요.","rule":"주어에 맞는 형태로.","items":[{"t":"text","q":"Enrique ___ los ojos verdes.","a":["tiene"]},{"t":"text","q":"Mi casa no ___ jardín.","a":["tiene"]},{"t":"text","q":"¿Tú ___ un lápiz?","a":["tienes"]},{"t":"text","q":"Nosotros ___ un coche viejo.","a":["tenemos"]},{"t":"text","q":"Vosotros ___ mala cara.","a":["tenéis"]},{"t":"text","q":"Yo no ___ coche.","a":["tengo"]}]}]};</script>
