<script>window.UNIT={"id":84,"es":"Quiero que me ayudes","ko":"소망 표현","theory":"<h2>핵심 정리<\/h2>\n<h3>소망 동사 + 부정사 / que + 접속법<\/h3>\n<ul class=\"rules\"><li>querer, desear, preferir, esperar, rogar, soñar con, tener ganas de, (me, te…) gustaría / importaría<\/li><li><b>주어가 같으면 부정사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"De pequeña, Elisa soñaba con ser escritora.\">De pequeña, Elisa soñaba con ser escritora.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te gustaría ganar algo de dinero?\">¿Te gustaría ganar algo de dinero?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy no deseo ver a nadie. Estoy triste.\">Hoy no deseo ver a nadie. Estoy triste.<\/span><\/li><li><b>주어가 다르면 que + 접속법<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quiero que me ayudes, Jorge.\">Quiero que me ayudes, Jorge.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo ganas de que trabajen mis hijos.\">Tengo ganas de que trabajen mis hijos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Matías, prefiero que me lo digas ahora.\">Matías, prefiero que me lo digas ahora.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Espero que haga buen tiempo el domingo.\">Espero que haga buen tiempo el domingo.<\/span><\/li><li>현재·미래 → <b>접속법 현재<\/b>, 과거·가능법 뒤 → <b>접속법 불완료과거<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis padres querían que fuera piloto.\">Mis padres querían que fuera piloto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gustaría que me hicieras un favor, Mario.\">Me gustaría que me hicieras un favor, Mario.<\/span><\/li><\/ul>\n<h3>¡Que + 접속법 현재!<\/h3>\n<ul class=\"rules\"><li>현재·미래의 소망: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Que tengáis buen viaje!\">¡Que tengáis buen viaje!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Que Ángel apruebe!\">¡Que Ángel apruebe!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Que cumplas muchos más!\">¡Que cumplas muchos más!<\/span><\/li><\/ul>\n<h3>Ojalá + 접속법<\/h3>\n<ul class=\"rules\"><li>실현 가능한 소망 → <b>현재<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ojalá haga buen tiempo mañana!\">¡Ojalá haga buen tiempo mañana!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ojalá encuentres trabajo pronto!\">¡Ojalá encuentres trabajo pronto!<\/span><\/li><li>어렵거나 불가능한 소망 → <b>불완료과거<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ojalá me tocara la lotería!\">¡Ojalá me tocara la lotería!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ojalá fuera más joven!\">¡Ojalá fuera más joven!<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 부정사 vs 접속법","instr":"알맞은 형태를 고르세요.","rule":"같은 주어 → 부정사, 다른 주어 → que + 접속법.","items":[{"t":"pick","q":"Quiero ___ a tu casa. (yo)","o":["ir","que vaya","que voy"],"a":"ir"},{"t":"pick","q":"Quiero que ___ a mi casa. (tú)","o":["vengas","venir","vienes"],"a":"vengas"},{"t":"pick","q":"Espero ___ buen trabajo. (yo, encontrar)","o":["encontrar","que encuentre","encuentro"],"a":"encontrar"},{"t":"pick","q":"Espero que ___ buen trabajo. (tú, encontrar)","o":["encuentres","encontrar","encuentras"],"a":"encuentres"},{"t":"pick","q":"Elisa soñaba con ___ escritora. (ella)","o":["ser","que sea","que fuera"],"a":"ser"},{"t":"pick","q":"Mis padres querían que ___ piloto. (yo, ser)","o":["fuera","sea","ser"],"a":"fuera"},{"t":"pick","q":"Prefiero que me lo ___ ahora. (tú, decir)","o":["digas","dices","dijeras"],"a":"digas"},{"t":"pick","q":"Tengo ganas de ___ a Perú. (yo, viajar)","o":["viajar","que viaje","viajo"],"a":"viajar"}]},{"title":"연습 2. 접속법 형태 쓰기","instr":"알맞은 형태를 쓰세요.","rule":"현재·미래: 접속법 현재.","items":[{"t":"text","q":"Quiero que (tú, ayudar) ___ a Jorge.","a":["ayudes"]},{"t":"text","q":"Espero que (hacer) ___ buen tiempo el domingo.","a":["haga"]},{"t":"text","q":"Prefiero que (tú, venir) ___ mañana.","a":["vengas"]},{"t":"text","q":"Deseo que (vosotros, ser) ___ felices.","a":["seáis"]},{"t":"text","q":"Tengo ganas de que (ellos, llegar) ___ .","a":["lleguen"]},{"t":"text","q":"Rogamos que (ustedes, tener) ___ paciencia.","a":["tengan"]},{"t":"text","q":"Mi madre quiere que (yo, estudiar) ___ más.","a":["estudie"]},{"t":"text","q":"Queremos que (tú, quedarse) ___ aquí.","a":["te quedes"]}]},{"title":"연습 3. 과거·가능법 뒤","instr":"알맞은 형태를 쓰세요.","rule":"접속법 불완료과거.","items":[{"t":"text","q":"Mis padres querían que (yo, ser) ___ piloto.","a":["fuera"]},{"t":"text","q":"Me gustaría que (tú, hacer) ___ un favor.","a":["hicieras"]},{"t":"text","q":"Quería que (ellos, venir) ___ a la fiesta.","a":["vinieran"]},{"t":"text","q":"Mi jefe preferiría que (nosotros, llegar) ___ antes.","a":["llegáramos"]},{"t":"text","q":"Esperaba que (tú, estar) ___ en casa.","a":["estuvieras"]},{"t":"text","q":"Me encantaría que (vosotros, poder) ___ venir.","a":["pudierais"]}]},{"title":"연습 4. ¡Que…! 와 Ojalá","instr":"알맞은 형태를 고르세요.","rule":"¡Que + 현재 / Ojalá + 현재(가능) · 불완료과거(불가능).","items":[{"t":"pick","q":"¡Que ___ buen viaje! (vosotros, tener)","o":["tengáis","tenéis","tuvierais"],"a":"tengáis"},{"t":"pick","q":"¡Que ___ muchos más! (tú, cumplir)","o":["cumplas","cumples","cumplieras"],"a":"cumplas"},{"t":"pick","q":"¡Ojalá ___ buen tiempo mañana! (hacer)","o":["haga","hiciera","hace"],"a":"haga"},{"t":"pick","q":"¡Ojalá ___ más joven! (yo, ser — 불가능)","o":["fuera","sea","soy"],"a":"fuera"},{"t":"pick","q":"¡Ojalá me ___ la lotería! (tocar — 매우 어려움)","o":["tocara","toque","toca"],"a":"tocara"},{"t":"pick","q":"¡Ojalá ___ trabajo pronto! (tú, encontrar — 가능)","o":["encuentres","encontraras","encuentras"],"a":"encuentres"},{"t":"pick","q":"¡Ojalá ___ más dinero! (yo, tener — 현재 불가능)","o":["tuviera","tenga","tengo"],"a":"tuviera"},{"t":"pick","q":"¡Que ___ Ángel! (aprobar)","o":["apruebe","aprobara","aprueba"],"a":"apruebe"}]}]};</script>
