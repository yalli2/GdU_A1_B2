<script>window.UNIT={"id":96,"es":"Suelo comer en casa","ko":"부정사 구문 (3): soler, llevar, volver a","theory":"<h2>핵심 정리<\/h2>\n<h3>soler + 부정사 (습관·반복)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>현재<\/th><th>불완료과거<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>suelo<\/td><td>solía<\/td><\/tr><tr><td>tú<\/td><td>sueles<\/td><td>solías<\/td><\/tr><tr><td>usted, él, ella<\/td><td>suele<\/td><td>solía<\/td><\/tr><tr><td>nosotros/as<\/td><td>solemos<\/td><td>solíamos<\/td><\/tr><tr><td>vosotros/as<\/td><td>soléis<\/td><td>solíais<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>suelen<\/td><td>solían<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>현재: 지금의 습관 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Solemos comer en casa.\">Solemos comer en casa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde suelen pasar las vacaciones?\">¿Dónde suelen pasar las vacaciones?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No suelo trabajar por la tarde.\">No suelo trabajar por la tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Renata suele ir en metro al trabajo.\">Renata suele ir en metro al trabajo.<\/span><\/li><li>불완료과거: 과거의 습관(지금은 아님) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"De pequeño, solía pasar las vacaciones en Buenos Aires.\">De pequeño, solía pasar las vacaciones en Buenos Aires.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando trabajábamos en Venezuela, solíamos ir a pescar todos los fines de semana.\">Cuando trabajábamos en Venezuela, solíamos ir a pescar todos los fines de semana.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando era joven, solía hacer mucho deporte.\">Cuando era joven, solía hacer mucho deporte.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>soler는 <b>현재와 불완료과거<\/b>로만 주로 씁니다. 현재 변화는 o → ue (suelo, sueles, suele, solemos, soléis, suelen).<\/div>\n<h3>llevar + sin + 부정사 (~하지 않은 채 …째)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando me llamó Alfonso, llevaba un mes sin salir.\">Cuando me llamó Alfonso, llevaba un mes sin salir.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"…llevaba sin salir un mes.\">…llevaba sin salir un mes.<\/span><\/li><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llevamos dos días sin dormir.\">Llevamos dos días sin dormir.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llevamos sin dormir dos días.\">Llevamos sin dormir dos días.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Agua, por favor. Llevo dos días sin beber.\">Agua, por favor. Llevo dos días sin beber.<\/span><\/li><li>llevar + sin + 부정사 + desde + 시점: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llevamos sin dormir desde el lunes.\">Llevamos sin dormir desde el lunes.<\/span><\/li><\/ul>\n<h3>volver a + 부정사 (다시 ~하다)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He vuelto a ver a Teresa.\">He vuelto a ver a Teresa.<\/span> (또 만났다), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No vuelvas a hacer eso o me enfado.\">No vuelvas a hacer eso o me enfado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se ha vuelto a estropear el coche.\">Se ha vuelto a estropear el coche.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. soler 활용","instr":"알맞은 형태를 쓰세요.","rule":"suelo, sueles, suele, solemos, soléis, suelen.","items":[{"t":"text","q":"(yo, soler) ___ comer en casa.","a":["Suelo"]},{"t":"text","q":"(tú, soler) ___ levantarte a las siete.","a":["Sueles"]},{"t":"text","q":"(Renata, soler) ___ ir en metro.","a":["suele"]},{"t":"text","q":"(nosotros, soler) ___ cenar tarde.","a":["Solemos"]},{"t":"text","q":"(vosotros, soler) ___ viajar en verano.","a":["soléis"]},{"t":"text","q":"(ellos, soler) ___ pasar las vacaciones en la playa.","a":["suelen"]},{"t":"text","q":"(yo, no soler) No ___ trabajar por la tarde.","a":["suelo"]},{"t":"text","q":"(usted, soler) ¿___ comer fuera?","a":["Suele"]}]},{"title":"연습 2. 현재 vs 불완료과거","instr":"알맞은 형태를 고르세요.","rule":"지금의 습관 = suelo, 과거의 습관 = solía.","items":[{"t":"pick","q":"De pequeño, ___ pasar las vacaciones en Buenos Aires.","o":["solía","suelo","he solido"],"a":"solía"},{"t":"pick","q":"Ahora ___ pasar las vacaciones en la montaña.","o":["suelo","solía","solí"],"a":"suelo"},{"t":"pick","q":"Cuando trabajábamos en Venezuela, ___ ir a pescar.","o":["solíamos","solemos","soléis"],"a":"solíamos"},{"t":"pick","q":"Cuando era joven, ___ hacer mucho deporte.","o":["solía","suelo","suele"],"a":"solía"},{"t":"pick","q":"Normalmente ___ ir en metro. (ella)","o":["suele","solía","solió"],"a":"suele"},{"t":"pick","q":"Antes ellos ___ vivir en el campo.","o":["solían","suelen","soler"],"a":"solían"},{"t":"pick","q":"Mi abuelo ___ pasear todas las mañanas. (지금도)","o":["suele","solía","solió"],"a":"suele"},{"t":"pick","q":"No ___ comer carne cuando era niño. (yo)","o":["solía","suelo","soler"],"a":"solía"}]},{"title":"연습 3. llevar + sin","instr":"알맞은 형태를 쓰세요.","rule":"llevar + (기간) + sin + 부정사.","items":[{"t":"text","q":"(nosotros, llevar) ___ dos días sin dormir.","a":["Llevamos"]},{"t":"text","q":"(yo, llevar) ___ dos días sin beber.","a":["Llevo"]},{"t":"text","q":"Cuando me llamó Alfonso, (yo, llevar) ___ un mes sin salir.","a":["llevaba"]},{"t":"text","q":"Llevamos sin ___ desde el lunes. (dormir)","a":["dormir"]},{"t":"text","q":"(ella, llevar) ___ un año sin ver a su familia.","a":["Lleva"]},{"t":"text","q":"Llevan tres meses sin ___ . (trabajar)","a":["trabajar"]},{"t":"text","q":"Cuando llegué, (ellos, llevar) ___ una hora sin hablar.","a":["llevaban"]},{"t":"text","q":"(tú, llevar) ___ mucho tiempo sin llamar.","a":["Llevas"]}]},{"title":"연습 4. volver a","instr":"알맞은 형태를 고르세요.","rule":"volver a + 부정사 = 다시 ~하다.","items":[{"t":"pick","q":"He ___ a ver a Teresa.","o":["vuelto","vuelta","volver"],"a":"vuelto"},{"t":"pick","q":"No ___ a hacer eso o me enfado.","o":["vuelvas","vuelves","volver"],"a":"vuelvas"},{"t":"pick","q":"Se ha ___ a estropear el coche.","o":["vuelto","volver","vuelvo"],"a":"vuelto"},{"t":"pick","q":"Mañana ___ a llamarte. (yo)","o":["vuelvo","volví","volvía"],"a":"vuelvo"},{"t":"pick","q":"Ayer ___ a llover.","o":["volvió","vuelve","volvería"],"a":"volvió"},{"t":"pick","q":"No ___ a decírtelo. (yo, volver)","o":["volveré","vuelvo de","volví de"],"a":"volveré"}]}]};</script>
