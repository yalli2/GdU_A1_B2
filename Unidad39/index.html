tabindex=\"0\" data-say=\"Está leyéndomela.\">Está leyéndomela.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>대명사를 붙이면 <b>강세 위치를 지키기 위해 악센트<\/b>가 생길 수 있습니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ama → ámame\">ama → ámame<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dame → dámelo\">dame → dámelo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dar → dárnosla\">dar → dárnosla<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"prestar → prestármelo\">prestar → prestármelo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"arreglando → arreglándola\">arreglando → arreglándola<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"preguntando → preguntándote\">preguntando → preguntándote<\/span><\/div>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>조동사 + 동사원형/현재분사에서는 <b>동사 앞<\/b>에도 쓸 수 있습니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No los puedo ver.\">No los puedo ver.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No puedo verlos.\">No puedo verlos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te quiero decir algo.\">Te quiero decir algo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Me lo vais a regalar?\">¿Me lo vais a regalar?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo está envolviendo.\">Lo está envolviendo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me lo está leyendo.\">Me lo está leyendo.<\/span><\/div>\n<ul class=\"rules\"><li>부정명령에서는 대명사가 동사 앞: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me lo des.\">No me lo des.<\/span> (Unidad 78)<\/li><\/ul>","ex":[{"title":"연습 1. 긍정명령 + 대명사","instr":"알맞은 형태를 쓰세요. (악센트 주의)","rule":"긍정명령에는 대명사를 동사 뒤에 붙입니다. dame → dámelo처럼 악센트가 필요할 때가 있습니다.","items":[{"t":"text","q":"나를 사랑해 줘 (amar) → ___","a":["ámame"]},{"t":"text","q":"그것을 팔아라 (vender, el coche) → ___","a":["véndelo"]},{"t":"text","q":"나에게 줘 (dar) → ___","a":["dame"]},{"t":"text","q":"그것을 내게 줘 (dar, el libro) → ___","a":["dámelo"]},{"t":"text","q":"그에게 말해 (decir) → ___","a":["dile"]},{"t":"text","q":"그것을 그에게 줘 (dar, las gafas) → ___","a":["dáselas"]},{"t":"text","q":"나에게 말해 줘 (decir) → ___","a":["dime"]},{"t":"text","q":"그것을 봐라 (mirar, el cuadro) → ___","a":["míralo"]}]},{"title":"연습 2. 동사원형 + 대명사","instr":"알맞은 형태를 고르세요.","rule":"동사원형 뒤에 대명사를 붙입니다. 두 개 붙이면 악센트가 생길 수 있습니다.","items":[{"t":"pick","q":"No quiere (ver) ___ . (우리를)","o":["vernos","nos ver","verlos"],"a":"vernos"},{"t":"pick","q":"He olvidado (comprar) ___ . (그것, la leche)","o":["comprarla","comprarlo","la comprar"],"a":"comprarla"},{"t":"pick","q":"Quiero (decir) ___ algo. (너희에게)","o":["deciros","decirnos","decirte"],"a":"deciros"},{"t":"pick","q":"Me gustaría (preguntar) ___ algo. (너에게)","o":["preguntarte","preguntarse","preguntarme"],"a":"preguntarte"},{"t":"pick","q":"Él quiere (dar) ___ . (우리에게 그것을 la entrada)","o":["dárnosla","darnosla","darlanos"],"a":"dárnosla"},{"t":"pick","q":"¿Puedes (prestar) ___ un boli? (나에게)","o":["prestarme","prestarte","prestarse"],"a":"prestarme"}]},{"title":"연습 3. 현재분사 + 대명사","instr":"알맞은 형태를 쓰세요. (악센트 주의)","rule":"현재분사에 대명사를 붙이면 반드시 악센트를 씁니다.","items":[{"t":"text","q":"Está (envolver) ___ . (그것을, el regalo)","a":["envolviéndolo"]},{"t":"text","q":"¿Qué está (decir) ___ ? (그에게)","a":["diciéndole"]},{"t":"text","q":"Estoy (escribir) ___ a Laura. (그녀에게)","a":["escribiéndole"]},{"t":"text","q":"Está (leer) ___ . (나에게 그것을, la carta)","a":["leyéndomela"]},{"t":"text","q":"Estoy (arreglar) ___ . (그것을, la bici)","a":["arreglándola"]},{"t":"text","q":"Está (preguntar) ___ . (너에게)","a":["preguntándote"]}]},{"title":"연습 4. 대명사 위치","instr":"알맞은 것을 고르세요.","rule":"조동사 + 원형/현재분사는 대명사를 동사 앞이나 뒤 둘 다 둘 수 있습니다. 긍정명령은 반드시 뒤에.","items":[{"t":"pick","q":"___ la verdad. (나에게 말해 줘)","o":["Dime","Me di","Me dime"],"a
