<script>window.UNIT={"id":78,"es":"dámelo, no me lo des","ko":"대명사가 붙는 명령법","theory":"<h2>핵심 정리<\/h2>\n<h3>직접목적 대명사 (me, te, lo, la, nos, los, las)<\/h3>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>긍정 (동사 뒤에 붙임)<\/th><th>부정 (no + 대명사 + 동사)<\/th><\/tr><\/thead><tbody><tr><td>tú<\/td><td>cómpralo / cómprala<\/td><td>no la compres<\/td><\/tr><tr><td>usted<\/td><td>cómprela<\/td><td>no la compre<\/td><\/tr><tr><td>vosotros<\/td><td>compradla<\/td><td>no la compréis<\/td><\/tr><tr><td>ustedes<\/td><td>cómprenla<\/td><td>no la compren<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mira esta lámpara. Cómprala. Es muy bonita.\">Mira esta lámpara. Cómprala. Es muy bonita.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No la compres. A mí no me gusta.\">No la compres. A mí no me gusta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llámame mañana.\">Llámame mañana.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mírame a los ojos.\">Mírame a los ojos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Ponemos la mesa? —No, no la pongáis todavía.\">—¿Ponemos la mesa? —No, no la pongáis todavía.<\/span><\/li><\/ul>\n<h3>간접목적 대명사 (me, le, nos, les)<\/h3>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>긍정<\/th><th>부정<\/th><\/tr><\/thead><tbody><tr><td>tú<\/td><td>préstame<\/td><td>no me prestes<\/td><\/tr><tr><td>usted<\/td><td>présteme<\/td><td>no me preste<\/td><\/tr><tr><td>vosotros<\/td><td>prestadme<\/td><td>no me prestéis<\/td><\/tr><tr><td>ustedes<\/td><td>préstenme<\/td><td>no me presten<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Préstame tu diccionario.\">Préstame tu diccionario.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No le prestes el tuyo, yo tengo dos.\">No le prestes el tuyo, yo tengo dos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dame ese libro, por favor.\">Dame ese libro, por favor.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Enseñadles el mapa.\">Enseñadles el mapa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dinos la verdad.\">Dinos la verdad.<\/span><\/li><\/ul>\n<h3>간접 + 직접 대명사 (간접이 앞)<\/h3>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>긍정<\/th><th>부정<\/th><\/tr><\/thead><tbody><tr><td>tú<\/td><td>dámelo<\/td><td>no me lo des<\/td><\/tr><tr><td>usted<\/td><td>démelo<\/td><td>no me lo dé<\/td><\/tr><tr><td>vosotros<\/td><td>dádmelo<\/td><td>no me lo deis<\/td><\/tr><tr><td>ustedes<\/td><td>dénmelo<\/td><td>no me lo den<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>le/les + lo/la → <b>se lo/la<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Jorge le gusta tu dibujo. Regálaselo.\">A Jorge le gusta tu dibujo. Regálaselo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tienes las manos sucias. Lávatelas.\">Tienes las manos sucias. Lávatelas.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>대명사가 붙으면 <b>악센트<\/b> 위치 유지: compra → cómpralo, da → dámelo.<\/div>","ex":[{"title":"연습 1. 직접목적 대명사 (긍정)","instr":"알맞은 형태를 쓰세요.","rule":"동사 + 대명사를 한 단어로.","items":[{"t":"text","q":"Esta lámpara es bonita. (tú, comprar + la) ___ .","a":["Cómprala"]},{"t":"text","q":"Mira el libro. (tú, leer + lo) ___ .","a":["Léelo"]},{"t":"text","q":"Necesito ayuda. (tú, llamar + me) ___ mañana.","a":["Llámame"]},{"t":"text","q":"(tú, mirar + me) ___ a los ojos.","a":["Mírame"]},{"t":"text","q":"(usted, cerrar + la) ___ , por favor.","a":["Ciérrela"]},{"t":"text","q":"(vosotros, hacer + lo) ___ ahora.","a":["Hacedlo"]},{"t":"text","q":"(tú, abrir + la) ___ , hace calor.","a":["Ábrela"]},{"t":"text","q":"(ustedes, escribir + la) ___ .","a":["Escríbanla"]}]},{"title":"연습 2. 직접목적 대명사 (부정)","instr":"알맞은 형태를 쓰세요.","rule":"no + 대명사 + 접속법.","items":[{"t":"text","q":"No (tú, comprar + la) ___ .","a":["la compres"]},{"t":"text","q":"No (usted, comprar + la) ___ .","a":["la compre"]},{"t":"text","q":"No (vosotros, poner + la) ___ todavía.","a":["la pongáis"]},{"t":"text","q":"No (tú, llamar + me) ___ tarde.","a":["me llames"]},{"t":"text","q":"No (ustedes, abrir + lo) ___ .","a":["lo abran"]},{"t":"text","q":"No (tú, hacer + lo) ___ .","a":["lo hagas"]},{"t":"text","q":"No (usted, perder + lo) ___ .","a":["lo pierda"]},{"t":"text","q":"No (vosotros, decir + lo) ___ .","a":["lo digáis"]}]},{"title":"연습 3. 간접목적 대명사","instr":"알맞은 형태를 쓰세요.","rule":"préstame / no me prestes.","items":[{"t":"text","q":"(tú, prestar + me) ___ tu diccionario.","a":["Préstame"]},{"t":"text","q":"(tú, dar + me) ___ ese libro.","a":["Dame"]},{"t":"text","q":"(tú, decir + nos) ___ la verdad.","a":["Dinos"]},{"t":"text","q":"(vosotros, enseñar + les) ___ el mapa.","a":["Enseñadles"]},{"t":"text","q":"No (tú, prestar + le) ___ el tuyo.","a":["le prestes"]},{"t":"text","q":"(usted, prestar + me) ___ su pluma.","a":["Présteme"]},{"t":"text","q":"No (tú, dar + me) ___ más.","a":["me des"]},{"t":"text","q":"(ustedes, prestar + me) ___ ayuda.","a":["Préstenme"]}]},{"title":"연습 4. 간접 + 직접 대명사","instr":"알맞은 형태를 쓰세요.","rule":"dámelo / no me lo des / regálaselo.","items":[{"t":"text","q":"¿Quieres el libro? (tú, dar + me + lo) ___ .","a":["Dámelo"]},{"t":"text","q":"(tú, dar + me + lo) No ___ .","a":["me lo des"]},{"t":"text","q":"A Jorge le gusta tu dibujo. (tú, regalar + le + lo) ___ .","a":["Regálaselo"]},{"t":"text","q":"Tienes las manos sucias. (tú, lavarse + las) ___ .","a":["Lávatelas"]},{"t":"text","q":"(usted, dar + me + lo) ___ , por favor.","a":["Démelo"]},{"t":"text","q":"(vosotros, dar + me + lo) ___ .","a":["Dádmelo"]},{"t":"text","q":"(tú, decir + me + lo) ___ ya.","a":["Dímelo"]},{"t":"text","q":"(tú, comprar + le + la) ___ a tu madre.","a":["Cómprasela"]},{"t":"text","q":"No (tú, decir + se + lo) ___ a nadie.","a":["se lo digas"]},{"t":"text","q":"(tú, mandar + les + la) ___ hoy.","a":["Mándasela"]}]},{"title":"연습 5. 올바른 문장","instr":"올바른 형태를 고르세요.","rule":"긍정: 붙임, 부정: 앞.","items":[{"t":"pick","q":"올바른 문장: ___","o":["Cómpralo.","Lo compra.","Compralo."],"a":"Cómpralo."},{"t":"pick","q":"올바른 문장: ___","o":["No lo compres.","No cómprelo.","No compreslo."],"a":"No lo compres."},{"t":"pick","q":"올바른 문장: ___","o":["Dámelo.","Me lo da.","Dame lo."],"a":"Dámelo."},{"t":"pick","q":"올바른 문장: ___","o":["No me lo des.","Dámelo no.","No dámelo."],"a":"No me lo des."},{"t":"pick","q":"올바른 문장: ___","o":["Regálaselo.","Regálalelo.","Regálele lo."],"a":"Regálaselo."}]}]};</script>
