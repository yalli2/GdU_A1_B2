<script>window.UNIT={"id":7,"es":"un perro / el perro","ko":"정관사와 부정관사의 대조","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th>부정관사 un, una, unos, unas<\/th><th>정관사 el, la, los, las<\/th><\/tr><\/thead><tbody><tr><td>처음 언급하는 <b>새로운 정보<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo un loro y un perro.\">Tengo un loro y un perro.<\/span><\/td><td>이미 언급한 <b>알려진 정보<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El loro se llama Ricky y el perro se llama Trotski.\">El loro se llama Ricky y el perro se llama Trotski.<\/span><\/td><\/tr><tr><td>어떤 <b>종류·집단의 하나<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Un hijo de Andrés es médico.\">Un hijo de Andrés es médico.<\/span> (아들이 여럿)<\/td><td><b>유일하거나 특정한 것<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La hija de Rosa es escritora.\">La hija de Rosa es escritora.<\/span> (딸이 하나)<\/td><\/tr><tr><td>여러 개 중 아무거나 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tucumán es una ciudad de Argentina.\">Tucumán es una ciudad de Argentina.<\/span><\/td><td>하나뿐인 것 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Buenos Aires es la capital de Argentina.\">Buenos Aires es la capital de Argentina.<\/span><\/td><\/tr><tr><td>불특정한 것 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito alquilar un coche.\">Necesito alquilar un coche.<\/span> (아무 차나)<\/td><td>특정한 것 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito arreglar el coche.\">Necesito arreglar el coche.<\/span> (내 차)<\/td><\/tr><tr><td><b>수량<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Un melón, por favor.\">Un melón, por favor.<\/span><\/td><td><b>일반적인 의미<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me encanta el melón.\">Me encanta el melón.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>한 번 소개된 명사는 두 번째부터 정관사로 바뀝니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estoy leyendo un libro sobre una cantante.\">Estoy leyendo un libro sobre una cantante.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El libro se titula «Mi vida». La cantante tiene…\">El libro se titula «Mi vida». La cantante tiene…<\/span><\/div>","ex":[{"title":"연습 1. 새 정보 vs 아는 정보","instr":"알맞은 관사를 고르세요.","rule":"처음 말하는 새 정보는 부정관사, 이미 말한 것은 정관사입니다.","items":[{"t":"pick","q":"Tengo un perro y un gato. ___ perro es blanco.","o":["Un","El"],"a":"El"},{"t":"pick","q":"Ayer vi una película. ___ película es muy buena.","o":["Una","La"],"a":"La"},{"t":"pick","q":"Voy a leer un libro. ___ libro es de mi hermano.","o":["Un","El"],"a":"El"},{"t":"pick","q":"Tiene un hijo y una hija. ___ hija es médica.","o":["Una","La"],"a":"La"},{"t":"pick","q":"Tengo ___ perro en casa.","o":["un","el"],"a":"un"},{"t":"pick","q":"Estoy leyendo ___ libro sobre una cantante.","o":["un","el"],"a":"un"},{"t":"pick","q":"Estoy leyendo un libro sobre una cantante. ___ cantante tiene una voz preciosa.","o":["Una","La"],"a":"La"}]},{"title":"연습 2. 관사 하나 고르기","instr":"알맞은 관사를 고르세요.","rule":"하나뿐이거나 특정한 것은 정관사, 여럿 중 하나는 부정관사.","items":[{"t":"pick","q":"Andrés tiene tres hijos. ___ hijo de Andrés es médico.","o":["Un","El"],"a":"Un"},{"t":"pick","q":"Rosa solo tiene una hija. ___ hija de Rosa es escritora.","o":["Una","La"],"a":"La"},{"t":"pick","q":"Tucumán es ___ ciudad de Argentina.","o":["una","la"],"a":"una","why":"아르헨티나에는 도시가 많으므로 una입니다."},{"t":"pick","q":"Buenos Aires es ___ capital de Argentina.","o":["una","la"],"a":"la","why":"수도는 하나뿐이므로 la입니다."},{"t":"pick","q":"Necesito alquilar ___ coche. (아무 차나)","o":["un","el"],"a":"un"},{"t":"pick","q":"Necesito arreglar ___ coche. (내 차)","o":["un","el"],"a":"el"},{"t":"pick","q":"___ actores de la película eran muy malos.","o":["Unos","Los"],"a":"Los"},{"t":"pick","q":"He visto ___ película de terror.","o":["una","la"],"a":"una"}]},{"title":"연습 3. 수량 vs 일반"
