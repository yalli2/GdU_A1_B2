<script>window.UNIT={"id":121,"es":"por eso, así que, tanto… que","ko":"결과절","theory":"<h2>핵심 정리<\/h2>\n<h3>결과 접속 표현 + 직설법<\/h3>\n<div class=\"tw\"><table><thead><tr><th>표현<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>por eso<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La semana pasada estuve muy ocupado, por eso no te llamé.\">La semana pasada estuve muy ocupado, por eso no te llamé.<\/span><\/td><\/tr><tr><td><b>así que<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No vi a nadie conocido en el club, así que me volví a casa.\">No vi a nadie conocido en el club, así que me volví a casa.<\/span><\/td><\/tr><tr><td><b>por (lo) tanto<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Empecé a trabajar en junio, por tanto no he tenido vacaciones este año.\">Empecé a trabajar en junio, por tanto no he tenido vacaciones este año.<\/span><\/td><\/tr><tr><td><b>de modo que / de manera que<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No había plazas en el vuelo, de modo que tuvimos que ir en tren.\">No había plazas en el vuelo, de modo que tuvimos que ir en tren.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay mucha gente, de manera que será mejor que te des prisa.\">Hay mucha gente, de manera que será mejor que te des prisa.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>강조: tanto… que, tan… que (+ 직설법)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>동사 + <b>tanto que<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Corre tanto que gana todas las carreras.\">Corre tanto que gana todas las carreras.<\/span><\/td><\/tr><tr><td><b>tanto/a/os/as<\/b> + 명사 + que<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Maite tiene tantos amigos que nunca está en casa.\">Maite tiene tantos amigos que nunca está en casa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Había tanta gente que no pudimos entrar en el museo.\">Había tanta gente que no pudimos entrar en el museo.<\/span><\/td><\/tr><tr><td><b>tan poco/a/os/as<\/b> + 명사 + que<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El río tenía tan poca agua que no pudimos bañarnos.\">El río tenía tan poca agua que no pudimos bañarnos.<\/span><\/td><\/tr><tr><td><b>tan + 형용사/부사 + que<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lourdes es tan culta que entiende de todo.\">Lourdes es tan culta que entiende de todo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me siento tan mal que me voy a acostar.\">Me siento tan mal que me voy a acostar.<\/span><\/td><\/tr><tr><td>동사 + <b>tan poco que<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Come tan poco que va a enfermar.\">Come tan poco que va a enfermar.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>tanto, -a, -os, -as / tan poco, -a, -os, -as는 <b>뒤 명사와 성·수 일치<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay tanta gente en la fiesta que prefiero irme.\">Hay tanta gente en la fiesta que prefiero irme.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Había tan pocos espectadores que suspendieron la función.\">Había tan pocos espectadores que suspendieron la función.<\/span><\/div>","ex":[{"title":"연습 1. 결과 접속 표현","instr":"알맞은 표현을 고르세요.","rule":"por eso, así que, por tanto, de modo que.","items":[{"t":"pick","q":"Estuve muy ocupado, ___ no te llamé.","o":["por eso","porque","aunque"],"a":"por eso"},{"t":"pick","q":"No vi a nadie, ___ me volví a casa.","o":["así que","porque","a pesar de"],"a":"así que"},{"t":"pick","q":"Empecé a trabajar en junio, por ___ no he tenido vacaciones.","o":["tanto","eso que","qué"],"a":"tanto"},{"t":"pick","q":"No había plazas, de ___ que tuvimos que ir en tren.","o":["modo","causa","pesar"],"a":"modo"},{"t":"pick","q":"Hay mucha gente, de ___ que será mejor que te des prisa.","o":["manera","porque","aunque"],"a":"manera"},{"t":"pick","q":"Luis hace mucho ejercicio, ___ está en forma.","o":["por eso","porque","aunque"],"a":"por eso"},{"t":"pick","q":"Tengo mucho trabajo, ___ no puedo ir.","o":["así que","porque","aunque"],"a":"así que"},{"t":"pick","q":"Llovía mucho, ___ nos quedamos en casa.","o":["así que","porque","aunque"],"a":"así que"}]},{"title":"연습 2. tanto · tan","instr":"알맞은 형태를 고르세요.","rule":"tanto/a/os/as + 명사, tan + 형용사/부사.","items":[{"t":"pick","q":"Había ___ gente que no pudimos entrar.","o":["tanta","tanto","tan"],"a":"tanta"},{"t":"pick","q":"Maite tiene ___ amigos que nunca está en casa.","o":["tantos","tanto","tan"],"a":"tantos"},{"t":"pick","q":"Corre ___ que gana todas las carreras.","o":["tanto","tan","tanta"],"a":"tanto"},{"t":"pick","q":"Lourdes es ___ culta que entiende de todo.","o":["tan","tanto","tanta"],"a":"tan"},{"t":"pick","q":"Me siento ___ mal que me voy a acostar.","o":["tan","tanto","tanta"],"a":"tan"},{"t":"pick","q":"El río tenía tan ___ agua que no pudimos bañarnos.","o":["poca","poco","pocas"],"a":"poca"},{"t":"pick","q":"Había tan ___ espectadores que suspendieron la función.","o":["pocos","poco","poca"],"a":"pocos"},{"t":"pick","q":"Hay ___ ruido que no puedo dormir.","o":["tanto","tanta","tantos"],"a":"tanto"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 표현을 쓰세요.","rule":"tan, tanto, tanta, tantos, tantas.","items":[{"t":"text","q":"Come ___ poco que va a enfermar.","a":["tan"]},{"t":"text","q":"Hay ___ gente en la fiesta que prefiero irme.","a":["tanta"]},{"t":"text","q":"Es ___ alto que no cabe en la cama.","a":["tan"]},{"t":"text","q":"Tengo ___ sueño que no puedo estudiar.","a":["tanto"]},{"t":"text","q":"Tiene ___ libros que no caben en la estantería.","a":["tantos"]},{"t":"text","q":"Hace ___ calor que no se puede salir.","a":["tanto"]},{"t":"text","q":"Tenía ___ hambre que se comió dos pizzas.","a":["tanta"]},{"t":"text","q":"Habla ___ rápido que nadie le entiende.","a":["tan"]}]},{"title":"연습 4. 접속 표현 쓰기","instr":"알맞은 표현을 쓰세요.","rule":"por eso, así que, por tanto, de modo que.","items":[{"t":"text","q":"No tengo dinero, ___ no voy de vacaciones.","a":["así que","por eso","por tanto"]},{"t":"text","q":"Estuve enfermo, ___ no fui a clase.","a":["por eso","así que","por tanto"]},{"t":"text","q":"No hay entradas, ___ que no podemos ir.","a":["así"]},{"t":"text","q":"Llegó tarde; ___ , perdió el tren.","a":["por eso","por tanto"]},{"t":"text","q":"Es muy tarde, de ___ que será mejor irse.","a":["modo","manera"]},{"t":"text","q":"No me llamó, ___ me enfadé.","a":["así que","por eso"]}]}]};</script>
