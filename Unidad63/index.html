ndo vivía en Buenos Aires, iba al teatro todas las semanas.<\/span><\/li><li><b>과거의 사람·사물·장소 묘사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Yo vi al ladrón. Era alto, tenía el pelo corto y llevaba gafas de sol.\">Yo vi al ladrón. Era alto, tenía el pelo corto y llevaba gafas de sol.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta ciudad era más tranquila antes; no había tanta gente ni tanto tráfico.\">Esta ciudad era más tranquila antes; no había tanta gente ni tanto tráfico.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>-ar 동사 nosotros형은 악센트: trabajábamos. ser의 nosotros형 éramos, ir의 nosotros형 íbamos.<\/div>","ex":[{"title":"연습 1. 규칙 활용","instr":"알맞은 형태를 쓰세요.","rule":"-ar → -aba, -er/-ir → -ía.","items":[{"t":"text","q":"(yo, trabajar) ___ en un laboratorio.","a":["trabajaba"]},{"t":"text","q":"(tú, comer) ___ mucho chocolate.","a":["comías"]},{"t":"text","q":"(ella, vivir) ___ en Cuba.","a":["vivía"]},{"t":"text","q":"(nosotros, cultivar) ___ maíz.","a":["cultivábamos"]},{"t":"text","q":"(vosotros, beber) ___ mucha agua.","a":["bebíais"]},{"t":"text","q":"(ellos, escribir) ___ cartas.","a":["escribían"]},{"t":"text","q":"(yo, hablar) ___ con mis abuelos.","a":["hablaba"]},{"t":"text","q":"(nosotros, vivir) ___ en el campo.","a":["vivíamos"]},{"t":"text","q":"(tú, estudiar) ___ por las tardes.","a":["estudiabas"]},{"t":"text","q":"(ellos, comer) ___ en casa.","a":["comían"]}]},{"title":"연습 2. 불규칙 ver, ser, ir","instr":"알맞은 형태를 쓰세요.","rule":"ver → veía, ser → era, ir → iba.","items":[{"t":"text","q":"(yo, ser) ___ muy joven.","a":["era"]},{"t":"text","q":"(tú, ir) ___ al campo.","a":["ibas"]},{"t":"text","q":"(él, ver) ___ la tele.","a":["veía"]},{"t":"text","q":"(nosotros, ser) ___ jóvenes.","a":["éramos"]},{"t":"text","q":"(nosotros, ir) ___ al teatro.","a":["íbamos"]},{"t":"text","q":"(vosotros, ver) ___ muchas películas.","a":["veíais"]},{"t":"text","q":"(ellos, ir) ___ en bici.","a":
