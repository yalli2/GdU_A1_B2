<script>window.UNIT={"id":13,"es":"un coche pequeño","ko":"성질형용사","theory":"<h2>핵심 정리<\/h2>\n<p><b>성질형용사<\/b>는 사람·동물·사물에 대한 정보를 더합니다. 꾸미는 명사의 성·수에 일치합니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>남성 단수<\/th><th>여성 단수<\/th><th>남성 복수<\/th><th>여성 복수<\/th><\/tr><\/thead><tbody><tr><td>-o: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pequeño\">pequeño<\/span><\/td><td>-a: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pequeña\">pequeña<\/span><\/td><td>-os: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pequeños\">pequeños<\/span><\/td><td>-as: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pequeñas\">pequeñas<\/span><\/td><\/tr><tr><td>-e: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"inteligente\">inteligente<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"inteligente\">inteligente<\/span><\/td><td>-es: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"inteligentes\">inteligentes<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"inteligentes\">inteligentes<\/span><\/td><\/tr><tr><td>자음: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"joven\">joven<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"joven\">joven<\/span><\/td><td>+es: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"jóvenes\">jóvenes<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"jóvenes\">jóvenes<\/span><\/td><\/tr><tr><td>-or, -án, -ón, -ín: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"encantador\">encantador<\/span><\/td><td>+a: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"encantadora\">encantadora<\/span><\/td><td>+es: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"encantadores\">encantadores<\/span><\/td><td>+as: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"encantadoras\">encantadoras<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"marrón\">marrón<\/span> (남녀 같음) → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"marrones\">marrones<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"feliz\">feliz<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"felices\">felices<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"charlatán\">charlatán<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"charlatana\">charlatana<\/span><\/div>\n<ul class=\"rules\"><li>남성 + 여성 → <b>남성 복수<\/b> 형용사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Antonio y Marta son altos y morenos.\">Antonio y Marta son altos y morenos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Gabi lleva una camisa y un pantalón negros.\">Gabi lleva una camisa y un pantalón negros.<\/span><\/li><\/ul>\n<h3>위치<\/h3>\n<ul class=\"rules\"><li>ser/estar + 형용사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Roberto es simpático.\">Roberto es simpático.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan está muy delgado.\">Juan está muy delgado.<\/span><\/li><li>명사 + 형용사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"María tiene los ojos azules.\">María tiene los ojos azules.<\/span><\/li><\/ul>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b><b>buen / mal<\/b> (bueno, malo)는 남성 단수 명사 <b>앞<\/b>에서 축약: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"un buen escritor\">un buen escritor<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"un mal ejemplo\">un mal ejemplo<\/span>, 여성은 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"una buena profesora\">una buena profesora<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"una mala noticia\">una mala noticia<\/span><\/div>","ex":[{"title
