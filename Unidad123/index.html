"0\" data-say=\"fútbol\">fútbol<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"árbol\">árbol<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"azúcar\">azúcar<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"lápiz\">lápiz<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"bolígrafo\">bolígrafo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"médico\">médico<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"sábado\">sábado<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>tilde가 사라지거나 생기는 경우: inglés → inglesa, autobús → autobuses, ratón → ratones, examen → exámenes, joven → jóvenes, jersey → jerséis<\/div>\n<ul class=\"rules\"><li><b>한 음절<\/b> 단어에는 tilde 없음: pan, tren, luz, sol, sal, dos<\/li><\/ul>\n<h3>뜻을 구별하는 tilde (tilde diacrítica)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>tilde 있음<\/th><th>tilde 없음<\/th><\/tr><\/thead><tbody><tr><td><b>él<\/b> (대명사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Él es de Hamburgo.\">Él es de Hamburgo.<\/span><\/td><td><b>el<\/b> (관사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El coche de Andrés está mal aparcado.\">El coche de Andrés está mal aparcado.<\/span><\/td><\/tr><tr><td><b>sí<\/b> (긍정) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sí, quiero.\">Sí, quiero.<\/span><\/td><td><b>si<\/b> (조건) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si quieres, cómpratelo.\">Si quieres, cómpratelo.<\/span><\/td><\/tr><tr><td><b>mí<\/b> (대명사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Es para mí?\">¿Es para mí?<\/span><\/td><td><b>mi<\/b> (소유) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es mi padre.\">Es mi padre.<\/span><\/td><\/tr><tr><td><b>tú<\/b> (대명사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Y tú, ¿dónde vives?\">Y tú, ¿dónde vives?<\/span><\/td><td><b>tu<\/b> (소유) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién es tu profesor?\">¿Quién es tu profesor?<\/span><\/td><\/tr><tr><td><b>dé<\/b> (dar) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dile que te dé las llaves.\">Dile que te dé las llaves.<\/span><\/td><td><b>de<\/b> (전치사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es el padre de mi novia.\">Es el padre de mi novia.<\/span><\/td><\/tr><tr><td><b>sé<\/b> (saber) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sé hablar español.\">Sé hablar español.<\/span><\/td><td><b>se<\/b> (대명사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se levanta muy temprano.\">Se levanta muy temprano.<\/span><\/td><\/tr><tr><td><b>té<\/b> (차) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me gusta el té.\">No me gusta el té.<\/span><\/td><td><b>te<\/b> (대명사) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te gusta el café?\">¿Te gusta el café?<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>의문사·감탄사 vs 관계사<\/h3>\n<ul class=\"rules\"><li>tilde 있음: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde vives?\">¿Dónde vives?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué quieres?\">¿Qué quieres?<\/span> / 없음: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta es la casa donde nací.\">Esta es la casa donde nací.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ese es el coche que quiero.\">Ese es el coche que quiero.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 강세 위치","instr":"알맞은 규칙을 고르세요.","rule":"자음(n,s 제외) → 마지막 음절 / 모음·n·s → 끝에서 둘째 음절.","items":[{"t":"pick","q":"español 의 강세는 ___ 에 있다.","o":["마지막 음절","끝에서 둘째 음절","끝에서 셋째 음절"],"a":"마지막 음절"},{"t":"pick","q":"casa 의 강세는 ___ 에 있다.","o":["끝에서 둘째 음절","마지막 음절","끝에서 셋째 음절"],"a":"끝에서 둘째 음절"},{"t":"pick","q":"hotel 의 강세는 ___ 에 있다.","o":["마지막 음절","끝에서 둘째 음절","끝에서 셋
