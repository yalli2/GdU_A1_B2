<script>window.UNIT={"id":59,"es":"durmió, leyó, hizo…","ko":"부정과거: 불규칙동사","theory":"<h2>핵심 정리<\/h2>\n<h3>3인칭(usted, él, ella, ustedes, ellos, ellas)만 불규칙<\/h3>\n<div class=\"tw\"><table><thead><tr><th>유형<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>-ir<\/b> 동사의 e → i<\/td><td>pedir: pedí, pediste, <b>pidió<\/b>, pedimos, pedisteis, <b>pidieron<\/b> (mentir, preferir, seguir, sentir, divertirse) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Pepi y Lolo se divirtieron mucho.\">Pepi y Lolo se divirtieron mucho.<\/span><\/td><\/tr><tr><td><b>-ir<\/b> 동사의 o → u<\/td><td>dormir: dormí, dormiste, <b>durmió<\/b>, dormimos, dormisteis, <b>durmieron<\/b> (morir) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Los niños durmieron diez horas.\">Los niños durmieron diez horas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La madre de Clara murió hace dos meses.\">La madre de Clara murió hace dos meses.<\/span><\/td><\/tr><tr><td>모음 + er/ir → <b>-yó, -yeron<\/b><\/td><td>leer: leí, leíste, <b>leyó<\/b>, leímos, leísteis, <b>leyeron<\/b> (caer, construir, creer, destruir, huir, incluir, oír) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Los gatos huyeron cuando vieron al perro.\">Los gatos huyeron cuando vieron al perro.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>모든 인칭의 어간이 바뀜 (어미: -e, -iste, -o, -imos, -isteis, -ieron)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>동사<\/th><th>어간<\/th><th>동사<\/th><th>어간<\/th><\/tr><\/thead><tbody><tr><td>decir<\/td><td><b>dij-<\/b> (dijeron)<\/td><td>querer<\/td><td><b>quis-<\/b><\/td><\/tr><tr><td>estar<\/td><td><b>estuv-<\/b><\/td><td>saber<\/td><td><b>sup-<\/b><\/td><\/tr><tr><td>haber<\/td><td><b>hub-<\/b><\/td><td>tener<\/td><td><b>tuv-<\/b><\/td><\/tr><tr><td>hacer<\/td><td><b>hic-/hiz-<\/b><\/td><td>traer<\/td><td><b>traj-<\/b> (trajeron)<\/td><\/tr><tr><td>poder<\/td><td><b>pud-<\/b><\/td><td>venir<\/td><td><b>vin-<\/b><\/td><\/tr><tr><td>poner<\/td><td><b>pus-<\/b><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>yo 형은 -e, 3인칭 단수는 <b>-o<\/b> (악센트 없음): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estuve en casa.\">Estuve en casa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hice varios viajes.\">Hice varios viajes.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hubo una fiesta.\">Hubo una fiesta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Pato no quiso venir.\">Pato no quiso venir.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Los abuelos tuvieron diez hijos.\">Los abuelos tuvieron diez hijos.<\/span><\/li><li>hacer 3인칭 단수: <b>hizo<\/b><\/li><li><b>-ducir<\/b> → -duj-: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"conduje\">conduje<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"condujiste\">condujiste<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"condujo\">condujo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"condujimos\">condujimos<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"condujisteis\">condujisteis<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"condujeron\">condujeron<\/span> (producir, traducir) — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Traduje un libro sobre Goya.\">Traduje un libro sobre Goya.<\/span><\/li><\/ul>\n<h3>ir / ser (같은 형태)<\/h3>\n<p><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fui\">fui<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fuiste\">fuiste<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fue\">fue<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fue\">fue<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fuimos\">fuimos<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fuisteis\">fuisteis<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fueron\">fueron<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fueron\">fueron<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alicia fue directora del banco.\">Alicia fue directora del banco.<\/span> (ser), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Antonio fue a Puerto Rico en 2001.\">Antonio fue a Puerto Rico en 2001.<\/span> (ir)<\/p>","ex":[{"title":"연습 1. 3인칭 불규칙","instr":"알맞은 형태를 쓰세요.","rule":"3인칭에서 e→i, o→u, i→y.","items":[{"t":"text","q":"(él, pedir) ___ dinero.","a":["pidió"]},{"t":"text","q":"(ellos, pedir) ___ la cuenta.","a":["pidieron"]},{"t":"text","q":"(ella, dormir) ___ diez horas.","a":["durmió"]},{"t":"text","q":"(ellos, dormir) ___ en casa.","a":["durmieron"]},{"t":"text","q":"(él, leer) ___ el periódico.","a":["leyó"]},{"t":"text","q":"(ellos, leer) ___ la carta.","a":["leyeron"]},{"t":"text","q":"(ella, morir) ___ hace dos meses.","a":["murió"]},{"t":"text","q":"(ellos, divertirse) se ___ mucho.","a":["divirtieron"]}]},{"title":"연습 2. 어간이 바뀌는 동사","instr":"알맞은 형태를 쓰세요.","rule":"estuve, hice, pude, puse, quise, supe, tuve, traje, vine, dije.","items":[{"t":"text","q":"(yo, estar) ___ en casa.","a":["estuve"]},{"t":"text","q":"(yo, hacer) ___ un viaje.","a":["hice"]},{"t":"text","q":"(tú, poder) ___ venir.","a":["pudiste"]},{"t":"text","q":"(yo, poner) ___ la mesa.","a":["puse"]},{"t":"text","q":"(él, querer) ___ venir.","a":["quiso"]},{"t":"text","q":"(nosotros, tener) ___ suerte.","a":["tuvimos"]},{"t":"text","q":"(yo, venir) ___ en tren.","a":["vine"]},{"t":"text","q":"(ellos, decir) ___ la verdad.","a":["dijeron"]}]},{"title":"연습 3. hacer, ir, ser, haber","instr":"알맞은 형태를 쓰세요.","rule":"ir/ser: fui, fuiste, fue, fuimos, fuisteis, fueron. hacer 3인칭 단수: hizo.","items":[{"t":"text","q":"(él, hacer) ___ la cena.","a":["hizo"]},{"t":"text","q":"(yo, ir) ___ a Madrid.","a":["fui"]},{"t":"text","q":"(tú, ser) ___ muy amable.","a":["fuiste"]},{"t":"text","q":"(nosotros, ir) ___ al cine.","a":["fuimos"]},{"t":"text","q":"(ellos, ser) ___ unas vacaciones fantásticas.","a":["fueron"]},{"t":"text","q":"(haber) ___ una fiesta en casa de Emilia.","a":["Hubo"]},{"t":"text","q":"(yo, traer) ___ el pan.","a":["traje"]},{"t":"text","q":"(yo, conducir) ___ toda la noche.","a":["conduje"]}]},{"title":"연습 4. 문장 완성","instr":"알맞은 형태를 고르세요.","rule":"부정과거의 불규칙을 정확히.","items":[{"t":"pick","q":"¿Qué ___ el domingo? (hacer, tú)","o":["hiciste","hizo","hicisteis"],"a":"hiciste"},{"t":"pick","q":"¿Adónde ___ el verano pasado? (ir, vosotros)","o":["fuisteis","fueron","fuimos"],"a":"fuisteis"},{"t":"pick","q":"Alicia ___ directora de un banco. (ser)","o":["fue","fui","fueron"],"a":"fue"},{"t":"pick","q":"Pato no ___ venir. (querer)","o":["quiso","quisó","quiero"],"a":"quiso"},{"t":"pick","q":"Hace unos años ___ un libro sobre Goya. (traducir, yo)","o":["traduje","traducí","tradujé"],"a":"traduje"},{"t":"pick","q":"Los gatos ___ cuando vieron al perro. (huir)","o":["huyeron","huieron","huyó"],"a":"huyeron"}]}]};</script>
