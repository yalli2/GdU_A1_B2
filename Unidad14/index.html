<script>window.UNIT={"id":14,"es":"una amiga chilena","ko":"국적 형용사","theory":"<h2>핵심 정리<\/h2>\n<p>국적 형용사도 성·수에 일치합니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>남성 단수<\/th><th>여성 단수<\/th><th>남성 복수<\/th><th>여성 복수<\/th><\/tr><\/thead><tbody><tr><td><b>-o<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"chileno\">chileno<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cubano\">cubano<\/span><\/td><td><b>-a<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"chilena\">chilena<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cubana\">cubana<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"chilenos\">chilenos<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cubanos\">cubanos<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"chilenas\">chilenas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cubanas\">cubanas<\/span><\/td><\/tr><tr><td><b>-a, -e, -í<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"belga\">belga<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"canadiense\">canadiense<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"marroquí\">marroquí<\/span><\/td><td>같음<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"belgas\">belgas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"canadienses\">canadienses<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"marroquíes\">marroquíes<\/span><\/td><td>같음<\/td><\/tr><tr><td><b>자음<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"español\">español<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"alemán\">alemán<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"portugués\">portugués<\/span><\/td><td><b>+a<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"española\">española<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"alemana\">alemana<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"portuguesa\">portuguesa<\/span><\/td><td>+es: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"españoles\">españoles<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"alemanes\">alemanes<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"portugueses\">portugueses<\/span><\/td><td>+as: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"españolas\">españolas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"alemanas\">alemanas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"portuguesas\">portuguesas<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>-án, -és로 끝나는 형용사는 여성·복수형에서 <b>악센트가 사라집니다.<\/b> <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"alemán → alemana, alemanes, alemanas\">alemán → alemana, alemanes, alemanas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"portugués → portuguesa, portugueses, portuguesas\">portugués → portuguesa, portugueses, portuguesas<\/span><\/div>\n<ul class=\"rules\"><li>남성 + 여성 = 남성 복수: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Iván es cubano. Haydée es cubana. → Iván y Haydée son cubanos.\">Iván es cubano. Haydée es cubana. → Iván y Haydée son cubanos.<\/span><\/li><li>ser + 국적: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Gabriel García Márquez es colombiano.\">Gabriel García Márquez es colombiano.<\/span> / 명사 + 국적: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La bandera argentina es azul y blanca.\">La bandera argentina es azul y blanca.<\/span><\/li><\/ul>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Isabel Allende es una escritora chilena.\">Isabel Allende es una escritora chilena.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Faro y Oporto son ciudades portuguesas.\">Faro y Oporto son ciudades portuguesas.<\/span><\/div>","ex":[{"title":"연습 1. 여성형","instr":"국적 형용사를 여성 단수형으로 쓰세요.","rule":"-o → -a, 자음 + a(악센트 삭제), -e/-a/-í는 그대로.","items":[{"t":"text","q":"chileno → ___","a":["chilena"]},{"t":"text","q":"español → ___","a":["española"]},{"t":"text","q":"alemán → ___","a":["alemana"]},{"t":"text","q":"portugués → ___","a":["portuguesa"]},{"t":"text","q":"belga → ___","a":["belga"]},{"t":"text","q":"canadiense → ___","a":["canadiense"]},{"t":"text","q":"marroquí → ___","a":["marroquí"]},{"t":"text","q":"francés → ___","a":["francesa"]},{"t":"text","q":"inglés → ___","a":["inglesa"]},{"t":"text","q":"japonés → ___","a":["japonesa"]}]},{"title":"연습 2. 복수형","instr":"국적 형용사를 복수형(남성)으로 쓰세요.","rule":"모음 +s, 자음 +es. -án/-és는 악센트가 사라집니다.","items":[{"t":"text","q":"cubano → ___","a":["cubanos"]},{"t":"text","q":"español → ___","a":["españoles"]},{"t":"text","q":"alemán → ___","a":["alemanes"]},{"t":"text","q":"portugués → ___","a":["portugueses"]},{"t":"text","q":"canadiense → ___","a":["canadienses"]},{"t":"text","q":"inglés → ___","a":["ingleses"]},{"t":"text","q":"marroquí → ___","a":["marroquíes","marroquís"]},{"t":"text","q":"belga → ___","a":["belgas"]}]},{"title":"연습 3. 문장 완성","instr":"알맞은 형태를 고르세요.","rule":"국적 형용사는 명사의 성·수에 일치합니다.","items":[{"t":"pick","q":"Isabel Allende es una escritora ___.","o":["chileno","chilena","chilenos"],"a":"chilena"},{"t":"pick","q":"Faro y Oporto son ciudades ___.","o":["portuguesas","portugueses","portuguesa"],"a":"portuguesas"},{"t":"pick","q":"Bild es una revista ___.","o":["alemán","alemana","alemanes"],"a":"alemana"},{"t":"pick","q":"La capital belga es Bruselas. Los bombones ___ son excelentes.","o":["belga","belgas","belgos"],"a":"belgas"},{"t":"pick","q":"Iván es cubano y Haydée es cubana. Iván y Haydée son ___.","o":["cubanos","cubanas","cubano"],"a":"cubanos"},{"t":"pick"
