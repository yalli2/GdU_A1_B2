<script>window.UNIT={"id":35,"es":"Te amo","ko":"직접목적어 대명사","theory":"<h2>핵심 정리<\/h2>\n<p><b>직접목적어<\/b>(…을/를)를 대신합니다.<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lola ama a Carlos.\">Lola ama a Carlos.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lola lo ama.\">Lola lo ama.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No encuentro el pan.\">No encuentro el pan.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No lo encuentro.\">No lo encuentro.<\/span><\/div>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>단수<\/th><th>복수<\/th><\/tr><\/thead><tbody><tr><td>1인칭<\/td><td><b>me<\/b> (a mí)<\/td><td><b>nos<\/b> (a nosotros/as)<\/td><\/tr><tr><td>2인칭<\/td><td><b>te<\/b> (a ti)<\/td><td><b>os<\/b> (a vosotros/as)<\/td><\/tr><tr><td>3인칭 남성<\/td><td><b>lo<\/b> (a él, a usted, 남성 사물)<\/td><td><b>los<\/b> (a ellos, a ustedes, 남성 사물)<\/td><\/tr><tr><td>3인칭 여성<\/td><td><b>la<\/b> (a ella, a usted, 여성 사물)<\/td><td><b>las<\/b> (a ellas, a ustedes, 여성 사물)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>남성 + 여성 = 남성 복수: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Ves mucho a Almudena y a Luis? — No, no los veo mucho.\">¿Ves mucho a Almudena y a Luis? — No, no los veo mucho.<\/span><\/li><li>위치: <b>동사 앞<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No te conozco.\">No te conozco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde está Marisa? No la veo.\">¿Dónde está Marisa? No la veo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quieres este libro? — No, no lo quiero.\">¿Quieres este libro? — No, no lo quiero.<\/span><\/li><\/ul>\n<h3>a mí, a ti, a él… 를 함께 쓰는 경우<\/h3>\n<ul class=\"rules\"><li>누구인지 분명히: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer las vi a ustedes en el parque.\">Ayer las vi a ustedes en el parque.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer las vi a ellas en el parque.\">Ayer las vi a ellas en el parque.<\/span><\/li><li>대조: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ramón ama a María, pero María no lo ama a él.\">Ramón ama a María, pero María no lo ama a él.<\/span><\/li><li>강조: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A mí no me conoce.\">A mí no me conoce.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A nosotros no nos ven.\">A nosotros no nos ven.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 직접목적어 대명사","instr":"알맞은 대명사를 고르세요.","rule":"대상의 성·수에 일치: lo(남·단), la(여·단), los(남·복), las(여·복).","items":[{"t":"pick","q":"¿Quieres este libro? — Sí, ___ quiero.","o":["lo","la","le"],"a":"lo"},{"t":"pick","q":"¿Ves la mesa? — Sí, ___ veo.","o":["la","lo","las"],"a":"la"},{"t":"pick","q":"¿Compras los zapatos? — Sí, ___ compro.","o":["los","lo","las"],"a":"los"},{"t":"pick","q":"¿Tienes las llaves? — Sí, ___ tengo.","o":["las","los","la"],"a":"las"},{"t":"pick","q":"¿Amas a Juan? — Sí, ___ amo.","o":["lo","le","la"],"a":"lo"},{"t":"pick","q":"¿Quieres a tus padres? — Sí, ___ quiero.","o":["los","les","las"],"a":"los"}]},{"title":"연습 2. me, te, nos, os","instr":"알맞은 대명사를 고르세요.","rule":"1·2인칭은 me, te, nos, os. 주어에 맞게 고르세요.","items":[{"t":"pick","q":"¿Quién eres? No ___ conozco.","o":["te","me","lo"],"a":"te"},{"t":"pick","q":"¿___ amas, Lola? (너는 나를)","o":["Me","Te","Nos"],"a":"Me"},{"t":"pick","q":"¿___ recuerdas? (너는 우리를)","o":["Nos","Os","Me"],"a":"Nos"},{"t":"pick","q":"Ahora ___ recuerdo. (나는 너희를)","o":["os","nos","me"],"a":"os"},{"t":"pick","q":"Mamá, ___ quiero mucho. (엄마, 나는 엄마를)","o":["te","me","la"],"a":"te"},{"t":"pick","q":"Jesús no ___ ve a nosotros.","o":["nos","os","me"],"a":"nos"}]},{"title":"연습 3. 대명사로 바꾸기","instr":"밑줄 친 부분을 대명사로 바꾸어 문장을 완성하세요.","rule":"직접목적어 대명사는 동사 앞에 옵니다.","items":[{"t":"text","q":"No encuentro el pan. → No ___ encuentro.","a":["lo"]},{"t":"text","q":"Lola ama a Carlos. → Lola ___ ama.","a":["lo"]},{"t":"text","q":"Veo a Marta. → ___ veo.","a":["La"]},{"t":"text","q":"Compro los billetes. → ___ compro.","a":["Los"]},{"t":"text","q":"Conozco a Pedro y a Ana. → ___ conozco.","a":["Los"]},{"t":"text","q":"No vemos a Luis y a Paula. → No ___ vemos.","a":["los"]}]},{"title":"연습 4. a ti / a él 첨가","instr":"알맞은 것을 고르세요.","rule":"대조·강조·모호함을 피하려고 a + 인칭대명사를 함께 쓸 수 있습니다.","items":[{"t":"pick","q":"A mí no ___ conoce.","o":["me","te","lo"],"a":"me"},{"t":"pick","q":"A nosotros no ___ ven.","o":["nos","os","los"],"a":"nos"},{"t":"pick","q":"Ramón ama a María, pero María no lo ama a ___.","o":["él","ella","ti"],"a":"él"},{"t":"pick","q":"Ayer las vi a ___ en el parque. (그녀들)","o":["ellas","ellos","ustedes"],"a":"ellas"},{"t":"pick","q":"¿A ti te quiere? — A ___ no me quiere.","o":["mí","ti","él"],"a":"mí"}]}]};</script>
