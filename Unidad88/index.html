<script>window.UNIT={"id":88,"es":"Dice que vive… Dijo que vivía…","ko":"간접화법 (1)","theory":"<h2>핵심 정리<\/h2>\n<h3>간접화법이란?<\/h3>\n<ul class=\"rules\"><li>남이 한 말, 또는 다른 때에 내가 한 말을 <b>그대로 반복하지 않고<\/b> 전달. 대명사·인칭·시제가 논리적으로 바뀝니다.<\/li><li>직접: “Soy el pintor. No puedo ir este mes. Dígale a su madre que la llamaré cuando (yo) pueda.” → 간접: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mamá, es el pintor. Dice que no puede venir este mes, que te llamará cuando (él) pueda.\">Mamá, es el pintor. Dice que no puede venir este mes, que te llamará cuando (él) pueda.<\/span><\/li><li>전달 동사: decir (가장 흔함), comentar, afirmar, añadir, explicar, asegurar, prometer — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El otro día Juan me comentó que había suspendido porque no había podido estudiar.\">El otro día Juan me comentó que había suspendido porque no había podido estudiar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Felipe me ha prometido que iremos a Cuba el verano que viene.\">Felipe me ha prometido que iremos a Cuba el verano que viene.<\/span><\/li><\/ul>\n<h3>시제 변화<\/h3>\n<div class=\"tw\"><table><thead><tr><th>전달 동사<\/th><th>현재 사실<\/th><th>과거<\/th><th>미래<\/th><th>가정<\/th><\/tr><\/thead><tbody><tr><td><b>현재 / 현재완료<\/b> (Dice que… / Ha dicho que…)<\/td><td>vive en Guadalajara / está estudiando mucho<\/td><td>no ha podido hacerlo / no pudo venir ayer porque estaba enferma<\/td><td>te espera esta noche / lo hará cuando tenga tiempo / va a hacerlo otro día<\/td><td>sería más feliz con otro trabajo<\/td><\/tr><tr><td><b>과거<\/b> (Dijo que…)<\/td><td>vivía(vive) en Guadalajara / estaba(está) estudiando mucho<\/td><td>no había podido hacerlo / no había podido venir ayer porque había estado enferma<\/td><td>te esperaba esta noche / lo haría cuando tuviera tiempo / iba a hacerlo otro día<\/td><td>sería más feliz con otro trabajo<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>말한 내용이 <b>지금도 사실<\/b>이면 현재형을 그대로 써도 됩니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dijo que vivía/vive en Guadalajara.\">Dijo que vivía/vive en Guadalajara.<\/span><\/div>","ex":[{"title":"연습 1. 전달 동사가 현재","instr":"알맞은 형태를 고르세요.","rule":"Dice que + 현재 / 현재완료 / 미래 …","items":[{"t":"pick","q":"Martín: “No puedo ir.” → Dice que no ___ venir.","o":["puede","podía","pudo"],"a":"puede"},{"t":"pick","q":"Martín: “Tengo fiebre.” → Dice que ___ fiebre.","o":["tiene","tenía","tuvo"],"a":"tiene"},{"t":"pick","q":"Ana: “Estoy estudiando.” → Dice que ___ estudiando.","o":["está","estaba","estuvo"],"a":"está"},{"t":"pick","q":"Pedro: “Te espero esta noche.” → Dice que te ___ esta noche.","o":["espera","esperaba","esperó"],"a":"espera"},{"t":"pick","q":"Laura: “Lo haré mañana.” → Ha dicho que lo ___ mañana.","o":["hará","haría","hizo"],"a":"hará"},{"t":"pick","q":"Juan: “No he podido hacerlo.” → Dice que no ___ hacerlo.","o":["ha podido","había podido","pudo"],"a":"ha podido"},{"t":"pick","q":"Rosa: “Vivo en Guadalajara.” → Ha dicho que ___ en Guadalajara.","o":["vive","vivía","viviera"],"a":"vive"},{"t":"pick","q":"Luis: “Voy a hacerlo otro día.” → Dice que ___ a hacerlo otro día.","o":["va","iba","fue"],"a":"va"}]},{"title":"연습 2. 전달 동사가 과거","instr":"알맞은 형태를 고르세요.","rule":"Dijo que + 불완료과거 / 대과거 / 가능법.","items":[{"t":"pick","q":"Martín: “No puedo ir.” → Dijo que no ___ venir.","o":["podía","puede","pudo"],"a":"podía"},{"t":"pick","q":"Ana: “Estoy enferma.” → Dijo que ___ enferma.","o":["estaba","está","estuvo"],"a":"estaba"},{"t":"pick","q":"Pedro: “Te espero esta noche.” → Dijo que te ___ esta noche.","o":["esperaba","espera","esperó"],"a":"esperaba"},{"t":"pick","q":"Laura: “Lo haré mañana.” → Dijo que lo ___ mañana.","o":["haría","hará","hizo"],"a":"haría"},{"t":"pick","q":"Juan: “He suspendido.” → Dijo que ___ suspendido.","o":["había","ha","hubo"],"a":"había"},{"t":"pick","q":"Rosa: “Voy a hacerlo otro día.” → Dijo que ___ a hacerlo otro día.","o":["iba","va","fue"],"a":"iba"},{"t":"pick","q":"Luis: “Sería más feliz con otro trabajo.” → Dijo que ___ más feliz con otro trabajo.","o":["sería","será","fue"],"a":"sería"},{"t":"pick","q":"Marta: “No pude venir ayer.” → Dijo que no ___ venir ayer.","o":["había podido","pudo","puede"],"a":"había podido"}]},{"title":"연습 3. 간접화법 쓰기","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"전달 동사에 맞는 시제.","items":[{"t":"text","q":"“Vivo en Madrid.” → Dijo que (vivir) ___ en Madrid.","a":["vivía"]},{"t":"text","q":"“Trabajo mucho.” → Dice que (trabajar) ___ mucho.","a":["trabaja"]},{"t":"text","q":"“Llegaré tarde.” → Dijo que (llegar) ___ tarde.","a":["llegaría"]},{"t":"text","q":"“Estoy cansada.” → Ha dicho que (estar) ___ cansada.","a":["está"]},{"t":"text","q":"“Hemos aprobado.” → Dijeron que (aprobar) ___ .","a":["habían aprobado"]},{"t":"text","q":"“Voy a viajar.” → Dijo que (ir) ___ a viajar.","a":["iba"]},{"t":"text","q":"“Te llamaré.” → Prometió que me (llamar) ___ .","a":["llamaría"]},{"t":"text","q":"“No tengo tiempo.” → Dice que no (tener) ___ tiempo.","a":["tiene"]}]},{"title":"연습 4. 전달 동사","instr":"알맞은 동사를 고르세요.","rule":"decir, comentar, afirmar, añadir, explicar, asegurar, prometer.","items":[{"t":"pick","q":"Felipe me ha ___ que iremos a Cuba. (약속했다)","o":["prometido","preguntado","dejado"],"a":"prometido"},{"t":"pick","q":"Juan me ___ que había suspendido. (말했다)","o":["comentó","preguntó","prometió"],"a":"comentó"},{"t":"pick","q":"Ella ___ que no sabía nada. (확언했다)","o":["aseguró","preguntó","dejó"],"a":"aseguró"},{"t":"pick","q":"El profesor ___ que el examen sería difícil. (설명했다)","o":["explicó","preguntó","pidió"],"a":"explicó"},{"t":"pick","q":"Luego ___ que vendría más tarde. (덧붙였다)","o":["añadió","preguntó","pidió"],"a":"añadió"}]}]};</script>
