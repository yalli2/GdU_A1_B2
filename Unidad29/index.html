<script>window.UNIT={"id":29,"es":"cuyo, donde, cuando…","ko":"관계사 (2)","theory":"<h2>핵심 정리<\/h2>\n<h3>cuyo, cuya, cuyos, cuyas<\/h3>\n<p>소유·친족·출처 관계를 나타냅니다. 뒤에 오는 <b>명사의 성·수<\/b>에 일치합니다.<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo un amigo. Su padre es fotógrafo.\">Tengo un amigo. Su padre es fotógrafo.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo un amigo cuyo padre es fotógrafo.\">Tengo un amigo cuyo padre es fotógrafo.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esa es la persona cuyo perro ganó el concurso.\">Esa es la persona cuyo perro ganó el concurso.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Conozco a una chica cuya hermana ha escalado el Aconcagua.\">Conozco a una chica cuya hermana ha escalado el Aconcagua.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Conozco a un señor cuyos hijos han estudiado Físicas.\">Conozco a un señor cuyos hijos han estudiado Físicas.<\/span><\/div>\n<ul class=\"rules\"><li>전치사 + cuyo + 명사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ese es el escritor de cuyos libros te he hablado.\">Ese es el escritor de cuyos libros te he hablado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ese es el profesor en cuya casa fue la fiesta.\">Ese es el profesor en cuya casa fue la fiesta.<\/span><\/li><\/ul>\n<h3>donde / adonde<\/h3>\n<ul class=\"rules\"><li><b>donde<\/b> = en el que, en la que, en los que, en las que: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta es la casa donde nació Cervantes.\">Esta es la casa donde nació Cervantes.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gustó mucho el restaurante donde comimos ayer.\">Me gustó mucho el restaurante donde comimos ayer.<\/span><\/li><li><b>adonde<\/b> = al que, a la que…(방향): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta es la piscina adonde van los niños en verano.\">Esta es la piscina adonde van los niños en verano.<\/span><\/li><\/ul>\n<h3>cuando<\/h3>\n<p>시간 표현을 받습니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El verano cuando nos conocimos fue muy especial.\">El verano cuando nos conocimos fue muy especial.<\/span><\/p>","ex":[{"title":"연습 1. cuyo / cuya / cuyos / cuyas","instr":"알맞은 형태를 고르세요.","rule":"cuyo는 소유자가 아니라 **뒤에 오는 명사**의 성·수에 일치합니다.","items":[{"t":"pick","q":"Tengo un amigo ___ padre es fotógrafo.","o":["cuyo","cuya","cuyos"],"a":"cuyo"},{"t":"pick","q":"Esa es la persona ___ perro ganó el concurso.","o":["cuyo","cuya","cuyos"],"a":"cuyo"},{"t":"pick","q":"Conozco a una chica ___ hermana ha escalado el Aconcagua.","o":["cuya","cuyo","cuyas"],"a":"cuya"},{"t":"pick","q":"Conozco a un señor ___ hijos han estudiado Físicas.","o":["cuyos","cuyo","cuyas"],"a":"cuyos"},{"t":"pick","q":"Tengo una amiga ___ padres viven en París.","o":["cuyos","cuya","cuyo"],"a":"cuyos"},{"t":"pick","q":"Es una casa ___ ventanas dan al mar.","o":["cuyas","cuyos","cuya"],"a":"cuyas"}]},{"title":"연습 2. 전치사 + cuyo","instr":"알맞은 형태를 고르세요.","rule":"전치사 + cuyo + 명사. 명사의 성·수에 일치.","items":[{"t":"pick","q":"Ese es el escritor de ___ libros te hablé.","o":["cuyos","cuyo","cuya"],"a":"cuyos"},{"t":"pick","q":"Ese es el profesor en ___ casa fue la fiesta.","o":["cuya","cuyo","cuyas"],"a":"cuya"},{"t":"pick","q":"Es la empresa con ___ director hablamos.","o":["cuyo","cuya","cuyos"],"a":"cuyo"},{"t":"pick","q":"Son los alumnos a ___ padres escribí.","o":["cuyos","cuyo","cuyas"],"a":"cuyos"}]},{"title":"연습 3. donde / adonde","instr":"알맞은 것을 고르세요.","rule":"donde = en el que (장소), adonde = al que (방향).","items":[{"t":"pick","q":"Esta es la casa ___ nació Cervantes.","o":["donde","adonde","cuando"],"a":"donde"},{"t":"pick","q":"Me gustó el restaurante ___ comimos ayer.","o":["donde","adonde","cuyo"],"a":"donde"},{"t":"pi
