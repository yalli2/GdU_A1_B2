<script>window.UNIT={"id":62,"es":"he trabajado / trabajé","ko":"현재완료와 단순과거 대조","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>현재완료 (he trabajado)<\/th><th>단순과거 (trabajé)<\/th><\/tr><\/thead><tbody><tr><td>시간<\/td><td><b>현재와 이어지는<\/b> 시간: hoy, esta mañana, este mes, este verano, hace un rato<\/td><td><b>이미 끝난<\/b> 시간: ayer, el mes pasado, aquel verano, hace una semana<\/td><\/tr><tr><td>예<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy he tenido dos exámenes.\">Hoy he tenido dos exámenes.<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer tuve dos exámenes.\">Ayer tuve dos exámenes.<\/span><\/td><\/tr><tr><td>질문<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué habéis hecho este verano?\">¿Qué habéis hecho este verano?<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué hicisteis el verano pasado?\">¿Qué hicisteis el verano pasado?<\/span><\/td><\/tr><tr><td>대답<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hemos ido a la playa.\">Hemos ido a la playa.<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Fuimos a la playa.\">Fuimos a la playa.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>세부 비교<\/h3>\n<ul class=\"rules\"><li><b>막 지나간 과거<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Hemos visto a Antonio Banderas!\">¡Hemos visto a Antonio Banderas!<\/span> (hace un momento) ↔ 먼 과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace una semana vimos a Antonio Banderas.\">Hace una semana vimos a Antonio Banderas.<\/span><\/li><li><b>경험<\/b>(시점 없음): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Has estado alguna vez en Cuzco?\">¿Has estado alguna vez en Cuzco?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No he viajado nunca en avión.\">No he viajado nunca en avión.<\/span><\/li><li><b>정확한 시점이 있으면<\/b> 단순과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace tres años estuvimos en Cuzco.\">Hace tres años estuvimos en Cuzco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El año pasado estuve en Chile.\">El año pasado estuve en Chile.<\/span><\/li><li><b>ya / todavía no<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ya hemos visitado La Guaira.\">Ya hemos visitado La Guaira.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todavía no hemos visitado La Guaira.\">Todavía no hemos visitado La Guaira.<\/span><\/li><li>시점을 묻는 질문은 단순과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuándo visitasteis La Guaira?\">¿Cuándo visitasteis La Guaira?<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>정확한 시점과 함께 현재완료를 쓰지 않습니다. (✗ El año pasado he estado en Chile.)<\/div>","ex":[{"title":"연습 1. 시간 표현으로 고르기","instr":"알맞은 동사 형태를 고르세요.","rule":"hoy/este año → 현재완료, ayer/el año pasado → 단순과거.","items":[{"t":"pick","q":"Hoy ___ dos exámenes.","o":["he tenido","tuve","tenía"],"a":"he tenido"},{"t":"pick","q":"Ayer ___ dos exámenes.","o":["tuve","he tenido","tenía"],"a":"tuve"},{"t":"pick","q":"Este verano ___ a la playa.","o":["hemos ido","fuimos","íbamos"],"a":"hemos ido"},{"t":"pick","q":"El verano pasado ___ a la playa.","o":["fuimos","hemos ido","vamos"],"a":"fuimos"},{"t":"pick","q":"Hace un momento ___ a Antonio Banderas.","o":["hemos visto","vimos","veíamos"],"a":"hemos visto"},{"t":"pick","q":"Hace una semana ___ a Antonio Banderas.","o":["vimos","hemos visto","hemos ver"],"a":"vimos"},{"t":"pick","q":"Esta mañana ___ muy tarde.","o":["me he levantado","me levanté","me levantaba"],"a":"me he levantado"},{"t":"pick","q":"El domingo pasado ___ en casa.","o":["comí","he comido","comía"],"a":"comí"}]},{"title":"연습 2. 현재완료 vs 단순과거 쓰기","instr":"괄호의 동사를 알맞은 시제로 쓰세요.","rule":"시간 표현을 먼저 확인하세요.","items":[{"t":"text","q":"Hoy (yo, trabajar) ___ diez horas.","a":["he trabajado"]},{"t":"text","q":"Ayer (yo, trabajar) ___ ocho horas.","a":["trabajé"]},{"t":"text","q":"Este año (nosotros, viajar) ___ a Italia.","a":["hemos viajado"]},{"t":"text","q":"El año pasado (nosotros, viajar) ___ a Francia.","a":["viajamos"]},{"t":"text","q":"Esta semana (ella, estar) ___ enferma.","a":["ha estado"]},{"t":"text","q":"La semana pasada (ella, estar) ___ en el hospital.","a":["estuvo"]},{"t":"text","q":"Hace tres años (nosotros, estar) ___ en Cuzco.","a":["estuvimos"]},{"t":"text","q":"Hace un rato (yo, hablar) ___ con Luis.","a":["he hablado"]},{"t":"text","q":"¿Cuándo (vosotros, visitar) ___ La Guaira?","a":["visitasteis"]},{"t":"text","q":"¿Qué (tú, hacer) ___ el verano pasado?","a":["hiciste"]}]},{"title":"연습 3. 경험·ya·todavía no","instr":"알맞은 것을 고르세요.","rule":"경험(alguna vez, nunca)은 현재완료, 정확한 시점은 단순과거.","items":[{"t":"pick","q":"¿Has estado alguna vez en Cuzco? —No, no he ___ nunca.","o":["estado","estuve","estaba"],"a":"estado"},{"t":"pick","q":"Hace tres años ___ en Cuzco.","o":["estuvimos","hemos estado","estábamos"],"a":"estuvimos"},{"t":"pick","q":"¿Has visitado ___ La Guaira?","o":["ya","ayer","el año pasado"],"a":"ya"},{"t":"pick","q":"Todavía no ___ La Guaira.","o":["hemos visitado","visitamos","visitábamos"],"a":"hemos visitado"},{"t":"pick","q":"¿Cuándo ___ La Guaira?","o":["visitasteis","habéis visitado","visitáis"],"a":"visitasteis"},{"t":"pick","q":"El mes pasado ___ en avión por primera vez.","o":["viajé","he viajado","viajaba"],"a":"viajé"}]},{"title":"연습 4. 오류 고치기","instr":"올바른 문장을 고르세요.","rule":"정확한 시점 + 현재완료는 오류입니다.","items":[{"t":"pick","q":"올바른 문장: ___","o":["El año pasado estuve en Chile.","El año pasado he estado en Chile.","El año pasado estoy en Chile."],"a":"El año pasado estuve en Chile."},{"t":"pick","q":"올바른 문장: ___","o":["Hoy me he levantado tarde.","Hoy me levanté ayer.","Hoy me he levantaste tarde."],"a":"Hoy me he levantado tarde."},{"t":"pick","q":"올바른 문장: ___","o":["Ayer fuimos al cine.","Ayer hemos ido al cine.","Ayer vamos al cine."],"a":"Ayer fuimos al cine."},{"t":"pick","q":"올바른 문장: ___","o":["Este mes hemos ido tres veces.","Este mes fuimos tres veces ayer.","Este mes hemos ido ayer."],"a":"Este mes hemos ido tres veces."}]}]};</script>
