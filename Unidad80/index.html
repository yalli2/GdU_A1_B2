<script>window.UNIT={"id":80,"es":"quiera, juegue…","ko":"접속법 현재: 불규칙동사 (1)","theory":"<h2>핵심 정리<\/h2>\n<h3>어간 변화형<\/h3>\n<div class=\"tw\"><table><thead><tr><th>유형<\/th><th>e→ie/e (querer)<\/th><th>e→ie/i (sentir)<\/th><th>e→i (pedir)<\/th><th>o→ue/o (poder)<\/th><th>u→ue/u (jugar)<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>quiera<\/td><td>sienta<\/td><td>pida<\/td><td>pueda<\/td><td>juegue<\/td><\/tr><tr><td>tú<\/td><td>quieras<\/td><td>sientas<\/td><td>pidas<\/td><td>puedas<\/td><td>juegues<\/td><\/tr><tr><td>usted, él, ella<\/td><td>quiera<\/td><td>sienta<\/td><td>pida<\/td><td>pueda<\/td><td>juegue<\/td><\/tr><tr><td>nosotros/as<\/td><td>queramos<\/td><td>sintamos<\/td><td>pidamos<\/td><td>podamos<\/td><td>juguemos<\/td><\/tr><tr><td>vosotros/as<\/td><td>queráis<\/td><td>sintáis<\/td><td>pidáis<\/td><td>podáis<\/td><td>juguéis<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>quieran<\/td><td>sientan<\/td><td>pidan<\/td><td>puedan<\/td><td>jueguen<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>querer 유형: calentar, cerrar, empezar, fregar, gobernar, pensar, regar / defender, entender, perder<\/li><li>sentir 유형: divertir, herir, preferir, mentir<\/li><li>pedir 유형: conseguir, corregir, elegir, freír, impedir, medir, reír, seguir, servir, sonreír<\/li><li>poder 유형: contar, costar, encontrar, recordar, sonar, soñar, volar / llover, morder, mover, soler, volver<\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>oler → huela, huelas, huela, huela, olamos, oláis, huelan, huelan / dormir → duerma, duermas, duerma, duerma, <b>durmamos, durmáis<\/b>, duerman, duerman<\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>nosotros·vosotros에서는 e→i, o→u (sentir, dormir) 또는 원래 모음 (querer, poder).<\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>소망<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Espero que podáis venir a mi fiesta.\">Espero que podáis venir a mi fiesta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Buenas noches. ¡Que durmáis bien!\">Buenas noches. ¡Que durmáis bien!<\/span><\/li><li><b>가능성<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta noche puede que llegue tarde. Tengo una reunión.\">Esta noche puede que llegue tarde. Tengo una reunión.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quizás te sientas mejor después de comer algo.\">Quizás te sientas mejor después de comer algo.<\/span><\/li><li><b>감정<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me gusta que Arturo vuelva tarde.\">No me gusta que Arturo vuelva tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Víctor le asombra que durmamos tanto.\">A Víctor le asombra que durmamos tanto.<\/span><\/li><li><b>평가<\/b>(me parece bien/mal que…, es lógico que…): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es lógico que Silvia no quiera ir a la fiesta. No conoce a nadie.\">Es lógico que Silvia no quiera ir a la fiesta. No conoce a nadie.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me parece bien que prefieras comer ahora.\">Me parece bien que prefieras comer ahora.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 어간 변화","instr":"알맞은 접속법 형태를 쓰세요.","rule":"querer → quiera, poder → pueda, pedir → pida, jugar → juegue.","items":[{"t":"text","q":"Es lógico que ella no (querer) ___ ir.","a":["quiera"]},{"t":"text","q":"Espero que (vosotros, poder) ___ venir.","a":["podáis"]},{"t":"text","q":"Quiero que (tú, pedir) ___ lo que quieras.","a":["pidas"]},{"t":"text","q":"Es posible que (yo, jugar) ___ mañana.","a":["juegue"]},{"t":"text","q":"Quizás (tú, sentirse) ___ mejor.","a":["te sientas"]},{"t":"text","q":"Me gusta que (tú, preferir) ___ comer ahora.","a":["prefieras"]},{"t":"text","q":"No me gusta que (él, volver) ___ tarde.","a":["vuelva"]},{"t":"text","q":"Espero que (ustedes, encontrar) ___ trabajo.","a":["encuentren"]},{"t":"text","q":"Es probable que (yo a":"pidas"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 형태를 쓰세요.","rule":"접속법 현재.","items":[{"t":"text","q":"Espero que (ellos, poder) ___ venir a mi fiesta.","a":["puedan"]},{"t":"text","q":"Es lógico que (ellos, pensar) ___ así.","a":["piensen"]},{"t":"text","q":"Me gusta que (tú, contar) ___ historias.","a":["cuentes"]},{"t":"text","q":"Quizás (yo, recordar) ___ su nombre.","a":["recuerde"]},{"t":"text","q":"No me gusta que (ustedes, mentir) ___ .","a":["mientan"]},{"t":"text","q":"Quiero que (tú, sonreír) ___ .","a":["sonrías"]},{"t":"text","q":"Espero que (vosotros, encontrar) ___ casa.","a":["encontréis"]},{"t":"text","q":"Es posible que (llover) ___ mañana.","a":["llueva"]}]}]};</script>
