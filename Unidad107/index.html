<script>window.UNIT={"id":107,"es":"más rápido, mejor, peor…","ko":"부사의 비교","theory":"<h2>핵심 정리<\/h2>\n<h3>비교급<\/h3>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>우등<\/td><td>más + 부사 (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Habla más alto, por favor.\">Habla más alto, por favor.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El agua avanza más rápido que el fuego.\">El agua avanza más rápido que el fuego.<\/span><\/td><\/tr><tr><td>열등<\/td><td>menos + 부사 (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy hemos llegado menos tarde que ayer.\">Hoy hemos llegado menos tarde que ayer.<\/span><\/td><\/tr><tr><td>동등<\/td><td>tan + 부사 (+ como)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este tren corre tan rápido como el AVE.\">Este tren corre tan rápido como el AVE.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>불규칙<\/h3>\n<div class=\"tw\"><table><thead><tr><th>원급<\/th><th>비교급<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>bien<\/td><td><b>mejor<\/b> (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hans habla español mejor que yo.\">Hans habla español mejor que yo.<\/span><\/td><\/tr><tr><td>mal<\/td><td><b>peor<\/b> (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Comes peor que antes.\">Comes peor que antes.<\/span><\/td><\/tr><tr><td>mucho<\/td><td><b>más<\/b> (+ que) / tanto (+ como)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"José Luis está trabajando más que nunca.\">José Luis está trabajando más que nunca.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hablas mucho en clase. No hables tanto.\">Hablas mucho en clase. No hables tanto.<\/span><\/td><\/tr><tr><td>poco<\/td><td><b>menos<\/b> (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esteban corre menos que yo.\">Esteban corre menos que yo.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>que / como 뒤에는 <b>주격 인칭대명사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ustedes hablan más que yo.\">Ustedes hablan más que yo.<\/span> (✗ más que mí)<\/li><li>열등 비교 대신 <b>부정 + 동등 비교<\/b>를 더 많이 씁니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Félix no suele llegar tan tarde como yo.\">Félix no suele llegar tan tarde como yo.<\/span><\/li><\/ul>\n<h3>최상급<\/h3>\n<ul class=\"rules\"><li>(+) <b>el, la, los, las + que + más + 부사 (+ de)<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién ha sido el que ha llegado más tarde?\">¿Quién ha sido el que ha llegado más tarde?<\/span><\/li><li>(-) <b>el que + menos + 부사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Anita es la que se porta menos mal.\">Anita es la que se porta menos mal.<\/span><\/li><li>불규칙: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Laura es la que mejor canta.\">Laura es la que mejor canta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nacho es el que peor baila del grupo.\">Nacho es el que peor baila del grupo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Gabriel es el que más estudia de toda la clase.\">Gabriel es el que más estudia de toda la clase.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Manuel y Alfonso son los que menos corren del equipo.\">Manuel y Alfonso son los que menos corren del equipo.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>비교급은 동사 앞뒤 어디든 가능: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rodolfo es el que menos estudia.\">Rodolfo es el que menos estudia.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién ha sido el que ha llegado más tarde?\">¿Quién ha sido el que ha llegado más tarde?<\/span><\/div>","ex":[{"title":"연습 1. 비교급","instr":"알맞은 형태를 고르세요.","rule":"más / menos / tan + 부사 + que / como.","items":[{"t":"pick","q":"Habla ___ alto, por favor.","o":["más","mucho","muy"],"a":"más"},{"t":"pick","q":"El agua avanza ___ rápido que el fuego.","o":["más","tan","muy"],"a":"más"},{"t":"pick","q":"Hoy hemos llegado ___ tarde que ayer. (덜 늦게)","o":["menos","más","tan"],"a":"menos"},{"t":"pick","q":"Este tren corre ___ rápido como el AVE.","o":["tan","más","menos"],"a":"tan"},{"t":"pick","q":"Hans habla español ___ que yo. (더 잘)","o":["mejor","más bien","bueno"],"a":"mejor"},{"t":"pick","q":"Comes ___ que antes. (더 나쁘게)","o":["peor","más mal","malo"],"a":"peor"},{"t":"pick","q":"José Luis está trabajando ___ que nunca.","o":["más","mejor","peor"],"a":"más"},{"t":"pick","q":"Esteban corre ___ que yo. (덜)","o":["menos","más","tan"],"a":"menos"}]},{"title":"연습 2. 대명사 · 문장 완성","instr":"알맞은 형태를 쓰세요.","rule":"que/como 뒤 주격 대명사.","items":[{"t":"text","q":"Ustedes hablan más que ___ . (yo)","a":["yo"]},{"t":"text","q":"Ella canta mejor que ___ . (tú)","a":["tú"]},{"t":"text","q":"Corro tan rápido como ___ . (él)","a":["él"]},{"t":"text","q":"Mi hermano estudia menos que ___ . (yo)","a":["yo"]},{"t":"text","q":"Habla más alto, por favor. No te ___ . (oír)","a":["oigo"]},{"t":"text","q":"Félix no suele llegar tan ___ como yo. (tarde)","a":["tarde"]},{"t":"text","q":"Hablas mucho en clase. No hables ___ . (그렇게 많이)","a":["tanto"]},{"t":"text","q":"Lorena lo hace ___ que Marta. (더 잘, bien)","a":["mejor"]}]},{"title":"연습 3. 최상급","instr":"알맞은 형태를 고르세요.","rule":"el/la/los/las que + más / menos / mejor / peor + 동사.","items":[{"t":"pick","q":"Laura es la que ___ canta. (가장 잘)","o":["mejor","más bien","bien"],"a":"mejor"},{"t":"pick","q":"Nacho es el que ___ baila del grupo. (가장 못)","o":["peor","más mal","malo"],"a":"peor"},{"t":"pick","q":"Gabriel es el que ___ estudia de toda la clase. (가장 많이)","o":["más","mayor","mucho"],"a":"más"},{"t":"pick","q":"Manuel y Alfonso son los que ___ corren del equipo. (가장 적게)","o":["menos","más poco","poco"],"a":"menos"},{"t":"pick","q":"Anita es la que se porta ___ mal. (가장 덜)","o":["menos","más","tan"],"a":"menos"},{"t":"pick","q":"¿Quién ha sido el que ha llegado ___ tarde? (가장 늦게)","o":["más","mejor","mucho"],"a":"más"},{"t":"pick","q":"Rodolfo es el que ___ estudia. (가장 적게)","o":["menos","más poco","poco"],"a":"menos"},{"t":"pick","q":"Julia es ___ que conduce más rápido.","o":["la","lo","el"],"a":"la"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 형태를 쓰세요.","rule":"비교급·최상급.","items":[{"t":"text","q":"Camila es la que ___ canta. (mejor)","a":["mejor"]},{"t":"text","q":"Este coche corre ___ rápido como aquel. (tan)","a":["tan"]},{"t":"text","q":"Él duerme ___ que yo. (menos)","a":["menos"]},{"t":"text","q":"Juan es el que ___ come de la familia. (más)","a":["más"]},{"t":"text","q":"Mi hermano baila ___ que yo. (peor)","a":["peor"]},{"t":"text","q":"No hay duda: Camila canta ___ que todos. (mejor)","a":["mejor"]},{"t":"text","q":"Hoy trabajo ___ que ayer. (menos)","a":["menos"]},{"t":"text","q":"Hablo español ___ que mi amigo. (peor)","a":["peor"]}]}]};</script>
