 avioneta volando.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mira unas fotos de mis hijos tocando el piano.\">Mira unas fotos de mis hijos tocando el piano.<\/span><\/li><li><b>hay / había + 명사 + 현재분사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un perro ladrando en la calle.\">Hay un perro ladrando en la calle.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Había dos chicos esperando a Ana.\">Había dos chicos esperando a Ana.<\/span><\/li><li><b>seguir + 현재분사<\/b>(계속): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sigo buscando trabajo.\">Sigo buscando trabajo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Le dije que se callara, pero siguió hablando.\">Le dije que se callara, pero siguió hablando.<\/span><\/li><li><b>llevar + 현재분사 + 기간 / desde<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sofía llevaba cuatro meses viviendo en México cuando conoció a Mario.\">Sofía llevaba cuatro meses viviendo en México cuando conoció a Mario.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llevo esperando desde las cuatro.\">Llevo esperando desde las cuatro.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 형태 쓰기","instr":"알맞은 현재분사를 쓰세요.","rule":"-ando, -iendo, 불규칙.","items":[{"t":"text","q":"(trabajar) Está ___ mucho.","a":["trabajando"]},{"t":"text","q":"(comer) Estamos ___ .","a":["comiendo"]},{"t":"text","q":"(vivir) Siguen ___ aquí.","a":["viviendo"]},{"t":"text","q":"(leer) No me gusta comer ___ .","a":["leyendo"]},{"t":"text","q":"(decir) Está ___ tonterías.","a":["diciendo"]},{"t":"text","q":"(dormir) El bebé está ___ .","a":["durmiendo"]},{"t":"text","q":"(pedir) Están ___ la cuenta.","a":["pidiendo"]},{"t":"text","q":"(oír) Estoy ___ música.","a":["oyendo"]},{"t":"text","q":"(reír) Se fue ___ .","a":["riendo"]},{"t":"text","q":"(ir) Va ___ a la escuela.","a":["yendo"]},{"t":"text","q":"(seguir) Sigue ___ las instruccion
