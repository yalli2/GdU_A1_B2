<script>window.UNIT={"id":102,"es":"ya, todavía, aún","ko":"시간 부사 (2): ya, todavía, aún","theory":"<h2>핵심 정리<\/h2>\n<h3>todavía · aún · ya no<\/h3>\n<ul class=\"rules\"><li><b>todavía, aún<\/b> = 과거에 시작한 일이 <b>지금도 계속<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todavía trabajo en el estudio de Mónica.\">Todavía trabajo en el estudio de Mónica.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Aún estás aquí? Creía que te habías ido.\">¿Aún estás aquí? Creía que te habías ido.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Es increíble! Son las doce y todavía está durmiendo.\">¡Es increíble! Son las doce y todavía está durmiendo.<\/span><\/li><li><b>ya no<\/b> = 예전에는 그랬지만 <b>지금은 아님<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Antes íbamos mucho a esquiar, pero ya no vamos casi nada.\">Antes íbamos mucho a esquiar, pero ya no vamos casi nada.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ya no trabajo en la academia. Ahora trabajo en la universidad.\">Ya no trabajo en la academia. Ahora trabajo en la universidad.<\/span><\/li><li>비교: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No salgas. Todavía llueve.\">No salgas. Todavía llueve.<\/span> ↔ <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Puedes salir ahora. Ya no llueve.\">Puedes salir ahora. Ya no llueve.<\/span><\/li><\/ul>\n<h3>ya · todavía no · aún no<\/h3>\n<ul class=\"rules\"><li><b>ya<\/b> = 이미 했음. 동사 앞뒤 어디든: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ya he terminado. Podemos marcharnos.\">Ya he terminado. Podemos marcharnos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando llegué a casa de Damián, se había ido ya.\">Cuando llegué a casa de Damián, se había ido ya.<\/span><\/li><li>의문문에서: 이미 했는지 묻기 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Has hablado ya con Pedro? —Sí, hablé ayer.\">—¿Has hablado ya con Pedro? —Sí, hablé ayer.<\/span><\/li><li><b>todavía no / aún no<\/b> = 아직 안 함: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aún no he acabado. Esperadme un momento.\">Aún no he acabado. Esperadme un momento.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mar no ha encontrado trabajo todavía.\">Mar no ha encontrado trabajo todavía.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Todavía no te has vestido? Vamos a llegar tarde.\">¿Todavía no te has vestido? Vamos a llegar tarde.<\/span><\/li><li>비교: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todavía no han comido.\">Todavía no han comido.<\/span> ↔ <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ya han comido.\">Ya han comido.<\/span><\/li><\/ul>\n<h3>ya + 미래 의미<\/h3>\n<ul class=\"rules\"><li><b>ya + 단순미래<\/b> (막연한 미래): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No te preocupes. Ya se arreglará todo.\">No te preocupes. Ya se arreglará todo.<\/span><\/li><li><b>ya + 현재<\/b> (지금부터): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ya me acuerdo! Tú eres Armando.\">¡Ya me acuerdo! Tú eres Armando.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ya no llueve. Ya podemos salir.\">Ya no llueve. Ya podemos salir.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. todavía · ya no","instr":"알맞은 표현을 고르세요.","rule":"지금도 계속 = todavía/aún, 이제 아님 = ya no.","items":[{"t":"pick","q":"___ trabajo en el estudio de Mónica. (지금도)","o":["Todavía","Ya no","Todavía no"],"a":"Todavía"},{"t":"pick","q":"___ trabajo en la academia. Ahora trabajo en la universidad.","o":["Ya no","Todavía","Aún"],"a":"Ya no"},{"t":"pick","q":"Son las doce y ___ está durmiendo.","o":["todavía","ya no","ya"],"a":"todavía"},{"t":"pick","q":"Antes íbamos mucho a esquiar, pero ___ vamos casi nada.","o":["ya no","todavía","aún"],"a":"ya no"},{"t":"pick","q":"No salgas. ___ llueve.","o":["Todavía","Ya no","Ya"],"a":"Todavía"},{"t":"pick","q":"Puedes salir ahora. ___ llueve.","o":["Ya no","Todavía","Aún"],"a":"Ya no"},{"t":"pick","q":"¿___ estás aquí? Creía que te habías ido.","o":["Aún","Ya no","Ya"],"a":"Aún"},{"t":"pick","q":"Mi hermano ___ vive con mis padres. (지금도)","o":["todavía","ya no","ya"],"a":"todavía"}]},{"title":"연습 2. ya · todavía no","instr":"알맞은 표현을 고르세요.","rule":"ya = 이미, todavía no / aún no = 아직.","items":[{"t":"pick","q":"___ he terminado. Podemos marcharnos.","o":["Ya","Todavía no","Ya no"],"a":"Ya"},{"t":"pick","q":"___ he acabado. Esperadme un momento.","o":["Aún no","Ya","Ya no"],"a":"Aún no"},{"t":"pick","q":"Mar no ha encontrado trabajo ___ .","o":["todavía","ya","ya no"],"a":"todavía"},{"t":"pick","q":"—¿Has hablado ___ con Pedro? —Sí, hablé ayer.","o":["ya","todavía no","ya no"],"a":"ya"},{"t":"pick","q":"Cuando llegué, se había ido ___ .","o":["ya","todavía no","ya no"],"a":"ya"},{"t":"pick","q":"¿___ te has vestido? Vamos a llegar tarde. (아직도?)","o":["Todavía no","Ya no","Ya"],"a":"Todavía no"},{"t":"pick","q":"Los niños ___ han comido. (이미)","o":["ya","todavía no","ya no"],"a":"ya"},{"t":"pick","q":"Los niños ___ han comido. (아직)","o":["todavía no","ya","ya no"],"a":"todavía no"}]},{"title":"연습 3. ya + 미래","instr":"알맞은 형태를 고르세요.","rule":"ya + 미래 = 막연한 미래, ya + 현재 = 지금부터.","items":[{"t":"pick","q":"No te preocupes. Ya se ___ todo. (arreglar)","o":["arreglará","arregla","arregló"],"a":"arreglará"},{"t":"pick","q":"¡Ya me ___ ! Tú eres Armando. (acordarse)","o":["acuerdo","acordaré","acordé"],"a":"acuerdo"},{"t":"pick","q":"Ya no llueve. Ya ___ salir. (nosotros, poder)","o":["podemos","podremos","pudimos"],"a":"podemos"},{"t":"pick","q":"No tengo dinero ahora, pero ya te lo ___ . (yo, dar)","o":["daré","doy","di"],"a":"daré"},{"t":"pick","q":"Ya ___ . No tardes. (yo, ir)","o":["voy","iré","fui"],"a":"voy"},{"t":"pick","q":"Tranquilo, ya ___ trabajo. (tú, encontrar)","o":["encontrarás","encuentras","encontraste"],"a":"encontrarás"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 표현을 쓰세요.","rule":"todavía, ya, ya no, aún no, todavía no.","items":[{"t":"text","q":"Nuestro hijo tiene tres años y ___ camina. (아직 걷지 못한다)","a":["todavía no","aún no"]},{"t":"text","q":"Ahora vivo en Madrid; ___ vivo en Sevilla.","a":["ya no"]},{"t":"text","q":"—¿Has comido? —Sí, ___ he comido.","a":["ya"]},{"t":"text","q":"Son las diez y ella ___ está en la cama. (아직도)","a":["todavía"]},{"t":"text","q":"—¿Has acabado? —___ . Un momento. (아직 아님)","a":["Todavía no","Aún no"]},{"t":"text","q":"Es muy tarde. ___ no hay autobuses. (이제는)","a":["Ya"]},{"t":"text","q":"Me gusta el café, pero ___ lo tomo. (이제 안 마심)","a":["ya no"]},{"t":"text","q":"No he leído el libro ___ . (아직)","a":["todavía","aún"]}]}]};</script>
