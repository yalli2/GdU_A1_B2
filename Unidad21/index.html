<script>window.UNIT={"id":21,"es":"uno, otro, cualquiera","ko":"부정어 (2)","theory":"<h2>핵심 정리<\/h2>\n<h3>un, una, unos, unas<\/h3>\n<p>불특정한 하나/몇몇: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito un móvil nuevo.\">Necesito un móvil nuevo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ana está con unas compañeras.\">Ana está con unas compañeras.<\/span><\/p>\n<h3>otro, otra, otros, otras<\/h3>\n<ul class=\"rules\"><li>같은 종류의 <b>하나 더<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Toma otra galleta.\">Toma otra galleta.<\/span> (=또 한 개), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Otros dos bocadillos, por favor.\">Otros dos bocadillos, por favor.<\/span><\/li><li><b>다른 종류<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Déjame otro libro. Este no me gusta.\">Déjame otro libro. Este no me gusta.<\/span> (=다른 책)<\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>otro, otra + 단수 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tráiganos otra cuchara, por favor.\">Tráiganos otra cuchara, por favor.<\/span><\/td><\/tr><tr><td>otros, otras + 복수 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Enséñeme otros zapatos. Estos no me gustan.\">Enséñeme otros zapatos. Estos no me gustan.<\/span><\/td><\/tr><tr><td>otros/otras + 숫자 + 복수 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesitamos otras dos jugadoras.\">Necesitamos otras dos jugadoras.<\/span><\/td><\/tr><tr><td>otro, otra + <b>de<\/b> + nosotros / los, las / mis, tus / estos, esos + 복수<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Pásame otro de los pasteles de chocolate.\">Pásame otro de los pasteles de chocolate.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dame otra de esas ciruelas.\">Dame otra de esas ciruelas.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>otro 앞에는 <b>un/una을 쓰지 않습니다.<\/b> <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"un otro libro\">un otro libro<\/span> ✗ → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"otro libro\">otro libro<\/span><\/div>\n<h3>cualquier, cualquiera<\/h3>\n<p>아무거나 하나(중요하지 않음): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dame cualquier libro.\">Dame cualquier libro.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Puedes llamarme a cualquier hora.\">Puedes llamarme a cualquier hora.<\/span><\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>cualquier<\/b> + 단수 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cualquier día voy a verte.\">Cualquier día voy a verte.<\/span><\/td><\/tr><tr><td>명사 + <b>cualquiera<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dame un libro cualquiera.\">Dame un libro cualquiera.<\/span><\/td><\/tr><tr><td><b>cualquiera<\/b> + de + 복수<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Pásame cualquiera de los bolígrafos.\">Pásame cualquiera de los bolígrafos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cualquiera de ustedes puede hacerlo.\">Cualquiera de ustedes puede hacerlo.<\/span><\/td><\/tr><tr><td>uno/una + cualquiera<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es igual. Deme uno cualquiera.\">Es igual. Deme uno cualquiera.<\/span><\/td><\/tr><\/tbody><\/table><\/div>","ex":[{"title":"연습 1. otro","instr":"알맞은 형태를 고르세요.","rule":"otro 앞에 un/una을 쓰지 않습니다. 성·수에 일치: otro/otra/otros/otras.","items":[{"t":"pick","q":"Toma ___ galleta.","o":["otra","otro","otras"],"a":"otra"},{"t":"pick","q":"___ zumo, por favor.","o":["Otro","Otra","Otros"],"a":"Otro"},{"t":"pick","q":"Enséñeme ___ zapatos.","o":["otros","otro","otras"],"a":"otros"},{"t":"pick","q":"Necesitamos ___ dos jugadoras.","o":["otras","otros","otra"],"a":"otras"},{"t":"pick","q":"Tráiganos ___ cuchara, por favor.","o":["otra","otro","una otra"],"a":"otra"},{"t":"pick","q":"Dame otra ___ esas ciruelas.","o":["de","en","a"],"a":"de"}]},{"title":"연습 2. cualquier / cualquiera","instr":"알맞은 형태를 고르세요.","rule":"명사 앞은 cualquier, 명사 뒤나 단독은 cualquiera.","items":[{"t":"pick","q":"Dame ___ libro.","o":["cualquier","cualquiera"],"a":"cualquier"},{"t":"pick","q":"Dame un libro ___.","o":["cualquier","cualquiera"],"a":"cualquiera"},{"t":"pick","q":"___ día voy a verte.","o":["Cualquier","Cualquiera"],"a":"Cualquier"},{"t":"pick","q":"Puedes llamarme a ___ hora.","o":["cualquier","cualquiera"],"a":"cualquier"},{"t":"pick","q":"___ de ustedes puede hacerlo.","o":["Cualquier","Cualquiera"],"a":"Cualquiera"},{"t":"pick","q":"Es igual. Deme uno ___.","o":["cualquier","cualquiera"],"a":"cualquiera"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 말을 쓰세요.","rule":"uno/un, otro, cualquiera 중 상황에 맞는 것을 씁니다.","items":[{"t":"text","q":"Hay muchos bocadillos. Toma ___.","a":["otro"]},{"t":"text","q":"¿Cuál quieres? — ___ cualquiera, es igual.","a":["Uno"]},{"t":"text","q":"Necesito ___ móvil nuevo.","a":["un"]},{"t":"text","q":"Pásame ___ de los bolígrafos. (아무거나)","a":["cualquiera"]},{"t":"text","q":"Este libro no me gusta. Déjame ___ libro.","a":["otro"]},{"t":"text","q":"¿Quieres otro café? — Sí, ___ por favor.","a":["otro"]}]},{"title":"연습 4. 맞는 문장 고르기","instr":"문법적으로 올바른 문장을 고르세요.","rule":"otro 앞에 관사를 쓰지 않으며, cualquiera는 명사 뒤에서 쓰입니다.","items":[{"t":"pick","q":"올바른 문장: ___","o":["Quiero otro libro.","Quiero un otro libro."],"a":"Quiero otro libro."},{"t":"pick","q":"올바른 문장: ___","o":["Dame un libro cualquiera.","Dame un cualquiera libro."],"a":"Dame un libro cualquiera."},{"t":"pick","q":"올바른 문장: ___","o":["Cualquier día voy a verte.","Cualquiera día voy a verte."],"a":"Cualquier día voy a verte."}]}]};</script>
