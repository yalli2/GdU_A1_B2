<script>window.UNIT={"id":47,"es":"Hay un cine. Está en la calle Mayor","ko":"haber와 estar의 대조","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th>HAY (존재)<\/th><th>ESTAR (위치)<\/th><\/tr><\/thead><tbody><tr><td><b>모르는 것·새로운 정보<\/b>의 존재 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un señor que quiere hablar con usted.\">Hay un señor que quiere hablar con usted.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un restaurante nuevo en el barrio.\">Hay un restaurante nuevo en el barrio.<\/span><\/td><td><b>이미 아는 것·언급된 것<\/b>의 위치 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Está en la recepción.\">Está en la recepción.<\/span> (말씀드린 그 신사), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Está en la calle Apodaca.\">Está en la calle Apodaca.<\/span><\/td><\/tr><tr><td><b>불특정한<\/b> 것의 존재 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un cine en la calle Monterrey.\">Hay un cine en la calle Monterrey.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En Madrid hay muchos museos.\">En Madrid hay muchos museos.<\/span><\/td><td><b>유일하거나 특정한<\/b> 것의 위치 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El cine América está en la calle Monterrey.\">El cine América está en la calle Monterrey.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El Museo del Prado está en Madrid.\">El Museo del Prado está en Madrid.<\/span><\/td><\/tr><tr><td>모르는 대상의 위치를 물음 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde hay una farmacia?\">¿Dónde hay una farmacia?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde hay un restaurante?\">¿Dónde hay un restaurante?<\/span><\/td><td>아는 대상의 위치를 물음 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde está la farmacia de tu tía?\">¿Dónde está la farmacia de tu tía?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-s
