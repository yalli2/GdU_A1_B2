<script>window.UNIT={"id":11,"es":"el rojo, uno rojo","ko":"명사의 생략","theory":"<h2>핵심 정리<\/h2>\n<p>이미 말했거나 문맥상 분명한 명사는 생략하고 <b>관사 + 형용사<\/b>로 말합니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>el / la / los / las + 형용사<\/td><td><b>특정한<\/b> 것<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué camisa te gusta más? — La verde.\">¿Qué camisa te gusta más? — La verde.<\/span><\/td><\/tr><tr><td>uno / una / unos / unas + 형용사<\/td><td><b>종류<\/b>의 하나<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué tipo de coche busca? — Uno pequeño.\">¿Qué tipo de coche busca? — Uno pequeño.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quiero unos cómodos.\">Quiero unos cómodos.<\/span><\/td><\/tr><tr><td>el / la / los / las + <b>de<\/b> + 명사<\/td><td>소유·위치·재료<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi coche es peor que el de mi hermano.\">Mi coche es peor que el de mi hermano.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Prefiero las de la derecha.\">Prefiero las de la derecha.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Los de oro.\">Los de oro.<\/span><\/td><\/tr><tr><td><b>lo<\/b> + 남성 단수 형용사<\/td><td>~한 것, ~한 점<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo bueno del verano son las vacaciones.\">Lo bueno del verano son las vacaciones.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo mejor de Perú es la gente.\">Lo mejor de Perú es la gente.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gusta lo salado.\">Me gusta lo salado.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>형용사는 생략된 명사의 성·수와 일치합니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué zapatillas te gustan más? — Las rojas.\">¿Qué zapatillas te gustan más? — Las rojas.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién es don Tomás? — El delgado.\">¿Quién es don Tomás? — El delgado.<\/span><span class=\"ko\">누가 돈 토마스지? — 마른 분이야.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién es Alicia? — La del vestido blanco.\">¿Quién es Alicia? — La del vestido blanco.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo difícil del español son los verbos.\">Lo difícil del español son los verbos.<\/span><\/div>","ex":[{"title":"연습 1. 명사 생략 (el/la/los/las)","instr":"알맞은 관사를 고르세요.","rule":"생략된 명사의 성·수에 맞춰 el, la, los, las를 씁니다.","items":[{"t":"pick","q":"¿Qué camisa te gusta? — ___ verde.","o":["El","La","Los","Las"],"a":"La"},{"t":"pick","q":"¿Qué zapatos prefieres? — ___ negros.","o":["El","La","Los","Las"],"a":"Los"},{"t":"pick","q":"¿Qué sombrero quieres? — ___ grande.","o":["El","La","Los","Las"],"a":"El"},{"t":"pick","q":"¿Qué zapatillas te gustan más? — ___ rojas.","o":["El","La","Los","Las"],"a":"Las"},{"t":"pick","q":"¿Qué libro es tuyo? — ___ azul.","o":["El","La","Los","Las"],"a":"El"},{"t":"pick","q":"¿Qué gafas prefieres? — ___ redondas.","o":["El","La","Los","Las"],"a":"Las"}]},{"title":"연습 2. uno/una vs. el/la","instr":"알맞은 것을 고르세요.","rule":"종류를 말할 때는 uno/una, 특정한 것은 el/la.","items":[{"t":"pick","q":"¿Qué tipo de coche busca? — ___ pequeño.","o":["Uno","El"],"a":"Uno"},{"t":"pick","q":"¿Quién es Susi? — ___ alta.","o":["Una","La"],"a":"La"},{"t":"pick","q":"¿Qué zapatos quiere? — Quiero ___ cómodos.","o":["unos","los"],"a":"unos"},{"t":"pick","q":"Necesito un boli. Quiero ___ barato.","o":["uno","el"],"a":"uno"},{"t":"pick","q":"¿Qué falda te pones? — ___ blanca. (특정한 것)","o":["Una","La"],"a":"La"},{"t":"pick","q":"¿Quieres una manzana? — Sí, dame ___ roja.","o":["una","la"],"a":"una"}]},{"title":"연습 3. el/la + de + 명사","instr":"알맞은 관사를 쓰세요.","rule":"관사 + de + 명사로 소유·위치·재료를 나타냅니다. 관사는 생략된 명사에 일치.","items":[{"t":"text","q":"Mi coche es peor que ___ de mi hermano.","a":["el"]},{"t":"text","q":"Esas gafas no me gustan. Prefiero ___ de la derecha.","a":["las"]},{"t":"text","q":"¿Quién es Alicia? — ___ del vestido blanco.","a":["La"]},{"t":"text","q":"¿Qué pendientes te vas a poner? — ___ de oro.","a":["Los"]},{"t":"text","q":"¿Cuál es tu casa? — ___ de la esquina.","a":["La"]},{"t":"text","q":"¿Cuáles son tus llaves? — ___ de la mesa.","a":["Las"]}]},{"title":"연습 4. lo + 형용사","instr":"알맞은 것을 고르세요.","rule":"lo + 남성 단수 형용사 = ~한 것/점. 동사는 뒤에 오는 명사에 일치합니다.","items":[{"t":"pick","q":"___ bueno del verano son las vacaciones.","o":["Lo","El","La"],"a":"Lo"},{"t":"pick","q":"___ mejor de Perú es la gente.","o":["Lo","El","La"],"a":"Lo"},{"t":"pick","q":"Me gusta ___ salado.","o":["lo","el","la"],"a":"lo"},{"t":"pick","q":"___ difícil del español son los verbos.","o":["Lo","El","La"],"a":"Lo"}]}]};</script>
