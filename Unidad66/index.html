<script>window.UNIT={"id":66,"es":"había trabajado","ko":"대과거","theory":"<h2>핵심 정리<\/h2>\n<h3>형태: haber 불완료과거 + 과거분사<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>haber<\/th><th>과거분사<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>había<\/td><td>trabajado<\/td><\/tr><tr><td>tú<\/td><td>habías<\/td><td>comido<\/td><\/tr><tr><td>usted, él, ella<\/td><td>había<\/td><td>vivido<\/td><\/tr><tr><td>nosotros/as<\/td><td>habíamos<\/td><td>hecho<\/td><\/tr><tr><td>vosotros/as<\/td><td>habíais<\/td><td>visto<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>habían<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>다른 과거 사건·상황보다 먼저<\/b> 끝난 과거 행위: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando llegué al banco, ya había cerrado.\">Cuando llegué al banco, ya había cerrado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando llegamos a la estación, se había ido el tren.\">Cuando llegamos a la estación, se había ido el tren.<\/span><\/li><li>과거 일의 <b>결과·이유 설명<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Por qué suspendiste? —No había estudiado nada.\">—¿Por qué suspendiste? —No había estudiado nada.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer me encontré con Lolo y no lo reconocí. Se había afeitado la cabeza.\">Ayer me encontré con Lolo y no lo reconocí. Se había afeitado la cabeza.<\/span><\/li><li><b>ya<\/b> (이미): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando conocí a Teresa, ya había tenido el niño.\">Cuando conocí a Teresa, ya había tenido el niño.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando Helga vino a España, ¿había estudiado ya algo de español?\">Cuando Helga vino a España, ¿había estudiado ya algo de español?<\/span><\/li><li><b>todavía no<\/b> (아직): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando Mariano y Concha se conocieron, Concha todavía no había acabado la carrera.\">Cuando Mariano y Concha se conocieron, Concha todavía no había acabado la carrera.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando llamé a casa de Antonio, no se había levantado todavía.\">Cuando llamé a casa de Antonio, no se había levantado todavía.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>재귀대명사는 haber 앞에: se había afeitado, no se había levantado.<\/div>","ex":[{"title":"연습 1. haber 불완료과거","instr":"알맞은 형태를 고르세요.","rule":"yo había, tú habías, él había, nosotros habíamos, vosotros habíais, ellos habían.","items":[{"t":"pick","q":"Yo ___ estudiado mucho.","o":["había","habías","habían"],"a":"había"},{"t":"pick","q":"Tú ___ comido ya.","o":["habías","había","habíamos"],"a":"habías"},{"t":"pick","q":"Ana ___ cerrado la puerta.","o":["había","habían","habíais"],"a":"había"},{"t":"pick","q":"Nosotros ___ llegado antes.","o":["habíamos","habíais","habían"],"a":"habíamos"},{"t":"pick","q":"Vosotros ___ hablado con él.","o":["habíais","habíamos","habían"],"a":"habíais"},{"t":"pick","q":"Ellos ___ salido temprano.","o":["habían","había","habíamos"],"a":"habían"}]},{"title":"연습 2. 형태 쓰기","instr":"괄호의 동사를 대과거로 쓰세요.","rule":"había + 과거분사.","items":[{"t":"text","q":"Cuando llegué, el banco ya (cerrar) ___ .","a":["había cerrado"]},{"t":"text","q":"Cuando llegamos, el tren ya (irse) ___ .","a":["se había ido"]},{"t":"text","q":"Ayer vi a Lolo. (afeitarse, él) ___ la cabeza.","a":["Se había afeitado"]},{"t":"text","q":"No aprobé porque no (yo, estudiar) ___ nada.","a":["había estudiado"]},{"t":"text","q":"Cuando la conocí, ella ya (tener) ___ un hijo.","a":["había tenido"]},{"t":"text","q":"Cuando llamé, Antonio todavía no (levantarse) ___ .","a":["se había levantado"]},{"t":"text","q":"Cuando llegaron, nosotros ya (comer) ___ .","a":["habíamos comido"]},{"t":"text","q":"Cuando abrí la puerta, los niños ya (hacer) ___ la cena.","a":["habían hecho"]},{"t":"text","q":"Ellos ya (ver) ___ la película cuando llegué.","a":["habían visto"]},{"t":"text","q":"¿Tú ya (hablar) ___ con él cuando te llamé?","a":["habías hablado"]}]},{"title":"연습 3. 어느 것이 먼저?","instr":"알맞은 시제를 고르세요.","rule":"먼저 끝난 일은 대과거, 나중 일은 단순과거.","items":[{"t":"pick","q":"Cuando llegué al banco, ya ___ .","o":["había cerrado","cerró","cerraba"],"a":"había cerrado"},{"t":"pick","q":"Cuando ___ a la estación, el tren se había ido.","o":["llegamos","habíamos llegado","llegábamos"],"a":"llegamos"},{"t":"pick","q":"¿Por qué suspendiste? —No ___ nada.","o":["había estudiado","estudié","estudiaba"],"a":"había estudiado"},{"t":"pick","q":"Cuando conocí a Teresa, ya ___ el niño.","o":["había tenido","tuvo","tenía"],"a":"había tenido"},{"t":"pick","q":"Concha todavía no ___ la carrera.","o":["había acabado","acabó","acaba"],"a":"había acabado"},{"t":"pick","q":"Cuando Helga vino a España, ¿___ ya algo de español?","o":["había estudiado","estudió","estudiaba"],"a":"había estudiado"},{"t":"pick","q":"Ayer vi a Lolo y no lo reconocí. Se ___ la cabeza.","o":["había afeitado","afeitó","afeitaba"],"a":"había afeitado"}]},{"title":"연습 4. 시제 선택","instr":"괄호의 동사를 알맞은 시제로 쓰세요.","rule":"먼저 일어난 일 = había + 과거분사.","items":[{"t":"text","q":"Cuando llegamos al cine, la película ya (empezar) ___ .","a":["había empezado"]},{"t":"text","q":"Cuando volví a casa, mis padres ya (cenar) ___ .","a":["habían cenado"]},{"t":"text","q":"Cuando ellos llamaron, yo todavía no (salir) ___ .","a":["había salido"]},{"t":"text","q":"No reconocí a Laura porque (cortarse) ___ el pelo.","a":["se había cortado"]},{"t":"text","q":"Cuando llegaste, ¿ya (terminar, nosotros) ___ la reunión?","a":["habíamos terminado"]}]}]};</script>
