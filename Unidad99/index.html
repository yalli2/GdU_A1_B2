<script>window.UNIT={"id":99,"es":"trabajado, comido, vivido","ko":"과거분사","theory":"<h2>핵심 정리<\/h2>\n<h3>형태<\/h3>\n<div class=\"tw\"><table><thead><tr><th>유형<\/th><th>변화<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>-ar<\/td><td>-ado<\/td><td>trabajar → trabajado<\/td><\/tr><tr><td>-er, -ir<\/td><td>-ido<\/td><td>comer → comido, vivir → vivido<\/td><\/tr><tr><td>불규칙<\/td><td>abrir → abierto, cubrir/descubrir → cubierto/descubierto, escribir → escrito, volver/devolver → vuelto/devuelto, decir → dicho, poner/componer → puesto/compuesto, romper → roto, ver → visto, morir → muerto, hacer → hecho<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>haber + 과거분사<\/b>(복합시제): 형태 불변 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis padres han vuelto hace un rato.\">Mis padres han vuelto hace un rato.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sonia no había comido cuando la llamé.\">Sonia no había comido cuando la llamé.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lidia no se ha atrevido a bañarse.\">Lidia no se ha atrevido a bañarse.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Os habéis lavado?\">¿Os habéis lavado?<\/span><\/li><li><b>형용사<\/b>로: 수식하는 명사와 성·수 일치 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Óscar parece cansado.\">Óscar parece cansado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Muchas personas estaban heridas.\">Muchas personas estaban heridas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El restaurante está cerrado.\">El restaurante está cerrado.<\/span><\/li><li><b>estar + 과거분사<\/b>: 행위의 결과 상태 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ya está arreglada la lavadora.\">Ya está arreglada la lavadora.<\/span><\/li><li><b>seguir + 과거분사<\/b>: 앞선 상태가 계속됨 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La puerta del salón sigue rota.\">La puerta del salón sigue rota.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta mañana había dormido bien, pero seguía cansado.\">Esta mañana había dormido bien, pero seguía cansado.<\/span><\/li><li><b>llevar + 과거분사 + 기간/desde<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rita y Jaime llevan casados quince años.\">Rita y Jaime llevan casados quince años.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rita y Jaime llevan quince años casados.\">Rita y Jaime llevan quince años casados.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando cambiaron el cristal, llevaba roto desde el verano.\">Cuando cambiaron el cristal, llevaba roto desde el verano.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 과거분사 형태","instr":"알맞은 과거분사를 쓰세요.","rule":"-ado, -ido, 불규칙.","items":[{"t":"text","q":"(terminar) La clase ha ___ .","a":["terminado"]},{"t":"text","q":"(comer) No hemos ___ todavía.","a":["comido"]},{"t":"text","q":"(vivir) Siempre han ___ aquí.","a":["vivido"]},{"t":"text","q":"(abrir) Han ___ la tienda.","a":["abierto"]},{"t":"text","q":"(escribir) He ___ una carta.","a":["escrito"]},{"t":"text","q":"(romper) Se ha ___ el vaso.","a":["roto"]},{"t":"text","q":"(volver) Mis padres han ___ .","a":["vuelto"]},{"t":"text","q":"(decir) Nunca me ha ___ nada.","a":["dicho"]},{"t":"text","q":"(ver) ¿Has ___ la película?","a":["visto"]},{"t":"text","q":"(hacer) Hemos ___ la cena.","a":["hecho"]},{"t":"text","q":"(poner) Ya he ___ la mesa.","a":["puesto"]},{"t":"text","q":"(morir) El gato se ha ___ .","a":["muerto"]}]},{"title":"연습 2. 형용사로 쓰이는 과거분사","instr":"성·수 일치 형태를 고르세요.","rule":"수식하는 명사와 성·수 일치.","items":[{"t":"pick","q":"El restaurante está ___ . (cerrar)","o":["cerrado","cerrada","cerrados"],"a":"cerrado"},{"t":"pick","q":"La tienda está ___ . (cerrar)","o":["cerrada","cerrado","cerradas"],"a":"cerrada"},{"t":"pick","q":"Muchas personas estaban ___ . (herir)","o":["heridas","herido","heridos"]
