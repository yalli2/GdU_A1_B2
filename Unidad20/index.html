<script>window.UNIT={"id":20,"es":"todos, algunos, unos, ninguno…","ko":"부정어 (1)","theory":"<h2>핵심 정리<\/h2>\n<p>무리를 이루는 구성원을 가리킬 때 씁니다.<\/p>\n<ul class=\"rules\"><li><b>todos<\/b> = 전체, <b>algunos<\/b> = 일부, <b>un(o)<\/b> = 불특정한 하나, <b>ningún(o)<\/b> = 아무도/아무것도 없음<\/li><\/ul>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todos los niños están llorando.\">Todos los niños están llorando.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Algunos niños están llorando.\">Algunos niños están llorando.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Un niño está llorando.\">Un niño está llorando.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ningún niño está llorando.\">Ningún niño está llorando.<\/span><\/div>\n<h3>todo, toda, todos, todas<\/h3>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>뒤에 오는 말<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>todo, toda<\/td><td>+ el/la, mi/tu…, este/ese… + <b>단수 명사<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dame todo el pan.\">Dame todo el pan.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Toda tu familia es muy alegre.\">Toda tu familia es muy alegre.<\/span><\/td><\/tr><tr><td>todos, todas<\/td><td>+ los/las, mis/tus…, estos/esos… + <b>복수 명사<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Voy a México todos los veranos.\">Voy a México todos los veranos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Todos mis hermanos hablan francés.\">Todos mis hermanos hablan francés.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>un, algún, ningún<\/h3>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>뒤에 오는 말<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>un, una / algún, alguna / ningún, ninguna<\/td><td>+ <b>단수 명사<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He conocido a un compañero tuyo.\">He conocido a un compañero tuyo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Ha venido algún alumno?\">¿Ha venido algún alumno?<\/span><\/td><\/tr><tr><td>unos, unas / algunos, algunas<\/td><td>+ <b>복수 명사<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Conozco a unos chicos que estudian quechua.\">Conozco a unos chicos que estudian quechua.<\/span><\/td><\/tr><tr><td>uno, alguno, ninguno + de +<\/td><td>nosotros, los/las + 복수, mis/tus + 복수<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Uno de mis tíos vive en Caracas.\">Uno de mis tíos vive en Caracas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Alguno de vosotros conduce?\">¿Alguno de vosotros conduce?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No veo a ninguno de los niños.\">No veo a ninguno de los niños.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>남성 단수 명사 앞에서는 <b>algún, ningún<\/b> (alguno, ninguno ✗): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"algún alumno\">algún alumno<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ningún domingo\">ningún domingo<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>ninguno + 긍정 동사<\/b> / <b>부정 동사 + ninguno<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ninguno de mis amigos ha salido.\">Ninguno de mis amigos ha salido.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No ha salido ninguno de mis amigos.\">No ha salido ninguno de mis amigos.<\/span><\/div>","ex":[{"title":"연습 1. todo / todos","instr":"알맞은 형태를 고르세요.","rule":"단수 명사 → todo/toda, 복수 명사 → todos/todas.","items":[{"t":"pick","q":"___ el pan","o":["Todo","Toda","Todos"],"a":"Todo"},{"t":"pick","q":"___ tu familia","o":["Todo","Toda","Todas"],"a":"Toda"},{"t":"pick","q":"___ los veranos","o":["Todo","Todos","Todas"],"a":"Todos"},{"t":"pic
