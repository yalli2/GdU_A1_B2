}]},{"title":"연습 2. 강세 a-/ha- 와 축약","instr":"알맞은 것을 고르세요.","rule":"강세 a-/ha- 여성 단수 명사 앞은 el, a+el=al, de+el=del.","items":[{"t":"pick","q":"___ agua","o":["el","la"],"a":"el"},{"t":"pick","q":"___ aula","o":["el","la"],"a":"el"},{"t":"pick","q":"___ águila","o":["el","la"],"a":"el"},{"t":"pick","q":"___ otra aula","o":["el","la"],"a":"la","why":"otra 같은 형용사가 앞에 오면 la를 씁니다."},{"t":"pick","q":"Voy ___ cine.","o":["a el","al"],"a":"al"},{"t":"pick","q":"Es el coche ___ director.","o":["de el","del"],"a":"del"},{"t":"pick","q":"Hablo ___ profesor.","o":["a el","al"],"a":"al"},{"t":"pick","q":"Vengo ___ colegio.","o":["de el","del"],"a":"del"}]},{"title":"연습 3. 정관사 쓰기","instr":"알맞은 정관사를 쓰세요.","rule":"유일한 것, 특정한 것, 일반적 의미 모두 정관사를 씁니다.","items":[{"t":"text","q":"Buenos Aires es ___ capital de Argentina.","a":["la"]},{"t":"text","q":"Cierra ___ puerta, por favor.","a":["la"]},{"t":"text","q":"___ tabaco es malo para la salud.","a":["El"]},{"t":"text","q":"___ chilenos hablan español.","a":["Los"]},{"t":"text","q":"Mira, ___ madre de Antonio.","a":["la"]},{"t":"text","q":"¿Puedo ver ___ director?","a":["al"]},{"t":"text","q":"___ rosas son mis flores preferidas.","a":["Las"]},{"t":"text","q":"Luis está en ___ cocina.","a":["la"]}]},{"title":"연습 4. 유일한 것인가, 특정한 것인가?","instr":"문장에서 정관사가 쓰인 이유로 알맞은 것을 고르세요.","rule":"유일한 것, 특정한 것, 일반적 의미 — 세 가지로 구분합니다.","items":[{"t":"pick","q":"Buenos Aires es la capital de Argentina. → ___","o":["유일","특정","일반"],"a":"유일"},{"t":"pick","q":"Enciende la luz, por favor. → ___","o":["유일","특정","일반"],"a":"특정"},{"t":"pick","q":"Los chilenos hablan español. → ___","o":["유일","특정","일반"],"a":"일반"},{"t":"pick","q":"Luis está en la cocina. → ___","o":["유일","특정","일반"],"a":"특정"},{"t":"pick","q":"El tabaco es malo para la salud. → ___","o":["유일","특정","일반"],"a":"일반"}]}]};</script>
