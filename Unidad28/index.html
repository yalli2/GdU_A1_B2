<script>window.UNIT={"id":28,"es":"que, el que, quien…","ko":"관계사 (1)","theory":"<h2>핵심 정리<\/h2>\n<p>관계사는 앞에 나온 명사를 다시 말하지 않고 그 명사에 대한 정보를 더합니다.<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo un loro. El loro habla.\">Tengo un loro. El loro habla.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo un loro que habla.\">Tengo un loro que habla.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He recibido una revista. Clara escribe en esta revista.\">He recibido una revista. Clara escribe en esta revista.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He recibido una revista en la que escribe Clara.\">He recibido una revista en la que escribe Clara.<\/span><\/div>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>쓰임<\/th><\/tr><\/thead><tbody><tr><td><b>que<\/b><\/td><td>사람·동물·사물 모두 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Las chicas que conocimos ayer son de Córdoba.\">Las chicas que conocimos ayer son de Córdoba.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me gusta el libro que estoy leyendo.\">No me gusta el libro que estoy leyendo.<\/span><\/td><\/tr><tr><td>전치사 + <b>el que, la que, los que, las que<\/b><\/td><td>선행사의 성·수에 일치 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ese es el perro del que te hablé.\">Ese es el perro del que te hablé.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Las chicas con las que estaba jugando son mis sobrinas.\">Las chicas con las que estaba jugando son mis sobrinas.<\/span><\/td><\/tr><tr><td>전치사 + <b>quien, quienes<\/b><\/td><td><b>사람만<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El chico con quien sale Nieves es bombero.\">El chico con quien sale Nieves es bombero.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Las chicas con quienes estaba jugando…\">Las chicas con quienes estaba jugando…<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>선행사를 식별하게 해 주는 경우: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La chica que está bailando con Pedro es Begoña.\">La chica que está bailando con Pedro es Begoña.<\/span> / 정의하는 경우: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Un carnicero es una persona que vende carne.\">Un carnicero es una persona que vende carne.<\/span><\/li><\/ul>\n<h3>el que / la que (명사 없이)<\/h3>\n<p>앞서 말한 명사를 대신합니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál es tu maleta? — La que tiene ruedas.\">¿Cuál es tu maleta? — La que tiene ruedas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gusta más este libro que el que me recomendó Luis.\">Me gusta más este libro que el que me recomendó Luis.<\/span><\/p>\n<h3>lo que<\/h3>\n<p>앞의 내용이나 생각을 가리킵니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo que has dicho es una tontería.\">Lo que has dicho es una tontería.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo que tú necesitas es mucho cariño.\">Lo que tú necesitas es mucho cariño.<\/span><\/p>","ex":[{"title":"연습 1. que","instr":"두 문장을 que로 연결할 때 알맞은 것을 고르세요.","rule":"관계사 que는 사람·동물·사물 모두에 쓰입니다.","items":[{"t":"pick","q":"Tengo un loro. El loro habla. → Tengo un loro ___ habla.","o":["que","quien","donde"],"a":"que"},{"t":"pick","q":"Las chicas ___ conocimos ayer son de Córdoba.","o":["que","quienes","cuyas"],"a":"que"},{"t":"pick","q":"No me gusta el libro ___ estoy leyendo.","o":["que","quien","cual"],"a":"que"},{"t":"pick","q":"El cóndor es un ave ___ procede de América del Sur.","o":["que","quien","donde"],"a":"que"},{"t":"pick","q":"Un carnicero es una persona ___ vende carne.","o":["que","quien","lo que"],"a":"que"},{"t":"pick","q":"El coche ___ está delante del banco es el mío.","o":["que","quien","lo"],"a":"que"}]},{"title":"연습 2. 전치사 + el que","instr":"알맞은 관계사를 고르세요.","rule":"전치사 뒤에서는 선행사의 성·수에 일치하는 el que, la que, los que, las que.","items":[{"t":"pick","q":"Ese es el perro del ___ te hablé.","o":["que","cual","quien"],"a":"que"},{"t":"pick","q":"Las chicas con ___ estaba jugando son mis sobrinas.","o":["las que","el que","los que"],"a":"las que"},{"t":"pick","q":"He recibido una revista en ___ escribe Clara.","o":["la que","el que","lo que"],"a":"la que"},{"t":"pick","q":"El libro del ___ te hablé es muy bueno.","o":["que","qué","quien"],"a":"que"},{"t":"pick","q":"La casa en ___ vivo es antigua.","o":["la que","el que","los que"],"a":"la que"},{"t":"pick","q":"Los amigos con ___ viajé son españoles.","o":["los que","las que","lo que"],"a":"los que"}]},{"title":"연습 3. quien","instr":"사람 선행사일 때 알맞은 것을 고르세요.","rule":"전치사 뒤 quien/quienes는 사람에게만 씁니다.","items":[{"t":"pick","q":"El chico con ___ sale Nieves es bombero.","o":["quien","el que","lo que"],"a":"quien"},{"t":"pick","q":"Las chicas con ___ estaba jugando son mis sobrinas.","o":["quienes","quien","que"],"a":"quienes"},{"t":"pick","q":"La persona a ___ saludé es mi profesor.","o":["quien","lo que","quienes"],"a":"quien"},{"t":"pick","q":"Los amigos para ___ he comprado el regalo son mis primos.","o":["quienes","quien","lo que"],"a":"quienes"}]},{"title":"연습 4. el que / lo que","instr":"알맞은 것을 고르세요.","rule":"명사를 대신하면 el/la que, 앞 내용을 가리키면 lo que.","items":[{"t":"pick","q":"¿Cuál es tu maleta? — ___ tiene ruedas.","o":["La que","El que","Lo que"],"a":"La que"},{"t":"pick","q":"___ has dicho es una tontería.","o":["Lo que","El que","La que"],"a":"Lo que"},{"t":"pick","q":"Me gusta más este libro que ___ me recomendó Luis.","o":["el que","lo que","la que"],"a":"el que"},{"t":"pick","q":"___ tú necesitas es mucho cariño.","o":["Lo que","El que","Quien"],"a":"Lo que"},{"t":"pick","q":"Mi coche es el ___ está delante del banco.","o":["que","lo que","quien"],"a":"que"}]}]};</script>
