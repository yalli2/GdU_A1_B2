<script>window.UNIT={"id":52,"es":"Vivo en México desde 1998","ko":"기간을 나타내는 현재","theory":"<h2>핵심 정리<\/h2>\n<p>과거에 시작해서 <b>지금도 계속되는<\/b> 행동이나 상황을 <b>현재 시제<\/b>로 말합니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>현재 + <b>desde<\/b> + 시점(날짜)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Vivo en México desde 1998.\">Vivo en México desde 1998.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Trabajo en un banco desde el año pasado.\">Trabajo en un banco desde el año pasado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Vivimos en este piso desde enero.\">Vivimos en este piso desde enero.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No voy al teatro desde Navidad.\">No voy al teatro desde Navidad.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Desde cuándo conoces a Charo?\">¿Desde cuándo conoces a Charo?<\/span><\/td><\/tr><tr><td>현재 + <b>desde hace<\/b> + 기간<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Keiko estudia español desde hace tres meses.\">Keiko estudia español desde hace tres meses.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rosana y Alberto viven en Argentina desde hace dos años.\">Rosana y Alberto viven en Argentina desde hace dos años.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No veo a Pili desde hace mucho tiempo.\">No veo a Pili desde hace mucho tiempo.<\/span><\/td><\/tr><tr><td><b>hace<\/b> + 기간 + <b>que<\/b> + 현재<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace un año que estudio español.\">Hace un año que estudio español.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace dos días que no miro el correo electrónico.\">Hace dos días que no miro el correo electrónico.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace mucho tiempo que no veo a Luis.\">Hace mucho tiempo que no veo a Luis.<\/span><\/td><\/tr><tr><td>¿<b>Cuánto tiempo hace que<\/b> + 현재?<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuánto tiempo hace que trabajas aquí?\">¿Cuánto tiempo hace que trabajas aquí?<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>세 구조는 모두 같은 뜻입니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estudio español desde hace un año.\">Estudio español desde hace un año.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace un año que estudio español.\">Hace un año que estudio español.<\/span><\/div>","ex":[{"title":"연습 1. desde / desde hace","instr":"알맞은 표현을 고르세요.","rule":"desde + 시점, desde hace + 기간.","items":[{"t":"pick","q":"Vivo en México ___ 1998.","o":["desde","desde hace"],"a":"desde"},{"t":"pick","q":"Keiko estudia español ___ tres meses.","o":["desde hace","desde"],"a":"desde hace"},{"t":"pick","q":"Trabajo en un banco ___ el año pasado.","o":["desde","desde hace"],"a":"desde"},{"t":"pick","q":"Rosana y Alberto viven en Argentina ___ dos años.","o":["desde hace","desde"],"a":"desde hace"},{"t":"pick","q":"No voy al teatro ___ Navidad.","o":["desde","desde hace"],"a":"desde"},{"t":"pick","q":"No veo a Pili ___ mucho tiempo.","o":["desde hace","desde"],"a":"desde hace"}]},{"title":"연습 2. hace … que","instr":"알맞은 말을 쓰세요.","rule":"hace + 기간 + que + 현재.","items":[{"t":"text","q":"___ un año que estudio español.","a":["Hace"]},{"t":"text","q":"Hace dos días ___ no miro el correo.","a":["que"]},{"t":"text","q":"¿Cuánto tiempo hace ___ trabajas aquí?","a":["que"]},{"t":"text","q":"Hace mucho tiempo que no ___ a Luis. (ver, yo)","a":["veo"]},{"t":"text","q":"Hace tres años que ___ en Madrid. (vivir, nosotros)","a":["vivimos"]},{"t":"text","q":"Hace cinco meses que ___ inglés. (estudiar, tú)","a":["estudias"]}]},{"title":"연습 3. 같은 뜻 만들기","instr":"알맞은 표현을 쓰세요.","rule":"desde hace + 기간 = hace + 기간 + que.","items":[{"t":"text","q":"Vivo aquí desde hace tres años. = Hace tres años ___ vivo aquí.","a":["que"]},{"t":"text","q":"Estudio español desde hace un año. = ___ un año que estudio español.","a":["Hace"]},{"t":"text","q":"Hace dos meses que trabajo aquí. = Trabajo aquí desde ___ dos meses.","a":["hace"]},{"t":"text","q":"Conozco a Elsa desde 2002. = ___ 2002 conozco a Elsa.","a":["Desde"]},{"t":"text","q":"No veo a mi tío desde hace mucho tiempo. = ___ mucho tiempo que no veo a mi tío.","a":["Hace"]},{"t":"text","q":"¿Desde cuándo vives aquí? = ¿Cuánto tiempo ___ que vives aquí?","a":["hace"]}]},{"title":"연습 4. 문장 완성","instr":"알맞은 현재형을 쓰세요.","rule":"지금도 계속되는 일이므로 현재형을 씁니다.","items":[{"t":"text","q":"Elsa ___ en México desde 1998. (vivir)","a":["vive"]},{"t":"text","q":"Julio ___ a Elsa desde 2002. (conocer)","a":["conoce"]},{"t":"text","q":"Keiko ___ español desde hace tres meses. (estudiar)","a":["estudia"]},{"t":"text","q":"Hace un año que ___ español. (yo, estudiar)","a":["estudio"]},{"t":"text","q":"Hace dos días que no ___ el correo. (yo, mirar)","a":["miro"]},{"t":"text","q":"¿Cuánto tiempo hace que ___ aquí? (tú, trabajar)","a":["trabajas"]}]}]};</script>
