<script>window.UNIT={"id":105,"es":"muy, mucho, muchos, -ísimo…","ko":"정도·양 표현 비교와 -ísimo","theory":"<h2>핵심 정리<\/h2>\n<h3>muy vs mucho<\/h3>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>용법<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>muy, bastante, poco, demasiado<\/b> + 형용사/부사<\/td><td>형용사·부사 수식<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Luisa es muy inteligente.\">Luisa es muy inteligente.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alberto cocina bastante bien.\">Alberto cocina bastante bien.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Jorge es poco estudioso.\">Jorge es poco estudioso.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Habéis llegado demasiado tarde.\">Habéis llegado demasiado tarde.<\/span><\/td><\/tr><tr><td>동사 + <b>mucho, bastante, poco, demasiado<\/b><\/td><td>동사 수식 (불변)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Clara trabaja mucho.\">Clara trabaja mucho.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Consuelo sale bastante.\">Consuelo sale bastante.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ignacio come poco.\">Ignacio come poco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rodri habla demasiado.\">Rodri habla demasiado.<\/span><\/td><\/tr><tr><td><b>mucho/a/os/as, bastante(s), poco/a/os/as, demasiado/a/os/as<\/b> + 명사<\/td><td>명사와 <b>성·수 일치<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Clara trabaja muchas horas.\">Clara trabaja muchas horas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene bastantes amigos.\">Tiene bastantes amigos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ignacio come poca carne.\">Ignacio come poca carne.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Bebes demasiada leche.\">Bebes demasiada leche.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>비교: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan es muy trabajador.\">Juan es muy trabajador.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan trabaja mucho.\">Juan trabaja mucho.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan trabaja muchas horas.\">Juan trabaja muchas horas.<\/span><\/li><\/ul>\n<h3>-ísimo (매우 ~한)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alonso conduce rapidísimo.\">Alonso conduce rapidísimo.<\/span> (muy rápido), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lorena es altísima.\">Lorena es altísima.<\/span> (muy alta), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Este examen es facilísimo!\">¡Este examen es facilísimo!<\/span><\/li><\/ul>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>규칙<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>형용사<\/td><td>끝 모음 삭제 + -ísimo, -a, -os, -as<\/td><td>listo → listísimo, difícil → dificilísimo, mucho → muchísimo<\/td><\/tr><tr><td>부사<\/td><td>끝 모음 삭제 + -ísimo<\/td><td>tarde → tardísimo, mucho → muchísimo<\/td><\/tr><tr><td>-mente 부사<\/td><td>형용사 -ísima + -mente<\/td><td>lento → lentísimamente, fácil → facilísimamente<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>철자·형태가 다른 것: feliz → felicísimo, antiguo → antiquísimo, blanco → blanquísimo, amable → amabilísimo, amigo → amiguísimo, joven → jovencísimo<\/div>","ex":[{"title":"연습 1. muy vs mucho","instr":"알맞은 형태를 고르세요.","rule":"형용사·부사 앞 muy, 동사 뒤 mucho.","items":[{"t":"pick","q":"Luisa es ___ inteligente.","o":["muy","mucho","mucha"],"a":"muy"},{"t":"pick","q":"Clara trabaja ___ .","o":["mucho","muy","mucha"],"a":"mucho"},{"t":"pick","q":"Alberto cocina ___ bien.","o":["bastante","bastantes","bastanta"],"a":"bastante"},{"t":"pick","q":"Habéis llegado ___ tarde.","o":["demasiado","demasiada","demasiados"],"a":"demasiado"},{"t":"pick","q":"Jorge es ___ estudioso. (거의 아님)","o":["poco","pocos","poca"],"a":"poco"},{"t":"pick","q":"Ignacio come ___ .","o":["poco","pocos","poca"],"a":"poco"},{"t":"pick","q":"Rodri habla ___ . (너무)","o":["demasiado","demasiada","demasiados"],"a":"demasiado"},{"t":"pick","q":"Consuelo sale ___ . (꽤)","o":["bastante","bastantes","muy"],"a":"bastante"}]},{"title":"연습 2. 명사 앞 일치","instr":"알맞은 형태를 고르세요.","rule":"명사의 성·수에 일치.","items":[{"t":"pick","q":"Clara trabaja ___ horas.","o":["muchas","mucho","mucha"],"a":"muchas"},{"t":"pick","q":"Tiene ___ amigos. (꽤 많은)","o":["bastantes","bastante","bastanta"],"a":"bastantes"},{"t":"pick","q":"Ignacio come ___ carne.","o":["poca","poco","pocas"],"a":"poca"},{"t":"pick","q":"Bebes ___ leche.","o":["demasiada","demasiado","demasiados"],"a":"demasiada"},{"t":"pick","q":"Hay ___ gente en la calle.","o":["mucha","mucho","muchas"],"a":"mucha"},{"t":"pick","q":"Tengo ___ problemas.","o":["muchos","mucho","muchas"],"a":"muchos"},{"t":"pick","q":"Hay ___ coches en la ciudad.","o":["demasiados","demasiado","demasiada"],"a":"demasiados"},{"t":"pick","q":"No tenemos ___ tiempo.","o":["mucho","mucha","muchos"],"a":"mucho"}]},{"title":"연습 3. -ísimo 만들기","instr":"알맞은 형태를 쓰세요.","rule":"끝 모음 삭제 + -ísimo(-a).","items":[{"t":"text","q":"(listo) Estas chicas son ___ . (복수 여성)","a":["listísimas"]},{"t":"text","q":"(difícil) El examen fue ___ .","a":["dificilísimo"]},{"t":"text","q":"(fácil) ¡Este examen es ___ !","a":["facilísimo"]},{"t":"text","q":"(alto) Lorena es ___ .","a":["altísima"]},{"t":"text","q":"(rápido) Alonso conduce ___ .","a":["rapidísimo"]},{"t":"text","q":"(tarde) Es ___ .","a":["tardísimo"]},{"t":"text","q":"(mucho) Sebastián trabaja ___ .","a":["muchísimo"]},{"t":"text","q":"(lento) Samuel conduce ___ . (lentamente의 -ísimo)","a":["lentísimamente"]},{"t":"text","q":"(mucho) Dunia tiene ___ amigos.","a":["muchísimos"]},{"t":"text","q":"(fácil) Esta ventana se abre ___ . (-mente)","a":["facilísimamente"]}]},{"title":"연습 4. 불규칙 -ísimo","instr":"알맞은 형태를 고르세요.","rule":"feliz → felicísimo, blanco → blanquísimo 등.","items":[{"t":"pick","q":"feliz → ___","o":["felicísimo","felizísimo","felísimo"],"a":"felicísimo"},{"t":"pick","q":"antiguo → ___","o":["antiquísimo","antiguísimo","antigísimo"],"a":"antiquísimo"},{"t":"pick","q":"blanco → ___","o":["blanquísimo","blancísimo","blancoísimo"],"a":"blanquísimo"},{"t":"pick","q":"amable → ___","o":["amabilísimo","amablísimo","amableísimo"],"a":"amabilísimo"},{"t":"pick","q":"amigo → ___","o":["amiguísimo","amigísimo","amicísimo"],"a":"amiguísimo"},{"t":"pick","q":"joven → ___","o":["jovencísimo","jovenísimo","joveníssimo"],"a":"jovencísimo"}]}]};</script>
