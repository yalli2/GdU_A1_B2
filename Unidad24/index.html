<script>window.UNIT={"id":24,"es":"más, menos, tanto como","ko":"명사의 비교","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th>비교<\/th><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>우등 (+)<\/td><td><b>más<\/b> + 명사 (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ernesto tiene más alumnos que Guadalupe.\">Ernesto tiene más alumnos que Guadalupe.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Belén tiene más libros que yo.\">Belén tiene más libros que yo.<\/span><\/td><\/tr><tr><td>열등 (−)<\/td><td><b>menos<\/b> + 명사 (+ que)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Antes había menos coches que ahora.\">Antes había menos coches que ahora.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ahora tengo menos pelo que cuando era joven.\">Ahora tengo menos pelo que cuando era joven.<\/span><\/td><\/tr><tr><td>동등 (=)<\/td><td><b>tanto/a/os/as<\/b> + 명사 (+ <b>como<\/b>)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy no hay tanta gente como ayer.\">Hoy no hay tanta gente como ayer.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No tengo tantos amigos como mi hermana.\">No tengo tantos amigos como mi hermana.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>tanto, tanta, tantos, tantas<\/b>는 뒤의 명사의 성·수에 일치합니다. (más, menos는 변하지 않음)<\/div>\n<ul class=\"rules\"><li>que, como + <b>주격 인칭대명사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rodolfo tiene más vacaciones que tú, pero tú haces más viajes que él.\">Rodolfo tiene más vacaciones que tú, pero tú haces más viajes que él.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes tanta hambre como yo?\">¿Tienes tanta hambre como yo?<\/span><\/li><li>비교 대상이 분명하면 생략: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ahora tengo menos hambre.\">Ahora tengo menos hambre.<\/span> (que antes), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy no hay tanta gente.\">Hoy no hay tanta gente.<\/span> (como ayer)<\/li><li>명사를 생략한 경우: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Yo tengo más.\">Yo tengo más.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Pues yo no tengo tantos.\">Pues yo no tengo tantos.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>긍정문에서 tanto는 항상 como와 함께: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Yo tengo tantos como ella.\">Yo tengo tantos como ella.<\/span><\/div>","ex":[{"title":"연습 1. más / menos / tanto","instr":"알맞은 말을 고르세요.","rule":"더 많다 = más, 더 적다 = menos, 같다 = tanto…como.","items":[{"t":"pick","q":"Belén tiene ___ libros que yo. (더 많이)","o":["más","menos","tantos"],"a":"más"},{"t":"pick","q":"Antes había ___ coches que ahora. (더 적게)","o":["más","menos","tantos"],"a":"menos"},{"t":"pick","q":"Hoy no hay ___ gente como ayer.","o":["tanta","tanto","tantas"],"a":"tanta"},{"t":"pick","q":"No tengo ___ amigos como mi hermana.","o":["tantos","tanto","tantas"],"a":"tantos"},{"t":"pick","q":"Ernesto tiene ___ alumnos que Guadalupe.","o":["más","menos","tantos"],"a":"más"},{"t":"pick","q":"Tengo ___ trabajo como tú. (같은 양)","o":["tanto","tanta","tantos"],"a":"tanto"}]},{"title":"연습 2. tanto의 일치","instr":"알맞은 형태를 쓰세요.","rule":"tanto는 명사의 성·수에 일치: tanto/tanta/tantos/tantas.","items":[{"t":"text","q":"No tengo ___ dinero como tú.","a":["tanto"]},{"t":"text","q":"No hay ___ gente como ayer.","a":["tanta"]},{"t":"text","q":"Tiene ___ amigas como yo.","a":["tantas"]},{"t":"text","q":"Hoy no tengo ___ trabajo como ayer.","a":["tanto"]},{"t":"text","q":"No bebo ___ agua como mi hermano.","a":["tanta"]},{"t":"text","q":"Lee ___ libros como su amiga.","a":["tantos"]}]},{"title":"연습 3. 인칭대명사","instr":"que/como 뒤 알맞은 대명사를 쓰세요.","rule":"que, como 뒤에는 주격 인칭대명사를 씁니다.","items":[{"t":"text","q":"Rodolfo tiene más vacaciones que ___. (너)","a":["tú"]},{"t":"text","q":"Tú haces más viajes que ___. (그)","a":["él"]},{"t":"text","q":"¿Tienes tanta hambre como ___? (나)","a":["yo"]},{"t":"text","q":"Mi hermana tiene tantos amigos como ___. (나)","a":["yo"]},{"t":"text","q":"Ellos tienen más dinero que ___. (우리)","a":["nosotros"]},{"t":"text","q":"No tengo tantos libros como ___. (그녀)","a":["ella"]}]},{"title":"연습 4. 생략과 대답","instr":"알맞은 말을 고르세요.","rule":"명사를 반복하지 않고 más/menos/tantos 등만 쓸 수 있습니다.","items":[{"t":"pick","q":"Sonia tiene cien CD. — Yo tengo ___. (더 많이)","o":["más","tanto","menos"],"a":"más"},{"t":"pick","q":"Sonia tiene cien CD. — Pues yo no tengo ___.","o":["tantos","tanto","tantas"],"a":"tantos"},{"t":"pick","q":"Elisa tiene una gran colección. — Yo tengo ___ como ella.","o":["tantos","tanto","tantas"],"a":"tantos"},{"t":"pick","q":"Ahora tengo ___ hambre. (이전보다 덜)","o":["menos","más","tanta"],"a":"menos"}]}]};</script>
