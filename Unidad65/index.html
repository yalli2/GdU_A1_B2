<script>window.UNIT={"id":65,"es":"estaba trabajando / trabajé","ko":"estaba + 현재분사","theory":"<h2>핵심 정리<\/h2>\n<h3>형태: estar 불완료과거 + 현재분사<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>estar<\/th><th>현재분사<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>estaba<\/td><td>trabajando<\/td><\/tr><tr><td>tú<\/td><td>estabas<\/td><td>comiendo<\/td><\/tr><tr><td>usted, él, ella<\/td><td>estaba<\/td><td>viviendo<\/td><\/tr><tr><td>nosotros/as<\/td><td>estábamos<\/td><td>leyendo<\/td><\/tr><tr><td>vosotros/as<\/td><td>estabais<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>estaban<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>과거 특정 시점에 진행 중이던 행위<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—Anoche te llamé a las ocho. ¿Dónde estabas? —Estaba en el jardín. Estaba regando los rosales.\">—Anoche te llamé a las ocho. ¿Dónde estabas? —Estaba en el jardín. Estaba regando los rosales.<\/span><\/li><li>사건의 <b>배경·상황<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando llegó el presidente, yo estaba aparcando y Mar y Luis estaban cruzando la calle.\">Cuando llegó el presidente, yo estaba aparcando y Mar y Luis estaban cruzando la calle.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando entró el jefe, Bruno estaba leyendo el periódico.\">Cuando entró el jefe, Bruno estaba leyendo el periódico.<\/span><\/li><\/ul>\n<h3>비교<\/h3>\n<div class=\"tw\"><table><thead><tr><th>estaba + 현재분사<\/th><th>단순과거<\/th><\/tr><\/thead><tbody><tr><td>진행 중인 <b>긴<\/b> 행위 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estábamos comiendo…\">Estábamos comiendo…<\/span><\/td><td>그것을 끊는 <b>짧은<\/b> 행위 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"…cuando llegaron los amigos de Ana.\">…cuando llegaron los amigos de Ana.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><b>연속된 행위<\/b>(하나가 끝나고 다음)는 단순과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Comimos cuando llegaron los amigos de Ana.\">Comimos cuando llegaron los amigos de Ana.<\/span> (도착한 뒤 먹기 시작)<\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>다음 동사는 보통 estaba + 현재분사를 쓰지 않고 불완료과거 그대로: comprender, entender, saber, querer, necesitar, amar, preferir, odiar, parecer, tener, llevar, ir, venir. — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tenía algo de fiebre cuando me llamaste.\">Tenía algo de fiebre cuando me llamaste.<\/span> (✗ Estaba teniendo)<\/div>","ex":[{"title":"연습 1. 형태 만들기","instr":"괄호의 동사를 estaba + 현재분사로 쓰세요.","rule":"estaba/estabas/… + -ando/-iendo.","items":[{"t":"text","q":"(yo, regar) ___ los rosales.","a":["estaba regando"]},{"t":"text","q":"(tú, leer) ___ el periódico.","a":["estabas leyendo"]},{"t":"text","q":"(él, aparcar) ___ el coche.","a":["estaba aparcando"]},{"t":"text","q":"(nosotros, comer) ___ en casa.","a":["estábamos comiendo"]},{"t":"text","q":"(vosotros, trabajar) ___ en el jardín.","a":["estabais trabajando"]},{"t":"text","q":"(ellos, cruzar) ___ la calle.","a":["estaban cruzando"]},{"t":"text","q":"(ella, dormir) ___ la siesta.","a":["estaba durmiendo"]},{"t":"text","q":"(yo, escribir) ___ una carta.","a":["estaba escribiendo"]}]},{"title":"연습 2. 진행 vs 사건","instr":"알맞은 형태를 고르세요.","rule":"진행 중: estaba + gerundio, 끼어든 사건: indefinido.","items":[{"t":"pick","q":"Cuando entró el jefe, Bruno ___ el periódico.","o":["estaba leyendo","leyó","ha leído"],"a":"estaba leyendo"},{"t":"pick","q":"Estábamos comiendo cuando ___ los amigos de Ana.","o":["llegaron","llegaban","estaban llegando"],"a":"llegaron"},{"t":"pick","q":"Cuando llegó el presidente, yo ___ .","o":["estaba aparcando","aparqué","he aparcado"],"a":"estaba aparcando"},{"t":"pick","q":"Anoche te llamé y ___ en el jardín.","o":["estaba","estuve","he estado"],"a":"estaba"},{"t":"pick","q":"Cuando me llamaste, ___ la cena.","o":["estaba preparando","preparé","he preparado"],"a":"estaba preparando"},{"t":"pick","q":"Mientras
