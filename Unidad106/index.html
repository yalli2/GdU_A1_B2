<script>window.UNIT={"id":106,"es":"bien, fácilmente…","ko":"양태 부사","theory":"<h2>핵심 정리<\/h2>\n<h3>형성: 형용사 여성 단수 + -mente<\/h3>\n<div class=\"tw\"><table><thead><tr><th>형용사<\/th><th>여성 단수<\/th><th>부사<\/th><\/tr><\/thead><tbody><tr><td>maravilloso<\/td><td>maravillosa<\/td><td>maravillosamente<\/td><\/tr><tr><td>fácil<\/td><td>fácil<\/td><td>fácilmente<\/td><\/tr><tr><td>prudente<\/td><td>prudente<\/td><td>prudentemente<\/td><\/tr><tr><td>perfecto<\/td><td>perfecta<\/td><td>perfectamente<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Gema conduce prudentemente.\">Gema conduce prudentemente.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hans habla español perfectamente.\">Hans habla español perfectamente.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>예외: bueno → <b>bien<\/b>, malo → <b>mal<\/b>, deprisa, despacio<\/div>\n<h3>형용사와 같은 형태인 부사<\/h3>\n<div class=\"tw\"><table><thead><tr><th>형용사<\/th><th>부사<\/th><\/tr><\/thead><tbody><tr><td>alto, bajo (소리)<\/td><td>alto, bajo<\/td><\/tr><tr><td>rápido<\/td><td>rápido, rápidamente<\/td><\/tr><tr><td>lento<\/td><td>lento, lentamente<\/td><\/tr><tr><td>claro<\/td><td>claro, claramente<\/td><\/tr><tr><td>fuerte<\/td><td>fuerte, fuertemente<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>동사와 함께 형용사형 부사: hablar, cantar + alto, bajo, claro — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Habla alto, por favor.\">Habla alto, por favor.<\/span>; explicar + claro — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis profesores explican claro.\">Mis profesores explican claro.<\/span>; andar, ir, correr, conducir, trabajar + rápido, lento — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Julia conduce muy rápido.\">Julia conduce muy rápido.<\/span>; golpear, empujar, tirar + fuerte — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Venga, empuja fuerte!\">¡Venga, empuja fuerte!<\/span><\/li><\/ul>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>하지만 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se veía claramente la torre de la iglesia.\">Se veía claramente la torre de la iglesia.<\/span> (-mente)<\/div>\n<ul class=\"rules\"><li><b>así<\/b> = de este modo: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hazlo así; es más fácil.\">Hazlo así; es más fácil.<\/span><\/li><li>양태 부사는 보통 동사 뒤: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alba vive alegremente.\">Alba vive alegremente.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No vayas deprisa.\">No vayas deprisa.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>-mente 부사가 둘 이상이면 <b>마지막에만<\/b> -mente: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo hizo rápida y eficazmente.\">Lo hizo rápida y eficazmente.<\/span> (✗ rápidamente y eficazmente)<\/div>","ex":[{"title":"연습 1. -mente 만들기","instr":"알맞은 부사를 쓰세요.","rule":"형용사 여성 단수 + -mente.","items":[{"t":"text","q":"(prudente) Gema conduce ___ .","a":["prudentemente"]},{"t":"text","q":"(perfecto) Hans habla español ___ .","a":["perfectamente"]},{"t":"text","q":"(fácil) Lo hizo ___ .","a":["fácilmente"]},{"t":"text","q":"(maravilloso) Canta ___ .","a":["maravillosamente"]},{"t":"text","q":"(alegre) Alba vive ___ .","a":["alegremente"]},{"t":"text","q":"(rápido) Lo hizo ___ .","a":["rápidamente"]},{"t":"text","q":"(claro) Se veía ___ la torre.","a":["claramente"]},{"t":"text","q":"(tranquilo) Hablaron ___ .","a":["tranquilamente"]},{"t":"text","q":"(lento) Anda ___ .","a":["lentamente"]},{"t":"text","q":"(cuidadoso) Trabaja ___ .","a":["cuidadosamente"]}]},{"title":"연습 2. bien / mal / deprisa / despacio","instr":"알맞은 부사를 고르세요.","rule":"bueno → bien, malo → mal.","items":[{"t":"pick","q":"Serafín toca el piano muy ___ .","o":["bien","bueno","buenamente"],"a":"bien"},{"t":"pick","q":"Me siento ___ . Tengo fiebre.","o":["mal","malo","malamente"],"a":"mal"},{"t":"pick","q":"Habla más ___ , por favor. No te entiendo. (천천히)","o":["despacio","lento","despacios"],"a":"despacio"},{"t":"pick","q":"No vayas ___ . Llegaremos tarde. (서둘러)","o":["deprisa","rápidamente","prisa"],"a":"deprisa"},{"t":"pick","q":"Hans habla español muy ___ .","o":["bien","bueno","buena"],"a":"bien"},{"t":"pick","q":"Ayer dormí ___ . Estoy cansada.","o":["mal","malo","mala"],"a":"mal"},{"t":"pick","q":"Come ___ , no tenemos prisa.","o":["despacio","deprisa","rápido"],"a":"despacio"},{"t":"pick","q":"Esto está muy ___ hecho.","o":["mal","malo","mala"],"a":"mal"}]},{"title":"연습 3. 형용사형 부사","instr":"알맞은 형태를 고르세요.","rule":"hablar + alto, bajo, claro / conducir + rápido / empujar + fuerte.","items":[{"t":"pick","q":"Habla ___ , por favor. No te oigo.","o":["alto","altamente","altos"],"a":"alto"},{"t":"pick","q":"Mis profesores explican ___ .","o":["claro","claros","clara"],"a":"claro"},{"t":"pick","q":"Julia conduce muy ___ .","o":["rápido","rápida","rápidos"],"a":"rápido"},{"t":"pick","q":"¡Venga, empuja ___ !","o":["fuerte","fuertes","fuerta"],"a":"fuerte"},{"t":"pick","q":"Habla ___ , el niño duerme.","o":["bajo","bajamente","bajos"],"a":"bajo"},{"t":"pick","q":"Los coches corren muy ___ .","o":["rápido","rápidos","rápidas"],"a":"rápido"},{"t":"pick","q":"Hazlo ___ ; es más fácil.","o":["así","ansí","así que"],"a":"así"},{"t":"pick","q":"¡Ven ___ ! Te necesito. (빨리)","o":["rápido","rápidos","rápida"],"a":"rápido"}]},{"title":"연습 4. 두 개의 -mente 부사","instr":"알맞은 형태를 쓰세요.","rule":"마지막 부사에만 -mente, 앞의 형용사는 여성 단수형.","items":[{"t":"text","q":"Lo hizo (rápido) ___ y eficazmente.","a":["rápida"]},{"t":"text","q":"Habló (claro) ___ y sinceramente.","a":["clara"]},{"t":"text","q":"Respondió (tranquilo) ___ y educadamente.","a":["tranquila"]},{"t":"text","q":"Conduce (lento) ___ y prudentemente.","a":["lenta"]},{"t":"text","q":"Lo explicó (breve) ___ y claramente.","a":["breve"]},{"t":"text","q":"Trabaja (cuidadoso) ___ y rápidamente.","a":["cuidadosa"]}]}]};</script>
