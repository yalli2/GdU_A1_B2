<script>window.UNIT={"id":60,"es":"he trabajado","ko":"현재완료 (1)","theory":"<h2>핵심 정리<\/h2>\n<h3>형태: haber 현재 + 과거분사<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>haber<\/th><th>과거분사 예<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>he<\/td><td>trabajado<\/td><\/tr><tr><td>tú<\/td><td>has<\/td><td>trabajado<\/td><\/tr><tr><td>usted, él, ella<\/td><td>ha<\/td><td>comido<\/td><\/tr><tr><td>nosotros/as<\/td><td>hemos<\/td><td>comido<\/td><\/tr><tr><td>vosotros/as<\/td><td>habéis<\/td><td>vivido<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>han<\/td><td>vivido<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>과거분사 형태는 <b>절대 변하지 않습니다<\/b>(성·수 일치 없음): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy he comido paella.\">Hoy he comido paella.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nosotras hemos comido pescado.\">Nosotras hemos comido pescado.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>haber와 과거분사는 <b>항상 붙어 있습니다<\/b>. 재귀대명사는 haber 앞에: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me he levantado tarde.\">Me he levantado tarde.<\/span> (✗ He me levantado)<\/div>\n<h3>규칙 과거분사와 대표 불규칙<\/h3>\n<div class=\"tw\"><table><thead><tr><th>동사 유형<\/th><th>과거분사<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>-ar → -ado<\/td><td>trabajar → trabajado<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He trabajado mucho.\">He trabajado mucho.<\/span><\/td><\/tr><tr><td>-er/-ir → -ido<\/td><td>comer → comido, vivir → vivido<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hemos vivido aquí.\">Hemos vivido aquí.<\/span><\/td><\/tr><tr><td>불규칙<\/td><td>hacer → hecho, ver → visto, decir → dicho, escribir → escrito, poner → puesto, abrir → abierto, volver → vuelto, romper → roto<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He hecho la compra.\">He hecho la compra.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>언제 쓰나?<\/h3>\n<ul class=\"rules\"><li><b>현재까지 이어지는 시간 안<\/b>의 일: hoy, este año, este mes, esta mañana/tarde/semana, últimamente<\/li><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy me he levantado tarde.\">Hoy me he levantado tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lara ha salido todas las noches esta semana.\">Lara ha salido todas las noches esta semana.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este mes hemos ido al cine tres veces.\">Este mes hemos ido al cine tres veces.<\/span><\/li><li><b>방금 전 과거<\/b>: hace poco, hace un momento, hace un rato — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He estado con Carlos hace un momento.\">He estado con Carlos hace un momento.<\/span><\/li><li><b>최근 뉴스<\/b> 전달: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Qué ha pasado? —Ha dimitido el presidente.\">—¿Qué ha pasado? —Ha dimitido el presidente.<\/span><\/li><\/ul>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>중남미와 스페인 일부 지역에서는 현재완료 대신 단순과거(Comí)를 쓰기도 합니다.<\/div>","ex":[{"title":"연습 1. haber 활용","instr":"haber의 알맞은 형태를 고르세요.","rule":"yo he, tú has, él ha, nosotros hemos, vosotros habéis, ellos han.","items":[{"t":"pick","q":"Yo ___ trabajado mucho hoy.","o":["he","has","ha"],"a":"he"},{"t":"pick","q":"Tú ___ comido paella.","o":["has","ha","han"],"a":"has"},{"t":"pick","q":"Ana ___ vivido en Cuba.","o":["ha","he","hemos"],"a":"ha"},{"t":"pick","q":"Nosotros ___ estudiado español.","o":["hemos","habéis","han"],"a":"hemos"},{"t":"pick","q":"Vosotros ___ hablado con él.","o":["habéis","hemos","han"],"a":"habéis"},{"t":"pick","q":"Ellos ___ llegado tarde.","o":["han","ha","hemos"],"a":"han"},{"t":"pick","q":"Usted ___ cantado muy bien.","o":["ha","han","has"],"a":"ha"},{"t":"pick","q":"Mis padres ___ viajado a Perú.","o":["han","ha","hemos"],"a":"han"}]},{"title":"연습 2. 과거분사 쓰기","instr":"알맞은 과거분사를 쓰세요.","rule":"-ar → -ado, -er/-ir → -ido. 불규칙: hecho, visto, dicho, escrito, puesto, abierto, vuelto, roto.","items":[{"t":"text","q":"(hablar) Hoy he ___ con Marta.","a":["hablado"]},{"t":"text","q":"(comer) Hemos ___ en un restaurante.","a":["comido"]},{"t":"text","q":"(vivir) Siempre han ___ en Madrid.","a":["vivido"]},{"t":"text","q":"(hacer) Esta mañana he ___ la compra.","a":["hecho"]},{"t":"text","q":"(ver) ¿Has ___ la película?","a":["visto"]},{"t":"text","q":"(escribir) Ana ha ___ una carta.","a":["escrito"]},{"t":"text","q":"(abrir) Alguien ha ___ la ventana.","a":["abierto"]},{"t":"text","q":"(romper) Los niños han ___ el vaso.","a":["roto"]},{"t":"text","q":"(decir) Mi madre me ha ___ la verdad.","a":["dicho"]},{"t":"text","q":"(volver) Ya hemos ___ de vacaciones.","a":["vuelto"]}]},{"title":"연습 3. 현재완료 만들기","instr":"괄호의 동사를 현재완료로 쓰세요.","rule":"haber 현재 + 과거분사.","items":[{"t":"text","q":"Hoy (yo, levantarse) ___ temprano.","a":["me he levantado"]},{"t":"text","q":"Esta semana (nosotros, ir) ___ dos veces al cine.","a":["hemos ido"]},{"t":"text","q":"Este año (hacer) ___ mucho frío.","a":["ha hecho"]},{"t":"text","q":"(tú, tener) ___ un día muy duro.","a":["has tenido"]},{"t":"text","q":"Esta mañana (ellos, dar) ___ cuatro clases.","a":["han dado"]},{"t":"text","q":"Últimamente (yo, leer) ___ muchos libros.","a":["he leído"]},{"t":"text","q":"Este mes Laura (salir) ___ todas las noches.","a":["ha salido"]},{"t":"text","q":"(vosotros, estar) ___ con Carlos hace un rato.","a":["habéis estado"]},{"t":"text","q":"Hoy no (yo, comer) ___ nada.","a":["he comido"]},{"t":"text","q":"Este verano (nosotros, viajar) ___ mucho.","a":["hemos viajado"]}]},{"title":"연습 4. 현재완료를 쓰는 때","instr":"알맞은 시간 표현을 고르세요.","rule":"현재완료는 hoy, esta semana, este año, hace un rato 등과 함께 씁니다.","items":[{"t":"pick","q":"___ me he levantado tarde.","o":["Hoy","Ayer","El año pasado"],"a":"Hoy"},{"t":"pick","q":"Esta ___ hemos ido al cine tres veces.","o":["semana","semana pasada","hace una semana"],"a":"semana"},{"t":"pick","q":"___ ha dimitido el presidente. (방금 뉴스)","o":["Hace un momento","Hace diez años","El mes pasado"],"a":"Hace un momento"},{"t":"pick","q":"He estado con Carlos hace ___.","o":["un rato","tres años","un mes"],"a":"un rato"},{"t":"pick","q":"___ año no ha hecho mucho frío.","o":["Este","El","Aquel"],"a":"Este"},{"t":"pick","q":"___ hemos comido paella. (오늘 아침)","o":["Esta mañana","Ayer por la mañana","La semana pasada"],"a":"Esta mañana"}]}]};</script>
