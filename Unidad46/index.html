<script>window.UNIT={"id":46,"es":"Hay un vaso en la mesa","ko":"비인칭 haber","theory":"<h2>핵심 정리<\/h2>\n<p><b>hay<\/b>(haber의 비인칭 현재)는 사람·사물의 <b>존재<\/b>를 말합니다. 단수·복수에 상관없이 <b>hay<\/b>를 씁니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>hay + <b>un/una<\/b> + 가산 단수 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un vaso en la mesa.\">Hay un vaso en la mesa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un pájaro en el balcón.\">Hay un pájaro en el balcón.<\/span><\/td><\/tr><tr><td>hay + uno/una<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Hay un hotel por aquí? — Hay uno en la calle Arenal.\">¿Hay un hotel por aquí? — Hay uno en la calle Arenal.<\/span><\/td><\/tr><tr><td>hay + (unos/unas, 숫자, mucho/poco) + 가산 복수 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay cinco alumnos en clase.\">Hay cinco alumnos en clase.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En mi calle hay muchos árboles.\">En mi calle hay muchos árboles.<\/span><\/td><\/tr><tr><td>¿<b>Cuántos/as<\/b> + 복수 명사 + hay?<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuántos chicos hay en tu clase? — Hay nueve.\">¿Cuántos chicos hay en tu clase? — Hay nueve.<\/span><\/td><\/tr><tr><td>hay + 불가산 명사 (mucho, poco)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay agua en el suelo.\">Hay agua en el suelo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No hay mucha mantequilla.\">No hay mucha mantequilla.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Hay pan? — No hay mucho.\">¿Hay pan? — No hay mucho.<\/span><\/td><\/tr><tr><td>¿Cuánto/a + 불가산 + hay?<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuánta leche hay en la nevera?\">¿Cuánta leche hay en la nevera?<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>부정<\/h3>\n<ul class=\"rules\"><li>단수: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No hay ningún hotel en esta calle.\">No hay ningún hotel en esta calle.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En Santa Marta no hay aeropuerto.\">En Santa Marta no hay aeropuerto.<\/span><\/li><li>복수: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En mi calle no hay árboles.\">En mi calle no hay árboles.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En mi barrio no hay muchos bares.\">En mi barrio no hay muchos bares.<\/span><\/li><li>존재를 묻기: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Hay una frutería por aquí?\">¿Hay una frutería por aquí?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde hay un estanco?\">¿Dónde hay un estanco?<\/span> (그런 곳이 있는지 모를 때)<\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>hay 뒤에는 <b>정관사·소유사를 쓰지 않습니다.<\/b> (Hay el libro ✗) → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay un libro en la mesa.\">Hay un libro en la mesa.<\/span><\/div>","ex":[{"title":"연습 1. hay + 명사","instr":"알맞은 말을 고르세요.","rule":"hay + 부정관사/수량 표현/무관사. 정관사는 쓰지 않습니다.","items":[{"t":"pick","q":"Hay ___ vaso en la mesa.","o":["un","el","su"],"a":"un"},{"t":"pick","q":"Hay ___ pájaro en el balcón.","o":["un","el","mi"],"a":"un"},{"t":"pick","q":"En mi calle hay muchos ___.","o":["árboles","árbol","el árbol"],"a":"árboles"},{"t":"pick","q":"¿Hay ___ hotel por aquí?","o":["un","el","su"],"a":"un"},{"t":"pick","q":"¿Hay ___ farmacia cerca?","o":["una","la","mi"],"a":"una"},{"t":"pick","q":"En mi barrio hay ___ bares.","o":["muchos","mucho","el"],"a":"muchos"}]},{"title":"연습 2. ¿Cuántos…? 와 대답","instr":"알맞은 말을 고르세요.","rule":"가산 복수: cuántos/cuántas. 불가산: cuánto/cuánta.","items":[{"t":"pick","q":"¿___ chicos hay en tu clase?","o":["Cuántos","Cuánto","Cuántas"],"a":"Cuántos"},{"t":"pick","q":"¿___ leche hay en la nevera?","o":["Cuánta","Cuánto","Cuántas"],"a":"Cuánta"},{"t":"pick","q":"¿___ cines hay en tu barrio?","o":["Cuántos","Cuántas","Cuánto"],"a":"Cuántos"},{"t":"pick","q":"¿___ agua hay?","o":["Cuánta","Cuántas","Cuántos"],"a":"Cuánta"},{"t":"pick","q":"¿Hay muchos cines en tu barrio? — Hay ___. (3개)","o":["tres","tres de","los tres"],"a":"tres"},{"t":"pick","q":"¿Cuántos chicos hay? — Hay ___. (9명)","o":["nueve","nuevo","noventa"],"a":"nueve"}]},{"title":"연습 3. 부정문","instr":"알맞은 말을 고르세요.","rule":"no hay (+ ningún/ninguna) + 가산 단수, no hay (+ mucho) + 불가산·복수.","items":[{"t":"pick","q":"No hay ___ hotel en esta calle.","o":["ningún","ninguno","nadie"],"a":"ningún"},{"t":"pick","q":"En mi calle no hay ___. (나무들)","o":["árboles","ningún árbol","mucho árbol"],"a":"árboles"},{"t":"pick","q":"No hay ___ mantequilla. (많지 않음)","o":["mucha","mucho","muchas"],"a":"mucha"},{"t":"pick","q":"En Santa Marta no hay ___. (공항)","o":["aeropuerto","el aeropuerto","aeropuertos"],"a":"aeropuerto"},{"t":"pick","q":"No hay ___ mesa libre. (한 개도)","o":["ninguna","ningún","nada"],"a":"ninguna"},{"t":"pick","q":"No hay ___ leche.","o":["mucha","muchas","mucho"],"a":"mucha"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 말을 쓰세요.","rule":"비인칭 haber 현재는 hay(단·복수 공통).","items":[{"t":"text","q":"Aquí ___ cinco alumnos.","a":["hay"]},{"t":"text","q":"En esta calle no ___ ningún hotel.","a":["hay"]},{"t":"text","q":"¿___ una frutería por aquí?","a":["Hay"]},{"t":"text","q":"¿Dónde ___ un buzón?","a":["hay"]},{"t":"text","q":"¿___ pan en casa? — Sí, hay dos barras.","a":["Hay"]},{"t":"text","q":"En mi clase ___ veinte chicos.","a":["hay"]}]}]};</script>
