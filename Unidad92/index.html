<script>window.UNIT={"id":92,"es":"Si encontrara trabajo, me casaría","ko":"조건문 (2): 가능성이 낮은·가상의 조건","theory":"<h2>핵심 정리<\/h2>\n<h3>구조: Si + 접속법 불완료과거 → 가능법 (condicional simple)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>조건<\/th><th>귀결<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>si + imperfecto de subjuntivo<\/td><td>condicional simple<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si Alicia me dejara el coche, te llevaría a casa.\">Si Alicia me dejara el coche, te llevaría a casa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si Alberto fuera más alto, sería un buen jugador de baloncesto.\">Si Alberto fuera más alto, sería un buen jugador de baloncesto.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>두 가지 용법<\/h3>\n<ul class=\"rules\"><li><b>실제로는 가능하지만 가능성이 낮음<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si encontrara trabajo, me casaría.\">Si encontrara trabajo, me casaría.<\/span> (구할 수도 있지만 어렵다고 생각함)<\/li><li><b>상상·비현실<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si tuviéramos dinero, iríamos al Caribe.\">Si tuviéramos dinero, iríamos al Caribe.<\/span> (돈이 없다 → 가정)<\/li><\/ul>\n<h3>비교<\/h3>\n<div class=\"tw\"><table><thead><tr><th>가능하고 실제적 (si + 현재)<\/th><th>가능성이 낮음 / 가상 (si + 불완료과거 접속법)<\/th><\/tr><\/thead><tbody><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si viene Marga, nos lo pasaremos bien.\">Si viene Marga, nos lo pasaremos bien.<\/span> (올 수도 있다고 생각)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si viniera Marga, nos lo pasaríamos bien.\">Si viniera Marga, nos lo pasaríamos bien.<\/span> (올 가능성이 매우 낮다)<\/td><\/tr><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si hace buen tiempo mañana, podemos dar un paseo.\">Si hace buen tiempo mañana, podemos dar un paseo.<\/span> (내일 날씨가 좋을 수 있음)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si hiciera buen tiempo, podríamos dar un paseo.\">Si hiciera buen tiempo, podríamos dar un paseo.<\/span> (지금 날씨가 나쁨 — 상상)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>si 뒤에는 <b>가능법을 쓰지 않습니다<\/b>. (✗ Si tendría dinero…) → Si tuviera dinero, …<\/div>","ex":[{"title":"연습 1. 조건절 동사","instr":"알맞은 형태를 고르세요.","rule":"si + 접속법 불완료과거.","items":[{"t":"pick","q":"Si ___ trabajo, me casaría. (encontrar, yo)","o":["encontrara","encuentro","encontraría"],"a":"encontrara"},{"t":"pick","q":"Si ___ dinero, iríamos al Caribe. (tener, nosotros)","o":["tuviéramos","tenemos","tendríamos"],"a":"tuviéramos"},{"t":"pick","q":"Si Alberto ___ más alto, sería un buen jugador. (ser)","o":["fuera","es","sería"],"a":"fuera"},{"t":"pick","q":"Si Alicia me ___ el coche, te llevaría a casa. (dejar)","o":["dejara","deja","dejaría"],"a":"dejara"},{"t":"pick","q":"Si ___ buen tiempo, podríamos dar un paseo. (hacer)","o":["hiciera","hace","haría"],"a":"hiciera"},{"t":"pick","q":"Si ___ Marga, nos lo pasaríamos bien. (venir)","o":["viniera","viene","vendría"],"a":"viniera"},{"t":"pick","q":"Si yo ___ rico, viajaría por el mundo. (ser)","o":["fuera","soy","sería"],"a":"fuera"},{"t":"pick","q":"Si ___ tiempo, iría contigo. (tener, yo)","o":["tuviera","tengo","tendría"],"a":"tuviera"}]},{"title":"연습 2. 귀결절 쓰기","instr":"괄호의 동사를 가능법으로 쓰세요.","rule":"원형 + ía, ías, ía, íamos, íais, ían (불규칙 어간 주의).","items":[{"t":"text","q":"Si encontrara trabajo, (yo, casarse) ___ .","a":["me casaría"]},{"t":"text","q":"Si tuviéramos dinero, (nosotros, ir) ___ al Caribe.","a":["iríamos"]},{"t":"text","q":"Si Alberto fuera más alto, (ser) ___ un buen jugador.","a":["sería"]},{"t":"text","q":"Si Alicia me dejara el coche, te (llevar) ___ a casa.","a":["llevaría"]},{"t":"text","q":"Si hiciera buen tiempo, (nosotros, poder) ___ dar un paseo.","a":["podríamos"]},{"t":"text","q":"Si viniera Marga, nos lo (pasar) ___ bien.","a":["pasaríamos"]},{"t":"text","q":"Si yo fuera tú, (hacer) ___ otra cosa.","a":["haría"]},{"t":"text","q":"Si tuviera tiempo, (yo, salir) ___ más.","a":["saldría"]}]},{"title":"연습 3. 실제적 vs 가상","instr":"알맞은 형태를 고르세요.","rule":"가능성이 높음 = 현재, 낮음·가상 = 불완료과거.","items":[{"t":"pick","q":"Si hace buen tiempo mañana, ___ un paseo. (dar, nosotros)","o":["damos","daríamos","diéramos"],"a":"damos"},{"t":"pick","q":"Si hiciera buen tiempo, ___ un paseo. (dar, nosotros)","o":["daríamos","damos","daremos"],"a":"daríamos"},{"t":"pick","q":"Si viene Marga, nos lo ___ bien. (pasar)","o":["pasaremos","pasaríamos","pasáramos"],"a":"pasaremos"},{"t":"pick","q":"Si viniera Marga, nos lo ___ bien. (pasar)","o":["pasaríamos","pasaremos","pasamos"],"a":"pasaríamos"},{"t":"pick","q":"Si ___ mucho dinero, compraría una casa. (tener, yo)","o":["tuviera","tengo","tendría"],"a":"tuviera"},{"t":"pick","q":"Si ___ mucho dinero, compraré una casa. (tener, yo)","o":["tengo","tuviera","tendría"],"a":"tengo"}]},{"title":"연습 4. 문장 완성","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"불규칙 접속법 불완료과거 어간 확인.","items":[{"t":"text","q":"Si (yo, saber) ___ la respuesta, te la diría.","a":["supiera"]},{"t":"text","q":"Si (nosotros, poder) ___ , viajaríamos más.","a":["pudiéramos"]},{"t":"text","q":"Si ellos (venir) ___ , la fiesta sería mejor.","a":["vinieran"]},{"t":"text","q":"Si (tú, querer) ___ , podríamos ir.","a":["quisieras"]},{"t":"text","q":"Si (hacer, ella) ___ más deporte, estaría más sana.","a":["hiciera"]},{"t":"text","q":"Si (yo, estar) ___ en tu lugar, hablaría con él.","a":["estuviera"]},{"t":"text","q":"Si (tú, decir) ___ la verdad, todo sería más fácil.","a":["dijeras"]},{"t":"text","q":"Si (haber) ___ más tiempo, lo haríamos.","a":["hubiera"]}]}]};</script>
