<script>window.UNIT={"id":33,"es":"¡qué!, ¡cuánto!, ¡cómo!…","ko":"감탄문","theory":"<h2>핵심 정리<\/h2>\n<p>감탄문은 놀람, 감탄, 불만 등의 감정을 나타냅니다. 앞뒤에 ¡ ! 를 쓰고, 의문사처럼 <b>악센트<\/b>가 있습니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>qué<\/b> + 형용사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué alta es Linda!\">¡Qué alta es Linda!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué frío hace!\">¡Qué frío hace!<\/span><\/td><\/tr><tr><td><b>qué<\/b> + 부사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué bien conduces!\">¡Qué bien conduces!<\/span><\/td><\/tr><tr><td><b>qué<\/b> + 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué suerte tiene Pablo!\">¡Qué suerte tiene Pablo!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué alegría!\">¡Qué alegría!<\/span><\/td><\/tr><tr><td><b>qué<\/b> + 명사 + <b>tan / más<\/b> + 형용사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué pendientes tan caros!\">¡Qué pendientes tan caros!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué casa más bonita tiene Lola!\">¡Qué casa más bonita tiene Lola!<\/span><\/td><\/tr><tr><td><b>cuánto/a/os/as<\/b> + 명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Cuánto dinero se gasta Pili!\">¡Cuánto dinero se gasta Pili!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Cuántos sellos tienes!\">¡Cuántos sellos tienes!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Cuánta gente hay!\">¡Cuánta gente hay!<\/span><\/td><\/tr><tr><td><b>cuánto<\/b> + 동사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Cuánto trabaja Lidia!\">¡Cuánto trabaja Lidia!<\/span><\/td><\/tr><tr><td><b>cómo<\/b> + 동사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Cómo canta Ángela!\">¡Cómo canta Ángela!<\/spa ,{"t":"pick","q":"¡___ ropa tienes!","o":["Cuánta","Cuánto","Cuántas"],"a":"Cuánta"}]},{"title":"연습 3. cómo + 동사","instr":"알맞은 말을 쓰세요.","rule":"cómo + 동사: 방식이나 정도에 대한 감탄.","items":[{"t":"text","q":"¡___ canta Ángela! Tiene una voz preciosa.","a":["Cómo"]},{"t":"text","q":"¡___ come! Se nota que tiene hambre.","a":["Cómo"]},{"t":"text","q":"¡___ nieva!","a":["Cómo"]},{"t":"text","q":"¡___ baila! Parece profesional.","a":["Cómo"]},{"t":"text","q":"¡___ ríe esa chica!","a":["Cómo"]},{"t":"text","q":"¡___ llueve!","a":["Cómo"]}]},{"title":"연습 4. 문장 완성","instr":"알맞은 말을 고르세요.","rule":"qué + 형용사, cuánto + 명사/동사, cómo + 동사.","items":[{"t":"pick","q":"¡___ casa más bonita tiene Lola!","o":["Qué","Cuánta","Cómo"],"a":"Qué"},{"t":"pick","q":"¡___ bonito!","o":["Qué","Cuánto","Cómo"],"a":"Qué"},{"t":"pick","q":"¡___ gente!","o":["Cuánta","Qué","Cómo"],"a":"Cuánta"},{"t":"pick","q":"¡___ lloras!","o":["Cómo","Qué","Cuántas"],"a":"Cómo"},{"t":"pick","q":"¡___ trabajos!","o":["Cuántos","Qué","Cómo"],"a":"Cuántos"},{"t":"pick","q":"¡___ grande es!","o":["Qué","Cuánto","Cómo"],"a":"Qué"}]}]};</script>
