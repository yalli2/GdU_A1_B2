:"연습 2. 활용 쓰기","instr":"알맞은 형태를 쓰세요.","rule":"yo 외에는 대부분 규칙. (악센트 주의)","items":[{"t":"text","q":"(tú, hacer) ___ la cena.","a":["haces"]},{"t":"text","q":"(él, saber) ___ la respuesta.","a":["sabe"]},{"t":"text","q":"(nosotros, salir) ___ a las ocho.","a":["salimos"]},{"t":"text","q":"(vosotros, poner) ___ la mesa.","a":["ponéis"]},{"t":"text","q":"(ellos, traer) ___ el pan.","a":["traen"]},{"t":"text","q":"(tú, conocer) ___ a Berta.","a":["conoces"]},{"t":"text","q":"(ella, conducir) ___ muy bien.","a":["conduce"]},{"t":"text","q":"(nosotros, dar) ___ una vuelta.","a":["damos"]}]},{"title":"연습 3. ir","instr":"ir의 알맞은 형태를 쓰세요.","rule":"voy, vas, va, vamos, vais, van.","items":[{"t":"text","q":"(yo) ___ a casa.","a":["voy"]},{"t":"text","q":"¿Adónde ___ tú?","a":["vas"]},{"t":"text","q":"(ella) ___ al trabajo.","a":["va"]},{"t":"text","q":"(nosotros) ___ al cine.","a":["vamos"]},{"t":"text","q":"(vosotros) ___ a Madrid.","a":["vais"]},{"t":"text","q":"(ellos) ___ en autobús.","a":["van"]}]},{"title":"연습 4. oír, huir 외","instr":"알맞은 형태를 쓰세요.","rule":"oír: oigo, oyes, oye, oímos, oís, oyen. huir: huyo, huyes, huye, huimos, huís, huyen.","items":[{"t":"text","q":"(yo, oír) ___ música.","a":["oigo"]},{"t":"text","q":"(tú, oír) ___ el teléfono.","a":["oyes"]},{"t":"text","q":"Tomás no ___ nada. (oír)","a":["oye"]},{"t":"text","q":"(nosotros, oír) ___ ruido.","a":["oímos"]},{"t":"text","q":"(yo, huir) ___ del peligro.","a":["huyo"]},{"t":"text","q":"(ellos, construir) ___ una casa.","a":["construyen"]}]}]};</script>
