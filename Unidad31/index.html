<script>window.UNIT={"id":31,"es":"¿cuál?, ¿qué?…","ko":"의문사 (2)","theory":"<h2>핵심 정리<\/h2>\n<p><b>cuál / cuáles<\/b>: 특정 집단에서 하나(또는 여럿)를 <b>고르도록<\/b> 묻습니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>cuál, cuáles<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál es tu color preferido?\">¿Cuál es tu color preferido?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuáles son tus deportes preferidos?\">¿Cuáles son tus deportes preferidos?<\/span><\/td><\/tr><tr><td>cuál / cuáles + <b>de<\/b> + 명사·대명사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál de tus hermanos vive en La Habana?\">¿Cuál de tus hermanos vive en La Habana?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál de vosotros habla ruso?\">¿Cuál de vosotros habla ruso?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál de estas ciudades está en Argentina?\">¿Cuál de estas ciudades está en Argentina?<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes un boli? — Sí. Tengo uno azul y otro negro. ¿Cuál prefieres? — El negro.\">¿Tienes un boli? — Sí. Tengo uno azul y otro negro. ¿Cuál prefieres? — El negro.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál es el río más largo del mundo? — El Nilo.\">¿Cuál es el río más largo del mundo? — El Nilo.<\/span><\/div>\n<h3>qué와 cuál의 비교<\/h3>\n<div class=\"tw\"><table><thead><tr><th>열린 대답<\/th><th>제한된 대답<\/th><\/tr><\/thead><tbody><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué quieres?\">¿Qué quieres?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué es un OVNI?\">¿Qué es un OVNI?<\/span><\/td><td><b>cuál<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál es tu apellido?\">¿Cuál es tu apellido?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál de estos libros quieres?\">¿Cuál de estos libros quieres?<\/span><\/td><\/tr><tr><td>qué + 명사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué libro quieres?\">¿Qué libro quieres?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué poeta famoso nació en Chile?\">¿Qué poeta famoso nació en Chile?<\/span><\/td><td><b>cuál + 명사는 쓰지 않음<\/b>: ¿Cuál libro…? ✗<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>선택지를 직접 말하며 묻는 경우 ¿qué?는 사물에, ¿quién?은 사람에: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué prefieren, carne o pescado?\">¿Qué prefieren, carne o pescado?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién es más alta, Rosana o Leila?\">¿Quién es más alta, Rosana o Leila?<\/span><\/div>\n<ul class=\"rules\"><li>복수는 <b>cuáles<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuáles de esos chicos son tus primos?\">¿Cuáles de esos chicos son tus primos?<\/span><\/li><\/ul>","ex":[{"title":"연습 1. cuál / cuáles","instr":"알맞은 것을 고르세요.","rule":"단수 명사·단수 동사 → cuál, 복수 → cuáles.","items":[{"t":"pick","q":"¿___ es tu color preferido?","o":["Cuál","Cuáles","Qué"],"a":"Cuál"},{"t":"pick","q":"¿___ son tus deportes preferidos?","o":["Cuáles","Cuál","Qué"],"a":"Cuáles"},{"t":"pick","q":"¿___ es tu apellido?","o":["Cuál","Qué","Cuáles"],"a":"Cuál"},{"t":"pick","q":"¿___ de estas ciudades está en Argentina?","o":["Cuál","Cuáles","Qué"],"a":"Cuál"},{"t":"pick","q":"¿___ son tus zapatos?","o":["Cuáles","Cuál","Quién"],"a":"Cuáles"},{"t":"pick","q":"¿___ es el río más largo del mundo?","o":["Cuál","Qué","Cuáles"],"a":"Cuál"}]},{"title":"연습 2. qué + 명사 / cuál","instr":"알맞은 의문사를 고르세요.","rule":"명사 바로 앞에는 qué. cuál은 명사 앞에 쓰지 않습니다.","items":[{"t":"pick","q":"¿___ libro prefieres?","o":["Qué","Cuál","Cuáles"],"a":"Qué"},{"t":"pick","q":"¿___ de estos libros quieres?","o":["Cuál","Qué","Cuáles"],"a":"Cuál"},{"t":"pick","q":"¿___ poeta famoso nació en Chile?","o":["Qué","Cuál","Cuáles"],"a":"Qué"},{"t":"pick","q":"¿___ es un OVNI?","o":["Qué","Cuál","Cuáles"],"a":"Qué"},{"t":"pick","q":"¿___ médico te ha visto?","o":["Qué","Cuál","Cuáles"],"a":"Qué"},{"t":"pick","q":"¿___ de vosotros habla ruso?","o":["Cuál","Qué","Quiénes"],"a":"Cuál"}]},{"title":"연습 3. 열린 대답 vs 제한된 대답","instr":"알맞은 의문사를 고르세요.","rule":"정의를 묻거나 열린 대답이면 qué, 정해진 집단에서 고르게 하면 cuál.","items":[{"t":"pick","q":"¿___ quieres? (자유롭게)","o":["Qué","Cuál"],"a":"Qué"},{"t":"pick","q":"¿___ de estas camisas quieres?","o":["Cuál","Qué"],"a":"Cuál"},{"t":"pick","q":"¿___ es la capital de Chile?","o":["Cuál","Qué"],"a":"Cuál"},{"t":"pick","q":"¿___ es una capital? (정의)","o":["Qué","Cuál"],"a":"Qué"},{"t":"pick","q":"¿___ prefieres, carne o pescado?","o":["Qué","Cuál"],"a":"Qué"},{"t":"pick","q":"¿___ es más alta, Rosana o Leila?","o":["Quién","Qué"],"a":"Quién"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 의문사를 쓰세요.","rule":"¿cuál(es)? ¿qué? ¿quién? 중 알맞은 것을 악센트와 함께.","items":[{"t":"text","q":"¿___ es tu número de teléfono?","a":["Cuál"]},{"t":"text","q":"¿___ películas te gustan?","a":["Qué"]},{"t":"text","q":"¿___ es tu madre? (사진 속)","a":["Cuál"]},{"t":"text","q":"¿___ de estas faldas te gusta más?","a":["Cuál"]},{"t":"text","q":"¿___ son tus hermanos? (사진 속)","a":["Cuáles"]},{"t":"text","q":"¿___ es un OVNI?","a":["Qué"]}]}]};</script>
