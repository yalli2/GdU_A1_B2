<script>window.UNIT={"id":79,"es":"trabaje, coma, viva","ko":"접속법 현재: 규칙동사","theory":"<h2>핵심 정리<\/h2>\n<h3>규칙 활용 (직설법과 모음이 반대)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>-ar (trabajar)<\/th><th>-er (comer)<\/th><th>-ir (vivir)<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>trabaje<\/td><td>coma<\/td><td>viva<\/td><\/tr><tr><td>tú<\/td><td>trabajes<\/td><td>comas<\/td><td>vivas<\/td><\/tr><tr><td>usted, él, ella<\/td><td>trabaje<\/td><td>coma<\/td><td>viva<\/td><\/tr><tr><td>nosotros/as<\/td><td>trabajemos<\/td><td>comamos<\/td><td>vivamos<\/td><\/tr><tr><td>vosotros/as<\/td><td>trabajéis<\/td><td>comáis<\/td><td>viváis<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>trabajen<\/td><td>coman<\/td><td>vivan<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>불규칙 (4개)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>동사<\/th><th>활용<\/th><\/tr><\/thead><tbody><tr><td>dar<\/td><td>dé, des, dé, dé, demos, deis, den, den<\/td><\/tr><tr><td>estar<\/td><td>esté, estés, esté, esté, estemos, estéis, estén, estén<\/td><\/tr><tr><td>ser<\/td><td>sea, seas, sea, sea, seamos, seáis, sean, sean<\/td><\/tr><tr><td>ver<\/td><td>vea, veas, vea, vea, veamos, veáis, vean, vean<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>접속법 현재는 <b>현재<\/b> 또는 <b>미래<\/b>를 가리킵니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Puede que Sonia esté ahora en casa.\">Puede que Sonia esté ahora en casa.<\/span> (현재), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi padre quiere que le ayude mañana.\">Mi padre quiere que le ayude mañana.<\/span> (미래)<\/li><\/ul>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>소망<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quiero que me ayudes.\">Quiero que me ayudes.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ojalá no sea grave!\">¡Ojalá no sea grave!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Espero que trabajes a gusto.\">Espero que trabajes a gusto.<\/span><\/li><li><b>가능성<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es probable que el Boca Juniors gane la copa este año.\">Es probable que el Boca Juniors gane la copa este año.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Te ha llamado Adela? —No. Quizás me llame esta noche.\">—¿Te ha llamado Adela? —No. Quizás me llame esta noche.<\/span><\/li><li><b>감정<\/b>(놀람, 기쁨, 불쾌, 두려움 등): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gusta que seáis educados, niños.\">Me gusta que seáis educados, niños.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me gusta que comáis nada antes de las comidas.\">No me gusta que comáis nada antes de las comidas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo miedo de que me echen del trabajo.\">Tengo miedo de que me echen del trabajo.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 규칙 활용","instr":"알맞은 접속법 현재형을 쓰세요.","rule":"-ar → e, es, e, emos, éis, en / -er·-ir → a, as, a, amos, áis, an.","items":[{"t":"text","q":"Espero que (tú, trabajar) ___ a gusto.","a":["trabajes"]},{"t":"text","q":"Quiero que (tú, comer) ___ más.","a":["comas"]},{"t":"text","q":"Ojalá (ella, vivir) ___ muchos años.","a":["viva"]},{"t":"text","q":"Es probable que (nosotros, llegar) ___ tarde.","a":["lleguemos"]},{"t":"text","q":"Me gusta que (vosotros, hablar) ___ español.","a":["habléis"]},{"t":"text","q":"Quizás (ellos, escribir) ___ hoy.","a":["escriban"]},{"t":"text","q":"Quiero que (yo, ayudar) ___ .","a":["ayude"]},{"t":"text","q":"Espero que (usted, beber) ___ más agua.","a":["beba"]},{"t":"text","q":"Es probable que (nosotros, vivir) ___ allí.","a":["vivamos"]},{"t":"text","q":"Me gusta que (ustedes, cantar) ___ tan bien.","a":["canten"]}]},{"title":"연습 2. 불규칙 dar·estar·ser·ver","instr":"알맞은 형태를 쓰세요.","rule":"dé/des, esté/estés, sea/seas, vea/veas.","items":[{"t":"text","q":"Puede que Sonia (estar) ___ en casa.","a":["esté"]},{"t":"text","q":"Espero que (tú, estar) ___ bien.","a":["estés"]},{"t":"text","q":"¡Ojalá (ser) ___ verdad!","a":["sea"]},{"t":"text","q":"Quiero que (tú, ser) ___ feliz.","a":["seas"]},{"t":"text","q":"Es posible que (yo, ver) ___ a Ana.","a":["vea"]},{"t":"text","q":"Quiero que (tú, dar) ___ una respuesta.","a":["des"]},{"t":"text","q":"Es probable que (nosotros, estar) ___ allí.","a":["estemos"]},{"t":"text","q":"Quizás (ellos, dar) ___ una fiesta.","a":["den"]},{"t":"text","q":"Me gusta que (vosotros, ser) ___ educados.","a":["seáis"]},{"t":"text","q":"Espero que (vosotros, ver) ___ la película.","a":["veáis"]}]},{"title":"연습 3. 알맞은 형태 고르기","instr":"알맞은 접속법 형태를 고르세요.","rule":"소망·가능성·감정 표현 뒤에 접속법.","items":[{"t":"pick","q":"Quiero que me ___ . (tú, ayudar)","o":["ayudes","ayudas","ayudaras"],"a":"ayudes"},{"t":"pick","q":"Es probable que el equipo ___ la copa.","o":["gane","gana","ganó"],"a":"gane"},{"t":"pick","q":"Me gusta que ___ educados. (vosotros)","o":["seáis","sois","sed"],"a":"seáis"},{"t":"pick","q":"Tengo miedo de que me ___ del trabajo. (echar)","o":["echen","echan","echaron"],"a":"echen"},{"t":"pick","q":"¡Ojalá no ___ grave!","o":["sea","es","será"],"a":"sea"},{"t":"pick","q":"Quizás me ___ esta noche. (llamar)","o":["llame","llama","llamó"],"a":"llame"},{"t":"pick","q":"Puede que ella ___ en casa.","o":["esté","está","estaba"],"a":"esté"},{"t":"pick","q":"No me gusta que ___ nada antes de comer. (vosotros, comer)","o":["comáis","coméis","comed"],"a":"comáis"}]},{"title":"연습 4. 직설법 vs 접속법","instr":"알맞은 형태를 고르세요.","rule":"소망·감정 표현 뒤 접속법, 사실은 직설법.","items":[{"t":"pick","q":"Mi padre quiere que le ___ mañana. (ayudar)","o":["ayude","ayuda","ayudaré"],"a":"ayude"},{"t":"pick","q":"Sé que Ana ___ en casa. (estar)","o":["está","esté","estar"],"a":"está"},{"t":"pick","q":"Espero que ___ buen tiempo. (hacer)","o":["haga","hace","hará"],"a":"haga"},{"t":"pick","q":"Es probable que ___ mucho. (nosotros, trabajar)","o":["trabajemos","trabajamos","trabajaremos"],"a":"trabajemos"},
