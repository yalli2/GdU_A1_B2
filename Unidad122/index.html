<script>window.UNIT={"id":122,"es":"Aquí se trabaja mucho","ko":"비인칭문","theory":"<h2>핵심 정리<\/h2>\n<h3>se + 동사 3인칭 단수<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aquí se vive muy bien.\">Aquí se vive muy bien.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Antes se trabajaba mucho en el campo.\">Antes se trabajaba mucho en el campo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aquí se trabaja mucho.\">Aquí se trabaja mucho.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>acostarse, divertirse처럼 이미 se가 있는 동사는 <b>la gente / uno<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aquí la gente se acuesta muy tarde.\">Aquí la gente se acuesta muy tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aquí se acuesta uno muy tarde.\">Aquí se acuesta uno muy tarde.<\/span> (✗ Aquí se se acuesta…)<\/div>\n<h3>se + 동사 + 부정사<\/h3>\n<ul class=\"rules\"><li>soler, poder, deber, necesitar: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En España se suele cenar muy tarde.\">En España se suele cenar muy tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Desde mi casa se puede ver el mar.\">Desde mi casa se puede ver el mar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No se debe hablar con la boca llena.\">No se debe hablar con la boca llena.<\/span><\/li><\/ul>\n<h3>se dice que / se espera que<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se dice que Arlindo está enfermo.\">Se dice que Arlindo está enfermo.<\/span> (직설법), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se espera que ganen sin problemas.\">Se espera que ganen sin problemas.<\/span> (접속법)<\/li><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se sospecha que el ladrón estaba escondido allí.\">Se sospecha que el ladrón estaba escondido allí.<\/span> (누가 의심하는지 알 수 없음)<\/li><li>직설법: se ve, se dice, se piensa, se supone, se sospecha — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se supone que el Presidente lo sabe.\">Se supone que el Presidente lo sabe.<\/span><\/li><li>접속법: se espera — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se esperaba que llegasen todos juntos.\">Se esperaba que llegasen todos juntos.<\/span><\/li><\/ul>\n<h3>ser + 형용사 + 부정사 (일반적 평가)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es importante saber idiomas.\">Es importante saber idiomas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Era inútil explicárselo. No lo entendían.\">Era inútil explicárselo. No lo entendían.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sería injusto castigar a todos.\">Sería injusto castigar a todos.<\/span><\/li><li>형용사: bueno, malo, mejor, peor, fácil, difícil, útil, inútil, justo, injusto, importante, imposible, necesario<\/li><\/ul>\n<h3>3인칭 단수 동사 (자연현상 등)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>haber<\/th><th><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy hay niebla.\">Hoy hay niebla.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer había mucha gente.\">Ayer había mucha gente.<\/span><\/th><\/tr><\/thead><tbody><tr><td>haber que + 부정사<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay que preparar la comida.\">Hay que preparar la comida.<\/span><\/td><\/tr><tr><td>hacer + frío/calor/viento<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer hizo mucho frío.\">Ayer hizo mucho frío.<\/span><\/td><\/tr><tr><td>hacer + 시간<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hace dos semanas que no veo a Pili.\">Hace dos semanas que no veo a Pili.<\/span><\/td><\/tr><tr><td>ser + 시간<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es tarde. Vámonos a casa.\">Es tarde. Vámonos a casa.<\/span><\/td><\/tr><tr><td>자연현상<\/td><td>llover, nevar, amanecer, anochecer — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En verano amanece pronto.\">En verano amanece pronto.<\/span><\/td><\/tr><\/tbody><\/table><\/div>","ex":[{"title":"연습 1. se + 3인칭 단수","instr":"알맞은 형태를 고르세요.","rule":"비인칭 se + 동사 3인칭 단수.","items":[{"t":"pick","q":"Aquí ___ muy bien. (vivir)","o":["se vive","viven","se viven"],"a":"se vive"},{"t":"pick","q":"Antes ___ mucho en el campo. (trabajar)","o":["se trabajaba","trabajaban","se trabaja"],"a":"se trabajaba"},{"t":"pick","q":"En España ___ cenar muy tarde. (soler)","o":["se suele","suelen","se suelen"],"a":"se suele"},{"t":"pick","q":"Desde mi casa ___ ver el mar. (poder)","o":["se puede","pueden","se pueden"],"a":"se puede"},{"t":"pick","q":"No ___ hablar con la boca llena. (deber)","o":["se debe","deben","se debe de"],"a":"se debe"},{"t":"pick","q":"En esta ciudad ___ mucho. (comer)","o":["se come","comen","se comen"],"a":"se come"},{"t":"pick","q":"Aquí ___ mucho. (trabajar)","o":["se trabaja","trabajan","se trabajan"],"a":"se trabaja"},{"t":"pick","q":"Aquí ___ bien. (comer)","o":["se come","comen","se comen"],"a":"se come"}]},{"title":"연습 2. se dice que","instr":"알맞은 형태를 고르세요.","rule":"se dice/se supone/se sospecha + 직설법, se espera + 접속법.","items":[{"t":"pick","q":"Se dice que Arlindo ___ enfermo. (estar)","o":["está","esté","estuviera"],"a":"está"},{"t":"pick","q":"Se espera que ___ sin problemas. (ellos, ganar)","o":["ganen","ganan","ganaron"],"a":"ganen"},{"t":"pick","q":"Se supone que el Presidente lo ___ . (saber)","o":["sabe","sepa","supiera"],"a":"sabe"},{"t":"pick","q":"Se sospecha que el ladrón ___ escondido allí. (estar, 과거)","o":["estaba","estuviera","esté"],"a":"estaba"},{"t":"pick","q":"Se esperaba que ___ todos juntos. (llegar)","o":["llegasen","llegan","llegaban"],"a":"llegasen"},{"t":"pick","q":"Se piensa que el invierno ___ duro. (ser)","o":["será","sea","fuera"],"a":"será"},{"t":"pick","q":"Se espera que mañana ___ buen tiempo. (hacer)","o":["haga","hace","hará"],"a":"haga"},{"t":"pick","q":"Se dice que ellos ___ ricos. (ser)","o":["son","sean","fueran"],"a":"son"}]},{"title":"연습 3. ser + 형용사 + 부정사","instr":"알맞은 형태를 고르세요.","rule":"일반적 평가.","items":[{"t":"pick","q":"Es importante ___ idiomas. (saber)","o":["saber","que sabe","sabiendo"],"a":"saber"},{"t":"pick","q":"Era inútil ___ ; no lo entendían. (a ellos, explicar + 대명사)","o":["explicárselo","explicó","explicando"],"a":"explicárselo"},{"t":"pick","q":"Sería injusto ___ a todos. (castigar)","o":["castigar","que castiga","castigó"],"a":"castigar"},{"t":"pick","q":"Es necesario ___ más. (estudiar)","o":["estudiar","que estudia","estudiando"],"a":"estudiar"},{"t":"pick","q":"___ importante descansar.","o":["Es","Está","Hay"],"a":"Es"},{"t":"pick","q":"___ difícil aprender chino.","o":["Es","Está","Hay"],"a":"Es"},{"t":"pick","q":"Es bueno ___ deporte. (hacer)","o":["hacer","que hace","hecho"],"a":"hacer"},{"t":"pick","q":"Es imposible ___ en esta casa. (dormir)","o":["dormir","que duerme","durmiendo"],"a":"dormir"}]},{"title":"연습 4. haber · hacer · ser · 자연현상","instr":"알맞은 형태를 쓰세요.","rule":"3인칭 단수.","items":[{"t":"text","q":"Hoy ___ niebla. (haber)","a":["hay"]},{"t":"text","q":"Ayer ___ mucha gente. (haber, 불완료과거)","a":["había"]},{"t":"text","q":"Ayer ___ mucho frío. (hacer, 단순과거)","a":["hizo"]},{"t":"text","q":"___ dos semanas que no veo a Pili. (hacer, 현재)","a":["Hace"]},{"t":"text","q":"___ tarde. Vámonos a casa. (ser)","a":["Es"]},{"t":"text","q":"En verano ___ pronto. (amanecer)","a":["amanece"]},{"t":"text","q":"En invierno ___ pronto. (anochecer)","a":["anochece"]},{"t":"text","q":"___ que preparar la comida. (haber, 현재)","a":["Hay"]}]}]};</script>
