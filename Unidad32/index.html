<script>window.UNIT={"id":32,"es":"¿cuándo?, ¿dónde?…","ko":"의문사 (3)","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th>의문사<\/th><th>용도<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>dónde<\/b> (por/de… dónde)<\/td><td>장소<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde vive Graciela?\">¿Dónde vive Graciela?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Por dónde pasa el Guadalquivir?\">¿Por dónde pasa el Guadalquivir?<\/span><\/td><\/tr><tr><td><b>adónde<\/b><\/td><td>가는 장소(방향)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Adónde vais a ir este verano?\">¿Adónde vais a ir este verano?<\/span><\/td><\/tr><tr><td><b>cuándo<\/b> (desde/hasta cuándo)<\/td><td>때<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuándo se casa Sebastián?\">¿Cuándo se casa Sebastián?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Desde cuándo estudias español?\">¿Desde cuándo estudias español?<\/span><\/td><\/tr><tr><td><b>cuánto, -a, -os, -as<\/b><\/td><td>수량<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuántos años tiene Rosario?\">¿Cuántos años tiene Rosario?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Con cuántos amigos vas?\">¿Con cuántos amigos vas?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuánto vale esa revista?\">¿Cuánto vale esa revista?<\/span><\/td><\/tr><tr><td><b>cómo<\/b><\/td><td>① 방법 ② 상태 ③ 특징<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cómo conduce Alberto?\">¿Cómo conduce Alberto?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cómo está la madre de Julia?\">¿Cómo está la madre de Julia?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cómo es la casa de Ángel?\">¿Cómo es la casa de Ángel?<\/span><\/td><\/tr><tr><td><b>por qué<\/b><\/td><td>원인·이유<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Por qué no viniste ayer?\">¿Por qué no viniste ayer?<\/span><\/td><\/tr><tr><td><b>para qué<\/b><\/td><td>목적·용도<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Para qué quieres la plancha?\">¿Para qué quieres la plancha?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Para qué sirve esa máquina?\">¿Para qué sirve esa máquina?<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>의문사 + 동사 + 주어 순서: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde vive Graciela?\">¿Dónde vive Graciela?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Por qué se ríe Juanjo?\">¿Por qué se ríe Juanjo?<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>cuánto<\/b>는 명사의 성·수에 일치: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuántas personas hay?\">¿Cuántas personas hay?<\/span> / 모든 의문사에는 악센트가 있습니다.<\/div>","ex":[{"title":"연습 1. 알맞은 의문사","instr":"알맞은 의문사를 고르세요.","rule":"dónde(장소), adónde(방향), cuándo(때), cuánto(양), cómo(방법·상태), por qué(이유), para qué(목적).","items":[{"t":"pick","q":"¿___ vive Graciela? — En Rosario.","o":["Dónde","Adónde","Cuándo"],"a":"Dónde"},{"t":"pick","q":"¿___ vais a ir este verano? — A Ica.","o":["Adónde","Dónde","Cuándo"],"a":"Adónde"},{"t":"pick","q":"¿___ se casa Sebastián? — El mes que viene.","o":["Cuándo","Dónde","Cómo"],"a":"Cuándo"},{"t":"pick","q":"¿___ años tiene Rosario? — Doce.","o":["Cuántos","Cuánto","Cuántas"],"a":"Cuántos"},{"t":"pick","q":"¿___ conduce Alberto? — Bastante mal.","o":["Cómo","Cuándo","Dónde"],"a":"Cómo"},{"t":"pick","q":"¿___ no viniste ayer? — Estaba cansada.","o":["Por qué","Para qué","Porque"],"a":"Por qué"}]},{"title":"연습 2. por qué / para qué","instr":"알맞은 의문사를 고르세요.","rule":"이유(원인)는 por qué, 목적·용도는 para qué.","items":[{"t":"pick","q":"¿___ quieres la plancha? — Quiero plancharme una camisa.","o":["Para qué","Por qué"],"a":"Para qué"},{"t":"pick","q":"¿___ no vienes a la fiesta? — Porque estoy enfermo.","o":["Por qué","Para qué"],"a":"Por qué"},{"t":"pick","q":"¿___ sirve esa máquina? — Para moler café.","o":["Para qué","Por qué"],"a":"Para qué"},{"t":"pick","q":"¿___ llegaste tarde? — Perdí el autobús.","o":["Por qué","Para qué"],"a":"Por qué"},{"t":"pick","q":"¿___ estudias español? — Para trabajar en España.","o":["Para qué","Por qué"],"a":"Para qué"}]},{"title":"연습 3. cuánto의 일치","instr":"알맞은 형태를 쓰세요.","rule":"cuánto는 명사의 성·수에 일치: cuánto/cuánta/cuántos/cuántas.","items":[{"t":"text","q":"¿___ años tienes?","a":["Cuántos"]},{"t":"text","q":"¿___ dinero tienes?","a":["Cuánto"]},{"t":"text","q":"¿___ personas hay en la fiesta?","a":["Cuántas"]},{"t":"text","q":"¿___ gente viene?","a":["Cuánta"]},{"t":"text","q":"¿Con ___ amigos vas?","a":["cuántos"]},{"t":"text","q":"¿___ cuesta esta camisa?","a":["Cuánto"]}]},{"title":"연습 4. cómo","instr":"알맞은 대답을 고르세요.","rule":"cómo는 방법·상태·특징을 묻습니다.","items":[{"t":"pick","q":"¿Cómo conduce Alberto? → ___","o":["Bastante mal.","En coche."],"a":"Bastante mal."},{"t":"pick","q":"¿Cómo está la madre de Julia? → ___","o":["Ya está mejor.","Es alta."],"a":"Ya está mejor."},{"t":"pick","q":"¿Cómo es la casa de Ángel? → ___","o":["Es muy grande.","Está en Sevilla."],"a":"Es muy grande."},{"t":"pick","q":"¿Cómo has abierto la puerta? → ___","o":["Con la llave de Marcela.","Mañana."],"a":"Con la llave de Marcela."}]}]};</script>
