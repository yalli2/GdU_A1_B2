<script>window.UNIT={"id":104,"es":"muy, mucho, bastante…","ko":"양 부사","theory":"<h2>핵심 정리<\/h2>\n<h3>강도 정도 (많음 → 적음)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>muy / mucho<\/th><th>bastante<\/th><th>algo / un poco<\/th><th>poco<\/th><th>nada<\/th><\/tr><\/thead><tbody><tr><td>매우<\/td><td>꽤<\/td><td>약간<\/td><td>거의 없는<\/td><td>전혀<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>demasiado = 필요하거나 적당한 것보다 <b>지나치게 많은<\/b><\/li><\/ul>\n<h3>+ 형용사 / 부사 (muy, bastante, algo, un poco, poco, demasiado, nada)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Fidel cocina muy bien.\">Fidel cocina muy bien.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Julia y su hermano son bastante diferentes.\">Julia y su hermano son bastante diferentes.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es algo tarde.\">Es algo tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este ejercicio es un poco difícil.\">Este ejercicio es un poco difícil.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Susana es poco cariñosa.\">Susana es poco cariñosa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este hotel es demasiado caro.\">Este hotel es demasiado caro.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Gema no es nada egoísta.\">Gema no es nada egoísta.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>algo, un poco = 긍정적 의미, poco = <b>부정적 의미<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Soy algo/un poco tímida.\">Soy algo/un poco tímida.<\/span> (= 수줍음이 있다) ↔ <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Soy poco tímida.\">Soy poco tímida.<\/span> (= 수줍지 않다)<\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>algo, un poco는 긍정적 특성 형용사와는 보통 쓰지 않습니다: ✗ Adela es algo simpática.<\/div>\n<h3>동사 + mucho, bastante, algo, poco, demasiado, nada<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Beatriz trabaja mucho.\">Beatriz trabaja mucho.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ernesto piensa bastante.\">Ernesto piensa bastante.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nati estudia algo, pero poco.\">Nati estudia algo, pero poco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este tren corre poco.\">Este tren corre poco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Felipe duerme demasiado.\">Felipe duerme demasiado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan no come nada.\">Juan no come nada.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 형용사·부사 앞","instr":"알맞은 부사를 고르세요.","rule":"muy, bastante, un poco, poco, demasiado, nada.","items":[{"t":"pick","q":"Fidel cocina ___ bien.","o":["muy","mucho","demasiados"],"a":"muy"},{"t":"pick","q":"Este hotel es ___ caro. No lo podemos pagar.","o":["demasiado","mucho","nada"],"a":"demasiado"},{"t":"pick","q":"Gema no es ___ egoísta.","o":["nada","mucha","demasiados"],"a":"nada"},{"t":"pick","q":"Este ejercicio es un ___ difícil.","o":["poco","mucho","muy"],"a":"poco"},{"t":"pick","q":"Susana es ___ cariñosa. (애정이 별로 없다)","o":["poco","un poco","algo"],"a":"poco"},{"t":"pick","q":"Es ___ tarde. (조금)","o":["algo","poco","mucho"],"a":"algo"},{"t":"pick","q":"Julia y su hermano son ___ diferentes. (꽤)","o":["bastante","nada","un"],"a":"bastante"},{"t":"pick","q":"Hace ___ calor. (정말 많이)","o":["mucho","muy","poco"],"a":"mucho"}]},{"title":"연습 2. 동사 뒤","instr":"알맞은 부사를 고르세요.","rule":"동사 + mucho, bastante, poco, demasiado, nada.","items":[{"t":"pick","q":"Beatriz trabaja ___ .","o":["mucho","muy","nada"],"a":"mucho"},{"t":"pick","q":"Ernesto piensa ___ .","o":["bastante","muy","demasiados"],"a":"bastante"},{"t":"pick","q":"Felipe duerme ___ . (너무 많이)","o":["demasiado","muy","algo"],"a":"demasiado"},{"t":"pick","q":"Juan no come ___ . (전혀)","o":["nada","mucho","algo"],"a":"nada"},{"t":"pick","q":"Este tren corre ___ . (거의 안 빠르다)","o":["poco","muy","demasiados"],"a":"poco"},{"t":"pick","q":"Nati estudia algo, pero ___ .","o":["poco","nada","muy"],"a":"poco"},{"t":"pick","q":"Estoy cansado: he trabajado ___ .","o":["mucho","muy","nada"],"a":"mucho"},{"t":"pick","q":"Mi hermano no estudia ___ . (전혀)","o":["nada","muy","mucho"],"a":"nada"}]},{"title":"연습 3. algo / un poco vs poco","instr":"알맞은 문장을 고르세요.","rule":"algo, un poco = 긍정적 / poco = 부정적.","items":[{"t":"pick","q":"나는 수줍음이 있다. → Soy ___ tímida.","o":["algo","poco","mucho"],"a":"algo"},{"t":"pick","q":"나는 수줍지 않다. → Soy ___ tímida.","o":["poco","un poco","algo"],"a":"poco"},{"t":"pick","q":"이 문제는 약간 어렵다. → Es ___ difícil.","o":["un poco","ningún","tampoco"],"a":"un poco"},{"t":"pick","q":"그녀는 별로 정직하지 않다. → Es ___ honesta.","o":["poco","un poco","algo"],"a":"poco"},{"t":"pick","q":"올바른 문장: ___","o":["Adela es muy simpática.","Adela es algo simpática.","Adela es un poco simpática."],"a":"Adela es muy simpática."},{"t":"pick","q":"이 요리는 약간 짜다. → Está un ___ salado.","o":["poco","mucho","muy"],"a":"poco"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 부사를 쓰세요.","rule":"muy / mucho / bastante / poco / demasiado / nada.","items":[{"t":"text","q":"Nuria trabaja ___ . (아주 많이)","a":["mucho"]},{"t":"text","q":"Es ___ tarde. El avión ya ha despegado. (너무)","a":["demasiado"]},{"t":"text","q":"Gema no es ___ egoísta. (전혀)","a":["nada"]},{"t":"text","q":"Fidel cocina ___ bien. (매우)","a":["muy"]},{"t":"text","q":"Este tren corre ___ . (거의 안 빠르다)","a":["poco"]},{"t":"text","q":"Ernesto piensa ___ . (꽤)","a":["bastante"]},{"t":"text","q":"Felipe duerme ___ . (지나치게)","a":["demasiado"]},{"t":"text","q":"Juan no come ___ . (전혀)","a":["nada"]}]}]};</script>
