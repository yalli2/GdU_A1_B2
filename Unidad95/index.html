<script>window.UNIT={"id":95,"es":"Tengo que trabajar. ¿Puedo abrir la ventana?","ko":"부정사 구문 (2): 의무·허가","theory":"<h2>핵심 정리<\/h2>\n<h3>의무·필요<\/h3>\n<div class=\"tw\"><table><thead><tr><th>표현<\/th><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>tener que + 부정사<\/b><\/td><td>상황이 강요하는 의무·필요<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este domingo tenemos que trabajar.\">Este domingo tenemos que trabajar.<\/span> (상점이 문을 연다), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sara tiene que levantarse a las cinco.\">Sara tiene que levantarse a las cinco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer tuve que quedarme en la oficina hasta las diez.\">Ayer tuve que quedarme en la oficina hasta las diez.<\/span><\/td><\/tr><tr><td><b>deber + 부정사<\/b><\/td><td>화자가 필요하다고 생각하는 의무, 권고<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Debes llamar a Rubén. Se lo prometiste.\">Debes llamar a Rubén. Se lo prometiste.<\/span><\/td><\/tr><tr><td><b>no tener que + 부정사<\/b><\/td><td>~할 필요가 없다<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mañana no tengo que madrugar. Es fiesta.\">Mañana no tengo que madrugar. Es fiesta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No tienes que regalarme nada.\">No tienes que regalarme nada.<\/span><\/td><\/tr><tr><td><b>no deber + 부정사<\/b><\/td><td>~하지 않는 것이 좋다<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No debemos irnos ahora. Es demasiado pronto.\">No debemos irnos ahora. Es demasiado pronto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No debes regalar nada a Nati.\">No debes regalar nada a Nati.<\/span><\/td><\/tr><tr><td><b>deber de + 부정사<\/b><\/td><td>추측·짐작<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Debe de ser extranjero. Casi no habla español.\">Debe de ser extranjero. Casi no habla español.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No deben de ser de aquí.\">No deben de ser de aquí.<\/span><\/td><\/tr><tr><td><b>haber que + 부정사<\/b><\/td><td>일반적·비인칭 의무 (3인칭 단수 hay, había, hubo, habrá만)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Para viajar a Egipto hay que tener un visado.\">Para viajar a Egipto hay que tener un visado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No hay que hablar alto.\">No hay que hablar alto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando yo era pequeño, había que ser muy respetuoso con los mayores.\">Cuando yo era pequeño, había que ser muy respetuoso con los mayores.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>poder<\/h3>\n<ul class=\"rules\"><li><b>허락·금지<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Puedo abrir la ventana?\">¿Puedo abrir la ventana?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aquí no podemos aparcar. Está prohibido.\">Aquí no podemos aparcar. Está prohibido.<\/span><\/li><li><b>일반적 허락·금지<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En este museo no se pueden hacer fotos.\">En este museo no se pueden hacer fotos.<\/span><\/li><li><b>불가능한 추측<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No puede ser Juan. Se fue ayer a Cali.\">No puede ser Juan. Se fue ayer a Cali.<\/span><\/li><li>비교: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No debe de trabajar aquí. No lleva uniforme.\">No debe de trabajar aquí. No lleva uniforme.<\/span> (아마 아닐 것이다) ↔ <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No puede trabajar aquí. No ha terminado la carrera.\">No puede trabajar aquí. No ha terminado la carrera.<\/span> (그럴 수 없다)<\/li><\/ul>","ex":[{"title":"연습 1. 의무 표현","instr":"알맞은 표현을 고르세요.","rule":"tener que / deber / hay que.","items":[{"t":"pick","q":"Este domingo ___ trabajar. Las tiendas abren.","o":["tenemos que","hay de","debemos de"],"a":"tenemos que"},{"t":"pick","q":"Sara ___ levantarse a las cinco. Sale de viaje a las seis.","o":["tiene que","hay que","debe de"],"a":"tiene que"},{"t":"pick","q":"Para viajar a Egipto ___ tener un visado.","o":["hay que","tienes que","debes de"],"a":"hay que"},{"t":"pick","q":"Ayer ___ quedarme en la oficina hasta las diez.","o":["tuve que","hube de","debí de"],"a":"tuve que"},{"t":"pick","q":"___ llamar a Rubén. Se lo prometiste.","o":["Debes","Hay","Puedes que"],"a":"Debes"},{"t":"pick","q":"No ___ hablar alto.","o":["hay que","tiene que","debe de"],"a":"hay que"},{"t":"pick","q":"Cuando yo era pequeño, ___ ser muy respetuoso.","o":["había que","hay que","tuve que"],"a":"había que"},{"t":"pick","q":"___ madrugar mañana. Es fiesta. (필요 없음)","o":["No tengo que","No debo de","No hay de"],"a":"No tengo que"}]},{"title":"연습 2. no tener que vs no deber","instr":"알맞은 표현을 고르세요.","rule":"no tener que = 필요 없음, no deber = 하지 않는 게 좋음.","items":[{"t":"pick","q":"No te preocupes. No ___ regalarme nada. (필요 없다)","o":["tienes que","debes","puedes"],"a":"tienes que"},{"t":"pick","q":"No ___ regalar nada a Nati. Se puede enfadar. (좋지 않다)","o":["debes","tienes que","hay que"],"a":"debes"},{"t":"pick","q":"Mañana no ___ madrugar. Es fiesta.","o":["tengo que","debo","hay que"],"a":"tengo que"},{"t":"pick","q":"No ___ irnos ahora. Es demasiado pronto.","o":["debemos","tenemos que","hay que"],"a":"debemos"},{"t":"pick","q":"No ___ trabajar hoy. Es domingo. (필요 없음)","o":["tenemos que","debemos","podemos de"],"a":"tenemos que"},{"t":"pick","q":"No ___ fumar en el hospital. (좋지 않다/금지)","o":["debes","tienes que","puedes de"],"a":"debes"}]},{"title":"연습 3. deber de · poder","instr":"알맞은 표현을 고르세요.","rule":"deber de = 추측, no poder ser = 불가능.","items":[{"t":"pick","q":"___ ser extranjero. Casi no habla español.","o":["Debe de","Tiene que","Hay que"],"a":"Debe de"},{"t":"pick","q":"No ___ ser Juan. Se fue ayer a Cali.","o":["puede","debe de","hay que"],"a":"puede"},{"t":"pick","q":"¿___ abrir la ventana?","o":["Puedo","Debo de","Tengo de"],"a":"Puedo"},{"t":"pick","q":"Aquí no ___ aparcar. Está prohibido.","o":["podemos","debemos de","hay"],"a":"podemos"},{"t":"pick","q":"En este museo no ___ hacer fotos.","o":["se puede","se debe de","hay"],"a":"se puede"},{"t":"pick","q":"No ___ ser de aquí. No conocen a nadie.","o":["deben de","pueden de","hay que"],"a":"deben de"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 형태를 쓰세요.","rule":"tener que / deber / haber que.","items":[{"t":"text","q":"Ayer (yo, tener que) ___ quedarme en la oficina. (과거)","a":["tuve que"]},{"t":"text","q":"Para entrar ___ pagar. (haber que, 현재)","a":["hay que"]},{"t":"text","q":"Antes ___ pedir permiso. (haber que, 과거)","a":["había que"]},{"t":"text","q":"(nosotros, tener que) ___ trabajar este domingo.","a":["Tenemos que"]},{"t":"text","q":"No (nosotros, deber) ___ irnos ahora.","a":["debemos"]},{"t":"text","q":"(él, deber de) ___ ser el jefe. Lleva traje.","a":["Debe de"]},{"t":"text","q":"Ellos no (poder) ___ ser vecinos. Viven muy lejos.","a":["pueden"]},{"t":"text","q":"(usted, deber) ___ llamarle. Se lo prometió.","a":["Debe"]}]}]};</script>
