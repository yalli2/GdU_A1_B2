<script>window.UNIT={"id":3,"es":"libro, libros","ko":"단수와 복수","theory":"<h2>핵심 정리<\/h2>\n<p>한 사람·한 개는 <b>단수<\/b>, 둘 이상은 <b>복수<\/b>입니다. 복수형은 마지막 철자에 따라 만듭니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>단수 어미<\/th><th>복수<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>모음 (-a, -e, -i, -o, -u), 강세 모음 (-á, -é, -ó, -ú)<\/td><td>+ s<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"casa → casas\">casa → casas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"libro → libros\">libro → libros<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"café → cafés\">café → cafés<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"menú → menús\">menú → menús<\/span><\/td><\/tr><tr><td>자음<\/td><td>+ es<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"frijol → frijoles\">frijol → frijoles<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"reloj → relojes\">reloj → relojes<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"mes → meses\">mes → meses<\/span><\/td><\/tr><tr><td>강세 -í, -y<\/td><td>+ es<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"rubí → rubíes\">rubí → rubíes<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ley → leyes\">ley → leyes<\/span><\/td><\/tr><tr><td>2음절 이상 + -as, -es, -is, -os, -us<\/td><td>변화 없음<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"el lunes → los lunes\">el lunes → los lunes<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"el paraguas → los paraguas\">el paraguas → los paraguas<\/span><\/td><\/tr><tr><td>-z<\/td><td>-z → -c + es<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"actriz → actrices\">actriz → actrices<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pez → peces\">pez → peces<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>강세 위치가 달라지면 악센트를 확인하세요. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"autobús → autobuses\">autobús → autobuses<\/span> (악센트 사라짐), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"televisión → televisiones\">televisión → televisiones<\/span><\/div>\n<h3>단복수 같은 명사<\/h3>\n<p>항상 복수형으로 쓰는 명사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"tijeras\">tijeras<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"gafas\">gafas<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pantalones\">pantalones<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"vaqueros\">vaqueros<\/span> → 하나일 때도 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"unas tijeras\">unas tijeras<\/span>, 여러 개일 때도 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"tres tijeras\">tres tijeras<\/span><\/p>\n<h3>남성 + 여성 = 복수 남성<\/h3>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"padre + madre = padres\">padre + madre = padres<\/span><span class=\"ko\">부모<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"hijo + hija = hijos\">hijo + hija = hijos<\/span><span class=\"ko\">자녀들<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"rey + reina = reyes\">rey + reina = reyes<\/span><span class=\"ko\">왕과 왕비<\/span><\/div>","ex":[{"title":"연습 1. 복수형 쓰기","instr":"다음 명사의 복수형을 쓰세요. (관사 없이)","rule":"모음+s, 자음+es, -z → -ces. -s로 끝나는 2음절 이상은 그대로입니다.","items":[{"t":"text","q":"libro → ___","a":["libros"]},{"t":"text","q":"casa → ___","a":["casas"]},{"t":"text","q":"café → ___","a":["cafés"]},{"t":"text","q":"reloj → ___","a":["relojes"]},{"t":"text","q":"mes → ___","a":["meses"]},{"t":"text","q":"ley → ___","a":["leyes"]},{"t":"text","q":"lunes → ___","a":["lunes"]},{"t":"text","q":"paraguas → ___","a":["paraguas"]},{"t":"text","q":"actriz → ___","a":["actrices"]},{"t":"text","q":"pez → ___","a":["peces"]},{"t":"text","q":"autobús → ___","a":["autobuses"]},{"t":"text","q":"televisión → ___","a":["televisiones"]},{"t":"text","q":"canción → ___","a":["canciones"]},{"t":"text","q":"ciudad → ___","a":["ciudades"]}]},{"title":"연습 2. 단수형 쓰기","instr":"다음 복수 명사의 단수형을 쓰세요.","rule":"복수 -es를 떼고, -ces는 -z로 되돌립니다.","items":[{"t":"text","q":"relojes → ___","a":["reloj"]},{"t":"text","q":"lápices → ___","a":["lápiz"]},{"t":"text","q":"flores → ___","a":["flor"]},{"t":"text","q":"luces → ___","a":["luz"]},{"t":"text","q":"peces → ___","a":["pez"]},{"t":"text","q":"hoteles → ___","a":["hotel"]},{"t":"text","q":"trenes → ___","a":["tren"]},{"t":"text","q":"jóvenes → ___","a":["joven"]}]},{"title":"연습 3. 알맞은 복수형 고르기","instr":"알맞은 복수형을 고르세요.","rule":"모음 +s, 자음 +es, -z → -ces","items":[{"t":"pick","q":"un chico → dos ___","o":["chicos","chicoes"],"a":"chicos"},{"t":"pick","q":"una voz → dos ___","o":["vozes","voces"],"a":"voces"},{"t":"pick","q":"un jersey → dos ___","o":["jerseys","jerseyes","jerseis"],"a":"jerseys","why":"jersey처럼 외래어는 -s를 붙이기도 합니다."},{"t":"pick","q":"un rubí → dos ___","o":["rubís","rubíes"],"a":"rubíes"},{"t":"pick","q":"un sofá → dos ___","o":["sofás","sofáes"],"a":"sofás"},{"t":"pick","q":"un miércoles → dos ___","o":["miércoles","miércoleses"],"a":"miércoles"}]},{"title":"연습 4. 남녀 혼합 복수","instr":"알맞은 복수형을 고르세요.","rule":"남성 + 여성의 혼합 복수는 남성 복수형을 씁니다.","items":[{"t":"pick","q":"mi padre y mi madre = mis ___","o":["padres","madres"],"a":"padres"},{"t":"pick","q":"un hijo y una hija = dos ___","o":["hijos","hijas"],"a":"hijos"},{"t":"pick","q":"el rey y la reina = los ___","o":["reyes","reinas"],"a":"reyes"},{"t":"pick","q":"un tío y una tía = mis ___","o":["tíos","tías"],"a":"tíos"},{"t":"pick","q":"un gato y una gata = dos ___","o":["gatos","gatas"],"a":"gatos"},{"t":"pick","q":"un niño y una niña = dos ___","o":["niños","niñas"],"a":"niños"}]}]};</script>
