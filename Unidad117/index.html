<script>window.UNIT={"id":117,"es":"para, para que","ko":"목적절","theory":"<h2>핵심 정리<\/h2>\n<h3>목적절<\/h3>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>조건<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>para + 부정사<\/b><\/td><td>두 절의 주어가 같을 때<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llamé a Antonio para invitarle a la fiesta.\">Llamé a Antonio para invitarle a la fiesta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sonia, Hans y yo nos reunimos todos los viernes para practicar español.\">Sonia, Hans y yo nos reunimos todos los viernes para practicar español.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Fito ha cerrado la puerta para no molestar a sus padres.\">Fito ha cerrado la puerta para no molestar a sus padres.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Anoche me llamó Juan para quedar el domingo.\">Anoche me llamó Juan para quedar el domingo.<\/span><\/td><\/tr><tr><td><b>para que + 접속법<\/b><\/td><td>주어가 다를 때<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan ha escondido el chocolate para que no lo veas.\">Juan ha escondido el chocolate para que no lo veas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He traído un CD nuevo para que lo escuchéis.\">He traído un CD nuevo para que lo escuchéis.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Elvira ha cerrado la puerta para que no les molesten los niños.\">Elvira ha cerrado la puerta para que no les molesten los niños.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gustaría ver a Dolores para que me cuente la fiesta.\">Me gustaría ver a Dolores para que me cuente la fiesta.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><b>현재·미래<\/b> → 접속법 <b>현재<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estoy esperando a Lupe para que me explique este problema.\">Estoy esperando a Lupe para que me explique este problema.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Vamos a ir a León este verano para que Martita conozca a sus tíos.\">Vamos a ir a León este verano para que Martita conozca a sus tíos.<\/span><\/li><li><b>과거<\/b> → 접속법 <b>불완료과거<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer quedé con Jesús para que me enseñara las fotos de las vacaciones.\">Ayer quedé con Jesús para que me enseñara las fotos de las vacaciones.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El domingo fuimos al Museo de la Ciencia para que lo conocieran los niños.\">El domingo fuimos al Museo de la Ciencia para que lo conocieran los niños.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>ir, venir, salir 등 <b>이동 동사<\/b> 뒤에서는 para 대신 <b>a / a que<\/b>를 자주 씁니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Dónde está Lola? —Ha salido un momento a comprar leche.\">—¿Dónde está Lola? —Ha salido un momento a comprar leche.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Uschi viene a casa todos los lunes a que le ayude con el español.\">Uschi viene a casa todos los lunes a que le ayude con el español.<\/span><\/div>","ex":[{"title":"연습 1. para / para que","instr":"알맞은 형태를 고르세요.","rule":"같은 주어 = para + 부정사, 다른 주어 = para que + 접속법.","items":[{"t":"pick","q":"Llamé a Antonio ___ invitarle a la fiesta.","o":["para","para que","por"],"a":"para"},{"t":"pick","q":"Te llamo ___ me ayudes.","o":["para que","para","por"],"a":"para que"},{"t":"pick","q":"Fito ha cerrado la puerta ___ no molestar.","o":["para","para que","a que"],"a":"para"},{"t":"pick","q":"Cierro la puerta ___ no te moleste el ruido.","o":["para que","para","a"],"a":"para que"},{"t":"pick","q":"Estudio ___ aprobar.","o":["para","para que","por"],"a":"para"},{"t":"pick","q":"Te lo explico ___ lo entiendas.","o":["para que","para","por"],"a":"para que"},{"t":"pick","q":"Vamos a León ___ conocer a tus tíos.","o":["para","para que","por"],"a":"para"},{"t":"pick","q":"Vamos a León ___ Martita conozca a sus tíos.","o":["para que","para","por"],"a":"para que"}]},{"title":"연습 2. 접속법 시제","instr":"알맞은 형태를 고르세요.","rule":"현재·미래 → 현재, 과거 → 불완료과거.","items":[{"t":"pick","q":"Estoy esperando a Lupe para que me ___ este problema.","o":["explique","explicara","explica"],"a":"explique"},{"t":"pick","q":"Ayer quedé con Jesús para que me ___ las fotos.","o":["enseñara","enseñe","enseña"],"a":"enseñara"},{"t":"pick","q":"He traído un CD para que lo ___ . (vosotros)","o":["escuchéis","escucharais","escucháis"],"a":"escuchéis"},{"t":"pick","q":"El domingo fuimos al museo para que lo ___ los niños.","o":["conocieran","conozcan","conocen"],"a":"conocieran"},{"t":"pick","q":"Juan ha escondido el chocolate para que no lo ___ . (tú)","o":["veas","vieras","ves"],"a":"veas"},{"t":"pick","q":"Cerré la puerta para que no ___ el ruido. (ellos)","o":["oyeran","oigan","oyen"],"a":"oyeran"},{"t":"pick","q":"Te doy mi número para que me ___ mañana. (tú)","o":["llames","llamaras","llamas"],"a":"llames"},{"t":"pick","q":"Mi madre me dio dinero para que ___ un regalo. (yo)","o":["comprara","compre","compro"],"a":"comprara"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 형태를 쓰세요.","rule":"para + 부정사 / para que + 접속법.","items":[{"t":"text","q":"Voy al mercado para (comprar) ___ fruta.","a":["comprar"]},{"t":"text","q":"Te lo digo para que (tú, saber) ___ la verdad.","a":["sepas"]},{"t":"text","q":"Abro la ventana para que (entrar) ___ el aire.","a":["entre"]},{"t":"text","q":"Estudio mucho para (yo, aprobar) ___ el examen.","a":["aprobar"]},{"t":"text","q":"Te doy la llave para que (tú, poder) ___ entrar.","a":["puedas"]},{"t":"text","q":"Lo hizo para que (nosotros, estar) ___ contentos.","a":["estuviéramos"]},{"t":"text","q":"Compré un libro para (yo, leer) ___ en el tren.","a":["leer"]},{"t":"text","q":"Hablaré con ellos para que (venir) ___ a la fiesta.","a":["vengan"]}]},{"title":"연습 4. a / a que","instr":"알맞은 형태를 고르세요.","rule":"이동 동사 뒤: a(같은 주어), a que(다른 주어).","items":[{"t":"pick","q":"Ha salido un momento ___ comprar leche.","o":["a","para que","por"],"a":"a"},{"t":"pick","q":"Uschi viene a casa ___ que le ayude con el español.","o":["a","para","por"],"a":"a"},{"t":"pick","q":"Vengo ___ ayudarte.","o":["a","a que","para que"],"a":"a"},{"t":"pick","q":"Vengo a que me ___ tu opinión. (tú, dar)","o":["des","das","dieras"],"a":"des"},{"t":"pick","q":"Voy a la tienda ___ comprar pan.","o":["a","a que","para que"],"a":"a"},{"t":"pick","q":"Ana ha venido a que le ___ la mano. (yo, dar)","o":["dé","da","daré"],"a":"dé"}]}]};</script>
