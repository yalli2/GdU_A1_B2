<script>window.UNIT={"id":82,"es":"trabajara, comiera, viviera","ko":"접속법 불완료과거: 규칙동사","theory":"<h2>핵심 정리<\/h2>\n<h3>규칙 활용 (-ra형 / -se형)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>-ar (trabajar)<\/th><th>-er (comer)<\/th><th>-ir (vivir)<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>trabajara / trabajase<\/td><td>comiera / comiese<\/td><td>viviera / viviese<\/td><\/tr><tr><td>tú<\/td><td>trabajaras / trabajases<\/td><td>comieras / comieses<\/td><td>vivieras / vivieses<\/td><\/tr><tr><td>usted, él, ella<\/td><td>trabajara / trabajase<\/td><td>comiera / comiese<\/td><td>viviera / viviese<\/td><\/tr><tr><td>nosotros/as<\/td><td>trabajáramos / trabajásemos<\/td><td>comiéramos / comiésemos<\/td><td>viviéramos / viviésemos<\/td><\/tr><tr><td>vosotros/as<\/td><td>trabajarais / trabajaseis<\/td><td>comierais / comieseis<\/td><td>vivierais / vivieseis<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>trabajaran / trabajasen<\/td><td>comieran / comiesen<\/td><td>vivieran / viviesen<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>-se형은 -ra형보다 덜 쓰입니다. 어간은 <b>3인칭 복수 단순과거<\/b>(trabajaron, comieron, vivieron)에서 -ron을 뗀 것.<\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>nosotros형은 악센트: trabajáramos, comiéramos, viviéramos.<\/div>\n<ul class=\"rules\"><li>시간: <b>과거<\/b>, <b>현재<\/b>, <b>미래<\/b> 모두 가리킬 수 있습니다. — 과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer te llamé. Quería que me ayudases a preparar el examen.\">Ayer te llamé. Quería que me ayudases a preparar el examen.<\/span> / 현재: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Estás ocupada? Me gustaría que vieras algo.\">¿Estás ocupada? Me gustaría que vieras algo.<\/span> / 미래: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Hacéis algo el sábado? Me gustaría que vinierais a casa.\">¿Hacéis algo el sábado? Me gustaría que vinierais a casa.<\/span><\/li><\/ul>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>¡Quién + 접속법 불완료과거!<\/b>: 이루기 어렵거나 불가능한 소망 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Quién viviera cien años!\">¡Quién viviera cien años!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Quién conociera el futuro!\">¡Quién conociera el futuro!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Qué bien pintas! ¡Quién pintara como tú!\">¡Qué bien pintas! ¡Quién pintara como tú!<\/span><\/li><li>과거·가능법 표현 뒤:<\/li><\/ul>\n<p>  - 의지·소망: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El jefe prohibió que usáramos los móviles.\">El jefe prohibió que usáramos los móviles.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis padres querían que estudiara Derecho.\">Mis padres querían que estudiara Derecho.<\/span><\/p>\n<p>  - 감정: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me gustó que no me invitaran.\">No me gustó que no me invitaran.<\/span><\/p>\n<p>  - 평가: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Era lógico que Goyo protestase por la película.\">Era lógico que Goyo protestase por la película.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sería mejor que llamáramos a Chus.\">Sería mejor que llamáramos a Chus.<\/span><\/p>\n<p>  - 가능성: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Era imposible que Pedro encontrase empleo. No lo buscaba.\">Era imposible que Pedro encontrase empleo. No lo buscaba.<\/span><\/p>","ex":[{"title":"연습 1. -ra형 활용","instr":"알맞은 형태를 쓰세요.","rule":"ellos 단순과거에서 -ron을 떼고 -ra, -ras, -ra, -ramos(악센트), -rais, -ran.","items":[{"t":"text","q":"Quería que (yo, trabajar) ___ más.","a":["trabajara"]},{"t":"text","q":"Quería que (tú, comer) ___ más.","a":["comieras"]},{"t":"text","q":"Quería que (ella, vivir) ___ con él.","a":["viviera"]},{"t":"text","q":"Quería que (nosotros, cantar) ___ .","a":["cantáramos"]},{"t":"text","q":"Quería que (vosotros, estudiar) ___ más.","a":["estudiarais"]},{"t":"text","q":"Quería que (ellos, escribir) ___ una carta.","a":["escribieran"]},{"t":"text","q":"Me gustó que (tú, hablar) ___ con ella.","a":["hablaras"]},{"t":"text","q":"Era lógico que (ustedes, beber) ___ agua.","a":["bebieran"]},{"t":"text","q":"Me gustaría que (tú, ver) ___ algo. (ver → viera)","a":["vieras"]},{"t":"text","q":"Era mejor que (yo, llamar) ___ a Chus.","a":["llamara"]}]},{"title":"연습 2. -se형도 알아보기","instr":"알맞은 -se형을 쓰세요.","rule":"-se, -ses, -se, -semos, -seis, -sen.","items":[{"t":"text","q":"Era lógico que Goyo (protestar) ___ .","a":["protestase"]},{"t":"text","q":"Quería que (tú, ayudar) ___ .","a":["ayudases"]},{"t":"text","q":"Era imposible que Pedro (encontrar) ___ empleo.","a":["encontrase"]},{"t":"text","q":"Mis padres querían que (yo, estudiar) ___ .","a":["estudiase"]},{"t":"text","q":"No me gustó que (ellos, hablar) ___ así.","a":["hablasen"]},{"t":"text","q":"Quería que (tú, comer) ___ más.","a":["comieses"]},{"t":"text","q":"Esperaba que (vosotros, vivir) ___ allí.","a":["vivieseis"]},{"t":"text","q":"Prefería que (nosotros, llegar) ___ pronto.","a":["llegásemos"]}]},{"title":"연습 3. ¡Quién + 접속법!","instr":"알맞은 형태를 쓰세요.","rule":"불가능·어려운 소망.","items":[{"t":"text","q":"¡Quién (vivir) ___ cien años!","a":["viviera"]},{"t":"text","q":"¡Quién (pintar) ___ como tú!","a":["pintara"]},{"t":"text","q":"¡Quién (conocer) ___ el futuro!","a":["conociera"]},{"t":"text","q":"¡Quién (cantar) ___ como ella!","a":["cantara"]},{"t":"text","q":"¡Quién (poder) ___ viajar siempre! (poder → pudiera)","a":["pudiera"]},{"t":"text","q":"¡Quién (estudiar) ___ otra vez!","a":["estudiara"]}]},{"title":"연습 4. 시제 선택","instr":"알맞은 형태를 고르세요.","rule":"주절이 과거·가능법이면 접속법 불완료과거.","items":[{"t":"pick","q":"El jefe prohibió que ___ los móviles. (nosotros, usar)","o":["usáramos","usemos","usamos"],"a":"usáramos"},{"t":"pick","q":"Mis padres querían que ___ Derecho. (yo, estudiar)","o":["estudiara","estudie","estudio"],"a":"estudiara"},{"t":"pick","q":"No me gustó que no me ___ . (ellos, invitar)","o":["invitaran","inviten","invitan"],"a":"invitaran"},{"t":"pick","q":"Sería mejor que ___ a Chus. (nosotros, llamar)","o":["llamáramos","llamemos","llamamos"],"a":"llamáramos"},{"t":"pick","q":"Es mejor que ___ a Chus. (nosotros, llamar)","o":["llamemos","llamáramos","llamábamos"],"a":"llamemos"},{"t":"pick","q":"Quiero que me ___ . (tú, ayudar)","o":["ayudes","ayudaras","ayudarás"],"a":"ayudes"},{"t":"pick","q":"Quería que me ___ . (tú, ayudar)","o":["ayudaras","ayudes","ayudas"],"a":"ayudaras"},{"t":"pick","q":"Me gustaría que ___ pronto a casa. (vosotros, llegar)","o":["llegarais","lleguéis","llegáis"],"a":"llegarais"}]}]};</script>
