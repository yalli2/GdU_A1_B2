<script>window.UNIT={"id":124,"es":"adiós, león, continúa","ko":"강세 규칙 (2)","theory":"<h2>핵심 정리<\/h2>\n<h3>i/u + e/a/o → 한 음절 (이중모음)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"a-gua\">a-gua<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ai-re\">ai-re<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"aus-tra-lia-no\">aus-tra-lia-no<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"can-ción\">can-ción<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cien-to\">cien-to<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cruel\">cruel<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"die-ci-nue-ve\">die-ci-nue-ve<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"em-pie-za\">em-pie-za<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ju-lio\">ju-lio<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"jus-ti-cia\">jus-ti-cia<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"nues-tro\">nues-tro<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"pei-ne\">pei-ne<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"lim-piáis\">lim-piáis<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>단어 끝의 <b>y<\/b> = i: Para-guay, buey<\/div>\n<ul class=\"rules\"><li><b>일반 강세 규칙<\/b>을 그대로 따릅니다:<\/li><\/ul>\n<p>  - 자음(n, s 제외)으로 끝 → 마지막 음절: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"remedial\">remedial<\/span><\/p>\n<p>  - 모음, n, s로 끝 → 끝에서 둘째 음절: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"empieza\">empieza<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ciento\">ciento<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"nuestro\">nuestro<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"julio\">julio<\/span><\/p>\n<p>  - 규칙에 어긋나면 <b>e/a/o 위에 tilde<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"huésped\">huésped<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"canción\">canción<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dieciséis\">dieciséis<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"adiós\">adiós<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"farmacéutico\">farmacéutico<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"limpiáis\">limpiáis<\/span><\/p>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>단, <b>-ay, -ey, -oy, -uy<\/b> 로 끝나면 tilde 없음: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"estoy\">estoy<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Paraguay\">Paraguay<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Uruguay\">Uruguay<\/span><\/div>\n<ul class=\"rules\"><li><b>한 음절<\/b> 단어에는 tilde 없음: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dio\">dio<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"vio\">vio<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"fui\">fui<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"rey\">rey<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"seis\">seis<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"soy\">soy<\/span><\/li><\/ul>\n<h3>i + u (삼중모음 아님) → 한 음절<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cir-cui-to\">cir-cui-to<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"rui-do\">rui-do<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"viu-do\">viu-do<\/span> — tilde가 필요하면 <b>두 번째 모음<\/b> 위: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cuí-da-los\">cuí-da-los<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"vein-tiún\">vein-tiún<\/span><\/li><\/ul>\n<h3>a, e, o 끼리 → 두 음절 (hiato)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"a-é-re-o\">a-é-re-o<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"a-ho-ra\">a-ho-ra<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"a-ma-os\">a-ma-os<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"le-ón\">le-ón<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"lí-ne-a\">lí-ne-a<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"mo-ve-os\">mo-ve-os<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"o-a-sis\">o-a-sis<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"re-ha-cer\">re-ha-cer<\/span><\/li><\/ul>\n<h3>강세가 오는 i, u + e/a/o → 두 음절 (hiato)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ma-rí-a\">Ma-rí-a<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"a-brí-ais\">a-brí-ais<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dor-mí-os\">dor-mí-os<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"huí-a\">huí-a<\/span><\/li><li>일반 규칙: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"re-ís\">re-ís<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"con-ti-nu-a-mos\">con-ti-nu-a-mos<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>강세가 <b>i, u<\/b>에 있으면 <b>항상 tilde<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"o-ír\">o-ír<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dí-a\">dí-a<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ha-bí-a\">ha-bí-a<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"bú-ho\">bú-ho<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"rí-o\">rí-o<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ra-úl\">Ra-úl<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"ma-íz\">ma-íz<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"son-rí-o\">son-rí-o<\/span><\/div>\n<div class=\"tw\"><table><thead><tr><th>continuar<\/th><th>reír<\/th><th>prohibir<\/th><\/tr><\/thead><tbody><tr><td>continúo, continúas, continúa, continuamos, continuáis, continúan<\/td><td>río, ríes, ríe, reímos, reís, ríen<\/td><td>prohíbo, prohíbes, prohíbe, prohibimos, prohibís, prohíben<\/td><\/tr><\/tbody><\/table><\/div>","ex":[{"title":"연습 1. 한 음절? 두 음절?","instr":"알맞은 음절 수를 고르세요.","rule":"i/u + e/a/o는 한 음절, a/e/o 끼리와 강세 i/u는 두 음절.","items":[{"t":"pick","q":"agua 은(는) ___ 이다.","o":["두 음절","한 음절","세 음절"],"a":"두 음절"},{"t":"pick","q":"cruel 은(는) ___ 이다.","o":["한 음절","두 음절","세 음절"],"a":"한 음절"},{"t":"pick","q":"seis 은(는) ___ 이다.","o":["한 음절","두 음절","세 음절"],"a":"한 음절"},{"t":"pick","q":"león 은(는) ___ 이다.","o":["두 음절","한 음절","세 음절"],"a":"두 음절"},{"t":"pick","q":"maíz 은(는) ___ 이다.","o":["두 음절","한 음절","세 음절"],"a":"두 음절"},{"t":"pick","q":"día 은(는) ___ 이다.","o":["두 음절","한 음절","세 음절"],"a":"두 음절"},{"t":"pick","q":"rey 은(는) ___ 이다.","o":["한 음절","두 음절","세 음절"],"a":"한 음절"},{"t":"pick","q":"aéreo 은(는) ___ 이다.","o":["네 음절","세 음절","두 음절"],"a":"네 음절"}]},{"title":"연습 2. tilde 필요 여부","instr":"올바른 철자를 고르세요.","rule":"한 음절 단어·-ay/-ey/-oy/-uy는 tilde 없음.","items":[{"t":"pick","q":"올바른 철자: ___ (한 음절)","o":["dio","dió","díó"],"a":"dio"},{"t":"pick","q":"올바른 철자: ___ (한 음절)","o":["fui","fuí","fúi"],"a":"fui"},{"t":"pick","q":"올바른 철자: ___","o":["rey","réy","reí"],"a":"rey"},{"t":"pick","q":"올바른 철자: ___","o":["estoy","estóy","estoí"],"a":"estoy"},{"t":"pick","q":"올바른 철자: ___","o":["Uruguay","Uruguáy","Urugúay"],"a":"Uruguay"},{"t":"pick","q":"올바른 철자: ___","o":["seis","séis","seís"],"a":"seis"},{"t":"pick","q":"올바른 철자: ___","o":["adiós","adios","ádios"],"a":"adiós"},{"t":"pick","q":"올바른 철자: ___","o":["canción","cancion","cáncion"],"a":"canción"}]},{"title":"연습 3. 강세가 i, u에 있을 때","instr":"tilde가 있는 올바른 철자를 쓰세요.","rule":"i, u에 강세 + e/a/o → 항상 tilde.","items":[{"t":"text","q":"Me llamo ___ . (Maria)","a":["María"]},{"t":"text","q":"Hoy es mi ___ de suerte. (dia)","a":["día"]},{"t":"text","q":"Quiero ___ música. (oir)","a":["oír"]},{"t":"text","q":"___ muchos problemas. (habia)","a":["Había"]},{"t":"text","q":"Es un ___ muy grande. (rio)","a":["río"]},{"t":"text","q":"El ___ vuela de noche. (buho)","a":["búho"]},{"t":"text","q":"Me gusta el ___ . (maiz)","a":["maíz"]},{"t":"text","q":"Mi hermana ___ mucho. (reír)","a":["ríe"]}]},{"title":"연습 4. 동사 활용과 tilde","instr":"알맞은 형태를 고르세요.","rule":"continuar(continúo), reír(río), prohibir(prohíbo).","items":[{"t":"pick","q":"yo ___ (continuar)","o":["continúo","continuo","continuó"],"a":"continúo"},{"t":"pick","q":"nosotros ___ (continuar)","o":["continuamos","continúamos","continuámos"],"a":"continuamos"},{"t":"pick","q":"tú ___ (reír)","o":["ríes","ries","riés"],"a":"ríes"},{"t":"pick","q":"nosotros ___ (reír)","o":["reímos","ríemos","reimos"],"a":"reímos"},{"t":"pick","q":"yo ___ (prohibir)","o":["prohíbo","prohibo","prohibó"],"a":"prohíbo"},{"t":"pick","q":"vosotros ___ (prohibir)","o":["prohibís","prohíbis","prohibis"],"a":"prohibís"},{"t":"pick","q":"ellos ___ (continuar)","o":["continúan","continuan","continúán"],"a":"continúan"},{"t":"pick","q":"ellos ___ (reír)","o":["ríen","rien","riên"],"a":"ríen"}]}]};</script>
