<script>window.UNIT={"id":93,"es":"Viajar es estupendo","ko":"부정사","theory":"<h2>핵심 정리<\/h2>\n<h3>형태<\/h3>\n<div class=\"tw\"><table><thead><tr><th>-ar<\/th><th>-er<\/th><th>-ir / -ír<\/th><\/tr><\/thead><tbody><tr><td>trabajar, cantar<\/td><td>comer, correr<\/td><td>vivir, reír<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>남성 단수 명사<\/b>처럼: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El tabaco es malo.\">El tabaco es malo.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Fumar es malo.\">Fumar es malo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Las compras son aburridas.\">Las compras son aburridas.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Comprar es aburrido.\">Comprar es aburrido.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Conducir es fácil.\">Conducir es fácil.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Viajar es estupendo.\">Viajar es estupendo.<\/span><\/li><li><b>동사 + 부정사<\/b>: conseguir, dejar(=허락하다), esperar, hacer(=시키다), necesitar, oír, poder, preferir, querer, saber, ver… — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Por fin he conseguido terminar el proyecto.\">Por fin he conseguido terminar el proyecto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No nos dejan usar el móvil en clase.\">No nos dejan usar el móvil en clase.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesitamos cambiar dinero.\">Necesitamos cambiar dinero.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito descansar.\">Necesito descansar.<\/span><\/li><li><b>동사 + 전치사 + 부정사<\/b>:<\/li><\/ul>\n<p>  - <b>a<\/b>: aprender, empezar, enseñar, ir, salir, venir — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estoy aprendiendo a conducir.\">Estoy aprendiendo a conducir.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Salimos a dar una vuelta?\">¿Salimos a dar una vuelta?<\/span><\/p>\n<p>  - <b>de<\/b>: acordarse, encargarse, olvidarse, tratar — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me olvidé de despertarte.\">Me olvidé de despertarte.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ese chico siempre trata de engañarnos.\">Ese chico siempre trata de engañarnos.<\/span><\/p>\n<p>  - <b>en<\/b>: dudar, insistir, interesarse — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Si tienes algún problema, no dudes en llamarme.\">Si tienes algún problema, no dudes en llamarme.<\/span><\/p>\n<p>  - <b>con<\/b>: amenazar, soñar — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos ha amenazado con contarle todo a Teresa.\">Nos ha amenazado con contarle todo a Teresa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"De pequeña, soñaba con ser bailarina.\">De pequeña, soñaba con ser bailarina.<\/span><\/p>\n<ul class=\"rules\"><li><b>명령 대신<\/b> (주로 글에서 지시·금지): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No entrar.\">No entrar.<\/span> (= No entren), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Instrucciones: asar dos pimientos y pelarlos…\">Instrucciones: asar dos pimientos y pelarlos…<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 형태 쓰기","instr":"알맞은 부정사를 쓰세요.","rule":"-ar, -er, -ir.","items":[{"t":"text","q":"(trabajar) Me gusta ___ en equipo.","a":["trabajar"]},{"t":"text","q":"(comer) Voy a ___ en casa.","a":["comer"]},{"t":"text","q":"(vivir) Quiero ___ en el campo.","a":["vivir"]},{"t":"text","q":"(conducir) ___ es fácil.","a":["Conducir"]},{"t":"text","q":"(fumar) ___ es malo.","a":["Fumar"]},{"t":"text","q":"(viajar) ___ es estupendo.","a":["Viajar"]},{"t":"text","q":"(comprar) ___ es aburrido.","a":["Comprar"]},{"t":"text","q":"(descansar) Necesito ___ .","a":["descansar"]}]},{"title":"연습 2. 동사 + 부정사","instr":"알맞은 동사를 고르세요.","rule":"
