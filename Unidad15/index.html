 tabindex=\"0\" data-say=\"Estas camisas son más caras.\">Estas camisas son más caras.<\/span><\/li><\/ul>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>mayor, menor, mejor, peor는 <b>성<\/b>의 구별이 없고 복수만 -es: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"mayores\">mayores<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"menores\">menores<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"mejores\">mejores<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"peores\">peores<\/span><\/div>\n<ul class=\"rules\"><li>que + <b>주격 인칭대명사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Eres más fuerte que yo.\">Eres más fuerte que yo.<\/span> (que mí ✗), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Somos menos altos que vosotros.\">Somos menos altos que vosotros.<\/span><\/li><li>비교 대상 생략: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este piso es pequeño. Yo quiero uno más grande.\">Este piso es pequeño. Yo quiero uno más grande.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. más / menos","instr":"알맞은 비교 표현을 고르세요.","rule":"우등 = más, 열등 = menos.","items":[{"t":"pick","q":"Un elefante es ___ grande que un caballo.","o":["más","menos"],"a":"más"},{"t":"pick","q":"Una hormiga es ___ grande que un gato.","o":["más","menos"],"a":"menos"},{"t":"pick","q":"Madrid es ___ caro que un pueblo pequeño.","o":["más","menos"],"a":"más"},{"t":"pick","q":"El tren es ___ rápido que el avión.","o":["más","menos"],"a":"menos"},{"t":"pick","q":"Marta es ___ trabajadora que Laura.","o":["más","menos"],"a":"menos"},{"t":"pick","q":"Una jirafa es ___ alta que un oso.","o":["más","menos"],"a":"más"}]},{"title":"연습 2. 불규칙 비교급","instr":"알맞은 비교급을 고르세요.","rule":"bueno → mejor, malo → peor, viejo/나이 → mayor, joven → menor. (más bueno ✗)","items":[{"t":"pick","q":"El coche de Ana es ___ que el de Álvaro. (더 좋음)","o":["mejor","más bueno","mayor"],"a":"mejor"},{"t":"pick","q":"Este café
