<script>window.UNIT={"id":83,"es":"fuera, tuviera…","ko":"접속법 불완료과거: 불규칙동사","theory":"<h2>핵심 정리<\/h2>\n<h3>3인칭 복수 단순과거 어간 + -ra / -se<\/h3>\n<div class=\"tw\"><table><thead><tr><th>유형<\/th><th>동사<\/th><th>-ra형 (yo)<\/th><\/tr><\/thead><tbody><tr><td>e → i<\/td><td>pedir, elegir, sentir<\/td><td>pidiera, eligiera, sintiera<\/td><\/tr><tr><td>o → u<\/td><td>dormir, morir<\/td><td>durmiera, muriera<\/td><\/tr><tr><td>불규칙 어간<\/td><td>dar → d-<\/td><td>diera<\/td><\/tr><tr><td><\/td><td>estar → estuv-<\/td><td>estuviera<\/td><\/tr><tr><td><\/td><td>haber → hub-<\/td><td>hubiera<\/td><\/tr><tr><td><\/td><td>hacer → hic-<\/td><td>hiciera<\/td><\/tr><tr><td><\/td><td>poder → pud-<\/td><td>pudiera<\/td><\/tr><tr><td><\/td><td>poner → pus-<\/td><td>pusiera<\/td><\/tr><tr><td><\/td><td>querer → quis-<\/td><td>quisiera<\/td><\/tr><tr><td><\/td><td>saber → sup-<\/td><td>supiera<\/td><\/tr><tr><td><\/td><td>tener → tuv-<\/td><td>tuviera<\/td><\/tr><tr><td><\/td><td>venir → vin-<\/td><td>viniera<\/td><\/tr><tr><td>-y-<\/td><td>caer → cay-, leer → ley-, oír → oy-, huir → huy-, construir<\/td><td>cayera, leyera, oyera, huyera<\/td><\/tr><tr><td>-j-<\/td><td>traducir → traduj-, traer → traj-, decir → dij-<\/td><td>tradujera, trajera, dijera<\/td><\/tr><tr><td>기타<\/td><td>ir/ser → fu-, reír → ri-<\/td><td>fuera, riera<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>어미: -iera/-era, -ieras/-eras, -iera/-era, -iéramos/-éramos, -ierais/-erais, -ieran/-eran (-se형: -iese/-ese…).<\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>¡Quién + 접속법!<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Quién pudiera nadar como tú!\">¡Quién pudiera nadar como tú!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Quién fuera Spielberg!\">¡Quién fuera Spielberg!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Quién tuviera treinta años menos!\">¡Quién tuviera treinta años menos!<\/span><\/li><li><b>의지 -, d-, fu-.","items":[{"t":"text","q":"Quería que (tú, tener) ___ más tiempo.","a":["tuvieras"]},{"t":"text","q":"Me extrañaría que Alfonso (estar) ___ en casa.","a":["estuviera"]},{"t":"text","q":"Quería que (tú, hacer) ___ un favor.","a":["hicieras"]},{"t":"text","q":"¡Quién (poder) ___ nadar como tú!","a":["pudiera"]},{"t":"text","q":"Era lógico que (ella, querer) ___ irse.","a":["quisiera"]},{"t":"text","q":"Puede que Juan (saber) ___ que había examen.","a":["supiera"]},{"t":"text","q":"Me extrañó que no (vosotros, venir) ___ .","a":["vinierais"]},{"t":"text","q":"Me gustaría que (tú, dar) ___ una respuesta.","a":["dieras"]},{"t":"text","q":"¡Quién (ser) ___ Spielberg!","a":["fuera"]},{"t":"text","q":"Mis padres querían que (yo, ir) ___ a la universidad.","a":["fuera"]},{"t":"text","q":"Quería que (ellos, poner) ___ la mesa.","a":["pusieran"]},{"t":"text","q":"Me gustaría que (haber) ___ más tiempo.","a":["hubiera"]}]},{"title":"연습 3. -y-, -j- 형","instr":"알맞은 형태를 고르세요.","rule":"leer → leyera, caer → cayera, decir → dijera, traer → trajera.","items":[{"t":"pick","q":"Me extrañó que (tú, leer) ___ eso.","o":["leyeras","leieras","leyieras"],"a":"leyeras"},{"t":"pick","q":"Era posible que (él, caer) ___ .","o":["cayera","cayiera","caiera"],"a":"cayera"},{"t":"pick","q":"Quería que me (tú, decir) ___ la verdad.","o":["dijeras","decieras","dijieras"],"a":"dijeras"},{"t":"pick","q":"Me gustaría que (vosotros, traer) ___ vino.","o":["trajerais","traieseis","traerais"],"a":"trajerais"},{"t":"pick","q":"No me gustó que (ellos, oír) ___ eso.","o":["oyeran","oieran","oyieran"],"a":"oyeran"},{"t":"pick","q":"Era lógico que (ellos, huir) ___ .","o":["huyeran","huiran","huyieran"],"a":"huyeran"},{"t":"pick","q":"Quería que (tú, traducir) ___ el texto.","o":["tradujeras","traduciras","tradujieras"],"a":"tradujeras"},{"t":"pick","q":"Era mejor que (nosotros, construir) ___ más.","o":["construyéramos","construiéramos","construyiéramos"],"a":"construyéramos"}]},{"title":"연습 4. 문장
