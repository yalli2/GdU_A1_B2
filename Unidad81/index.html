<script>window.UNIT={"id":81,"es":"conozca, diga, vaya…","ko":"접속법 현재: 불규칙동사 (2)","theory":"<h2>핵심 정리<\/h2>\n<h3>직설법 현재 yo형에서 만드는 동사<\/h3>\n<div class=\"tw\"><table><thead><tr><th>동사<\/th><th>yo형<\/th><th>접속법 현재 (yo, tú, él, nosotros, vosotros, ellos)<\/th><\/tr><\/thead><tbody><tr><td>conocer (-zco)<\/td><td>conozco<\/td><td>conozca, conozcas, conozca, conozcamos, conozcáis, conozcan<\/td><\/tr><tr><td>huir (-y-)<\/td><td>huyo<\/td><td>huya, huyas, huya, huyamos, huyáis, huyan<\/td><\/tr><tr><td>traer<\/td><td>traigo<\/td><td>traiga, traigas, traiga, traigamos, traigáis, traigan<\/td><\/tr><tr><td>decir<\/td><td>digo<\/td><td>diga, digas, diga, digamos, digáis, digan<\/td><\/tr><tr><td>hacer<\/td><td>hago<\/td><td>haga, hagas, haga, hagamos, hagáis, hagan<\/td><\/tr><tr><td>oír<\/td><td>oigo<\/td><td>oiga, oigas, oiga, oigamos, oigáis, oigan<\/td><\/tr><tr><td>poner<\/td><td>pongo<\/td><td>ponga, pongas, ponga, pongamos, pongáis, pongan<\/td><\/tr><tr><td>salir<\/td><td>salgo<\/td><td>salga, salgas, salga, salgamos, salgáis, salgan<\/td><\/tr><tr><td>tener<\/td><td>tengo<\/td><td>tenga, tengas, tenga, tengamos, tengáis, tengan<\/td><\/tr><tr><td>venir<\/td><td>vengo<\/td><td>venga, vengas, venga, vengamos, vengáis, vengan<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>그 밖의 불규칙<\/h3>\n<div class=\"tw\"><table><thead><tr><th>동사<\/th><th>활용<\/th><\/tr><\/thead><tbody><tr><td>ir<\/td><td>vaya, vayas, vaya, vayamos, vayáis, vayan<\/td><\/tr><tr><td>saber<\/td><td>sepa, sepas, sepa, sepamos, sepáis, sepan<\/td><\/tr><tr><td>haber<\/td><td>haya<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>conocer 유형: conducir, obedecer, parecer, reconocer, traducir / huir 유형: concluir, construir, contribuir, destruir, influir / traer 유형: caer(se)<\/li><\/ul>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>소망<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Ojalá no haya más guerras!\">¡Ojalá no haya más guerras!<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ven, quiero que conozcas a Teresa.\">Ven, quiero que conozcas a Teresa.<\/span><\/li><li><b>가능성<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Estás esperando a Manuel? —Sí, pero puede que no venga hoy. Tenía mucho trabajo.\">—¿Estás esperando a Manuel? —Sí, pero puede que no venga hoy. Tenía mucho trabajo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es imposible que te oigan. Están muy lejos.\">Es imposible que te oigan. Están muy lejos.<\/span><\/li><li><b>감정<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Siento que Alberto no vaya a tu concierto, pero no se encuentra bien.\">Siento que Alberto no vaya a tu concierto, pero no se encuentra bien.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me importa que lo sepa.\">No me importa que lo sepa.<\/span><\/li><li><b>평가<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es lógico que construyan más carreteras.\">Es lógico que construyan más carreteras.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me parece una vergüenza que no sepas freír un huevo.\">Me parece una vergüenza que no sepas freír un huevo.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. yo형에서 만들기","instr":"알맞은 접속법 형태를 쓰세요.","rule":"conozco → conozca, digo → diga, hago → haga…","items":[{"t":"text","q":"Quiero que (tú, conocer) ___ a Teresa.","a":["conozcas"]},{"t":"text","q":"Espero que (ella, venir) ___ hoy.","a":["venga"]},{"t":"text","q":"Es posible que (yo, tener) ___ tiempo.","a":["tenga"]},{"t":"text","q":"Quiero que (tú, decir) ___ la verdad.","a":["digas"]},{"t":"text","q":"Es lógico que (ellos, construir) ___ más carreteras.","a":["construyan"]},{"t":"text","q":"Me gusta que (vosotros, traer) ___ regalos.","a":["traigáis"]},{"t":"text","q":"Puede que (nosotros, salir) ___ temprano.","a":["salgamos"]},{"t":"text","q":"Es imposible que te (ellos, oír) ___ .","a":["oigan"]},{"t":"text","q":"Quiero que (tú
