<script>window.UNIT={"id":38,"es":"lo/la/le","ko":"목적어 대명사의 혼동","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th>형태<\/th><th>용도<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>lo, la, los, las<\/b><\/td><td><b>직접목적어<\/b> (…을/를)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Me dejas el diccionario? — No puedo. Lo necesito.\">¿Me dejas el diccionario? — No puedo. Lo necesito.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Amas a Juan? — Sí, lo amo.\">¿Amas a Juan? — Sí, lo amo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quieres a tus padres? — Sí, los quiero.\">¿Quieres a tus padres? — Sí, los quiero.<\/span><\/td><\/tr><tr><td><b>le, les<\/b><\/td><td><b>간접목적어<\/b> (…에게)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué le has regalado a Pedro? — Le he regalado una cartera.\">¿Qué le has regalado a Pedro? — Le he regalado una cartera.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Elena le duele la cabeza.\">A Elena le duele la cabeza.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>일부 화자(특히 스페인)는 사람 직접목적어에 <b>le / les<\/b>를 쓰기도 합니다(leísmo): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Amas a Juan? — Sí, le amo.\">¿Amas a Juan? — Sí, le amo.<\/span> 그러나 사물에는 lo/la를 씁니다.<\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>틀리기 쉬운 문장: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Me dejas el diccionario? — No puedo. Lo necesito.\">¿Me dejas el diccionario? — No puedo. Lo necesito.<\/span> (le necesito ✗), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Di a Sofía que la llaman por teléfono.\">Di a Sofía que la llaman por teléfono.<\/span> (직접), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A María le he regalado unos pendientes.\">A María le he regalado unos pendientes.<\/span> (la ✗)<\/div>\n<ul class=\"rules\"><li>대명사가 두 개일 때 le, les → <b>se<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Le has dado la carta a Joaquín? — Sí, se la he dado.\">¿Le has dado la carta a Joaquín? — Sí, se la he dado.<\/span><\/li><li><b>lo<\/b>는 앞서 주어진 <b>정보 전체<\/b>를 직접목적어로 받습니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Sabes que Chávez está muy enfermo? — Sí, lo sé.\">¿Sabes que Chávez está muy enfermo? — Sí, lo sé.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Le has dicho a Juan que me caso? — Sí, se lo he dicho, pero no se lo cree.\">¿Le has dicho a Juan que me caso? — Sí, se lo he dicho, pero no se lo cree.<\/span><\/li><li>놀람·반대를 나타내는 표현에서: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Felipe no es argentino. — Claro que lo es.\">Felipe no es argentino. — Claro que lo es.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. lo / la / los / las","instr":"알맞은 직접목적어 대명사를 고르세요.","rule":"직접목적어는 대상의 성·수에 일치.","items":[{"t":"pick","q":"¿Me dejas el diccionario? — No puedo. ___ necesito.","o":["Lo","Le","La"],"a":"Lo"},{"t":"pick","q":"¿Me dejas la pluma? — No puedo. ___ necesito.","o":["La","Le","Lo"],"a":"La"},{"t":"pick","q":"¿Quieres a tus padres? — Sí, ___ quiero.","o":["los","les","lo"],"a":"los"},{"t":"pick","q":"¿Amas a Juan? — Sí, ___ amo.","o":["lo","le","la"],"a":"lo"},{"t":"pick","q":"¿Ves las fotos? — Sí, ___ veo.","o":["las","los","les"],"a":"las"},{"t":"pick","q":"¿Llamas a María? — Sí, ___ llamo.","o":["la","le","lo"],"a":"la"}]},{"title":"연습 2. le / les (간접)","instr":"알맞은 간접목적어 대명사를 고르세요.","rule":"…에게 = le/les.","items":[{"t":"pick","q":"¿Qué ___ has regalado a Pedro?","o":["le","lo","la"],"a":"le"},{"t":"pick","q":"A Elena ___ duele la cabeza.","o":["le","la","lo"],"a":"le"},{"t":"pick","q":"A María ___ he regalado unos pendientes.","o":["le","la","lo"],"a":"le"},{"t":"pick","q":"A los niños ___ he enseñado la casa.","o":["les","los","las"],"a":"les"},{"t":"pick","q":"A Juan ___ han regalado un disco.","o":["le","lo","se"],"a":"le"},{"t":"pick","q":"¿Qué ___ pasa a Elena?","o":["le","la","lo"],"a":"le"}]},{"title":"연습 3. 직접인가 간접인가","instr":"알맞은 것을 고르세요.","rule":"동사가 ‘~을(를)’을 취하면 직접(lo/la), ‘~에게’를 취하면 간접(le).","items":[{"t":"pick","q":"A Sofía ___ llaman por teléfono. (Sofía를 부르다: 직접)","o":["la","le"],"a":"la"},{"t":"pick","q":"A Sofía ___ digo la verdad. (Sofía에게: 간접)","o":["le","la"],"a":"le"},{"t":"pick","q":"A tu hermano ___ he visto ayer. (직접)","o":["lo","le"],"a":"lo"},{"t":"pick","q":"A tu hermano ___ he escrito una carta. (간접)","o":["le","lo"],"a":"le"},{"t":"pick","q":"A los niños ___ cuido. (직접)","o":["los","les"],"a":"los"},{"t":"pick","q":"A los niños ___ cuento un cuento. (간접)","o":["les","los"],"a":"les"}]},{"title":"연습 4. lo = 정보","instr":"알맞은 것을 고르세요.","rule":"앞서 말한 정보 전체는 중성 lo로 받습니다.","items":[{"t":"pick","q":"¿Sabes que Chávez está enfermo? — Sí, ___ sé.","o":["lo","le","la"],"a":"lo"},{"t":"pick","q":"¿Sabes que me caso? — No, no ___ sabía.","o":["lo","le","la"],"a":"lo"},{"t":"pick","q":"Felipe no es argentino. — Claro que ___ es.","o":["lo","le","la"],"a":"lo"},{"t":"pick","q":"¿Le has dicho a Juan que me caso? — Sí, ___ lo he dicho.","o":["se","le","la"],"a":"se"}]}]};</script>
