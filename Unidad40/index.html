<script>window.UNIT={"id":40,"es":"me ducho, nos queremos","ko":"재귀·상호 대명사","theory":"<h2>핵심 정리<\/h2>\n<p><b>재귀대명사<\/b>는 동사의 행위가 <b>주어 자신<\/b>에게 돌아올 때 씁니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>재귀대명사<\/th><th>예 (ducharse)<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td><b>me<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me ducho todos los días.\">Me ducho todos los días.<\/span><\/td><\/tr><tr><td>tú<\/td><td><b>te<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te duchas.\">Te duchas.<\/span><\/td><\/tr><tr><td>usted, él, ella<\/td><td><b>se<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ricardo se afeita todas las mañanas.\">Ricardo se afeita todas las mañanas.<\/span><\/td><\/tr><tr><td>nosotros/as<\/td><td><b>nos<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos duchamos.\">Nos duchamos.<\/span><\/td><\/tr><tr><td>vosotros/as<\/td><td><b>os<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Os duchéis.\">Os duchéis.<\/span><\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td><b>se<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se duchan.\">Se duchan.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>행위가 주어 자신에게 돌아옴: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me ducho.\">Me ducho.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rut se viste después de desayunar.\">Rut se viste después de desayunar.<\/span><\/li><li>주어의 <b>신체 부위·옷<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me lavo el pelo.\">Me lavo el pelo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos ponemos una bata para trabajar.\">Nos ponemos una bata para trabajar.<\/span><\/li><\/ul>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>대상이 다른 사람이면 재귀대명사 없이: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rut viste a los niños.\">Rut viste a los niños.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Afeito a unas seis personas.\">Afeito a unas seis personas.<\/span><\/div>\n<h3>상호 용법 (서로)<\/h3>\n<p><b>nos, os, se<\/b>는 두 사람 이상이 <b>서로<\/b> 행위를 할 때도 씁니다.<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos queremos.\">Nos queremos.<\/span> (그녀는 나를, 나는 그녀를 사랑해요)<\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Os conocéis Marisa y tú?\">¿Os conocéis Marisa y tú?<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan y su padre se entienden muy bien.\">Juan y su padre se entienden muy bien.<\/span><\/div>","ex":[{"title":"연습 1. 재귀대명사 고르기","instr":"알맞은 재귀대명사를 고르세요.","rule":"주어와 인칭이 같은 재귀대명사: me, te, se, nos, os, se.","items":[{"t":"pick","q":"(yo) ___ ducho todos los días.","o":["Me","Te","Se"],"a":"Me"},{"t":"pick","q":"(tú) ___ levantas a las siete.","o":["Te","Me","Se"],"a":"Te"},{"t":"pick","q":"(Ricardo) ___ afeita todas las mañanas.","o":["Se","Me","Te"],"a":"Se"},{"t":"pick","q":"(nosotros) ___ acostamos tarde.","o":["Nos","Os","Se"],"a":"Nos"},{"t":"pick","q":"(vosotros) ¿___ laváis las manos?","o":["Os","Nos","Se"],"a":"Os"},{"t":"pick","q":"(ellos) ___ visten rápido.","o":["Se","Nos","Os"],"a":"Se"}]},{"title":"연습 2. 재귀 vs 타동","instr":"알맞은 것을 고르세요.","rule":"행위가 자기 자신에게 돌아오면 재귀, 다른 사람에게 하면 재귀대명사 없이.","items":[{"t":"pick","q":"Rut ___ viste después de desayunar. (자기 자신)","o":["se","—","le"],"a":"se"},{"t":"pick","q":"Rut ___ viste a los niños. (아이들에게)","o":["—","se","le"],"a":"—"},{"t":"pick","q":"Me lavo ___ pelo.","o":["el","mi","—"],"a":"el"},{"t":"pick","q":"Nos ponemos ___ bata para trabajar.","o":["una","mi","—"],"a":"una"},{"t":"pick","q":"Yo ___ afeito a unas seis personas. (타인)","o":["—","me","se"],"a":"—"},{"t":"pick","q":"¿Tú ___ peinas?","o":["te","—","se"],"a":"te"}]},{"title":"연습 3. 상호 용법","instr":"알맞은 대명사를 고르세요.","rule":"‘서로’의 의미: nos, os, se.","items":[{"t":"pick","q":"(우리는 서로 사랑한다) ___ queremos.","o":["Nos","Me","Se"],"a":"Nos"},{"t":"pick","q":"¿___ conocéis Marisa y tú? (서로)","o":["Os","Nos","Se"],"a":"Os"},{"t":"pick","q":"Juan y su padre ___ entienden muy bien.","o":["se","nos","os"],"a":"se"},{"t":"pick","q":"Ana y yo ___ escribimos a menudo.","o":["nos","os","se"],"a":"nos"},{"t":"pick","q":"Pedro y Luis ___ ven todos los días.","o":["se","nos","os"],"a":"se"},{"t":"pick","q":"Vosotros ___ ayudáis mucho.","o":["os","nos","se"],"a":"os"}]},{"title":"연습 4. 문장 완성","instr":"재귀대명사 또는 재귀동사를 완성하세요.","rule":"재귀동사: ducharse, afeitarse, lavarse, vestirse, peinarse…","items":[{"t":"text","q":"Yo me ___ por la mañana. (ducharse)","a":["ducho"]},{"t":"text","q":"Tú te ___ el pelo. (lavarse)","a":["lavas"]},{"t":"text","q":"Mi padre se ___ todas las mañanas. (afeitarse)","a":["afeita"]},{"t":"text","q":"Nosotros nos ___ para ir a la fiesta. (vestirse)","a":["vestimos"]},{"t":"text","q":"Vosotros os ___ rápido. (peinarse)","a":["peináis"]},{"t":"text","q":"Ellos se ___ a las once. (acostarse)","a":["acuestan"]}]}]};</script>
