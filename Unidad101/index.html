<script>window.UNIT={"id":101,"es":"hoy, ayer, entonces, luego…","ko":"시간 부사 (1)","theory":"<h2>핵심 정리<\/h2>\n<h3>날짜 부사<\/h3>\n<div class=\"tw\"><table><thead><tr><th>anteayer<\/th><th>ayer<\/th><th>anoche<\/th><th>hoy<\/th><th>ahora<\/th><th>mañana<\/th><th>pasado mañana<\/th><\/tr><\/thead><tbody><tr><td>그저께<\/td><td>어제<\/td><td>어젯밤<\/td><td>오늘<\/td><td>지금<\/td><td>내일<\/td><td>모레<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>¿cuándo?에 답: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Has visto a Rosa? —Sí. Ayer estuve con ella.\">—¿Has visto a Rosa? —Sí. Ayer estuve con ella.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Cuándo me vas a devolver el libro que te dejé? —Mañana te lo devuelvo.\">—¿Cuándo me vas a devolver el libro que te dejé? —Mañana te lo devuelvo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Me ayudas? —Ahora no puedo. Estoy ocupada.\">—¿Me ayudas? —Ahora no puedo. Estoy ocupada.<\/span><\/li><\/ul>\n<h3>entonces · luego · después<\/h3>\n<div class=\"tw\"><table><thead><tr><th>부사<\/th><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>entonces<\/b><\/td><td>그때 (말하고 있는 그 순간)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Le pregunté por Paula y entonces me contó todo.\">Le pregunté por Paula y entonces me contó todo.<\/span><\/td><\/tr><tr><td><b>luego, después<\/b><\/td><td>그 후, 나중에<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ahora tengo clase. Nos vemos luego.\">Ahora tengo clase. Nos vemos luego.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me voy. Después te llamo.\">Me voy. Después te llamo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Primero hablé con Carmen y después con Olivia.\">Primero hablé con Carmen y después con Olivia.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>pronto · temprano · tarde<\/h3>\n<div class=\"tw\"><table><thead><tr><th>부사<\/th><th>의미<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>pronto<\/b><\/td><td>곧; 너무 이르게<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lo sabréis pronto.\">Lo sabréis pronto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Es pronto. La clase no empieza hasta las ocho.\">Es pronto. La clase no empieza hasta las ocho.<\/span><\/td><\/tr><tr><td><b>temprano<\/b><\/td><td>하루·밤의 이른 시간; 이르게<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Abel se levanta temprano, a las seis.\">Abel se levanta temprano, a las seis.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy quiero comer temprano.\">Hoy quiero comer temprano.<\/span><\/td><\/tr><tr><td><b>tarde<\/b><\/td><td>하루·밤의 늦은 시간; 늦게<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer cenamos muy tarde, a las doce.\">Ayer cenamos muy tarde, a las doce.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Habéis llegado tarde. El concierto ya ha empezado.\">Habéis llegado tarde. El concierto ya ha empezado.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>비교: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Se ha ido María? —Sí, pero vuelve pronto.\">—¿Se ha ido María? —Sí, pero vuelve pronto.<\/span> (곧) ↔ <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—Mamá, nos vamos. —Volved temprano.\">—Mamá, nos vamos. —Volved temprano.<\/span> (밤 이른 시각에)<\/li><\/ul>\n<h3>위치<\/h3>\n<ul class=\"rules\"><li>ahora, hoy, ayer 등은 문장 앞·끝·동사 뒤 어디든: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Anoche no pude dormir.\">Anoche no pude dormir.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No pude dormir anoche.\">No pude dormir anoche.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer estuve con Antón.\">Ayer estuve con Antón.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estuve ayer con Antón.\">Estuve ayer con Antón.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estuve con Antón ayer.\">Estuve con Antón ayer.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>문장 앞에 오면 주어는 보통 <b>동사 뒤<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer llegó Pablo.\">Ayer llegó Pablo.<\/span> (✗ Ayer Pablo llegó.)<\/div>","ex":[{"title":"연습 1. 날짜 부사","instr":"알맞은 부사를 고르세요.","rule":"시간선: anteayer → ayer → anoche → hoy → mañana → pasado mañana.","items":[{"t":"pick","q":"오늘이 월요일이면 일요일은 ___ .","o":["ayer","mañana","anteayer"],"a":"ayer"},{"t":"pick","q":"오늘이 월요일이면 토요일은 ___ .","o":["anteayer","ayer","pasado mañana"],"a":"anteayer"},{"t":"pick","q":"오늘이 월요일이면 화요일은 ___ .","o":["mañana","ayer","pasado mañana"],"a":"mañana"},{"t":"pick","q":"오늘이 월요일이면 수요일은 ___ .","o":["pasado mañana","mañana","anteayer"],"a":"pasado mañana"},{"t":"pick","q":"어젯밤 11시에 → ___","o":["anoche","ayer noche mañana","hoy noche"],"a":"anoche"},{"t":"pick","q":"지금 이 순간 → ___","o":["ahora","entonces","luego"],"a":"ahora"}]},{"title":"연습 2. entonces · luego · después","instr":"알맞은 부사를 고르세요.","rule":"entonces = 그때, luego/después = 나중에.","items":[{"t":"pick","q":"Le pregunté por Paula y ___ me contó todo.","o":["entonces","luego","ayer"],"a":"entonces"},{"t":"pick","q":"Ahora tengo clase. Nos vemos ___ .","o":["luego","entonces","ayer"],"a":"luego"},{"t":"pick","q":"Me voy. ___ te llamo.","o":["Después","Entonces","Anteayer"],"a":"Después"},{"t":"pick","q":"Primero hablé con Carmen y ___ con Olivia.","o":["después","entonces","anoche"],"a":"después"},{"t":"pick","q":"Llegó Pedro. ___ todos se levantaron. (그때)","o":["Entonces","Anteayer","Mañana"],"a":"Entonces"},{"t":"pick","q":"Hoy tengo mucho trabajo; ___ descansaré. (그 후에)","o":["luego","entonces","ayer"],"a":"luego"}]},{"title":"연습 3. pronto · temprano · tarde","instr":"알맞은 부사를 고르세요.","rule":"pronto = 곧/너무 일찍, temprano = 이른 시각에, tarde = 늦게.","items":[{"t":"pick","q":"Lo sabréis ___ . (곧)","o":["pronto","temprano","tarde"],"a":"pronto"},{"t":"pick","q":"Abel se levanta ___ , a las seis.","o":["temprano","tarde","ayer"],"a":"temprano"},{"t":"pick","q":"Ayer cenamos muy ___ , a las doce.","o":["tarde","temprano","pronto"],"a":"tarde"},{"t":"pick","q":"Habéis llegado ___ . El concierto ya ha empezado.","o":["tarde","temprano","pronto"],"a":"tarde"},{"t":"pick","q":"Es ___ . La clase no empieza hasta las ocho.","o":["pronto","tarde","anteayer"],"a":"pronto"},{"t":"pick","q":"Hoy quiero comer ___ . He quedado a las tres.","o":["temprano","tarde","luego"],"a":"temprano"},{"t":"pick","q":"—¿Se ha ido María? —Sí, pero vuelve ___ .","o":["pronto","tarde","anteayer"],"a":"pronto"},{"t":"pick","q":"Mamá, nos vamos. —Volved ___ .","o":["temprano","tarde","ayer"],"a":"temprano"}]},{"title":"연습 4. 어순","instr":"알맞은 문장을 고르세요.","rule":"시간 부사가 앞에 오면 주어는 동사 뒤.","items":[{"t":"pick","q":"올바른 문장: ___","o":["Ayer llegó Pablo.","Ayer Pablo llegó.","Pablo ayer llegó ayer."],"a":"Ayer llegó Pablo."},{"t":"pick","q":"올바른 문장: ___","o":["Anoche no pude dormir.","Anoche no dormir pude.","No anoche pude dormir."],"a":"Anoche no pude dormir."},{"t":"pick","q":"올바른 문장: ___","o":["Estuve con Antón ayer.","Estuve ayer anoche con Antón.","Antón ayer estuve."],"a":"Estuve con Antón ayer."},{"t":"pick","q":"올바른 문장: ___","o":["Hoy llegó el director.","Hoy el director llegó.","El hoy director llegó."],"a":"Hoy llegó el director."}]}]};</script>
