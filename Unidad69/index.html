<script>window.UNIT={"id":69,"es":"voy a salir…","ko":"ir a + 원형","theory":"<h2>핵심 정리<\/h2>\n<h3>형태: ir (현재) + a + 동사원형<\/h3>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>ir<\/th><th>+ a + 원형<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>voy<\/td><td>a trabajar<\/td><\/tr><tr><td>tú<\/td><td>vas<\/td><td>a comer<\/td><\/tr><tr><td>usted, él, ella<\/td><td>va<\/td><td>a vivir<\/td><\/tr><tr><td>nosotros/as<\/td><td>vamos<\/td><td>a salir<\/td><\/tr><tr><td>vosotros/as<\/td><td>vais<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>van<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>se 동사: 대명사는 앞이나 원형 뒤 어느 쪽도 가능 — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Laura y Jaime van a casarse este verano.\">Laura y Jaime van a casarse este verano.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Laura y Jaime se van a casar este verano.\">Laura y Jaime se van a casar este verano.<\/span><\/div>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>계획·의도<\/b>(가까운 미래): ahora mismo, esta tarde, esta noche, mañana, este verano — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo sueño. Voy a acostarme.\">Tengo sueño. Voy a acostarme.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Qué vas a hacer esta noche? —Voy a ir al cine.\">—¿Qué vas a hacer esta noche? —Voy a ir al cine.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Vamos a ir a un restaurante mexicano.\">Vamos a ir a un restaurante mexicano.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy no voy a dormir la siesta.\">Hoy no voy a dormir la siesta.<\/span><\/li><li><b>현재 상황으로 보아 확실한 일<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esa niña va a caerse de la silla.\">Esa niña va a caerse de la silla.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Escucha. Va a hablar el presidente.\">Escucha. Va a hablar el presidente.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Llévate el paraguas. Va a llover.\">Llévate el paraguas. Va a llover.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. ir 활용","instr":"ir의 알맞은 형태를 고르세요.","rule":"voy, vas, va, vamos, vais, van.","items":[{"t":"pick","q":"Yo ___ a salir con unos amigos.","o":["voy","vas","va"],"a":"voy"},{"t":"pick","q":"Tú ___ a hacer la cena.","o":["vas","va","van"],"a":"vas"},{"t":"pick","q":"Ana ___ a casarse.","o":["va","vas","voy"],"a":"va"},{"t":"pick","q":"Nosotros ___ a viajar.","o":["vamos","vais","van"],"a":"vamos"},{"t":"pick","q":"Vosotros ___ a comer fuera.","o":["vais","vamos","van"],"a":"vais"},{"t":"pick","q":"Ellos ___ a llegar tarde.","o":["van","va","vamos"],"a":"van"}]},{"title":"연습 2. ir a + 원형 쓰기","instr":"괄호의 동사로 ir a + 원형 문장을 완성하세요.","rule":"ir (현재) + a + 원형.","items":[{"t":"text","q":"Tengo sueño. (yo, acostarse) ___ .","a":["Voy a acostarme","Me voy a acostar"]},{"t":"text","q":"¿Qué (tú, hacer) ___ esta noche?","a":["vas a hacer"]},{"t":"text","q":"Esta noche (nosotros, ir) ___ a un restaurante mexicano.","a":["vamos a ir"]},{"t":"text","q":"Hoy no (yo, dormir) ___ la siesta.","a":["voy a dormir"]},{"t":"text","q":"¿Cuándo (tú, arreglar) ___ la tele?","a":["vas a arreglar"]},{"t":"text","q":"Ellos (cenar) ___ en casa.","a":["van a cenar"]},{"t":"text","q":"(vosotros, viajar) ___ en verano.","a":["Vais a viajar"]},{"t":"text","q":"Mañana (nosotros, ver) ___ a Laura.","a":["vamos a ver"]},{"t":"text","q":"¿(ustedes, salir) ___ esta noche?","a":["Van a salir"]},{"t":"text","q":"Mis padres (comprar) ___ un coche.","a":["van a comprar"]}]},{"title":"연습 3. 상황으로 보아 확실한 일","instr":"알맞은 문장을 고르세요.","rule":"현재 징후가 있을 때 ir a + 원형.","items":[{"t":"pick","q":"Mira el cielo. ___ llover.","o":["Va a","Fue a","Iba a"],"a":"Va a"},{"t":"pick","q":"Esa niña ___ caerse de la silla.","o":["va a","va","iba"],"a":"va a"},{"t":"pick","q":"Escucha: ___ hablar el presidente.","o":["va a","vas a","fue a"],"a":"va a"},{"t":"pick","q":"Cuidado, el coche ___ estrellarse.","o":["va a","van a","voy a"],"a":"va a"},{"t":"pick","q":"Ese chico está muy nervioso. ___ llorar.","o":["Va a","Van a","Voy a"],"a":"Va a"}]},{"title":"연습 4. 재귀동사","instr":"같은 뜻의 문장을 완성하세요.","rule":"se van a casar = van a casarse.","items":[{"t":"text","q":"Laura y Jaime se van a casar. = Laura y Jaime van a ___ .","a":["casarse"]},{"t":"text","q":"Voy a acostarme. = Me voy a ___ .","a":["acostar"]},{"t":"text","q":"Nos vamos a duchar. = Vamos a ___ .","a":["ducharnos"]},{"t":"text","q":"Te vas a caer. = Vas a ___ .","a":["caerte"]},{"t":"text","q":"Se va a levantar. = Va a ___ .","a":["levantarse"]},{"t":"text","q":"Os vais a divertir. = Vais a ___ .","a":["divertiros"]}]}]};</script>
