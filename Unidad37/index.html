<script>window.UNIT={"id":37,"es":"Se lo he dado. Te lo he dado","ko":"간접·직접목적어 대명사","theory":"<h2>핵심 정리<\/h2>\n<p>한 문장에 직접목적어(CD)와 간접목적어(CI)가 함께 있을 때 대명사 순서는 <b>간접(CI) + 직접(CD)<\/b> 입니다.<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Le has dado tu teléfono a Rafa?\">¿Le has dado tu teléfono a Rafa?<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Se lo has dado?\">¿Se lo has dado?<\/span><\/div>\n<div class=\"tw\"><table><thead><tr><th>간접목적어<\/th><th>+<\/th><th>직접목적어<\/th><\/tr><\/thead><tbody><tr><td>me, te, (se), nos, os, (se)<\/td><td>+<\/td><td><b>lo, la, los, las<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>le / les + lo, la, los, las → se lo, se la, se los, se las<\/b> (le lo ✗): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se lo he dado.\">Se lo he dado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Les has presentado a tu novia? — No, no se la he presentado.\">¿Les has presentado a tu novia? — No, no se la he presentado.<\/span><\/div>\n<ul class=\"rules\"><li>어떤 사람인지 분명히 하려면 a + 대명사/명사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se lo he enseñado a usted / a él / a ella / a ustedes / a ellos / a ellas.\">Se lo he enseñado a usted / a él / a ella / a ustedes / a ellos / a ellas.<\/span><\/li><li>강조: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A mí no me lo ha dado.\">A mí no me lo ha dado.<\/span><\/li><li>첫 번째 대명사가 이미 말했던 것을 다시 가리킬 때: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta corbata me la regaló Andrea.\">Esta corbata me la regaló Andrea.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esos libros se los regalé yo.\">Esos libros se los regalé yo.<\/span><\/li><\/ul>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué has hecho con el coche? ¿Se lo has regalado a Pepe? — No, se lo he vendido.\">¿Qué has hecho con el coche? ¿Se lo has regalado a Pepe? — No, se lo he vendido.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te ha dado el dinero? — A mí no me lo ha dado.\">¿Te ha dado el dinero? — A mí no me lo ha dado.<\/span><\/div>","ex":[{"title":"연습 1. 순서와 se","instr":"알맞은 대명사를 고르세요.","rule":"순서는 간접 + 직접. le/les + lo/la/los/las → se lo/la/los/las.","items":[{"t":"pick","q":"¿Le has dado tu teléfono a Rafa? — Sí, ___ lo he dado.","o":["se","le","me"],"a":"se"},{"t":"pick","q":"¿Me has traído la revista? — Sí, ___ la he traído.","o":["te","se","me"],"a":"te"},{"t":"pick","q":"¿Nos has comprado los billetes? — Sí, ___ los he comprado.","o":["os","nos","se"],"a":"os"},{"t":"pick","q":"¿Les has enseñado la casa a tus padres? — Sí, ___ la he enseñado.","o":["se","les","lo"],"a":"se"},{"t":"pick","q":"¿Me das el libro? — Sí, ___ lo doy.","o":["te","se","me"],"a":"te"},{"t":"pick","q":"¿Le dijiste la verdad a Ana? — Sí, ___ la dije.","o":["se","le","la"],"a":"se"}]},{"title":"연습 2. 대명사 두 개 쓰기","instr":"알맞은 대명사 조합을 고르세요.","rule":"간접 + 직접: me lo, te la, se los, nos las…","items":[{"t":"pick","q":"Mi hermana me prestó su coche. → Mi hermana ___ prestó.","o":["me lo","lo me","se lo"],"a":"me lo"},{"t":"pick","q":"Te regalo estas flores. → ___ regalo.","o":["Te las","Las te","Se las"],"a":"Te las"},{"t":"pick","q":"Le doy el regalo a Marta. → ___ doy.","o":["Se lo","Le lo","Lo le"],"a":"Se lo"},{"t":"pick","q":"Les mando la carta a mis padres. → ___ mando.","o":["Se la","Les la","La les"],"a":"Se la"},{"t":"pick","q":"Nos enseña las fotos. → ___ enseña.","o":["Nos las","Las nos","Se las"],"a":"Nos las"},{"t":"pick","q":"Le he vendido los libros a Pablo. → ___ he vendido.","o":["Se los","Le los","Los le"],"a":"Se los"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 대명사를 쓰세요.","rule":"대명사 순서: 간접 + 직접.","items":[{"t":"text","q":"¿Has dado el dinero a Pedro? — Sí, ___ lo he dado.","a":["se"]},{"t":"text","q":"¿Me prestas el boli? — Sí, ___ lo presto.","a":["te"]},{"t":"text","q":"¿Os ha dado el profesor las notas? — Sí, ___ las ha dado.","a":["nos"]},{"t":"text","q":"¿Quién te dio ese libro? — ___ lo regaló mi abuela.","a":["Me"]},{"t":"text","q":"¿Dónde pusiste las llaves? — ___ las dejé a Juan.","a":["Se"]},{"t":"text","q":"¿Cuándo les enviaste la carta? — ___ la envié ayer.","a":["Se"]}]},{"title":"연습 4. 정확히 구별하기","instr":"알맞은 것을 고르세요.","rule":"le lo ✗ → se lo. 두 대명사 사이에 다른 말이 오지 않습니다.","items":[{"t":"pick","q":"___ lo he dado a ella.","o":["Se","Le","La"],"a":"Se"},{"t":"pick","q":"Esta corbata ___ la regaló Andrea.","o":["me","le","lo"],"a":"me"},{"t":"pick","q":"Esos libros ___ los regalé yo.","o":["se","me","la"],"a":"se"},{"t":"pick","q":"A mí no ___ lo ha dado.","o":["me","se","le"],"a":"me"}]}]};</script>
