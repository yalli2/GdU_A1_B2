<script>window.UNIT={"id":118,"es":"cuando, antes de que, siempre que…","ko":"시간절","theory":"<h2>핵심 정리<\/h2>\n<h3>접속사<\/h3>\n<ul class=\"rules\"><li>antes de (que), después de (que), cuando, desde que, hasta que, en cuanto (que), siempre que, mientras<\/li><li>질문: ¿cuándo? ¿desde cuándo? ¿hasta cuándo? — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Daniel se puso bien en cuanto tomó la medicina.\">Daniel se puso bien en cuanto tomó la medicina.<\/span><\/li><\/ul>\n<h3>직설법 — 과거·현재·습관<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando era joven, comía mucho.\">Cuando era joven, comía mucho.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me fui en cuanto empezó a llover.\">Me fui en cuanto empezó a llover.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Insistió hasta que su padre le perdonó.\">Insistió hasta que su padre le perdonó.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Suelo escuchar música mientras leo.\">Suelo escuchar música mientras leo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Javi se enfada siempre que llego tarde.\">Javi se enfada siempre que llego tarde.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La conozco desde que era pequeña.\">La conozco desde que era pequeña.<\/span><\/li><\/ul>\n<h3>접속법 현재 — 미래<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo que recoger la casa antes de que lleguen todos.\">Tengo que recoger la casa antes de que lleguen todos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando cobre mi primer sueldo, te invitaré a cenar.\">Cuando cobre mi primer sueldo, te invitaré a cenar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis hijas meriendan en cuanto lleguen a casa.\">Mis hijas meriendan en cuanto lleguen a casa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quiero irme antes de que llegue Andrés.\">Quiero irme antes de que llegue Andrés.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando veas a Silvia, dale recuerdos.\">Cuando veas a Silvia, dale recuerdos.<\/span><\/li><\/ul>\n<h3>주의<\/h3>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>mientras<\/b> (= al tiempo que, 동시에) → <b>직설법<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Voy a ducharme mientras haces la cena.\">Voy a ducharme mientras haces la cena.<\/span> / <b>mientras<\/b> (= durante todo el tiempo que, 조건적) → <b>접속법<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No pienso salir mientras esté enfermo.\">No pienso salir mientras esté enfermo.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>antes de que<\/b>는 <b>절대 직설법<\/b>을 쓰지 않음: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Normalmente me despierto antes de que suene el despertador.\">Normalmente me despierto antes de que suene el despertador.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>antes de, hasta, después de + <b>부정사<\/b> (주어가 같을 때) ↔ <b>que + 접속법<\/b> (주어가 다를 때): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te llamaré antes de salir.\">Te llamaré antes de salir.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te llamaré antes de que salgan.\">Te llamaré antes de que salgan.<\/span><\/div>","ex":[{"title":"연습 1. 직설법 vs 접속법","instr":"알맞은 형태를 고르세요.","rule":"과거·습관 = 직설법, 미래 = 접속법.","items":[{"t":"pick","q":"Cuando era joven, ___ mucho. (comer)","o":["comía","comiera","comeré"],"a":"comía"},{"t":"pick","q":"Cuando ___ mi primer sueldo, te invitaré. (cobrar)","o":["cobre","cobro","cobraré"],"a":"cobre"},{"t":"pick","q":"Me fui en cuanto ___ a llover. (empezar)","o":["empezó","empiece","empezara"],"a":"empezó"},{"t":"pick","q":"Mis hijas meriendan en cuanto ___ a casa. (llegar, 습관적으로 미래)","o":["lleguen","llegan","llegaron"],"a":"lleguen"},{"t":"pick","q":"Insistió hasta que su padre le ___ . (perdonar)","o":["perdonó","perdone","perdonara"],"a":"perdonó"},{"t":"pick","q":"Cuando ___ a Silvia, dale recuerdos. (tú, ver)","o":["veas","ves","viste"],"a":"veas"},{"t":"pick","q":"Javi se enfada siempre que ___ tarde. (yo, llegar)","o":["llego","llegue","llegaré"],"a":"llego"},{"t":"pick","q":"La conozco desde que ___ pequeña. (ella, ser)","o":["era","sea","fuera"],"a":"era"}]},{"title":"연습 2. antes de que","instr":"알맞은 형태를 고르세요.","rule":"antes de que + 접속법.","items":[{"t":"pick","q":"Quiero irme antes de que ___ Andrés. (llegar)","o":["llegue","llega","llegó"],"a":"llegue"},{"t":"pick","q":"Tengo que recoger la casa antes de que ___ todos. (llegar)","o":["lleguen","llegan","llegarán"],"a":"lleguen"},{"t":"pick","q":"Normalmente me despierto antes de que ___ el despertador. (sonar)","o":["suene","suena","sonó"],"a":"suene"},{"t":"pick","q":"Te llamaré antes de ___ . (yo, salir)","o":["salir","que salga","que salgo"],"a":"salir"},{"t":"pick","q":"Te llamaré antes de que ___ . (ellos, salir)","o":["salgan","salir","salen"],"a":"salgan"},{"t":"pick","q":"Terminaré antes de que ___ las ocho. (ser)","o":["sean","son","serán"],"a":"sean"},{"t":"pick","q":"Habla con él antes de que ___ . (irse, él)","o":["se vaya","se va","se irá"],"a":"se vaya"},{"t":"pick","q":"Tengo que acabar el informe antes de ___ . (yo, irse)","o":["irme","que me vaya","que me voy"],"a":"irme"}]},{"title":"연습 3. mientras","instr":"알맞은 형태를 고르세요.","rule":"동시 = 직설법, 조건적 = 접속법.","items":[{"t":"pick","q":"Suelo escuchar música mientras ___ . (leer, yo)","o":["leo","lea","leyera"],"a":"leo"},{"t":"pick","q":"Voy a ducharme mientras ___ la cena. (hacer, tú)","o":["haces","hagas","hicieras"],"a":"haces"},{"t":"pick","q":"No pienso salir mientras ___ enfermo. (estar)","o":["esté","estoy","estaré"],"a":"esté"},{"t":"pick","q":"Mientras ___ tú, yo pongo la mesa. (cocinar)","o":["cocinas","cocines","cocinaras"],"a":"cocinas"},{"t":"pick","q":"No te preocupes mientras me ___ a mi lado. (tener)","o":["tengas","tienes","tuvieras"],"a":"tengas"},{"t":"pick","q":"Puedes quedarte mientras ___ tú. (querer)","o":["quieras","quieres","quisieras"],"a":"quieras"}]},{"title":"연습 4. 문장 완성","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"직설법 / 접속법 / 부정사.","items":[{"t":"text","q":"Cuando (yo, ser) ___ joven, hacía mucho deporte.","a":["era"]},{"t":"text","q":"Te llamaré en cuanto (yo, llegar) ___ .","a":["llegue"]},{"t":"text","q":"Te espero hasta que (tú, venir) ___ .","a":["vengas"]},{"t":"text","q":"Antes de (nosotros, salir) ___ , apago las luces.","a":["salir"]},{"t":"text","q":"Siempre que (ella, ir) ___ , me trae flores.","a":["va"]},{"t":"text","q":"Después de (comer) ___ , doy un paseo.","a":["comer"]},{"t":"text","q":"Cuando (tú, ver) ___ a Ana, dile que me llame.","a":["veas"]},{"t":"text","q":"Desde que (vivir, yo) ___ aquí, soy feliz.","a":["vivo"]}]}]};</script>
