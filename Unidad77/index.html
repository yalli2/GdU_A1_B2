gase / no se ponga<\/td><td>poneos / no os pongáis<\/td><td>pónganse / no se pongan<\/td><\/tr><tr><td>irse<\/td><td>vete / no te vayas<\/td><td>váyase / no se vaya<\/td><td>idos / no os vayáis<\/td><td>váyanse / no se vayan<\/td><\/tr><tr><td>caerse<\/td><td>cáete / no te caigas<\/td><td>cáigase / no se caiga<\/td><td>caeos / no os caigáis<\/td><td>cáiganse / no se caigan<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Acuéstate.\">Acuéstate.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lávate las manos.\">Lávate las manos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quítese la camisa, por favor.\">Quítese la camisa, por favor.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 긍정 명령","instr":"알맞은 형태를 쓰세요.","rule":"동사 + 대명사 (악센트 주의).","items":[{"t":"text","q":"(tú, lavarse) ___ las manos.","a":["Lávate"]},{"t":"text","q":"(tú, levantarse) ___ ya.","a":["Levántate"]},{"t":"text","q":"(usted, quitarse) ___ la camisa.","a":["Quítese"]},{"t":"text","q":"(tú, acostarse) ___ ahora.","a":["Acuéstate"]},{"t":"text","q":"(vosotros, lavarse) ___ las manos.","a":["Lavaos"]},{"t":"text","q":"(tú, ponerse) ___ el abrigo.","a":["Ponte"]},{"t":"text","q":"(tú, irse) ___ de aquí.","a":["Vete"]},{"t":"text","q":"(usted, sentarse) ___ , por favor.","a":["Siéntese"]},{"t":"text","q":"(ustedes, sentarse) ___ aquí.","a":["Siéntense"]},{"t":"text","q":"(tú, vestirse) ___ rápido.","a":["Vístete"]}]},{"title":"연습 2. 부정 명령","instr":"알맞은 형태를 쓰세요.","rule":"no + 대명사 + 접속법.","items":[{"t":"text","q":"(tú, atreverse) No ___ a ir solo.","a":["te atrevas"]},{"t":"text","q":"(usted, subirse) No ___ a la estatua.","a":["se suba"]},{"t":"text","q":"(ustedes, subirse) No ___ a la estatua.","a":["se suban"]},{"t":"text","q":"(vosotros, vestirse) No ___ así.","a":["os vistáis"]},{"t":"text","q":"(tú, despertarse) No ___ tarde.","a":["te despiertes"]},{"t":"text","q":"(tú, caerse) No ___
