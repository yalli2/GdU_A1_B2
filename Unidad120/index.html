<script>window.UNIT={"id":120,"es":"aunque, a pesar de que…","ko":"양보절","theory":"<h2>핵심 정리<\/h2>\n<h3>접속사<\/h3>\n<ul class=\"rules\"><li>aunque, a pesar de que, por más que, por mucho que + 직설법 / 접속법<\/li><li>장애물이 있지만 행위가 이루어지는 것을 막지 않음.<\/li><\/ul>\n<h3>직설법 — 사실로 여겨질 때 (현재·과거)<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aunque Clara es muy simpática, no tiene muchos amigos.\">Aunque Clara es muy simpática, no tiene muchos amigos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A pesar de que trabajas mucho, no te subirán el sueldo.\">A pesar de que trabajas mucho, no te subirán el sueldo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Pobre Ronaldo! Por más que estudia, no aprueba.\">¡Pobre Ronaldo! Por más que estudia, no aprueba.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aunque trabajó mucho, nunca se hizo rico.\">Aunque trabajó mucho, nunca se hizo rico.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aunque Alicia no me quiere, yo la quiero a ella.\">Aunque Alicia no me quiere, yo la quiero a ella.<\/span><\/li><\/ul>\n<h3>접속법 — 가능성·가정<\/h3>\n<ul class=\"rules\"><li>현재·미래: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aunque llueva mañana, yo voy a la playa.\">Aunque llueva mañana, yo voy a la playa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aunque corras mucho, no me ganarás.\">Aunque corras mucho, no me ganarás.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Por mucho que corran, no me alcanzarán.\">Por mucho que corran, no me alcanzarán.<\/span><\/li><li>과거의 가정 → 불완료과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No sé si comiste mucho o poco, pero, aunque comieras poco, te sentó mal.\">No sé si comiste mucho o poco, pero, aunque comieras poco, te sentó mal.<\/span><\/li><li>상대의 반대에 <b>이미 사실<\/b>로 여겨지는 것에 답할 때도 접속법: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—No me gusta la sopa. —Aunque no te guste la sopa, tienes que comértela.\">—No me gusta la sopa. —Aunque no te guste la sopa, tienes que comértela.<\/span><\/li><\/ul>\n<h3>a pesar de + 부정사<\/h3>\n<ul class=\"rules\"><li>두 절의 주어가 같을 때: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A pesar de estar agotados, tuvimos que levantarnos temprano.\">A pesar de estar agotados, tuvimos que levantarnos temprano.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 직설법 vs 접속법","instr":"알맞은 형태를 고르세요.","rule":"사실 = 직설법, 가능성 = 접속법.","items":[{"t":"pick","q":"Aunque Clara ___ muy simpática, no tiene amigos. (ser, 사실)","o":["es","sea","fuera"],"a":"es"},{"t":"pick","q":"Aunque ___ mañana, yo voy a la playa. (llover, 가능성)","o":["llueva","llueve","lloverá"],"a":"llueva"},{"t":"pick","q":"A pesar de que ___ mucho, no te subirán el sueldo. (tú, trabajar, 사실)","o":["trabajas","trabajes","trabajaras"],"a":"trabajas"},{"t":"pick","q":"Aunque ___ mucho, no me ganarás. (tú, correr, 가능성)","o":["corras","corres","corrías"],"a":"corras"},{"t":"pick","q":"Por más que ___ , no aprueba. (estudiar, 사실)","o":["estudia","estudie","estudiara"],"a":"estudia"},{"t":"pick","q":"Por mucho que ___ , no me alcanzarán. (ellos, correr, 가정)","o":["corran","corren","corrieron"],"a":"corran"},{"t":"pick","q":"Aunque Alicia no me ___ , yo la quiero a ella. (querer, 사실)","o":["quiere","quiera","quisiera"],"a":"quiere"},{"t":"pick","q":"Aunque ___ mucho, nunca se hizo rico. (trabajar, 과거 사실)","o":["trabajó","trabaje","trabajara"],"a":"trabajó"}]},{"title":"연습 2. 과거 가정 · a pesar de","instr":"알맞은 형태를 고르세요.","rule":"과거 가정 = 불완료과거, 같은 주어 = a pesar de + 부정사.","items":[{"t":"pick","q":"Aunque ___ poco, te sentó mal. (comer, 가정)","o":["comieras","comas","comes"],"a":"comieras"},{"t":"pick","q":"A pesar de ___ agotados, nos levantamos temprano. (nosotros, estar)","o":["estar","que estamos","que estemos"],"a":"estar"},{"t":"pick","q":"—No me gusta la sopa. —Aunque no te ___ , tienes que comértela.","o":["guste","gusta","gustó"],"a":"guste"},{"t":"pick","q":"A pesar de que ___ agotados, nos levantamos temprano. (estar, 사실)","o":["estábamos","estuviéramos","estemos"],"a":"estábamos"},{"t":"pick","q":"A pesar de ___ mal, fue a trabajar. (sentirse)","o":["sentirse","que se siente","que se sienta"],"a":"sentirse"},{"t":"pick","q":"Aunque ___ más barato, no lo compraría. (ser, 가상)","o":["fuera","es","sea"],"a":"fuera"}]},{"title":"연습 3. 문장 완성","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"직설법 / 접속법.","items":[{"t":"text","q":"Aunque (llover) ___ mañana, iré a la playa. (가능성)","a":["llueva"]},{"t":"text","q":"Aunque (hacer) ___ frío, salimos a pasear. (오늘 실제로 춥다)","a":["hace"]},{"t":"text","q":"Por más que (buscar, él) ___ , no encuentra trabajo. (사실)","a":["busca"]},{"t":"text","q":"Aunque (tú, correr) ___ mucho, no llegarás a tiempo. (가능성)","a":["corras"]},{"t":"text","q":"A pesar de que (ella, estar) ___ enferma, fue a clase. (사실)","a":["estaba"]},{"t":"text","q":"Aunque (tú, decir) ___ lo contrario, no te creo.","a":["digas"]},{"t":"text","q":"Por mucho que (yo, intentar) ___ , no puedo. (사실)","a":["intento"]},{"t":"text","q":"Aunque (nosotros, tener) ___ más dinero, no lo gastaríamos. (가상)","a":["tuviéramos"]}]},{"title":"연습 4. 알맞은 접속사","instr":"알맞은 것을 고르세요.","rule":"aunque, a pesar de que, por más que, por mucho que.","items":[{"t":"pick","q":"___ llueva mañana, voy a la playa.","o":["Aunque","Porque","Para que"],"a":"Aunque"},{"t":"pick","q":"___ de que no estudia, aprueba.","o":["A pesar","Por más","Aunque"],"a":"A pesar"},{"t":"pick","q":"___ que estudia, no aprueba.","o":["Por más","Para","Aunque no"],"a":"Por más"},{"t":"pick","q":"Por ___ que corran, no me alcanzarán.","o":["mucho","poco","tanto"],"a":"mucho"},{"t":"pick","q":"___ estar agotados, nos levantamos temprano.","o":["A pesar de","Aunque de","Por más"],"a":"A pesar de"}]}]};</script>
