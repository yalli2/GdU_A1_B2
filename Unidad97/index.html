<script>window.UNIT={"id":97,"es":"Quiero ir / Quiero que vayas","ko":"부정사 vs 접속법","theory":"<h2>핵심 정리<\/h2>\n<h3>주어가 같으면 부정사<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Preferimos comer en casa.\">Preferimos comer en casa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sara se encargó de reservar las entradas.\">Sara se encargó de reservar las entradas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Esther de pequeña no le gustaba dormir sola.\">A Esther de pequeña no le gustaba dormir sola.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quiero hacer un viaje a Colombia el año que viene.\">Quiero hacer un viaje a Colombia el año que viene.<\/span><\/li><\/ul>\n<h3>주어가 다르면 que + 접속법<\/h3>\n<ul class=\"rules\"><li><b>현재·미래<\/b> → 접속법 현재: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Preferimos que lo hagas tú.\">Preferimos que lo hagas tú.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Espero que se levanten temprano.\">Espero que se levanten temprano.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me encanta que estéis todos aquí.\">Me encanta que estéis todos aquí.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito que me hagas un favor.\">Necesito que me hagas un favor.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quiero que hagas la cama enseguida.\">Quiero que hagas la cama enseguida.<\/span><\/li><li><b>과거·가능법 뒤<\/b> → 접속법 불완료과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Preferí que lo hicieran ellos.\">Preferí que lo hicieran ellos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me encantaría que arreglasen la lavadora.\">Me encantaría que arreglasen la lavadora.<\/span><\/li><li>첫 동사에 <b>전치사<\/b>가 있으면 que 앞에: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Yo me encargo de que Roberto venga.\">Yo me encargo de que Roberto venga.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Se ha acostumbrado a que haga yo todo.\">Se ha acostumbrado a que haga yo todo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Catalina insistió en que fuéramos a verlo.\">Catalina insistió en que fuéramos a verlo.<\/span><\/li><\/ul>\n<h3>비교<\/h3>\n<div class=\"tw\"><table><thead><tr><th>부정사 (같은 주어)<\/th><th>접속법 (다른 주어)<\/th><\/tr><\/thead><tbody><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito alquilar un coche.\">Necesito alquilar un coche.<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Necesito que me prestes el coche.\">Necesito que me prestes el coche.<\/span><\/td><\/tr><tr><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos gustaría conocer Guatemala.\">Nos gustaría conocer Guatemala.<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos gustaría que conocieran Guatemala.\">Nos gustaría que conocieran Guatemala.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>dejar, permitir, prohibir — 둘 다 가능<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El director no deja comer en las aulas.\">El director no deja comer en las aulas.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El director no deja que comamos en las aulas.\">El director no deja que comamos en las aulas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te prohíbo salir.\">Te prohíbo salir.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te prohíbo que salgas.\">Te prohíbo que salgas.<\/span><\/li><\/ul>\n<h3>acordarse, recordar, olvidarse de, olvidar<\/h3>\n<ul class=\"rules\"><li>같은 주어 → 부정사: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Acuérdate de comprar el pan, Tomás.\">Acuérdate de comprar el pan, Tomás.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No olvides echar la llave.\">No olvides echar la llave.<\/span><\/li><li>다른 주어 → <b>que + 직설법<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Miguel, acuérdate de que es mi cumpleaños mañana.\">Miguel, acuérdate de que es mi cumpleaños mañana.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No olvidéis que tenemos una reunión a las once.\">No olvidéis que tenemos una reunión a las once.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 부정사 vs 접속법","instr":"알맞은 형태를 고르세요.","rule":"같은 주어 = 부정사, 다른 주어 = que + 접속법.","items":[{"t":"pick","q":"Quiero ___ un viaje a Colombia. (yo)","o":["hacer","que haga","que hago"],"a":"hacer"},{"t":"pick","q":"Quiero que ___ la cama enseguida. (tú)","o":["hagas","hacer","haces"],"a":"hagas"},{"t":"pick","q":"Preferimos ___ en casa. (nosotros)","o":["comer","que comamos","que comemos"],"a":"comer"},{"t":"pick","q":"Preferimos que lo ___ tú.","o":["hagas","hacer","haces"],"a":"hagas"},{"t":"pick","q":"Necesito ___ un coche. (yo, alquilar)","o":["alquilar","que alquile","que alquilo"],"a":"alquilar"},{"t":"pick","q":"Necesito que me ___ el coche. (tú, prestar)","o":["prestes","prestar","prestas"],"a":"prestes"},{"t":"pick","q":"Nos gustaría ___ Guatemala. (nosotros, conocer)","o":["conocer","que conozcamos","que conocíamos"],"a":"conocer"},{"t":"pick","q":"Nos gustaría que ellos ___ Guatemala. (conocer)","o":["conocieran","conocer","conocen"],"a":"conocieran"}]},{"title":"연습 2. 시제 선택","instr":"알맞은 형태를 고르세요.","rule":"현재·미래 → 접속법 현재, 과거·가능법 → 불완료과거.","items":[{"t":"pick","q":"Espero que se ___ temprano. (ellos, levantar)","o":["levanten","levantaran","levantan"],"a":"levanten"},{"t":"pick","q":"Me encanta que ___ todos aquí. (vosotros, estar)","o":["estéis","estuvierais","estáis"],"a":"estéis"},{"t":"pick","q":"Preferí que lo ___ ellos. (hacer)","o":["hicieran","hagan","hacen"],"a":"hicieran"},{"t":"pick","q":"Me encantaría que ___ la lavadora. (ellos, arreglar)","o":["arreglasen","arreglen","arreglan"],"a":"arreglasen"},{"t":"pick","q":"Necesito que me ___ un favor. (tú, hacer)","o":["hagas","hicieras","haces"],"a":"hagas"},{"t":"pick","q":"Catalina insistió en que ___ a verlo. (nosotros, ir)","o":["fuéramos","vayamos","vamos"],"a":"fuéramos"},{"t":"pick","q":"Se ha acostumbrado a que ___ yo todo. (hacer)","o":["haga","hago","hiciera"],"a":"haga"},{"t":"pick","q":"Me encargo de que Roberto ___ . (venir)","o":["venga","viene","vendrá"],"a":"venga"}]},{"title":"연습 3. 접속법 형태 쓰기","instr":"알맞은 형태를 쓰세요.","rule":"que + 접속법.","items":[{"t":"text","q":"Quiero que (tú, ayudar) ___ a mi hermano.","a":["ayudes"]},{"t":"text","q":"Espero que (ellos, venir) ___ pronto.","a":["vengan"]},{"t":"text","q":"Necesito que (usted, firmar) ___ aquí.","a":["firme"]},{"t":"text","q":"Me gusta que (vosotros, ser) ___ puntuales.","a":["seáis"]},{"t":"text","q":"Prefería que (tú, quedarse) ___ en casa.","a":["te quedaras"]},{"t":"text","q":"Mis padres querían que (yo, estudiar) ___ Medicina.","a":["estudiara"]},{"t":"text","q":"Me gustaría que (tú, venir) ___ a mi fiesta.","a":["vinieras"]},{"t":"text","q":"Insisto en que (ellos, pagar) ___ .","a":["paguen"]}]},{"title":"연습 4. dejar·prohibir / acordarse","instr":"알맞은 형태를 고르세요.","rule":"dejar, prohibir: 부정사 또는 접속법. acordarse: 다른 주어는 직설법.","items":[{"t":"pick","q":"El director no deja ___ en las aulas. (comer)","o":["comer","que comemos","que comías"],"a":"comer"},{"t":"pick","q":"Te prohíbo que ___ . (salir)","o":["salgas","sales","salir"],"a":"salgas"},{"t":"pick","q":"Acuérdate de ___ el pan. (comprar, tú)","o":["comprar","que compres","que compras"],"a":"comprar"},{"t":"pick","q":"Miguel, acuérdate de que ___ mi cumpleaños mañana.","o":["es","sea","fuera"],"a":"es"},{"t":"pick","q":"No olvidéis que ___ una reunión a las once. (nosotros, tener)","o":["tenemos","tengamos","tuviéramos"],"a":"tenemos"},{"t":"pick","q":"No olvides ___ la llave. (echar, tú)","o":["echar","que eches","que echas"],"a":"echar"},{"t":"pick","q":"Nos prohíben ___ el móvil. (usar)","o":["usar","que usamos","que usemos"],"a":"usar"},{"t":"pick","q":"Me permitió que ___ . (yo, salir, 과거)","o":["saliera","salga","salgo"],"a":"saliera"}]}]};</script>
