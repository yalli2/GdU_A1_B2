<script>window.UNIT={"id":100,"es":"aquí, allí, abajo…","ko":"장소 부사","theory":"<h2>핵심 정리<\/h2>\n<h3>장소 부사는 ¿dónde? / ¿adónde? 에 답한다<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuelga el cuadro ahí.\">Cuelga el cuadro ahí.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lleve este paquete arriba.\">Lleve este paquete arriba.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Yo vivo aquí y Margarita vive enfrente.\">Yo vivo aquí y Margarita vive enfrente.<\/span><\/li><\/ul>\n<h3>aquí · ahí · allí<\/h3>\n<div class=\"tw\"><table><thead><tr><th>부사<\/th><th>거리<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>aquí<\/b><\/td><td>화자 가까이<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Póngalo aquí, por favor.\">Póngalo aquí, por favor.<\/span><\/td><\/tr><tr><td><b>ahí<\/b><\/td><td>청자 가까이<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Póngalo ahí, por favor.\">Póngalo ahí, por favor.<\/span><\/td><\/tr><tr><td><b>allí<\/b><\/td><td>화자·청자 모두에게서 멂<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Póngalo allí, por favor.\">Póngalo allí, por favor.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>위치 부사 쌍<\/h3>\n<div class=\"tw\"><table><thead><tr><th>쌍<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>arriba ↔ abajo<\/td><td>위 ↔ 아래<\/td><\/tr><tr><td>dentro ↔ fuera<\/td><td>안 ↔ 밖<\/td><\/tr><tr><td>delante ↔ detrás<\/td><td>앞 ↔ 뒤<\/td><\/tr><tr><td>cerca ↔ lejos<\/td><td>가까이 ↔ 멀리<\/td><\/tr><tr><td>encima ↔ debajo<\/td><td>위(맞닿음) ↔ 아래<\/td><\/tr><tr><td>enfrente, alrededor<\/td><td>맞은편, 주위<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Vives cerca? —No, vivo muy lejos.\">—¿Vives cerca? —No, vivo muy lejos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Qué hay arriba? —Una sala de juegos.\">—¿Qué hay arriba? —Una sala de juegos.<\/span><\/li><\/ul>\n<h3>위치<\/h3>\n<ul class=\"rules\"><li>보통 문장 끝: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este barrio tiene muchos parques alrededor.\">Este barrio tiene muchos parques alrededor.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay algo aquí.\">Hay algo aquí.<\/span><\/li><li><b>강조<\/b>하려면 문장 앞: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Aquí hay un zapato. ¿Dónde está el otro?\">Aquí hay un zapato. ¿Dónde está el otro?<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>문장 앞에 오면 주어는 <b>동사 뒤<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Arriba están las habitaciones.\">Arriba están las habitaciones.<\/span> (✗ Arriba las habitaciones están.)<\/div>\n<ul class=\"rules\"><li>함께 쓰기: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ponlo allí dentro.\">Ponlo allí dentro.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Juan, ven aquí arriba.\">Juan, ven aquí arriba.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. aquí · ahí · allí","instr":"알맞은 부사를 고르세요.","rule":"aquí = 나 가까이, ahí = 너 가까이, allí = 멀리.","items":[{"t":"pick","q":"(내 옆) Póngalo ___ , por favor.","o":["aquí","ahí","allí"],"a":"aquí"},{"t":"pick","q":"(너의 옆) Póngalo ___ , por favor.","o":["ahí","aquí","allí"],"a":"ahí"},{"t":"pick","q":"(저 멀리) Póngalo ___ , por favor.","o":["allí","aquí","ahí"],"a":"allí"},{"t":"pick","q":"(나는 지금 여기) Yo vivo ___ .","o":["aquí","ahí","allí"],"a":"aquí"},{"t":"pick","q":"(너 곁의 책) Dame ___ el libro.","o":["ahí","aquí","allí"],"a":"ahí"},{"t":"pick","q":"(저쪽 산) ___ está la montaña.","o":["Allí","Aquí","Ahí"],"a":"Allí"}]},{"title":"연습 2. 반대말","instr":"알맞은 부사를 고르세요.","rule":"arriba↔abajo, dentro↔fuera, delante↔detrás, cerca↔lejos, encima↔debajo.","items":[{"t":"pick","q":"arriba ↔ ___","o":["abajo","dentro","encima"],"a":"abajo"},{"t":"pick","q":"dentro ↔ ___","o":["fuera","arriba","cerca"],"a":"fuera"},{"t":"pick","q":"delante ↔ ___","o":["detrás","lejos","debajo"],"a":"detrás"},{"t":"pick","q":"cerca ↔ ___","o":["lejos","fuera","detrás"],"a":"lejos"},{"t":"pick","q":"encima ↔ ___","o":["debajo","delante","cerca"],"a":"debajo"},{"t":"pick","q":"¿Vives cerca? —No, vivo muy ___ .","o":["lejos","arriba","dentro"],"a":"lejos"},{"t":"pick","q":"¿Qué hay ___ ? —Una sala de juegos. (위층)","o":["arriba","abajo","fuera"],"a":"arriba"},{"t":"pick","q":"Hace frío ___ . Entra. (밖)","o":["fuera","dentro","encima"],"a":"fuera"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 부사를 쓰세요.","rule":"arriba, abajo, dentro, fuera, aquí, ahí, allí, enfrente, alrededor.","items":[{"t":"text","q":"Yo vivo aquí y Margarita vive ___ . (맞은편)","a":["enfrente"]},{"t":"text","q":"Este barrio tiene muchos parques ___ . (주위에)","a":["alrededor"]},{"t":"text","q":"Juan, ven ___ arriba. (이쪽, 여기)","a":["aquí"]},{"t":"text","q":"El libro está encima de la mesa y el lápiz está ___ de la mesa.","a":["debajo"]},{"t":"text","q":"Los niños están ___ . No quieren entrar. (밖에)","a":["fuera"]},{"t":"text","q":"Hace frío. Ponlo allí ___ . (안에)","a":["dentro"]},{"t":"text","q":"Cuelga el cuadro ___ , por favor. (너 곁에)","a":["ahí"]},{"t":"text","q":"La cocina está abajo; los dormitorios están ___ . (위층)","a":["arriba"]}]},{"title":"연습 4. 어순","instr":"알맞은 문장을 고르세요.","rule":"부사가 앞에 오면 주어는 동사 뒤.","items":[{"t":"pick","q":"올바른 문장: ___","o":["Arriba están las habitaciones.","Arriba las habitaciones están.","Las arriba habitaciones están."],"a":"Arriba están las habitaciones."},{"t":"pick","q":"올바른 문장: ___","o":["Aquí hay un zapato.","Aquí un zapato hay.","Hay aquí un zapato aquí."],"a":"Aquí hay un zapato."},{"t":"pick","q":"올바른 문장: ___","o":["Hay algo aquí.","Aquí algo hay.","Algo hay allí aquí."],"a":"Hay algo aquí."},{"t":"pick","q":"올바른 문장: ___","o":["Ponlo allí dentro.","Ponlo dentro allí allí.","Ponlo allí fuera dentro."],"a":"Ponlo allí dentro."}]}]};</script>
