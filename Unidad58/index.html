ndex=\"0\" data-say=\"llegué\">llegué<\/span>)<\/div>\n<h3>쓰임<\/h3>\n<p>이미 <b>끝난 과거의 특정 시점<\/b>의 사건: anoche, ayer, el jueves pasado, la semana pasada, hace dos meses, en 1995…<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Anoche no salimos. Nos quedamos en casa a descansar.\">Anoche no salimos. Nos quedamos en casa a descansar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis padres vivieron en Quito desde 1990 hasta 2001.\">Mis padres vivieron en Quito desde 1990 hasta 2001.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La Primera Guerra Mundial empezó en 1914 y acabó en 1918.\">La Primera Guerra Mundial empezó en 1914 y acabó en 1918.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"De joven, viví cuatro años en México.\">De joven, viví cuatro años en México.<\/span><\/div>\n<ul class=\"rules\"><li><b>연속된 행동<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando acabó la película, encendieron las luces.\">Cuando acabó la película, encendieron las luces.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El profesor entró en el aula, abrió el libro y empezó a explicar.\">El profesor entró en el aula, abrió el libro y empezó a explicar.<\/span><\/li><li><b>서술·전기<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cervantes nació en Alcalá de Henares en 1547.\">Cervantes nació en Alcalá de Henares en 1547.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Miguel Ángel Asturias nació en Ciudad de Guatemala en 1899.\">Miguel Ángel Asturias nació en Ciudad de Guatemala en 1899.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. -ar 동사","instr":"알맞은 형태를 쓰세요.","rule":"-é, -aste, -ó, -amos, -asteis, -aron. (악센트 주의)","items":[{"t":"text","q":"(yo, trabajar) ___ ayer.","a":["trabajé"]},{"t":"text","q":"(tú, hablar) ___ con Pedro.","a":["hablaste"]},{"t":"text","q":"(él, cantar) _
