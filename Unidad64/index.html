<script>window.UNIT={"id":64,"es":"trabajé / trabajaba","ko":"단순과거와 불완료과거 대조","theory":"<h2>핵심 정리<\/h2>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>단순과거 (trabajé)<\/th><th>불완료과거 (trabajaba)<\/th><\/tr><\/thead><tbody><tr><td>기능<\/td><td><b>특정한 순간<\/b>에 일어난 일, <b>끝난<\/b> 행위·상황<\/td><td><b>습관<\/b>, <b>진행 중<\/b>이던 행위·상황<\/td><\/tr><tr><td>시간 표현<\/td><td>ayer, el domingo pasado, la semana pasada, hace un mes…<\/td><td>normalmente, siempre, todos los días, los domingos…<\/td><\/tr><tr><td>예<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La semana pasada comí con Luis.\">La semana pasada comí con Luis.<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"De pequeña, comía mucho chocolate.\">De pequeña, comía mucho chocolate.<\/span><\/td><\/tr><tr><td>예<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El domingo pasado fuimos al campo.\">El domingo pasado fuimos al campo.<\/span><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando era pequeño, íbamos siempre al campo los domingos.\">Cuando era pequeño, íbamos siempre al campo los domingos.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>끝난 행위 vs 진행 중인 상황<\/h3>\n<ul class=\"rules\"><li><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El verano pasado estuvimos en Managua.\">El verano pasado estuvimos en Managua.<\/span> (끝난 상황) ↔ <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estábamos en Managua cuando comenzó la huelga.\">Estábamos en Managua cuando comenzó la huelga.<\/span> (진행 중, 사건이 끼어듦)<\/li><li>단순과거 = <b>사건<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer fuimos a la playa…\">Ayer fuimos a la playa…<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Los ladrones entraron…\">Los ladrones entraron…<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Vio usted al culpable?\">¿Vio usted al culpable?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cervantes nació en Alcalá de Henares en 1547.\">Cervantes nació en Alcalá de Henares en 1547.<\/span><\/li><li>불완료과거 = <b>배경·상황<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hacía mucho calor y había mucha gente.\">Hacía mucho calor y había mucha gente.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Era alto, tenía los ojos verdes y llevaba una gorra negra.\">Era alto, tenía los ojos verdes y llevaba una gorra negra.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Su padre era cirujano.\">Su padre era cirujano.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 습관 vs 사건","instr":"알맞은 시제를 고르세요.","rule":"siempre·todos los días → imperfecto, ayer·el domingo pasado → indefinido.","items":[{"t":"pick","q":"De pequeña, ___ mucho chocolate.","o":["comía","comí","he comido"],"a":"comía"},{"t":"pick","q":"La semana pasada ___ con Luis.","o":["comí","comía","comiendo"],"a":"comí"},{"t":"pick","q":"Cuando era pequeño, ___ siempre al campo.","o":["íbamos","fuimos","iremos"],"a":"íbamos"},{"t":"pick","q":"El domingo pasado ___ al campo.","o":["fuimos","íbamos","vamos"],"a":"fuimos"},{"t":"pick","q":"Todas las tardes ___ un paseo.","o":["dábamos","dimos","damos"],"a":"dábamos"},{"t":"pick","q":"Aquella tarde ___ un paseo por el centro.","o":["dimos","dábamos","damos"],"a":"dimos"},{"t":"pick","q":"Normalmente ___ a las siete.","o":["me levantaba","me levanté","me he levantado"],"a":"me levantaba"},{"t":"pick","q":"Ayer ___ a las nueve.","o":["me levanté","me levantaba","me levanto"],"a":"me levanté"}]},{"title":"연습 2. 진행 중인 상황 + 사건","instr":"알맞은 형태를 고르세요.","rule":"배경은 imperfecto, 끼어드는 사건은 indefinido.","items":[{"t":"pick","q":"Estábamos en Managua cuando ___ la huelga.","o":["comenzó","comenzaba","comenzando"],"a":"comenzó"},{"t":"pick","q":"___ en Managua cuando comenzó la huelga.","o":["Estábamos","Estuvimos","Estamos"],"a":"Estábamos"},{"t":"pick","q":"Cuando llegué, ___ mucha gente.","o":["había","hubo","ha habido"],"a":"había"},{"t":"pick","q":"Mientras ___ la siesta, sonó el teléfono.","o":["dormíamos","dormimos","dormiremos"],"a":"dormíamos"},{"t":"pick","q":"Hacía calor cuando ___ de casa.","o":["salí","salía","saliendo"],"a":"salí"},{"t":"pick","q":"¿Qué ___ cuando entró el jefe?","o":["hacías","hiciste","has hecho"],"a":"hacías"}]},{"title":"연습 3. 동사 형태 쓰기","instr":"알맞은 시제(indefinido / imperfecto)로 쓰세요.","rule":"사건 → indefinido, 배경·습관 → imperfecto.","items":[{"t":"text","q":"El verano pasado (nosotros, estar) ___ en Managua.","a":["estuvimos"]},{"t":"text","q":"Cuando era pequeño, (yo, vivir) ___ en el campo.","a":["vivía"]},{"t":"text","q":"Ayer (nosotros, ir) ___ a la playa.","a":["fuimos"]},{"t":"text","q":"Era alto y (tener) ___ los ojos verdes.","a":["tenía"]},{"t":"text","q":"Los ladrones (entrar) ___ por la ventana.","a":["entraron"]},{"t":"text","q":"Cervantes (nacer) ___ en 1547.","a":["nació"]},{"t":"text","q":"Hacía mucho calor y (haber) ___ mucha gente.","a":["había"]},{"t":"text","q":"Su padre (ser) ___ cirujano.","a":["era"]}]},{"title":"연습 4. 짧은 이야기","instr":"알맞은 형태를 고르세요.","rule":"배경(imperfecto) + 사건(indefinido).","items":[{"t":"pick","q":"Ayer ___ muy cansada.","o":["estaba","estuve","estoy"],"a":"estaba"},{"t":"pick","q":"Llovía mucho y por eso ___ en casa.","o":["me quedé","me quedaba","me quedo"],"a":"me quedé"},{"t":"pick","q":"Cuando salía del trabajo, ___ a Pedro.","o":["vi","veía","he ver"],"a":"vi"},{"t":"pick","q":"Antes ___ en bici todos los días.","o":["iba","fui","voy"],"a":"iba"},{"t":"pick","q":"Anoche ___ una película muy buena.","o":["vimos","veíamos","vemos"],"a":"vimos"}]}]};</script>
