<script>window.UNIT={"id":12,"es":"este, ese, aquel…","ko":"지시사","theory":"<h2>핵심 정리<\/h2>\n<p>지시사는 대상을 가리킵니다. 명사의 성·수에 맞춰 형태가 바뀝니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>나와 가까움<\/th><th>너와 가까움<\/th><th>나와 너 모두 멀리<\/th><\/tr><\/thead><tbody><tr><td>남성 단수<\/td><td><b>este<\/b><\/td><td><b>ese<\/b><\/td><td><b>aquel<\/b><\/td><\/tr><tr><td>남성 복수<\/td><td><b>estos<\/b><\/td><td><b>esos<\/b><\/td><td><b>aquellos<\/b><\/td><\/tr><tr><td>여성 단수<\/td><td><b>esta<\/b><\/td><td><b>esa<\/b><\/td><td><b>aquella<\/b><\/td><\/tr><tr><td>여성 복수<\/td><td><b>estas<\/b><\/td><td><b>esas<\/b><\/td><td><b>aquellas<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>명사와 함께: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esa chica es amiga de Ana.\">Esa chica es amiga de Ana.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estos zapatos son muy caros.\">Estos zapatos son muy caros.<\/span><\/li><li>단독으로: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Cuál es tu maleta, esta, esa o aquella?\">¿Cuál es tu maleta, esta, esa o aquella?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este es Juan, mi novio.\">Este es Juan, mi novio.<\/span><\/li><\/ul>\n<h3>시간 표현<\/h3>\n<ul class=\"rules\"><li><b>este<\/b> → 현재·가까운 미래: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este año ha sido muy frío.\">Este año ha sido muy frío.<\/span><\/li><li><b>ese<\/b> → 과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estuve en Perú en 1999. Ese año hubo elecciones.\">Estuve en Perú en 1999. Ese año hubo elecciones.<\/span><\/li><li><b>aquel<\/b> → 먼 과거: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"En aquella época, el imperio inca iba de Chile a Ecuador.\">En aquella época, el imperio inca iba de Chile a Ecuador.<\/span><\/li><\/ul>\n<h3>중성 지시사 esto, eso, aquello<\/h3>\n<p>무엇인지 모르거나 이름을 말할 필요가 없을 때: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué es esto?\">¿Qué es esto?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿De quién es eso?\">¿De quién es eso?<\/span><\/p>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>때로는 ese/esa를 나와 너 모두에게서 멀리 있는 것에도 씁니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gusta esa casa.\">Me gusta esa casa.<\/span><\/div>","ex":[{"title":"연습 1. 지시사 고르기","instr":"알맞은 지시사를 고르세요.","rule":"este(나와 가까움), ese(너와 가까움), aquel(둘 다 멀리). 명사의 성·수에 일치.","items":[{"t":"pick","q":"___ libro (나와 가까움)","o":["este","esta","estos","estas"],"a":"este"},{"t":"pick","q":"___ revista (나와 가까움)","o":["este","esta","estos","estas"],"a":"esta"},{"t":"pick","q":"___ zapatos (너와 가까움)","o":["ese","esa","esos","esas"],"a":"esos"},{"t":"pick","q":"___ casas (너와 가까움)","o":["ese","esa","esos","esas"],"a":"esas"},{"t":"pick","q":"___ chicas (멀리 있음)","o":["aquel","aquella","aquellos","aquellas"],"a":"aquellas"},{"t":"pick","q":"___ coche (멀리 있음)","o":["aquel","aquella","aquellos","aquellas"],"a":"aquel"},{"t":"pick","q":"___ chico (너와 가까움)","o":["ese","esa","esos","esas"],"a":"ese"},{"t":"pick","q":"___ mesa (나와 가까움)","o":["este","esta","estos","estas"],"a":"esta"}]},{"title":"연습 2. 문장 완성","instr":"알맞은 지시사를 쓰세요.","rule":"지시사는 뒤에 오는 명사의 성·수에 맞춥니다.","items":[{"t":"text","q":"¿Cuánto cuesta ___ revista? (여기 가까이)","a":["esta"]},{"t":"text","q":"¿Quiénes son ___ chicas? (저기 멀리)","a":["aquellas"]},{"t":"text","q":"___ zapatos son muy caros. (가까이)","a":["Estos"]},{"t":"text","q":"___ chica es amiga de Ana. (너 쪽)","a":["Esa"]},{"t":"text","q":"Quiero ___ libro. (너 쪽에 있는 책)","a":["ese"]},{"t":"text","q":"¿Te gustan ___ pantalones? (너 쪽)","a":["esos"]},{"t":"text","q":"___ es Juan, mi novio. (가까이, 남성 단독)","a":["Este"]},{"t":"text","q":"¿Cuál es tu maleta, esta, ___ o aquella? (너 쪽)","a":["esa"]}]},{"title":"연습 3. 시간 표현","instr":"알맞은 지시사를 고르세요.","rule":"este = 현재·가까운 미래, ese = 과거, aquel = 먼 과거.","items":[{"t":"pick","q":"___ año ha sido muy frío. (올해)","o":["Este","Ese","Aquel"],"a":"Este"},{"t":"pick","q":"Estuve en Perú en 1999. ___ año hubo elecciones.","o":["Este","Ese","Aquel"],"a":"Ese"},{"t":"pick","q":"Los españoles llegaron a América en 1492. En ___ época, había muchos conflictos.","o":["esta","esa","aquella"],"a":"aquella"},{"t":"pick","q":"Voy a verte ___ semana. (이번 주)","o":["esta","esa","aquella"],"a":"esta"}]},{"title":"연습 4. esto / eso / aquello","instr":"알맞은 지시사를 고르세요.","rule":"이름을 모르거나 말할 필요가 없을 때는 중성 esto, eso, aquello를 씁니다.","items":[{"t":"pick","q":"¿Qué es ___? (나와 가까운 것)","o":["esto","este","esta"],"a":"esto"},{"t":"pick","q":"¿De quién es ___? (너 쪽의 것)","o":["eso","ese","esa"],"a":"eso"},{"t":"pick","q":"No sé qué es ___. (멀리 있는 것)","o":["aquello","aquel","aquella"],"a":"aquello"},{"t":"pick","q":"¿Qué es ___? No sé. Parece una lámpara. (가까이)","o":["esto","este","esta"],"a":"esto"}]}]};</script>
