<script>window.UNIT={"id":36,"es":"Me han regalado un reloj","ko":"간접목적어 대명사","theory":"<h2>핵심 정리<\/h2>\n<p><b>간접목적어<\/b>(…에게)를 대신합니다.<\/p>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Luis ha regalado un reloj a Chus.\">Luis ha regalado un reloj a Chus.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Luis le ha regalado un reloj.\">Luis le ha regalado un reloj.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"He preguntado a Ana por sus padres.\">He preguntado a Ana por sus padres.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Le he preguntado por sus padres.\">Le he preguntado por sus padres.<\/span><\/div>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>단수<\/th><th>복수<\/th><\/tr><\/thead><tbody><tr><td>1인칭<\/td><td><b>me<\/b> (a mí)<\/td><td><b>nos<\/b> (a nosotros/as)<\/td><\/tr><tr><td>2인칭<\/td><td><b>te<\/b> (a ti)<\/td><td><b>os<\/b> (a vosotros/as)<\/td><\/tr><tr><td>3인칭<\/td><td><b>le<\/b> (a él, a ella, a usted)<\/td><td><b>les<\/b> (a ellos, a ellas, a ustedes)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>위치: <b>동사 앞<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Qué te ha dicho el médico? — Me ha dicho que estoy bien.\">¿Qué te ha dicho el médico? — Me ha dicho que estoy bien.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me ha preguntado nada.\">No me ha preguntado nada.<\/span><\/li><li>누구인지 분명히: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Le dije a usted que no era verdad.\">Le dije a usted que no era verdad.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Le dije a él…\">Le dije a él…<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Le dije a ella…\">Le dije a ella…<\/span><\/li><li>강조·대조: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A mí no me ha dado nada.\">A mí no me ha dado nada.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>사람을 가리킬 때 <b>le/les + a + 명사<\/b>를 함께 씁니다(처음 언급할 때): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Le has regalado algo a Pedro? — Sí, le he regalado una cartera.\">¿Le has regalado algo a Pedro? — Sí, le he regalado una cartera.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Juana le he regalado un collar y a los niños les he comprado juguetes.\">A Juana le he regalado un collar y a los niños les he comprado juguetes.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Les he comprado unos bombones a mis hermanos.\">Les he comprado unos bombones a mis hermanos.<\/span><\/div>","ex":[{"title":"연습 1. 간접목적어 대명사","instr":"알맞은 대명사를 고르세요.","rule":"1·2인칭은 me, te, nos, os. 3인칭 단수 le, 복수 les.","items":[{"t":"pick","q":"¿Qué ___ ha regalado Luis? (너에게)","o":["te","me","le"],"a":"te"},{"t":"pick","q":"___ ha regalado un reloj. (나에게)","o":["Me","Te","Le"],"a":"Me"},{"t":"pick","q":"Luis ___ ha regalado un reloj a Chus.","o":["le","les","lo"],"a":"le"},{"t":"pick","q":"A los niños ___ he comprado juguetes.","o":["les","le","los"],"a":"les"},{"t":"pick","q":"¿Qué ___ ha preguntado Leonor? (우리에게)","o":["nos","os","les"],"a":"nos"},{"t":"pick","q":"Los padres ___ han dicho a ti que vengas.","o":["te","me","os"],"a":"te"}]},{"title":"연습 2. 대명사로 바꾸기","instr":"알맞은 대명사를 쓰세요.","rule":"간접목적어를 le/les 등으로 바꾸어 동사 앞에 둡니다.","items":[{"t":"text","q":"Luis ha regalado un reloj a Chus. → Luis ___ ha regalado un reloj.","a":["le"]},{"t":"text","q":"He preguntado a Ana por sus padres. → ___ he preguntado por sus padres.","a":["Le"]},{"t":"text","q":"He comprado unos bombones a mis hermanos. → ___ he comprado unos bombones.","a":["Les"]},{"t":"text","q":"Doy el libro a mi madre. → ___ doy el libro.","a":["Le"]},{"t":"text","q":"Escribo a mis amigos. → ___ escribo.","a":["Les"]},{"t":"text","q":"Mando una carta a Pedro y a Ana. → ___ mando una carta.","a":["Les"]}]},{"title":"연습 3. a + 사람","instr":"알맞은 것을 쓰세요.","rule":"사람을 가리킬 때는 le/les와 a + 명사를 함께 쓸 수 있습니다.","items":[{"t":"text","q":"¿Le has regalado algo ___ Pedro?","a":["a"]},{"t":"text","q":"A Juana ___ he regalado un collar.","a":["le"]},{"t":"text","q":"A los niños ___ he comprado juguetes.","a":["les"]},{"t":"text","q":"___ mí no me ha dado nada.","a":["A"]},{"t":"text","q":"Le dije ___ usted que no era verdad.","a":["a"]},{"t":"text","q":"___ nosotros nos ha preguntado dónde vivimos.","a":["A"]}]},{"title":"연습 4. 직접 vs 간접","instr":"알맞은 대명사를 고르세요.","rule":"직접목적어(…을) lo/la, 간접목적어(…에게) le.","items":[{"t":"pick","q":"A Pedro le he regalado una cartera. Pedro는 ___","o":["간접목적어","직접목적어"],"a":"간접목적어"},{"t":"pick","q":"A Carlos lo vi ayer. Carlos는 ___","o":["직접목적어","간접목적어"],"a":"직접목적어"},{"t":"pick","q":"¿Qué ___ has dicho a Juan?","o":["le","lo","la"],"a":"le"},{"t":"pick","q":"¿___ conoces a Juan?","o":["Lo","Le","La"],"a":"Lo"}]}]};</script>
