<script>window.UNIT={"id":16,"es":"tan alto, igual de alto","ko":"형용사의 비교급 (2)","theory":"<h2>핵심 정리<\/h2>\n<p>두 대상의 성질이 <b>같을 때<\/b> 씁니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><b>tan<\/b> + 형용사 + <b>como<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Martín es tan alto como Carlos.\">Martín es tan alto como Carlos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Un caballo no es tan grande como un elefante.\">Un caballo no es tan grande como un elefante.<\/span><\/td><\/tr><tr><td><b>igual de<\/b> + 형용사 (+ <b>que<\/b>)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Martín es igual de alto que Carlos.\">Martín es igual de alto que Carlos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Martín y Carlos son igual de altos.\">Martín y Carlos son igual de altos.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>형용사는 주어의 성·수에 일치: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi hermana es tan alta como yo.\">Mi hermana es tan alta como yo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Sonia y su madre son igual de guapas.\">Sonia y su madre son igual de guapas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estos dos televisores son igual de caros.\">Estos dos televisores son igual de caros.<\/span><\/li><li>como/que + <b>주격 인칭대명사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Los hijos de Andrés no son tan guapos como él.\">Los hijos de Andrés no son tan guapos como él.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Yo soy igual de trabajadora que vosotros.\">Yo soy igual de trabajadora que vosotros.<\/span><\/li><li>부정: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Soy tan alto como tú, pero no soy tan fuerte.\">Soy tan alto como tú, pero no soy tan fuerte.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Un toro no es tan rápido como un caballo.\">Un toro no es tan rápido como un caballo.<\/span><\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>tan … como<\/b>는 igual de … que와 같은 뜻이지만 짝을 바꾸어 쓰지 않습니다. (tan … que ✗, igual de … como ✗)<\/div>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>부정적 형용사 대신 no tan + 긍정 형용사를 즐겨 씁니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Adolfo es más feo que Jorge.\">Adolfo es más feo que Jorge.<\/span> → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Adolfo no es tan guapo como Jorge.\">Adolfo no es tan guapo como Jorge.<\/span><\/div>","ex":[{"title":"연습 1. tan … como","instr":"알맞은 말을 고르세요.","rule":"tan + 형용사 + como. 형용사는 주어의 성·수에 일치.","items":[{"t":"pick","q":"Martín es tan alto ___ Carlos.","o":["como","que","de"],"a":"como"},{"t":"pick","q":"Mi hermana es tan ___ como yo. (alto)","o":["alta","alto","altas"],"a":"alta"},{"t":"pick","q":"Un caballo no es tan ___ como un elefante. (grande)","o":["grande","grandes","grando"],"a":"grande"},{"t":"pick","q":"Sonia es tan guapa ___ su madre.","o":["como","que","igual"],"a":"como"},{"t":"pick","q":"Estos zapatos son tan ___ como esos. (caro)","o":["caros","caro","caras"],"a":"caros"},{"t":"pick","q":"El tren no es tan ___ como el avión. (rápido)","o":["rápido","rápida","rápidos"],"a":"rápido"}]},{"title":"연습 2. igual de … que","instr":"알맞은 말을 쓰세요.","rule":"igual de + 형용사 (+ que). 복수 주어에는 형용사도 복수.","items":[{"t":"text","q":"Martín es igual ___ alto que Carlos.","a":["de"]},{"t":"text","q":"Mi piso es igual de pequeño ___ el tuyo.","a":["que"]},{"t":"text","q":"Sonia y su madre son igual de ___. (guapa)","a":["guapas"]},{"t":"text","q":"Estos dos televisores son igual de ___. (caro)","a":["caros"]},{"t":"text","q":"Martín y Carlos son igual de ___. (alto)","a":["altos"]},{"t":"text","q":"Yo soy igual de trabajadora ___ vosotros.","a":["que"]}]},{"title":"연습 3. 동등비교로 바꾸기","instr":"알맞은 인칭대명사를 쓰세요.","rule":"como/que 뒤에는 주격 인칭대명사를 씁니다.","items":[{"t":"text","q":"Los hijos de Andrés no son tan guapos como ___. (그)","a":["él"]},{"t":"text","q":"Soy tan alto como ___. (너)","a":["tú"]},{"t":"text","q":"Ellas son tan trabajadoras como ___. (우리)","a":["nosotras"]},{"t":"text","q":"Yo no soy tan rápido como ___. (그녀)","a":["ella"]},{"t":"text","q":"Mi hermana es tan alta como ___. (나)","a":["yo"]},{"t":"text","q":"No somos tan fuertes como ___. (너희)","a":["vosotros"]}]},{"title":"연습 4. no tan … como","instr":"문장을 no tan … como로 바꿀 때 알맞은 형용사를 고르세요.","rule":"부정 형용사를 쓰는 대신 no tan + 긍정 형용사.","items":[{"t":"pick","q":"Adolfo es más feo que Jorge. → Adolfo no es tan ___ como Jorge.","o":["guapo","feo","alto"],"a":"guapo"},{"t":"pick","q":"Luisa es menos fuerte que Ana. → Luisa no es tan ___ como Ana.","o":["fuerte","débil","baja"],"a":"fuerte"},{"t":"pick","q":"Este coche es más lento que ese. → Este coche no es tan ___ como ese.","o":["rápido","lento","viejo"],"a":"rápido"},{"t":"pick","q":"Mi casa es más pequeña que la tuya. → Mi casa no es tan ___ como la tuya.","o":["grande","pequeña","cara"],"a":"grande"}]}]};</script>
