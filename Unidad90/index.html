<script>window.UNIT={"id":90,"es":"Me pidió que le ayudara","ko":"간접화법 (3): 명령·부탁","theory":"<h2>핵심 정리<\/h2>\n<h3>구조<\/h3>\n<div class=\"tw\"><table><thead><tr><th>전달 동사<\/th><th>접속법 시제<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>Dice que… / Me ha dicho que… / Me ha pedido que…<\/td><td><b>현재<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El director dice que vayas ahora.\">El director dice que vayas ahora.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Luis me ha pedido que le enseñe a conducir.\">Luis me ha pedido que le enseñe a conducir.<\/span><\/td><\/tr><tr><td>Dijo que… / Me pidió que…<\/td><td><b>불완료과거<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Luisa dijo que la llamara hoy.\">Luisa dijo que la llamara hoy.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ramsés me pidió que le ayudara.\">Ramsés me pidió que le ayudara.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>직접: “Dile a Jaime que venga.” → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Dice papá que vayas.\">Dice papá que vayas.<\/span> / “No coman en la oficina.” → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"La jefa nos ha pedido que no comamos en la oficina.\">La jefa nos ha pedido que no comamos en la oficina.<\/span><\/li><\/ul>\n<h3>전달 동사<\/h3>\n<ul class=\"rules\"><li><b>decir<\/b>(= ordenar, no informar), mandar, ordenar, exigir: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alicia me ha dicho que deje de trabajar tanto.\">Alicia me ha dicho que deje de trabajar tanto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El policía nos ordenó que no nos moviéramos de allí.\">El policía nos ordenó que no nos moviéramos de allí.<\/span><\/li><li><b>pedir<\/b> (부탁): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi padre se va a Brasil y me ha pedido que lo lleve al aeropuerto esta noche.\">Mi padre se va a Brasil y me ha pedido que lo lleve al aeropuerto esta noche.<\/span><\/li><li>aconsejar, advertir, rogar, sugerir: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esteban me aconsejó que no le dijera a nadie que lo había visto.\">Esteban me aconsejó que no le dijera a nadie que lo había visto.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El jefe nos advirtió que no volviéramos a llegar tarde.\">El jefe nos advirtió que no volviéramos a llegar tarde.<\/span><\/li><\/ul>\n<h3>시제 선택<\/h3>\n<ul class=\"rules\"><li>전달 동사가 <b>현재·현재완료<\/b> → 접속법 <b>현재<\/b> (현재 또는 미래 일): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rafa dice que apagues la tele, que quiere estudiar.\">Rafa dice que apagues la tele, que quiere estudiar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rosario me ha pedido que la despierte a las ocho mañana.\">Rosario me ha pedido que la despierte a las ocho mañana.<\/span><\/li><li>전달 동사가 <b>과거<\/b>(주로 단순과거) → 접속법 <b>불완료과거<\/b> (과거·현재·미래): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Cuando suspendí el año pasado el profesor me sugirió que trabajara más.\">Cuando suspendí el año pasado el profesor me sugirió que trabajara más.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Voy a despertar a Juan. Me pidió que lo despertara a esta hora.\">Voy a despertar a Juan. Me pidió que lo despertara a esta hora.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hablé con Carlos hace una semana y me pidió que le volviera a llamar este lunes.\">Hablé con Carlos hace una semana y me pidió que le volviera a llamar este lunes.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 전달 동사가 현재","instr":"알맞은 접속법 형태를 고르세요.","rule":"Dice que + 접속법 현재.","items":[{"t":"pick","q":"“Ven ahora.” → El director dice que ___ ahora.","o":["vengas","vinieras","vienes"],"a":"vengas"},{"t":"pick","q":"“Apaga la tele.” → Rafa dice que ___ la tele.","o":["apagues","apagaras","apagas"],"a":"apagues"},{"t":"pick","q":"“Enséñame a conducir.” → Luis me ha pedido que le ___ a conducir.","o":["enseñe","enseñara","enseño"],"a":"enseñe"},{"t":"pick","q":"“Déjame en paz.” → Me ha dicho que la ___ en paz.","o":["deje","dejara","dejó"],"a":"deje"},{"t":"pick","q":"“Llámame mañana.” → Me ha pedido que le ___ mañana.","o":["llame","llamara","llamó"],"a":"llame"},{"t":"pick","q":"“No comáis aquí.” → La jefa nos ha pedido que no ___ aquí.","o":["comamos","comiéramos","comimos"],"a":"comamos"},{"t":"pick","q":"“Despiértame a las ocho.” → Me ha pedido que la ___ a las ocho.","o":["despierte","despertara","despierto"],"a":"despierte"},{"t":"pick","q":"“Lleva esto a casa.” → Mi madre me ha dicho que ___ esto a casa.","o":["lleve","llevara","llevo"],"a":"lleve"}]},{"title":"연습 2. 전달 동사가 과거","instr":"알맞은 접속법 형태를 고르세요.","rule":"Dijo / Pidió que + 접속법 불완료과거.","items":[{"t":"pick","q":"“Llámame hoy.” → Luisa dijo que la ___ hoy.","o":["llamara","llame","llamo"],"a":"llamara"},{"t":"pick","q":"“Ayúdame.” → Ramsés me pidió que le ___ .","o":["ayudara","ayude","ayudo"],"a":"ayudara"},{"t":"pick","q":"“No os mováis.” → El policía nos ordenó que no nos ___ .","o":["moviéramos","movamos","movimos"],"a":"moviéramos"},{"t":"pick","q":"“No le digas nada.” → Esteban me aconsejó que no le ___ nada.","o":["dijera","diga","dijo"],"a":"dijera"},{"t":"pick","q":"“No lleguéis tarde.” → El jefe nos advirtió que no ___ tarde.","o":["llegáramos","lleguemos","llegamos"],"a":"llegáramos"},{"t":"pick","q":"“Trabaja más.” → El profesor me sugirió que ___ más.","o":["trabajara","trabaje","trabajo"],"a":"trabajara"},{"t":"pick","q":"“Vuelve pronto.” → Me pidió que ___ pronto.","o":["volviera","vuelva","vuelvo"],"a":"volviera"},{"t":"pick","q":"“Ven aquí.” → Me dijo que ___ aquí.","o":["viniera","venga","vengo"],"a":"viniera"}]},{"title":"연습 3. 알맞은 형태 쓰기","instr":"괄호의 동사를 알맞은 형태로 쓰세요.","rule":"현재형 전달 → 접속법 현재 / 과거형 전달 → 접속법 불완료과거.","items":[{"t":"text","q":"Mi padre me ha pedido que lo (llevar) ___ al aeropuerto.","a":["lleve"]},{"t":"text","q":"Mi padre me pidió que lo (llevar) ___ al aeropuerto.","a":["llevara"]},{"t":"text","q":"Alicia me ha dicho que (dejar, yo) ___ de trabajar tanto.","a":["deje"]},{"t":"text","q":"El jefe nos advirtió que no (volver, nosotros) ___ a llegar tarde.","a":["volviéramos"]},{"t":"text","q":"Rafa dice que (apagar, tú) ___ la tele.","a":["apagues"]},{"t":"text","q":"El policía ordenó que (salir, nosotros) ___ de allí.","a":["saliéramos"]},{"t":"text","q":"Mi madre me ha rogado que (tener, yo) ___ cuidado.","a":["tenga"]},{"t":"text","q":"Mi madre me rogó que (tener, yo) ___ cuidado.","a":["tuviera"]}]},{"title":"연습 4. 전달 동사 선택","instr":"알맞은 동사를 고르세요.","rule":"pedir(부탁), decir(명령), aconsejar(충고), advertir(경고).","items":[{"t":"pick","q":"Mi padre me ha ___ que lo lleve al aeropuerto. (부탁)","o":["pedido","preguntado","dicho si"],"a":"pedido"},{"t":"pick","q":"Esteban me ___ que no se lo dijera a nadie. (충고)","o":["aconsejó","preguntó","contó"],"a":"aconsejó"},{"t":"pick","q":"El jefe nos ___ que no volviéramos a llegar tarde. (경고)","o":["advirtió","preguntó","prometió"],"a":"advirtió"},{"t":"pick","q":"El policía nos ___ que no nos moviéramos. (명령)","o":["ordenó","preguntó","prometió"],"a":"ordenó"},{"t":"pick","q":"El profesor me ___ que trabajara más. (제안)","o":["sugirió","preguntó","contó"],"a":"sugirió"}]}]};</script>
