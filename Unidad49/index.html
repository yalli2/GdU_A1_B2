<script>window.UNIT={"id":49,"es":"quiero, mido, sueño…","ko":"직설법 현재: 불규칙동사 (1)","theory":"<h2>핵심 정리<\/h2>\n<p>강세가 어간에 오는 인칭(yo, tú, él/ella/usted, ellos/ellas/ustedes)에서 어간 모음이 바뀝니다. <b>nosotros, vosotros<\/b>는 규칙.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>e → ie (querer)<\/th><th>e → i (pedir)<\/th><th>o → ue (dormir)<\/th><th>u → ue (jugar)<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td>quiero<\/td><td>pido<\/td><td>duermo<\/td><td>juego<\/td><\/tr><tr><td>tú<\/td><td>quieres<\/td><td>pides<\/td><td>duermes<\/td><td>juegas<\/td><\/tr><tr><td>usted, él, ella<\/td><td>quiere<\/td><td>pide<\/td><td>duerme<\/td><td>juega<\/td><\/tr><tr><td>nosotros/as<\/td><td>queremos<\/td><td>pedimos<\/td><td>dormimos<\/td><td>jugamos<\/td><\/tr><tr><td>vosotros/as<\/td><td>queréis<\/td><td>pedís<\/td><td>dormís<\/td><td>jugáis<\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td>quieren<\/td><td>piden<\/td><td>duermen<\/td><td>juegan<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li><b>e → ie<\/b>: empezar, fregar, pensar, regar, cerrar, entender, perder, mentir, preferir<\/li><li><b>e → i<\/b>: elegir, conseguir, freír, medir, reír, repetir, seguir, sonreír<\/li><li><b>o → ue<\/b>: comprobar, contar, costar, encontrar, recordar, sonar, volar, morder, mover, volver, poder, morir<\/li><\/ul>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>venir<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"vengo\">vengo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"vienes\">vienes<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"viene\">viene<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"venimos\">venimos<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"venís\">venís<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"vienen\">vienen<\/span> / <b>decir<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"digo\">digo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dices\">dices<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dice\">dice<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"decimos\">decimos<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"decís\">decís<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"dicen\">dicen<\/span> / <b>oler<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"huelo\">huelo<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"hueles\">hueles<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"huele\">huele<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"olemos\">olemos<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"oléis\">oléis<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"huelen\">huelen<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No juego muy bien al tenis.\">No juego muy bien al tenis.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Las gallinas no vuelan.\">Las gallinas no vuelan.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿En qué piensas?\">¿En qué piensas?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Solo duermo cinco horas al día.\">Solo duermo cinco horas al día.<\/span><\/div>","ex":[{"title":"연습 1. e → ie","instr":"알맞은 형태를 쓰세요.","rule":"nosotros/vosotros는 규칙 (queremos, queréis). 나머지는 e → ie.","items":[{"t":"text","q":"(yo, querer) ___ un café.","a":["quiero"]},{"t":"text","q":"(tú, querer) ___ té.","a":["quieres"]},{"t":"text","q":"(nosotros, querer) ___ salir.","a":["queremos"]},{"t":"text","q":"(ella, pensar) ___ en ti.","a":["piensa"]},{"t":"text","q":"(vosotros, preferir) ___ el cine.","a":["preferís"]},{"t":"text","q":"(ellos, cerrar) ___ la tienda.","a":["cierran"]},{"t":"text","q":"(yo, empezar) ___ a trabajar.","a":["empiezo"]},{"t":"text","q":"(tú, perder) ___ el tren.","a":["pierdes"]}]},{"title":"연습 2. e → i","instr":"알맞은 형태를 쓰세요.","rule":"pedir, repetir, seguir, medir, elegir: e → i.","items":[{"t":"text","q":"(yo, pedir) ___ un café.","a":["pido"]},{"t":"text","q":"(tú, pedir) ___ una cerveza.","a":["pides"]},{"t":"text","q":"(nosotros, pedir) ___ la cuenta.","a":["pedimos"]},{"t":"text","q":"(ellos, repetir) ___ la frase.","a":["repiten"]},{"t":"text","q":"(yo, medir) ___ 1,80 m.","a":["mido"]},{"t":"text","q":"(ella, seguir) ___ recto.","a":["sigue"]}]},{"title":"연습 3. o → ue / u → ue","instr":"알맞은 형태를 쓰세요.","rule":"dormir, poder, volver, contar, costar, encontrar, jugar.","items":[{"t":"text","q":"(yo, dormir) ___ cinco horas.","a":["duermo"]},{"t":"text","q":"(tú, poder) ___ venir.","a":["puedes"]},{"t":"text","q":"(nosotros, dormir) ___ poco.","a":["dormimos"]},{"t":"text","q":"(ellos, volver) ___ a casa.","a":["vuelven"]},{"t":"text","q":"(yo, jugar) ___ al tenis.","a":["juego"]},{"t":"text","q":"(nosotros, jugar) ___ al fútbol.","a":["jugamos"]},{"t":"text","q":"(esto, costar) ___ diez euros.","a":["cuesta"]},{"t":"text","q":"(vosotros, poder) ___ salir.","a":["podéis"]}]},{"title":"연습 4. venir, decir, oler","instr":"알맞은 형태를 쓰세요.","rule":"venir: vengo, vienes, viene, venimos, venís, vienen. decir: digo, dices, dice, decimos, decís, dicen.","items":[{"t":"text","q":"(yo, venir) ___ de Madrid.","a":["vengo"]},{"t":"text","q":"(tú, decir) ___ la verdad.","a":["dices"]},{"t":"text","q":"(él, venir) ___ mañana.","a":["viene"]},{"t":"text","q":"(nosotros, decir) ___ que sí.","a":["decimos"]},{"t":"text","q":"(yo, decir) ___ que no.","a":["digo"]},{"t":"text","q":"(la flor, oler) ___ bien.","a":["huele"]}]}]};</script>
