<script>window.UNIT={"id":41,"es":"para mí, contigo…","ko":"전치사 + 인칭대명사","theory":"<h2>핵심 정리<\/h2>\n<p>전치사(a, de, para, por, sin, con, en…) 뒤에는 <b>전치사격 대명사<\/b>를 씁니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>인칭<\/th><th>전치사 + 대명사<\/th><\/tr><\/thead><tbody><tr><td>1인칭 단수<\/td><td><b>mí<\/b> (<span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"para mí\">para mí<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"sin mí\">sin mí<\/span>) — 악센트 있음<\/td><\/tr><tr><td>2인칭 단수<\/td><td><b>ti<\/b> (<span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"para ti\">para ti<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"de ti\">de ti<\/span>) — 악센트 없음<\/td><\/tr><tr><td>3인칭<\/td><td><b>él, ella, usted<\/b> (<span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"con él\">con él<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"con ella\">con ella<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"para usted\">para usted<\/span>)<\/td><\/tr><tr><td>복수<\/td><td><b>nosotros/as, vosotros/as, ustedes, ellos, ellas<\/b> (<span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"junto a nosotras\">junto a nosotras<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"para ustedes\">para ustedes<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"para ellos\">para ellos<\/span>)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>con + mí = conmigo<\/b>, <b>con + ti = contigo<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te quieres venir conmigo al cine?\">¿Te quieres venir conmigo al cine?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Soy muy feliz contigo.\">Soy muy feliz contigo.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No pueden vivir sin mí.\">No pueden vivir sin mí.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No quiero nada de ti.\">No quiero nada de ti.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay una llamada para usted.\">Hay una llamada para usted.<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Has visto a Dana? Quiero hablar con ella.\">¿Has visto a Dana? Quiero hablar con ella.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo algo de comida para ellos.\">Tengo algo de comida para ellos.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>entre, excepto, hasta (=incluso), incluso, menos, según<\/b> 뒤에는 <b>주격 대명사 yo, tú<\/b>를 씁니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Siéntate aquí, entre Ivana y yo.\">Siéntate aquí, entre Ivana y yo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Saben nadar todos menos yo.\">Saben nadar todos menos yo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Según tú, ¿quién es el culpable?\">Según tú, ¿quién es el culpable?<\/span><\/div>","ex":[{"title":"연습 1. 전치사 + 대명사","instr":"알맞은 대명사를 고르세요.","rule":"1인칭 mí, 2인칭 ti, 3인칭 él/ella 등. con + mí = conmigo.","items":[{"t":"pick","q":"Toma, es para ___. (너)","o":["ti","tú","te"],"a":"ti"},{"t":"pick","q":"¿Para ___? Gracias. (나)","o":["mí","yo","me"],"a":"mí"},{"t":"pick","q":"No pueden vivir sin ___. (나)","o":["mí","yo","me"],"a":"mí"},{"t":"pick","q":"No quiero nada de ___. (너)","o":["ti","tú","te"],"a":"ti"},{"t":"pick","q":"Hay una llamada para ___. (usted)","o":["usted","ti","tú"],"a":"usted"},{"t":"pick","q":"Quiero hablar con ___. (그 남자)","o":["él","ello","le"],"a":"él"}]},{"title":"연습 2. conmigo / contigo","instr":"알맞은 것을 쓰세요.","rule":"con + mí = conmigo, con + ti = contigo. 그 외는 con él, con ella…","items":[{"t":"text","q":"Irene, ¿quieres venir al cine ___? (나와 함께)","a":["conmigo"]},{"t":"text","q":"Soy muy feliz ___. (너와 함께)","a":["contigo"]},{"t":"text","q":"¿Te quieres venir ___ al cine? (나와 함께)","a":["conmigo"]},{"t":"text","q":"Quiero hablar ___ él.","a":["con"]},{"t":"text","q":"No voy ___ ti. (너와 함께)","a":["contigo"]},{"t":"text","q":"¿Vienes ___ ella?","a":["con"]}]},{"title":"연습 3. entre / según / menos + yo, tú","instr":"알맞은 대명사를 고르세요.","rule":"이 전치사 뒤에는 주격 대명사(yo, tú)를 씁니다.","items":[{"t":"pick","q":"Siéntate aquí, entre Ivana y ___.","o":["yo","mí","me"],"a":"yo"},{"t":"pick","q":"Todos hablan idiomas menos ___.","o":["yo","mí","me"],"a":"yo"},{"t":"pick","q":"Según ___, ¿quién es el culpable?","o":["tú","ti","te"],"a":"tú"},{"t":"pick","q":"Todos vinieron, incluso ___.","o":["tú","ti","te"],"a":"tú"},{"t":"pick","q":"Todos están aquí excepto ___.","o":["yo","mí","me"],"a":"yo"},{"t":"pick","q":"Saben nadar todos menos ___.","o":["yo","mí","me"],"a":"yo"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 대명사를 쓰세요.","rule":"전치사 뒤 대명사의 형태를 정확히 쓰세요. (악센트 주의)","items":[{"t":"text","q":"Este regalo es para ___. (나에게)","a":["mí"]},{"t":"text","q":"Juan habla de ___. (너에 대해)","a":["ti"]},{"t":"text","q":"Siéntate junto a ___. (우리 여자들)","a":["nosotras"]},{"t":"text","q":"Tengo algo para ___. (너희)","a":["vosotros","vosotras"]},{"t":"text","q":"¿Dónde están los gatos? Tengo comida para ___. (그들)","a":["ellos"]},{"t":"text","q":"No puedo vivir sin ___. (너 없이)","a":["ti"]}]}]};</script>
