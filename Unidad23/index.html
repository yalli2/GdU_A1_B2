<script>window.UNIT={"id":23,"es":"alguien, algo, nadie, nada","ko":"부정어 (4)","theory":"<h2>핵심 정리<\/h2>\n<p>정체를 알 수 없는 사람이나 사물을 가리킵니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>사람<\/th><th>사물<\/th><\/tr><\/thead><tbody><tr><td>긍정문·의문문<\/td><td><b>alguien<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alguien ha roto la silla.\">Alguien ha roto la silla.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Hay alguien ahí dentro?\">¿Hay alguien ahí dentro?<\/span><\/td><td><b>algo<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay algo en la sopa.\">Hay algo en la sopa.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Has dicho algo?\">¿Has dicho algo?<\/span><\/td><\/tr><tr><td>부정문<\/td><td><b>nadie<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No ha venido nadie.\">No ha venido nadie.<\/span><\/td><td><b>nada<\/b> — <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hoy no he vendido nada.\">Hoy no he vendido nada.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>nadie, nada + 긍정 동사<\/b> / <b>no + 동사 + nadie, nada<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nadie me ha visto.\">Nadie me ha visto.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me ha visto nadie.\">No me ha visto nadie.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nada le importa.\">Nada le importa.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No le importa nada.\">No le importa nada.<\/span><\/div>\n<ul class=\"rules\"><li>불가산 명사와 함께: <b>algo de<\/b>(조금), <b>nada de<\/b>(전혀 없음): <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay algo de queso en la nevera.\">Hay algo de queso en la nevera.<\/span> (조금 있다), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No hay nada de queso.\">No hay nada de queso.<\/span><\/li><li>앞에서 언급한 명사는 생략: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes dinero? — Tengo algo. — Pues yo no tengo nada.\">¿Tienes dinero? — Tengo algo. — Pues yo no tengo nada.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. alguien / nadie","instr":"알맞은 말을 고르세요.","rule":"긍정문·의문문 → alguien, 부정문 → nadie (no + 동사 + nadie).","items":[{"t":"pick","q":"¿Hay ___ ahí dentro?","o":["alguien","nadie"],"a":"alguien"},{"t":"pick","q":"No ha venido ___.","o":["alguien","nadie"],"a":"nadie"},{"t":"pick","q":"___ ha roto la silla.","o":["Alguien","Nadie"],"a":"Alguien"},{"t":"pick","q":"___ me ha visto.","o":["Alguien","Nadie"],"a":"Nadie"},{"t":"pick","q":"No conozco a ___ en esta ciudad.","o":["alguien","nadie"],"a":"nadie"},{"t":"pick","q":"¿Conoces a ___ en Madrid?","o":["alguien","nadie"],"a":"alguien"}]},{"title":"연습 2. algo / nada","instr":"알맞은 말을 고르세요.","rule":"긍정문·의문문 → algo, 부정문 → nada.","items":[{"t":"pick","q":"Hay ___ en la sopa.","o":["algo","nada"],"a":"algo"},{"t":"pick","q":"Hoy no he vendido ___.","o":["algo","nada"],"a":"nada"},{"t":"pick","q":"¿Has dicho ___?","o":["algo","nada"],"a":"algo"},{"t":"pick","q":"___ le importa.","o":["Algo","Nada"],"a":"Nada"},{"t":"pick","q":"No me gusta ___.","o":["algo","nada"],"a":"nada"},{"t":"pick","q":"¿Quieres ___ de beber?","o":["algo","nada"],"a":"algo"}]},{"title":"연습 3. 이중부정 바꾸기","instr":"같은 뜻이 되도록 빈칸에 쓰세요.","rule":"nadie/nada가 동사 앞이면 no를 쓰지 않고, 동사 뒤이면 no를 씁니다.","items":[{"t":"text","q":"Nadie me ha visto. = No me ha visto ___.","a":["nadie"]},{"t":"text","q":"Nada le importa. = No le importa ___.","a":["nada"]},{"t":"text","q":"No ha venido nadie. = ___ ha venido.","a":["Nadie"]},{"t":"text","q":"No dice nada. = ___ dice.","a":["Nada"]},{"t":"text","q":"Nadie sabe la respuesta. = ___ sabe nadie la respuesta.","a":["No"]}]},{"title":"연습 4. algo de / nada de","instr":"알맞은 것을 고르세요.","rule":"불가산 명사와 함께 algo de(조금), nada de(전혀).","items":[{"t":"pick","q":"Hay ___ de queso en la nevera. (조금)","o
