<script>window.UNIT={"id":73,"es":"Abre la ventana","ko":"긍정 명령법: 규칙동사","theory":"<h2>핵심 정리<\/h2>\n<h3>규칙 활용<\/h3>\n<div class=\"tw\"><table><thead><tr><th>대상<\/th><th>-ar (trabajar)<\/th><th>-er (comer)<\/th><th>-ir (vivir)<\/th><\/tr><\/thead><tbody><tr><td>tú<\/td><td>trabaja<\/td><td>come<\/td><td>vive<\/td><\/tr><tr><td>usted<\/td><td>trabaje<\/td><td>coma<\/td><td>viva<\/td><\/tr><tr><td>vosotros/as<\/td><td>trabajad<\/td><td>comed<\/td><td>vivid<\/td><\/tr><tr><td>ustedes<\/td><td>trabajen<\/td><td>coman<\/td><td>vivan<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>ver: ve, vea, ved, vean.<\/div>\n<h3>철자 변화 (usted/ustedes형)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>어미<\/th><th>동사<\/th><th>tú<\/th><th>usted<\/th><th>vosotros<\/th><th>ustedes<\/th><\/tr><\/thead><tbody><tr><td>-gar<\/td><td>pagar<\/td><td>paga<\/td><td>pague<\/td><td>pagad<\/td><td>paguen<\/td><\/tr><tr><td>-ger<\/td><td>escoger<\/td><td>escoge<\/td><td>escoja<\/td><td>escoged<\/td><td>escojan<\/td><\/tr><tr><td>-car<\/td><td>practicar<\/td><td>practica<\/td><td>practique<\/td><td>practicad<\/td><td>practiquen<\/td><\/tr><tr><td>-zar<\/td><td>cruzar<\/td><td>cruza<\/td><td>cruce<\/td><td>cruzad<\/td><td>crucen<\/td><\/tr><\/tbody><\/table><\/div>\n<ul class=\"rules\"><li>필요하면 <b>주어 인칭대명사<\/b>를 동사 뒤에: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ahora habla tú, Ismael.\">Ahora habla tú, Ismael.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Pasen ustedes, por favor.\">Pasen ustedes, por favor.<\/span><\/li><\/ul>\n<h3>쓰임<\/h3>\n<ul class=\"rules\"><li><b>명령·지시<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Envíe esta carta, Sr. Aguayo, por favor.\">Envíe esta carta, Sr. Aguayo, por favor.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Abra con cuidado.\">Abra con cuidado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¡Policía! ¡Abran la puerta!\">¡Policía! ¡Abran la puerta!<\/span><\/li><li><b>부탁·권유<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Abre la puerta, por favor.\">Abre la puerta, por favor.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Coged un pastel. Están muy ricos.\">Coged un pastel. Están muy ricos.<\/span><\/li><li><b>충고·경고<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Come más. Estás muy delgado.\">Come más. Estás muy delgado.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Trabaja o tendrás problemas.\">Trabaja o tendrás problemas.<\/span><\/li><li><b>허락<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"—¿Puedo pasar? —Sí, por supuesto, pasa.\">—¿Puedo pasar? —Sí, por supuesto, pasa.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. tú 명령","instr":"알맞은 명령형(tú)을 쓰세요.","rule":"-ar → -a, -er → -e, -ir → -e.","items":[{"t":"text","q":"(abrir) ___ la ventana, por favor.","a":["Abre"]},{"t":"text","q":"(comer) ___ más.","a":["Come"]},{"t":"text","q":"(trabajar) ___ más.","a":["Trabaja"]},{"t":"text","q":"(hablar) ___ tú, Ismael.","a":["Habla"]},{"t":"text","q":"(escribir) ___ una carta.","a":["Escribe"]},{"t":"text","q":"(cantar) ___ con nosotros.","a":["Canta"]},{"t":"text","q":"(beber) ___ agua.","a":["Bebe"]},{"t":"text","q":"(cerrar) ___ la puerta.","a":["Cierra"]}]},{"title":"연습 2. usted / vosotros / ustedes","instr":"알맞은 형태를 쓰세요.","rule":"usted -e/-a, vosotros -ad/-ed/-id, ustedes -en/-an.","items":[{"t":"text","q":"(usted, abrir) ___ con cuidado.","a":["Abra"]},{"t":"text","q":"(usted, enviar) ___ esta carta.","a":["Envíe"]},{"t":"text","q":"(vosotros, abrir) ___ el libro.","a":["Abrid"]},{"t":"text","q":"(vosotros, coger) ___ un pastel.","a":["Coged"]},{"t":"text","q":"(ustedes, pasar) ___ , por favor.","a":["Pasen"]},{"t":"text","q":"(ustedes, abrir) ___ la puerta.","a":["Abran"]},{"t":"text","q":"(vosotros, comer) ___ más.","a":["Comed"]},{"t":"text","q":"(usted, hablar) ___ más despac
