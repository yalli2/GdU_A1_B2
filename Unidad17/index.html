<script>window.UNIT={"id":17,"es":"la más alta, el menos trabajador","ko":"최상급","theory":"<h2>핵심 정리<\/h2>\n<p>무리 안에서 가장 ~한 것을 말합니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>el / la / los / las (+ 명사) + <b>más<\/b> + 형용사 (+ de)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alberto es el más trabajador de su familia.\">Alberto es el más trabajador de su familia.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"El Everest es la montaña más alta del mundo.\">El Everest es la montaña más alta del mundo.<\/span><\/td><\/tr><tr><td>el / la / los / las (+ 명사) + <b>menos<\/b> + 형용사 (+ de)<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hugo es el menos hablador de mis amigos.\">Hugo es el menos hablador de mis amigos.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Paraguay es el país menos poblado de América del Sur.\">Paraguay es el país menos poblado de América del Sur.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>불규칙 최상급<\/h3>\n<div class=\"tw\"><table><thead><tr><th>의미<\/th><th>형태<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>가장 나이 많은<\/td><td><b>el/la mayor<\/b>, los/las mayores<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Eva es la mayor de sus hermanos.\">Eva es la mayor de sus hermanos.<\/span><\/td><\/tr><tr><td>가장 어린<\/td><td><b>el/la menor<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Carlos es el menor de la familia.\">Carlos es el menor de la familia.<\/span><\/td><\/tr><tr><td>가장 좋은<\/td><td><b>el/la mejor<\/b>, los/las mejores<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Estas naranjas son las mejores de España.\">Estas naranjas son las mejores de España.<\/span><\/td><\/tr><tr><td>가장 나쁜<\/td><td><b>el/la peor<\/b><\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este es el peor día de mi vida.\">Este es el peor día de mi vida.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>mejor / peor + 명사 + de + 명사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Julián es el mejor alumno de la clase.\">Julián es el mejor alumno de la clase.<\/span> / 최상급 + <b>que + 동사<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Elena es la chica más alegre que he conocido.\">Elena es la chica más alegre que he conocido.<\/span><\/div>\n<ul class=\"rules\"><li>형용사는 대상의 성·수에 일치: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Carola y Elena son las más simpáticas del grupo.\">Carola y Elena son las más simpáticas del grupo.<\/span><\/li><li>비교 집단이 분명하면 생략: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Este televisor es el más caro.\">Este televisor es el más caro.<\/span> (de todos los de la tienda), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Laura es la más alta.\">Laura es la más alta.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 최상급 만들기","instr":"알맞은 관사를 고르세요.","rule":"최상급 관사는 주어의 성·수에 일치: el, la, los, las.","items":[{"t":"pick","q":"Alberto es ___ más trabajador de su familia.","o":["el","la","los","las"],"a":"el"},{"t":"pick","q":"El Everest es ___ montaña más alta del mundo.","o":["el","la","los","las"],"a":"la"},{"t":"pick","q":"Estos libros son ___ más caros de la tienda.","o":["el","la","los","las"],"a":"los"},{"t":"pick","q":"Carla es ___ más alta de sus hermanos.","o":["el","la","los","las"],"a":"la"},{"t":"pick","q":"Ellas son ___ menos habladoras.","o":["el","la","los","las"],"a":"las"},{"t":"pick","q":"Mario es ___ menos trabajador de la clase.","o":["el","la","los","las"],"a":"el"}]},{"title":"연습 2. 불규칙 최상급","instr":"알맞은 것을 고르세요.","rule":"mayor, menor, mejor, peor는 más/menos 없이 씁니다.","items":[{"t":"pick","q":"Estas naranjas son ___ de España. (가장 좋은)","o":["las mejores","las más buenas","los mejores"],"a":"las mejores"},{"t":"pick","q":"Eva es ___ de sus hermanos. (가장 나이 많은)","o":["la mayor","la más vieja","el mayor"],"a":"la mayor"},{"t":"pick","q":"Julián es ___ alumno de la clase. (가장 좋은)","o":["el mejor","el más bueno","la mejor"],"a":"el mejor"},{"t":"pick","q":"Este es ___ día de mi vida. (가장 나쁜)","o":["el peor","el más malo","la peor"],"a":"el peor"},{"t":"pick","q":"Carlos es ___ de la familia. (가장 어린)","o":["el menor","el más joven","la menor"],"a":"el menor"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 말을 쓰세요.","rule":"최상급 뒤의 ‘~중에서’는 de를 씁니다. que는 뒤에 동사가 올 때.","items":[{"t":"text","q":"Raúl es el más cariñoso ___ sus hermanos.","a":["de"]},{"t":"text","q":"Hoy es el día más feliz ___ mi vida.","a":["de"]},{"t":"text","q":"Elena es la chica más alegre ___ he conocido.","a":["que"]},{"t":"text","q":"Carola y Elena son las más ___ del grupo. (simpática)","a":["simpáticas"]},{"t":"text","q":"Paraguay es el país menos ___ de América del Sur. (poblado)","a":["poblado"]},{"t":"text","q":"Zapatos Loto, los más ___. (cómodo)","a":["cómodos"]}]},{"title":"연습 4. 비교급 vs 최상급","instr":"알맞은 것을 고르세요.","rule":"비교급 = más … que, 최상급 = el/la/los/las más … de.","items":[{"t":"pick","q":"Marta es ___ alta que Laura.","o":["más","la más"],"a":"más"},{"t":"pick","q":"Marta es ___ alta de la clase.","o":["más","la más"],"a":"la más"},{"t":"pick","q":"Este televisor es ___ caro de la tienda.","o":["más","el más"],"a":"el más"},{"t":"pick","q":"Mi casa es ___ grande que la tuya.","o":["más","la más"],"a":"más"},{"t":"pick","q":"Ana es ___ simpática de todas.","o":["más","la más"],"a":"la más"},{"t":"pick","q":"Estos zapatos son ___ cómodos que esos.","o":["más","los más"],"a":"más"}]}]};</script>
