<script>window.UNIT={"id":18,"es":"mi, tu, su…","ko":"소유사 (1)","theory":"<h2>핵심 정리<\/h2>\n<p>소유사는 소유·가족·출신 등의 관계를 나타내며 <b>명사 앞<\/b>에 씁니다. 소유물(명사)의 성·수에 일치하며, 소유자에 따라 형태가 정해집니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>소유자<\/th><th>단수 (남·여)<\/th><th>복수 (남·여)<\/th><\/tr><\/thead><tbody><tr><td>yo<\/td><td><b>mi<\/b><\/td><td><b>mis<\/b><\/td><\/tr><tr><td>tú<\/td><td><b>tu<\/b><\/td><td><b>tus<\/b><\/td><\/tr><tr><td>usted, él, ella<\/td><td><b>su<\/b><\/td><td><b>sus<\/b><\/td><\/tr><tr><td>nosotros/as<\/td><td><b>nuestro / nuestra<\/b><\/td><td><b>nuestros / nuestras<\/b><\/td><\/tr><tr><td>vosotros/as<\/td><td><b>vuestro / vuestra<\/b><\/td><td><b>vuestros / vuestras<\/b><\/td><\/tr><tr><td>ustedes, ellos, ellas<\/td><td><b>su<\/b><\/td><td><b>sus<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Quién es tu profesor?\">¿Quién es tu profesor?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Ayer vi a Ignacio con sus primas.\">Ayer vi a Ignacio con sus primas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Dónde están vuestras cosas?\">¿Dónde están vuestras cosas?<\/span><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi madre trabaja en un laboratorio.\">Mi madre trabaja en un laboratorio.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mira, ese es nuestro profesor.\">Mira, ese es nuestro profesor.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b><b>su / sus<\/b>는 él, ella, usted, ellos, ellas, ustedes 모두의 것이 될 수 있습니다. 문맥으로 구별하세요. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Jorge y sus hijas.\">Jorge y sus hijas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alicia en su coche.\">Alicia en su coche.<\/span><\/div>\n<div class=\"note pero\"><b class=\"lab\">PERO<\/b>신체 부위·의복·개인 물건에는 소유사 대신 <b>정관사<\/b>를 씁니다. <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me duele la cabeza.\">Me duele la cabeza.<\/span> (mi cabeza ✗), <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Quítate el abrigo.\">Quítate el abrigo.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tengo que lavar el coche.\">Tengo que lavar el coche.<\/span><\/div>","ex":[{"title":"연습 1. 소유사 고르기","instr":"알맞은 소유사를 고르세요.","rule":"소유자(나, 너, 그…)에 맞는 형태를 고르고, 복수 명사 앞에서는 복수형(mis, tus, sus)을 씁니다.","items":[{"t":"pick","q":"(yo) ___ madre trabaja en un laboratorio.","o":["Mi","Mis","Tu"],"a":"Mi"},{"t":"pick","q":"(tú) ¿Quién es ___ profesor?","o":["tu","tus","su"],"a":"tu"},{"t":"pick","q":"(él) Ayer vi a Ignacio con ___ primas.","o":["su","sus","mis"],"a":"sus"},{"t":"pick","q":"(nosotros) Mira, ese es ___ profesor.","o":["nuestro","nuestra","nuestros"],"a":"nuestro"},{"t":"pick","q":"(vosotros) ¿Dónde están ___ cosas?","o":["vuestro","vuestras","vuestros"],"a":"vuestras"},{"t":"pick","q":"(yo) ___ hermanos viven en Perú.","o":["Mi","Mis","Nuestro"],"a":"Mis"},{"t":"pick","q":"(nosotros) ___ casa es grande.","o":["Nuestro","Nuestra","Nuestras"],"a":"Nuestra"},{"t":"pick","q":"(ustedes) ¿Dónde está ___ coche?","o":["su","sus","vuestro"],"a":"su"}]},{"title":"연습 2. 소유사 쓰기","instr":"괄호 안의 소유자에 맞는 소유사를 쓰세요.","rule":"소유물이 복수이면 -s를 붙입니다. nuestro/vuestro는 명사의 성·수에 일치.","items":[{"t":"text","q":"(yo) ___ amigos","a":["mis"]},{"t":"text","q":"(tú) ___ libro","a":["tu"]},{"t":"text","q":"(él) ___ casa","a":["su"]},{"t":"text","q":"(nosotros) ___ hijas","a":["nuestras"]},{"t":"text","q":"(vosotros) ___ padres","a":["vuestros"]},{"t":"text","q":"(ellos) ___ coches","a":["sus"]},{"t":"text","q":"(nosotros) ___ profesor","a":["nuestro"]},{"t":"text","q":"(tú) ___ tías","a":["tus"]}]},{"title":"연습 3. 소유사 or 정관사","instr":"알맞은 것을 고르세요.","rule":"신체 부위·옷·개인 소지품에는 소유사 대신 정관사를 씁니다.","items":[{"t":"pick","q":"Me duele ___ cabeza.","o":["la","mi"],"a":"la"},{"t":"pick","q":"Quítate ___ abrigo.","o":["el","tu"
