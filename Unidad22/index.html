<script>window.UNIT={"id":22,"es":"mucho, poco, demasiado, suficiente…","ko":"부정어 (3)","theory":"<h2>핵심 정리<\/h2>\n<p>수량의 정도: <b>mucho<\/b>(많음) > <b>bastante<\/b>(꽤 많음) > <b>poco<\/b>(적음). <b>demasiado<\/b>(필요 이상으로 많음), <b>suficiente<\/b>(필요한 만큼).<\/p>\n<div class=\"tw\"><table><thead><tr><th>뒤에 오는 말<\/th><th>형태<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>단수 불가산 명사<\/td><td>mucho/a, poco/a, demasiado/a, suficiente, bastante<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No tengo mucha hambre.\">No tengo mucha hambre.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Martín tiene poco tiempo para estudiar.\">Martín tiene poco tiempo para estudiar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Rodri come demasiado chocolate.\">Rodri come demasiado chocolate.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No tengo suficiente dinero para el avión.\">No tengo suficiente dinero para el avión.<\/span><\/td><\/tr><tr><td>복수 명사<\/td><td>muchos/as, pocos/as, demasiados/as, suficientes, bastantes<\/td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mis hijos duermen muchas horas.\">Mis hijos duermen muchas horas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Marcela tiene pocas amigas.\">Marcela tiene pocas amigas.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Alejo come demasiados pasteles.\">Alejo come demasiados pasteles.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tenemos suficientes patatas para hoy.\">Tenemos suficientes patatas para hoy.<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>suficiente(s)는 명사 앞뒤 모두 가능: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay suficiente agua.\">Hay suficiente agua.<\/span> = <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Hay agua suficiente.\">Hay agua suficiente.<\/span><\/div>\n<ul class=\"rules\"><li><b>bastante<\/b>: ① 꽤 많은(mucho보다는 적음) <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"bastante gente\">bastante gente<\/span> ② 필요한 만큼(=suficiente) <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No tenemos bastante dinero.\">No tenemos bastante dinero.<\/span><\/li><li>명사 없이 단독으로도 씁니다: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Tienes tiempo? — No tengo mucho.\">¿Tienes tiempo? — No tengo mucho.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Son suficientes para una tortilla.\">Son suficientes para una tortilla.<\/span><\/li><\/ul>","ex":[{"title":"연습 1. 성·수 일치","instr":"알맞은 형태를 고르세요.","rule":"뒤에 오는 명사의 성·수에 일치: mucho/mucha/muchos/muchas.","items":[{"t":"pick","q":"Tengo ___ hambre.","o":["mucha","mucho","muchas"],"a":"mucha"},{"t":"pick","q":"Mis hijos duermen ___ horas.","o":["muchas","mucha","mucho"],"a":"muchas"},{"t":"pick","q":"Marcela tiene ___ amigas.","o":["pocas","poca","pocos"],"a":"pocas"},{"t":"pick","q":"Rodri come ___ chocolate.","o":["demasiado","demasiada","demasiados"],"a":"demasiado"},{"t":"pick","q":"Alejo come ___ pasteles.","o":["demasiados","demasiado","demasiadas"],"a":"demasiados"},{"t":"pick","q":"Martín tiene ___ tiempo para estudiar.","o":["poco","poca","pocos"],"a":"poco"},{"t":"pick","q":"Hay ___ gente en la plaza.","o":["mucha","mucho","muchos"],"a":"mucha"},{"t":"pick","q":"Tenemos ___ patatas para hoy.","o":["suficientes","suficiente","suficientemente"],"a":"suficientes"}]},{"title":"연습 2. mucho / poco / demasiado / suficiente","instr":"문맥에 맞는 말을 고르세요.","rule":"mucho = 많이, poco = 적게, demasiado = 지나치게 많이, suficiente = 충분히.","items":[{"t":"pick","q":"No puedo comprar el coche. No tengo ___ dinero. (충분하지 않음)","o":["suficiente","demasiado","mucho"],"a":"suficiente"},{"t":"pick","q":"Come ___ chocolate y le duele el estómago. (필요 이상)","o":["demasiado","poco","suficiente"],"a":"demasiado"},{"t":"pick","q":"Casi no tengo tiempo. Tengo ___ tiempo.","o":["poco","demasiado","mucho"],"a":"poco"},{"t":"pick","q":"Mis padres trabajan ___ horas, de la mañana a la noche.","o":["muchas","pocas","suficiente"],"a":"muchas"},{"t":"pick","q":"Con dos huevos tenemos ___ para una tortilla.","o":["suficientes","demasiado","pocas"],"a":"suficientes"},{"t":"pick","q":"En la sala hay ___ gente. Está llena.","o":["mucha","poca","suficientes"],"a":"mucha"}]},{"title":"연습 3. 문장 완성","instr":"알맞은 말을 쓰세요.","rule":"명사의 성·수에 맞춰 형태를 변화시킵니다.","items":[{"t":"text","q":"Hay ___ agua para todos. (suficiente)","a":["suficiente"]},{"t":"text","q":"No tengo ___ tiempo. (mucho)","a":["mucho"]},{"t":"text","q":"Tienes ___ ropa. (demasiado)","a":["demasiada"]},{"t":"text","q":"Hay ___ problemas. (bastante)","a":["bastantes"]},{"t":"text","q":"Marcela tiene ___ amigas. (poco)","a":["pocas"]},{"t":"text","q":"Hay agua ___. (suficiente, 명사 뒤)","a":["suficiente"]}]},{"title":"연습 4. 명사 없이 쓰기","instr":"알맞은 말을 고르세요.","rule":"앞서 언급한 명사는 생략하고 mucho/poco/suficiente 등을 단독으로 씁니다.","items":[{"t":"pick","q":"¿Tienes tiempo? — No tengo ___.","o":["mucho","muchos","mucha"],"a":"mucho"},{"t":"pick","q":"¿Cuántos huevos hay? — Tres. Son ___ para una tortilla.","o":["suficientes","suficiente","suficientemente"],"a":"suficientes"},{"t":"pick","q":"¿Tienes amigos aquí? — Sí, tengo ___.","o":["muchos","mucho","mucha"],"a":"muchos"},{"t":"pick","q":"¿Hay comida? — Sí, hay ___.","o":["bastante","bastantes","bastantas"],"a":"bastante"}]}]};</script>
