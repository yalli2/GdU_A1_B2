<script>window.UNIT={"id":55,"es":"Me gusta la ópera","ko":"me, te, le 동사 (gustar류)","theory":"<h2>핵심 정리<\/h2>\n<p>gustar류 동사는 <b>좋아하는 사람이 간접목적어<\/b>, <b>좋아하는 대상이 주어<\/b>입니다. 동사는 <b>대상<\/b>(주어)에 일치합니다.<\/p>\n<div class=\"tw\"><table><thead><tr><th>사람<\/th><th>대명사<\/th><th>단수 대상<\/th><th>복수 대상<\/th><\/tr><\/thead><tbody><tr><td>(a mí)<\/td><td><b>me<\/b><\/td><td>gusta / encanta<\/td><td>gustan / encantan<\/td><\/tr><tr><td>(a ti)<\/td><td><b>te<\/b><\/td><td><\/td><\/tr><tr><td>(a usted, él, ella)<\/td><td><b>le<\/b><\/td><td><\/td><\/tr><tr><td>(a nosotros/as)<\/td><td><b>nos<\/b><\/td><td><\/td><\/tr><tr><td>(a vosotros/as)<\/td><td><b>os<\/b><\/td><td><\/td><\/tr><tr><td>(a ustedes, ellos, ellas)<\/td><td><b>les<\/b><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"eg\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te gusta este traje?\">¿Te gusta este traje?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Os gustan las naranjas?\">¿Os gustan las naranjas?<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Nos gustan la paella y el marisco.\">Nos gustan la paella y el marisco.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A mi hijo le encantan los pasteles.\">A mi hijo le encantan los pasteles.<\/span><\/div>\n<div class=\"note warn\"><b class=\"lab\">ATENCIÓN<\/b>gustar + <b>동사원형<\/b>은 항상 단수 <b>gusta<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me gusta bailar.\">Me gusta bailar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Luis le gusta nadar y jugar al tenis.\">A Luis le gusta nadar y jugar al tenis.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Concha le gusta cantar y bailar.\">A Concha le gusta cantar y bailar.<\/span><\/div>\n<ul class=\"rules\"><li><b>a + 명사/이름<\/b>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A mis padres les gusta mucho viajar.\">A mis padres les gusta mucho viajar.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Elsa no le gusta cocinar.\">A Elsa no le gusta cocinar.<\/span><\/li><\/ul>\n<h3>같은 구조의 동사<\/h3>\n<p><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"apetecer\">apetecer<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te apetece dar un paseo?\">¿Te apetece dar un paseo?<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"doler\">doler<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Me duelen los pies.\">Me duelen los pies.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Luisa le duelen las muelas.\">A Luisa le duelen las muelas.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"importar\">importar<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"No me importa madrugar.\">No me importa madrugar.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"interesar\">interesar<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Te interesan las matemáticas?\">¿Te interesan las matemáticas?<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"quedar\">quedar<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Esta chaqueta te queda corta.\">Esta chaqueta te queda corta.<\/span>, <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Solo nos quedan veinte euros.\">Solo nos quedan veinte euros.<\/span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"sentar\">sentar<\/span>: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Te sienta muy bien ese vestido.\">Te sienta muy bien ese vestido.<\/span><\/p>\n<h3>a mí, a ti… 를 함께 쓰는 경우<\/h3>\n<p>강조 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A nosotros nos encanta la ópera.\">A nosotros nos encanta la ópera.<\/span> / 대조 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"A Pedro le gusta Luisa, pero a ella no le gusta Pedro.\">A Pedro le gusta Luisa, pero a ella no le gusta Pedro.<\/span> / 누구인지 분명히 <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"¿Le gusta a usted el pescado?\">¿Le gusta a usted el pescado?<\/span><\/p>","ex":[{"title":"연습 1. gusta / gustan","instr":"알맞은 형태를 고르세요.","rule":"대상이 단수 또는 동사원형이면 gusta, 복수이면 gustan.","items":[{"t":"pick","q":"Me ___ la ópera.","o":["gusta","gustan"],"a":"gusta"},{"t":"pick","q":"Nos ___ la paella y el marisco.","o":["gustan","gusta"],"a":"gustan"},{"t":"pick","q":"¿Te ___ este traje?","o":["gusta","gustan"],"a":"gusta"},{"t":"pick","q":"¿Os ___ las naranjas?","o":["gustan","gusta"],"a":"gustan"},{"t":"pick","q":"Me ___ bailar.","o":["gusta","gustan"],"a":"gusta"},{"t":"pick","q":"A Luis le ___ nadar y jugar al tenis.","o":["gusta","gustan"],"a":"gusta"}]},{"title":"연습 2. 간접목적어 대명사","instr":"알맞은 대명사를 고르세요.","rule":"a mí → me, a ti → te, a él/ella/usted → le, a nosotros → nos, a vosotros → os, a ellos → les.","items":[{"t":"pick","q":"A mi hijo ___ encantan los pasteles.","o":["le","les","me"],"a":"le"},{"t":"pick","q":"A mis padres ___ gusta mucho viajar.","o":["les","le","nos"],"a":"les"},{"t":"pick","q":"A nosotros ___ encanta la ópera.","o":["nos","os","les"],"a":"nos"},{"t":"pick","q":"A ti ___ interesan las matemáticas.","o":["te","me","le"],"a":"te"},{"t":"pick","q":"A Elsa no ___ gusta cocinar.","o":["le","les","la"],"a":"le"},{"t":"pick","q":"¿___ gusta a usted el pescado?","o":["Le","Les","Te"],"a":"Le"}]},{"title":"연습 3. 같은 구조의 동사","instr":"알맞은 형태를 고르세요.","rule":"doler, interesar, importar, apetecer, quedar, sentar도 gustar와 같은 구조입니다.","items":[{"t":"pick","q":"Me ___ los pies.","o":["duelen","duele","dolemos"],"a":"duelen"},{"t":"pick","q":"A Luisa le ___ las muelas.","o":["duelen","duele","duelas"],"a":"duelen"},{"t":"pick","q":"¿Te ___ la cabeza?","o":["duele","duelen","dolé"],"a":"duele"},{"t":"pick","q":"No me ___ madrugar.","o":["importa","importan","importo"],"a":"importa"},{"t":"pick","q":"¿Te ___ dar un paseo?","o":["apetece","apetecen","apeteces"],"a":"apetece"},{"t":"pick","q":"Solo nos ___ veinte euros.","o":["quedan","queda","quedamos"],"a":"quedan"}]},{"title":"연습 4. 문장 완성","instr":"알맞은 말을 쓰세요.","rule":"대명사 + 동사 형태를 정확히.","items":[{"t":"text","q":"A mí no ___ gusta nada. (대명사)","a":["me"]},{"t":"text","q":"¿___ gustan las películas de miedo? (너에게)","a":["Te"]},{"t":"text","q":"A ellos ___ encanta viajar. (대명사)","a":["les"]},{"t":"text","q":"A Pedro le ___ Luisa. (gustar)","a":["gusta"]},{"t":"text","q":"A nosotros ___ gustan los pasteles.","a":["nos"]},{"t":"text","q":"Me ___ las muelas. (doler)","a":["duelen"]}]}]};</script>
